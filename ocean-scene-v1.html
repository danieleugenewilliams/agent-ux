<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Water</title>
<style>
  :root{
    --glass: rgba(18,22,28,.42);
    --line: rgba(255,255,255,.14);
    --ink: rgba(255,255,255,.92);
    --ink-dim: rgba(255,255,255,.6);
    --accent: #f3f1ea;
  }
  html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden;color:var(--ink);
    font:13px/1.35 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #ui{position:fixed;left:16px;bottom:16px;width:min(300px,calc(100vw - 32px));padding:14px 14px 12px;
    background:var(--glass);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .3s,transform .3s;user-select:none}
  #ui.hidden{opacity:0;transform:translateY(8px);pointer-events:none}
  .row{margin:0 0 12px}
  .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;letter-spacing:.02em}
  .lab b{font-weight:600}
  .lab span{color:var(--ink-dim);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,.75) var(--p,50%),rgba(255,255,255,.18) var(--p,50%))}
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,255,255,.2)}
  input[type=range]::-moz-range-progress{height:3px;background:rgba(255,255,255,.75)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);margin-top:-6.5px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--accent)}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:3px;border-radius:10px;background:rgba(255,255,255,.08)}
  .seg button{all:unset;text-align:center;padding:7px 0;border-radius:7px;cursor:pointer;color:var(--ink-dim);font-weight:500}
  .seg button[aria-pressed=true]{background:rgba(255,255,255,.88);color:#11161c}
  .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .foot{display:flex;justify-content:space-between;color:var(--ink-dim);font-size:11.5px;margin-top:2px}
  .foot button{all:unset;cursor:pointer;color:var(--ink-dim)}
  .foot button:hover{color:var(--ink)}
  #show{all:unset;display:none;position:fixed;left:16px;bottom:16px;padding:8px 12px;border-radius:10px;
    background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;color:var(--ink)}
  #err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:#dfe6ee;background:#0b0f14}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui" role="region" aria-label="Scene controls">
  <div class="row">
    <div class="lab"><b>Time of day</b><span id="tLab">17:40</span></div>
    <input id="tod" type="range" min="0" max="24" step="0.05" value="17.67" aria-label="Time of day">
  </div>
  <div class="row">
    <div class="lab"><b>Sea state</b><span id="sLab">Moderate</span></div>
    <input id="sea" type="range" min="0" max="1" step="0.005" value="0.45" aria-label="Sea state, calm to rough">
  </div>
  <div class="row">
    <div class="lab"><b>Weather</b><span id="wLab"></span></div>
    <div class="seg" role="group" aria-label="Weather">
      <button data-w="sunny" aria-pressed="true">Sunny</button>
      <button data-w="rain" aria-pressed="false">Rain</button>
      <button data-w="storm" aria-pressed="false">Storm</button>
    </div>
  </div>
  <div class="foot"><span>Drag to look · scroll for height</span><button id="hide" title="Hide controls (H)">Hide</button></div>
</div>
<button id="show">Controls</button>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ---------------------------------------------------------------- params
const Q = new URLSearchParams(location.search);
const qn = (k, d) => (Q.has(k) ? parseFloat(Q.get(k)) : d);
const TEST = Q.get('test');
const FIXED_TIME = Q.has('simTime') ? qn('simTime', 0) : null;
const WARMUP = qn('warmup', 30);

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: !!TEST || Q.has('warmup') });
if (!renderer.capabilities.isWebGL2 || !renderer.extensions.has('EXT_color_buffer_float')) {
  const e = document.getElementById('err'); e.style.display = 'grid';
  e.textContent = 'This scene needs WebGL2 with floating-point render targets. Try a recent Chrome, Edge, Safari or Firefox.';
  throw new Error('no float RT');
}
const DPR_MAX = Math.min(window.devicePixelRatio || 1, 2);
let DPR = Q.has('dpr') ? qn('dpr', 1) : Math.min(DPR_MAX, 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = { agx: THREE.AgXToneMapping, aces: THREE.ACESFilmicToneMapping }[Q.get('tm')] ?? THREE.NeutralToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const PI = Math.PI, G = 9.81;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------------------------------------------------------- fullscreen pass helper
const fsScene = new THREE.Scene();
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fsMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
fsMesh.frustumCulled = false; fsScene.add(fsMesh);
function runPass(mat, target) {
  fsMesh.material = mat;
  renderer.setRenderTarget(target);
  renderer.render(fsScene, fsCam);
  renderer.setRenderTarget(null);
}
const PASS_VS = /* glsl */`in vec3 position; void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const COMMON = /* glsl */`
precision highp float; precision highp int; precision highp sampler2D;
const float PI = 3.14159265359;
const float G = 9.81;
vec2 cmul(vec2 a, vec2 b){ return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
`;
function rawMat(frag, uniforms) {
  return new THREE.RawShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: PASS_VS, fragmentShader: COMMON + frag, uniforms, depthTest: false, depthWrite: false });
}

// ---------------------------------------------------------------- FFT ocean
const N = 256, LOG2N = 8;
const floatRT = (count) => new THREE.WebGLRenderTarget(N, N, { count, type: THREE.FloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: false, generateMipmaps: false, wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping });
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const outRT = () => {
  const rt = new THREE.WebGLRenderTarget(N, N, { count: 2, type: THREE.HalfFloatType, format: THREE.RGBAFormat,
    minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, generateMipmaps: true,
    wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping, anisotropy: maxAniso });
  for (const t of rt.textures) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = maxAniso; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; }
  return rt;
};

const initSpecMat = rawMat(/* glsl */`
uniform sampler2D uNoise;
uniform float uL, uN, uWind, uFetch, uWindAngle, uKMin, uKMax, uSwell, uSwellAngle, uSwellOmega, uShort;
out vec4 o;
float lgam(float x){ return (x-0.5)*log(x) - x + 0.9189385 + 1.0/(12.0*x); }
float spreadQ(float s){ return exp(lgam(s+1.0) - lgam(s+0.5)) / (2.0*sqrt(PI)); }
float jonswap(float w, float wp, float alpha, float gamma){
  float sigma = w <= wp ? 0.07 : 0.09;
  float r = exp(-(w-wp)*(w-wp)/(2.0*sigma*sigma*wp*wp));
  return alpha*G*G/pow(w,5.0) * exp(-1.25*pow(wp/w,4.0)) * pow(gamma, r);
}
float spectrum(vec2 k){
  float kl = length(k);
  if (kl < 1e-6 || kl < uKMin || kl >= uKMax) return 0.0;
  float w = sqrt(G*kl);
  float dwdk = G/(2.0*w);
  float th = atan(k.y, k.x);
  float U = max(uWind, 0.5);
  float alpha = 0.076*pow(U*U/(uFetch*G), 0.22);
  float wp = 22.0*pow(G*G/(U*uFetch), 1.0/3.0);
  float S = jonswap(w, wp, alpha, 3.3);
  float sp = 11.5*pow(wp*U/G, -2.5);
  float s = w > wp ? sp*pow(w/wp, -2.5) : sp*pow(w/wp, 5.0);
  s = clamp(s, 1.0, 30.0);
  float D = spreadQ(s)*pow(abs(cos(0.5*(th - uWindAngle))), 2.0*s);
  float total = S*D;
  float Ss = jonswap(w, uSwellOmega, 0.0081, 7.0);
  total += uSwell*Ss*spreadQ(30.0)*pow(abs(cos(0.5*(th - uSwellAngle))), 60.0);
  total *= exp(-kl*kl*uShort*uShort);
  return total*dwdk/kl;
}
void main(){
  vec2 n = gl_FragCoord.xy - 0.5;
  vec2 ki = vec2(n.x < uN*0.5 ? n.x : n.x - uN, n.y < uN*0.5 ? n.y : n.y - uN);
  float dk = 2.0*PI/uL;
  vec2 k = ki*dk;
  ivec2 mi = ivec2(mod(uN - n, uN));
  vec2 xi  = texelFetch(uNoise, ivec2(n), 0).xy;
  vec2 xim = texelFetch(uNoise, mi, 0).xy;
  vec2 h0  = xi  * 0.5*dk*sqrt(spectrum(k));
  vec2 nm = vec2(mi);
  vec2 kim = vec2(nm.x < uN*0.5 ? nm.x : nm.x - uN, nm.y < uN*0.5 ? nm.y : nm.y - uN);
  vec2 h0m = xim * 0.5*dk*sqrt(spectrum(kim*dk)); // not -k: atan(y,-0.0) is unreliable on some GPUs
  o = vec4(h0, h0m.x, -h0m.y);
}`, {
  uNoise: { value: null }, uL: { value: 1 }, uN: { value: N }, uWind: { value: 8 }, uFetch: { value: 150000 }, uWindAngle: { value: 0 },
  uKMin: { value: 0 }, uKMax: { value: 1e9 }, uSwell: { value: 0.01 }, uSwellAngle: { value: 0 }, uSwellOmega: { value: 0.6 }, uShort: { value: 0.01 },
});

const timeSpecMat = rawMat(/* glsl */`
uniform sampler2D uH0; uniform float uTime, uL, uN;
layout(location=0) out vec4 o0; layout(location=1) out vec4 o1;
void main(){
  vec2 n = gl_FragCoord.xy - 0.5;
  vec2 ki = vec2(n.x < uN*0.5 ? n.x : n.x - uN, n.y < uN*0.5 ? n.y : n.y - uN);
  vec2 k = ki*2.0*PI/uL;
  float kl = length(k);
  vec4 h0 = texelFetch(uH0, ivec2(n), 0);
  float ph = sqrt(G*kl)*uTime;
  vec2 e = vec2(cos(ph), sin(ph));
  vec2 h = cmul(h0.xy, e) + cmul(h0.zw, vec2(e.x, -e.y));
  vec2 ik = kl > 1e-6 ? k/kl : vec2(0.0);
  vec2 ih = vec2(-h.y, h.x);
  vec2 Dy = h, Dx = ih*ik.x, Dz = ih*ik.y;
  vec2 Dyx = ih*k.x, Dyz = ih*k.y;
  vec2 Dxx = -h*k.x*ik.x, Dzz = -h*k.y*ik.y, Dxz = -h*k.x*ik.y;
  o0 = vec4(Dy.x - Dx.y, Dy.y + Dx.x, Dz.x - Dyx.y, Dz.y + Dyx.x);
  o1 = vec4(Dyz.x - Dxx.y, Dyz.y + Dxx.x, Dzz.x - Dxz.y, Dzz.y + Dxz.x);
}`, { uH0: { value: null }, uTime: { value: 0 }, uL: { value: 1 }, uN: { value: N } });

const fftMat = rawMat(/* glsl */`
uniform sampler2D uA, uB; uniform float uSub, uN; uniform int uHoriz;
layout(location=0) out vec4 o0; layout(location=1) out vec4 o1;
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  float index = float(uHoriz == 1 ? p.x : p.y);
  float hs = uSub*0.5;
  float ev = floor(index/uSub)*hs + mod(index, hs);
  int ie = int(ev + 0.5), io = int(ev + uN*0.5 + 0.5);
  ivec2 pe = uHoriz == 1 ? ivec2(ie, p.y) : ivec2(p.x, ie);
  ivec2 po = uHoriz == 1 ? ivec2(io, p.y) : ivec2(p.x, io);
  float ang = 2.0*PI*index/uSub;
  vec2 tw = vec2(cos(ang), sin(ang));
  vec4 ea = texelFetch(uA, pe, 0), oa = texelFetch(uA, po, 0);
  vec4 eb = texelFetch(uB, pe, 0), ob = texelFetch(uB, po, 0);
  o0 = vec4(ea.xy + cmul(tw, oa.xy), ea.zw + cmul(tw, oa.zw));
  o1 = vec4(eb.xy + cmul(tw, ob.xy), eb.zw + cmul(tw, ob.zw));
}`, { uA: { value: null }, uB: { value: null }, uSub: { value: 2 }, uN: { value: N }, uHoriz: { value: 1 } });

const assembleMat = rawMat(/* glsl */`
uniform sampler2D uA, uB, uPrev; uniform float uLambda, uDt, uFoamDecay, uFoamBias, uFoamGain;
layout(location=0) out vec4 o0; layout(location=1) out vec4 o1;
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec4 a = texelFetch(uA, p, 0), b = texelFetch(uB, p, 0);
  float Dy = a.x, Dx = a.y, Dz = a.z, Dyx = a.w, Dyz = b.x, Dxx = b.y, Dzz = b.z, Dxz = b.w;
  float jxx = 1.0 + uLambda*Dxx, jzz = 1.0 + uLambda*Dzz, jxz = uLambda*Dxz;
  float J = jxx*jzz - jxz*jxz;
  float prev = texelFetch(uPrev, p, 0).w;
  float f = prev*exp(-uFoamDecay*uDt);
  f = max(f, clamp((uFoamBias - J)*uFoamGain, 0.0, 1.0));
  o0 = vec4(uLambda*Dx, Dy, uLambda*Dz, f);
  o1 = vec4(Dyx, Dyz, uLambda*Dxx, uLambda*Dzz);
}`, { uA: { value: null }, uB: { value: null }, uPrev: { value: null }, uLambda: { value: 1 }, uDt: { value: 0.016 },
  uFoamDecay: { value: 0.35 }, uFoamBias: { value: 0.35 }, uFoamGain: { value: 2.0 } });

function gaussNoiseTex(seed) {
  const rnd = mulberry32(seed), d = new Float32Array(N * N * 4);
  for (let i = 0; i < N * N; i++) {
    for (let j = 0; j < 2; j++) {
      const u1 = Math.max(1e-7, rnd()), u2 = rnd(), r = Math.sqrt(-2 * Math.log(u1));
      d[i * 4 + j * 2] = r * Math.cos(2 * PI * u2); d[i * 4 + j * 2 + 1] = r * Math.sin(2 * PI * u2);
    }
  }
  const t = new THREE.DataTexture(d, N, N, THREE.RGBAFormat, THREE.FloatType);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
}

const kb = (L) => 2 * PI / L * 6;
const CASCADES = [
  { L: 521.0, lambda: 0.9 },
  { L: 87.3, lambda: 0.9 },
  { L: 17.9, lambda: 0.8 },
];
CASCADES[0].kmin = 0; CASCADES[0].kmax = kb(CASCADES[1].L);
CASCADES[1].kmin = kb(CASCADES[1].L); CASCADES[1].kmax = kb(CASCADES[2].L);
CASCADES[2].kmin = kb(CASCADES[2].L); CASCADES[2].kmax = 1e9;
CASCADES.forEach((c, i) => {
  c.noise = gaussNoiseTex(1234 + i * 77);
  c.h0 = floatRT(1);
  c.ping = floatRT(2); c.pong = floatRT(2);
  c.out = [outRT(), outRT()];
  c.cur = 0;
});

const sea = { wind: 8, windAngle: 1.35, swellHs: 0.6, swellAngle: 1.2, swellT: 10.5 };
function updateSpectra() {
  const u = initSpecMat.uniforms;
  u.uWind.value = sea.wind; u.uWindAngle.value = sea.windAngle;
  u.uSwell.value = Math.pow(sea.swellHs / 6.4, 2); u.uSwellAngle.value = sea.swellAngle; u.uSwellOmega.value = 2 * PI / sea.swellT;
  for (const c of CASCADES) {
    u.uNoise.value = c.noise; u.uL.value = c.L; u.uKMin.value = c.kmin; u.uKMax.value = c.kmax;
    runPass(initSpecMat, c.h0);
  }
}

function fft(c) { // ping holds input; result ends in ping
  let src = c.ping, dst = c.pong;
  for (let h = 1; h >= 0; h--) {
    for (let s = 0; s < LOG2N; s++) {
      fftMat.uniforms.uA.value = src.textures[0]; fftMat.uniforms.uB.value = src.textures[1];
      fftMat.uniforms.uSub.value = Math.pow(2, s + 1); fftMat.uniforms.uHoriz.value = h;
      runPass(fftMat, dst);
      [src, dst] = [dst, src];
    }
  }
  return src; // 16 passes -> back in ping
}

function simulateOcean(t, dt) {
  for (const c of CASCADES) {
    timeSpecMat.uniforms.uH0.value = c.h0.texture; timeSpecMat.uniforms.uTime.value = t; timeSpecMat.uniforms.uL.value = c.L;
    runPass(timeSpecMat, c.ping);
    const res = fft(c);
    const prev = c.out[c.cur]; c.cur ^= 1; const out = c.out[c.cur];
    const a = assembleMat.uniforms;
    a.uA.value = res.textures[0]; a.uB.value = res.textures[1]; a.uPrev.value = prev.textures[0];
    a.uLambda.value = c.lambda; a.uDt.value = dt;
    runPass(assembleMat, out);
  }
}


// ---------------------------------------------------------------- FFT self-test (?test=fft)
if (TEST === 'fft') {
  const c = CASCADES[0], px = new Float32Array(N * N * 4), px2 = new Float32Array(N * N * 4);
  const d = new Float32Array(N * N * 4), dt = new THREE.DataTexture(d, N, N, THREE.RGBAFormat, THREE.FloatType);
  const copy = rawMat(`uniform sampler2D uT; layout(location=0) out vec4 o0; layout(location=1) out vec4 o1;
    void main(){ ivec2 p = ivec2(gl_FragCoord.xy); o0 = texelFetch(uT,p,0); o1 = vec4(0); }`, { uT: { value: dt } });
  let fftErr = 0;
  for (const [fa, fb] of [[3, 0], [0, 5], [3, 7], [250, 2], [200, 130]]) {
    d.fill(0); d.set([1, 0, 0.5, 0.25], (fb * N + fa) * 4); dt.needsUpdate = true; runPass(copy, c.ping);
    renderer.readRenderTargetPixels(fft(c), 0, 0, N, N, px, undefined, 0);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = (y * N + x) * 4, a = 2 * PI * (fa * x + fb * y) / N, co = Math.cos(a), si = Math.sin(a);
      fftErr = Math.max(fftErr, Math.abs(px[i] - co), Math.abs(px[i + 1] - si), Math.abs(px[i + 2] - (0.5 * co - 0.25 * si)), Math.abs(px[i + 3] - (0.5 * si + 0.25 * co)));
    }
  }
  sea.wind = 10; sea.windAngle = qn('wa', 1.35); updateSpectra();
  timeSpecMat.uniforms.uH0.value = c.h0.texture; timeSpecMat.uniforms.uTime.value = 3.0; timeSpecMat.uniforms.uL.value = c.L;
  runPass(timeSpecMat, c.ping); const r2 = fft(c);
  renderer.readRenderTargetPixels(r2, 0, 0, N, N, px, undefined, 0);
  renderer.readRenderTargetPixels(r2, 0, 0, N, N, px2, undefined, 1);
  const dx = c.L / N, I = (x, y) => (((y + N) % N) * N + ((x + N) % N)) * 4;
  const corr = (f) => { let sa = 0, sb = 0, sab = 0; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const [a, b] = f(x, y); sa += a * a; sb += b * b; sab += a * b; } return +(sab / Math.sqrt(sa * sb)).toFixed(4); };
  let rms = 0; for (let i = 0; i < N * N; i++) rms += px[i * 4] ** 2; rms = Math.sqrt(rms / (N * N));
  window.__testResult = {
    fftMaxErr: fftErr,
    dDy_dx: corr((x, y) => [px[I(x, y) + 3], (px[I(x + 1, y)] - px[I(x - 1, y)]) / (2 * dx)]),
    dDy_dz: corr((x, y) => [px2[I(x, y)], (px[I(x, y + 1)] - px[I(x, y - 1)]) / (2 * dx)]),
    dDx_dx: corr((x, y) => [px2[I(x, y) + 1], (px[I(x + 1, y) + 1] - px[I(x - 1, y) + 1]) / (2 * dx)]),
