  #toast { position: fixed; left: 50%; top: max(60px, calc(env(safe-area-inset-top) + 56px)); transform: translate(-50%, -10px); z-index: 12; pointer-events: none; opacity: 0;

<!-- ===========================================================================
TouchPad: on-screen controller for phones and tablets (issue #92).
Self-contained: its CSS, DOM and logic all live in the one script element below, so another game can copy the block as-is.

  const pad = TouchPad.create({
    buttons: [                       // right side; the first is the main action (biggest, at the thumb's rest)
      { id: 'jump', label: 'JUMP', icon: '<svg…>' },
      { id: 'dive', label: 'DIVE', icon: '<svg…>', angle: 180 },   // degrees around the main button (90 = up, 180 = left)
    ],
    pause: true,                     // a pause button, top right (reported as pressed.pause)
    active: () => bool,              // is the game in play? The controller shows only then, and only in touch mode.
  });
  pad.poll() -> { x, y, held: {id: bool}, pressed: {id: bool}, lookDx, lookDy, looking }
     x/y are analog -1..1 like a gamepad's left stick (y down = +), after a dead zone. `pressed` latches every
     tap since the last poll, so a tap shorter than a frame still counts (and reads as held for that poll).
     lookDx/lookDy are the pixels dragged on empty space on the right since the last poll (camera / aim).
  pad.state -> { showing, touchMode, x, y, held: [ids], looking }   (for test hooks)
  pad.padUsed()                      // call when a gamepad button or stick is used: hides it until the next touch

Touch mode turns on at the first touch (pointerType 'touch') or on load when (pointer: coarse) matches, and off
on any key press, mouse press or padUsed(). Each pointerId is tracked on its own (move + buttons + look at once).
The root element toggles `tp-showing` on <html> so a game can move HUD pieces out of the thumbs' way.
=========================================================================== -->
<script>
window.TouchPad = (() => {
  const CSS = `
  .tp-root { position: fixed; inset: 0; z-index: 20; display: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    --tp-u: 1; --tp-l: max(16px, env(safe-area-inset-left)); --tp-r: max(16px, env(safe-area-inset-right)); --tp-t: max(12px, env(safe-area-inset-top)); --tp-b: max(16px, env(safe-area-inset-bottom)); }
  .tp-root.on { display: block; }
  @media (min-width: 700px) and (min-height: 700px) { .tp-root { --tp-u: 1.3; } }
  .tp-root * { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; box-sizing: border-box; }
  .tp-ring { position: absolute; border-radius: 50%; background: rgba(255,255,255,.25); border: 2px solid rgba(255,255,255,.55);
    box-shadow: 0 0 0 1.5px rgba(0,0,0,.28), inset 0 0 0 1px rgba(0,0,0,.12); }
  .tp-stick { width: calc(120px * var(--tp-u)); height: calc(120px * var(--tp-u)); margin: calc(-60px * var(--tp-u)) 0 0 calc(-60px * var(--tp-u)); pointer-events: none;
    background: rgba(255,255,255,.14); opacity: .75; transition: left .22s ease-out, top .22s ease-out, opacity .22s; }
  .tp-stick.live { transition: none; opacity: 1; background: rgba(255,255,255,.25); }
  .tp-knob { left: 50%; top: 50%; width: 44%; height: 44%; margin: -22% 0 0 -22%; background: rgba(255,255,255,.4); }
  .tp-stick.live .tp-knob { background: rgba(255,255,255,.55); }
  .tp-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #fff; padding: 0;
    font: 900 calc(10px * var(--tp-u)) system-ui, sans-serif; letter-spacing: .5px; text-shadow: 0 1px 2px rgba(0,0,0,.7), 0 0 4px rgba(0,0,0,.35); }
  .tp-btn svg { width: 46%; height: 46%; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.6)) drop-shadow(0 0 3px rgba(0,0,0,.3)); }
  .tp-btn.down { background: rgba(255,255,255,.5); transform: scale(.94); }
  .tp-pause { top: var(--tp-t); right: var(--tp-r); width: calc(44px * var(--tp-u)); height: calc(44px * var(--tp-u)); }
  `;
  const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>';
  const DEAD = 0.15;   // stick dead zone, as a fraction of its radius

  function create(cfg) {
    const style = document.createElement('style'); style.textContent = CSS; document.head.appendChild(style);
    const root = document.createElement('div'); root.className = 'tp-root'; root.setAttribute('aria-hidden', 'true');
    const stick = document.createElement('div'); stick.className = 'tp-ring tp-stick';
    const knob = document.createElement('div'); knob.className = 'tp-ring tp-knob'; stick.appendChild(knob); root.appendChild(stick);
    const btns = {};
    const mkBtn = (b, cls) => {
      const el = document.createElement('div'); el.className = 'tp-ring tp-btn ' + cls; el.dataset.tp = b.id;
      el.innerHTML = b.icon + (b.label ? `<span>${b.label}</span>` : ''); root.appendChild(el); btns[b.id] = el; return el;
    };
    cfg.buttons.forEach((b, i) => mkBtn(b, i === 0 ? 'tp-main' : 'tp-sub'));
    if (cfg.pause) mkBtn({ id: 'pause', icon: PAUSE_ICON }, 'tp-pause');
    document.body.appendChild(root);

    const S = { touchMode: false, showing: false, x: 0, y: 0, lookDx: 0, lookDy: 0 };
    const held = {}, latched = {};
    const ptrs = new Map();   // pointerId -> { role: 'stick' | 'look' | 'btn', ... }
    let home = { x: 0, y: 0 }, R = 60;
    const hasStick = () => [...ptrs.values()].some((p) => p.role === 'stick');

    function layout() {
      const u = parseFloat(getComputedStyle(root).getPropertyValue('--tp-u')) || 1;
      const len = (v) => { const p = document.createElement('div'); p.style.cssText = `position:absolute;width:${v}`; root.appendChild(p); const w = p.getBoundingClientRect().width; p.remove(); return w; };
      const L = len('var(--tp-l)'), Rt = len('var(--tp-r)'), B = len('var(--tp-b)');
      const W = innerWidth, H = innerHeight;
      R = 60 * u;
      home = { x: L + R + 12 * u, y: H - B - R - 12 * u };
      if (!hasStick()) { stick.style.left = home.x + 'px'; stick.style.top = home.y + 'px'; }
      // the main button sits at the right thumb's rest, the others in an arc around it
      const main = 80 * u, sub = 58 * u, gap = 14 * u;
      const cx = W - Rt - main / 2 - 10 * u, cy = H - B - main / 2 - 10 * u;
      cfg.buttons.forEach((b, i) => {
        const el = btns[b.id], s = i === 0 ? main : sub;
        let x = cx, y = cy;
        if (i > 0) { const a = (b.angle ?? 180) * Math.PI / 180, r = main / 2 + sub / 2 + gap; x = cx + Math.cos(a) * r; y = cy - Math.sin(a) * r; }
        Object.assign(el.style, { width: s + 'px', height: s + 'px', left: x - s / 2 + 'px', top: y - s / 2 + 'px' });
      });
    }
    addEventListener('resize', () => { if (S.showing) layout(); });

    const setKnob = (dx, dy) => { knob.style.transform = `translate(${dx}px, ${dy}px)`; };
    function stickHome() { S.x = S.y = 0; setKnob(0, 0); stick.classList.remove('live'); stick.style.left = home.x + 'px'; stick.style.top = home.y + 'px'; }
    function releaseAll() {
      ptrs.clear(); for (const k in held) held[k] = false; for (const k in latched) latched[k] = false;
      S.lookDx = S.lookDy = 0; for (const el of Object.values(btns)) el.classList.remove('down'); stickHome();
    }
    function refresh() {
      const show = S.touchMode && !!cfg.active();
      if (show !== S.showing) {
        S.showing = show; root.classList.toggle('on', show); document.documentElement.classList.toggle('tp-showing', show);
        if (show) layout(); else releaseAll();
      }
    }
    function setTouchMode(on) { if (S.touchMode !== on) { S.touchMode = on; refresh(); } }

    function stickMove(p, x, y) {
      let dx = x - p.x0, dy = y - p.y0; const d = Math.hypot(dx, dy);
      if (d > R) { dx *= R / d; dy *= R / d; }
      setKnob(dx, dy);
      const m = Math.min(1, d / R);
      if (m < DEAD) { S.x = S.y = 0; return; }
      const s = (m - DEAD) / (1 - DEAD) / m;   // rescale: the dead zone's edge reads 0, the rim reads 1
      S.x = dx / R * s; S.y = dy / R * s;
    }

    root.addEventListener('pointerdown', (e) => {
      e.preventDefault();   // no stopPropagation: the game's own pointerdown (audio unlock) still runs
      const bEl = e.target.closest && e.target.closest('[data-tp]');
      try { root.setPointerCapture(e.pointerId); } catch (err) {}
      if (bEl) {
        const id = bEl.dataset.tp; held[id] = true; latched[id] = true; bEl.classList.add('down');
        ptrs.set(e.pointerId, { role: 'btn', id });
      } else if (e.clientX < innerWidth * 0.4) {
        if (hasStick()) return;
        // the stick floats: its centre lands under the thumb, kept fully on screen
        const x = Math.max(R + 4, e.clientX), y = Math.max(R + 4, Math.min(e.clientY, innerHeight - R - 4));
        const p = { role: 'stick', x0: x, y0: y }; ptrs.set(e.pointerId, p);
        stick.classList.add('live'); stick.style.left = x + 'px'; stick.style.top = y + 'px';
        stickMove(p, e.clientX, e.clientY);
      } else {
        ptrs.set(e.pointerId, { role: 'look', lx: e.clientX, ly: e.clientY });
      }
    });
    root.addEventListener('pointermove', (e) => {
      const p = ptrs.get(e.pointerId); if (!p) return;
      e.preventDefault();
      if (p.role === 'stick') stickMove(p, e.clientX, e.clientY);
      else if (p.role === 'look') { S.lookDx += e.clientX - p.lx; S.lookDy += e.clientY - p.ly; p.lx = e.clientX; p.ly = e.clientY; }
    });
    const onUp = (e) => {
      const p = ptrs.get(e.pointerId); if (!p) return;
      ptrs.delete(e.pointerId);
      if (p.role === 'btn') { if (![...ptrs.values()].some((q) => q.role === 'btn' && q.id === p.id)) { held[p.id] = false; btns[p.id].classList.remove('down'); } }
      else if (p.role === 'stick') stickHome();
    };
    for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) root.addEventListener(t, onUp);
    root.addEventListener('contextmenu', (e) => e.preventDefault());
    root.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });   // no double-tap zoom or long-press callout on iOS
    root.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

    // Touch mode: on at the first touch, off on a key or mouse press (capture, so it runs before the game's listeners).
    addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') setTouchMode(true); else if (e.pointerType === 'mouse') setTouchMode(false); }, true);
    addEventListener('keydown', () => setTouchMode(false), true);
    addEventListener('blur', releaseAll);
    document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
    try { if (matchMedia('(pointer: coarse)').matches) S.touchMode = true; } catch (err) {}

    return {
      poll() {
        refresh();
        if (!S.showing) return { x: 0, y: 0, held: {}, pressed: {}, lookDx: 0, lookDy: 0, looking: false };
        const out = { x: S.x, y: S.y, held: { ...held }, pressed: { ...latched }, lookDx: S.lookDx, lookDy: S.lookDy,
          looking: [...ptrs.values()].some((p) => p.role === 'look') };
        for (const k in latched) { if (latched[k]) out.held[k] = true; latched[k] = false; }
        S.lookDx = S.lookDy = 0;
        return out;
      },
      padUsed() { setTouchMode(false); },
      refresh,
      get state() {
        refresh();
        return { showing: S.showing, touchMode: S.touchMode, x: +S.x.toFixed(3), y: +S.y.toFixed(3),
          held: Object.keys(held).filter((k) => held[k]), looking: [...ptrs.values()].some((p) => p.role === 'look') };
      },
    };
  }
  return { create };
})();
</script>

<script type="module">
import * as THREE from 'three';

// ===========================================================================
// Wild World (#157, W1): an endless low-poly world, 18 animals to meet, and you can become any of them.
// Everything is built in code. Test hooks: window.__ww (bottom of this script).
// ===========================================================================
const $ = (id) => document.getElementById(id);
const V3 = THREE.Vector3;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const wrapA = (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const DT = 1 / 60;
const CHUNK = 64, SEG = 16, CS = CHUNK / SEG;   // 64 m chunks, a 4 m low-poly grid
const SEA = 0;
const LOAD_R = 2, FAR_R = 3, SLOTS = (FAR_R * 2 + 1) ** 2;   // 5 x 5 chunks loaded (7 x 7 while the giraffe looks far)
const LIVE_CAP = 20, LIVE_R = 85;                             // at most 20 live animals, all within 85 m
const FOG = { near: 40, far: 110 }, FOG_FAR = { near: 80, far: 185 };
const BC = 240, BLEND = 70;                                   // biome cells (m) and the border blend
const BIOMES = ['farm', 'forest', 'savanna', 'water'];

const params = new URLSearchParams(location.search);
const SEED = (parseInt(params.get('seed'), 10) || 157) >>> 0;

// ---------- storage (Robot Battle's try/catch style) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('wildworld.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('wildworld.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('wildworld.' + k); } catch (e) {} },
};

// ===========================================================================
// Seeded noise. Every chunk's random numbers come from (seed, cx, cz), never from a shared stream,
// so a chunk is the same whatever order the chunks load in.
// ===========================================================================

const MODEL_GEO = {};
for (const id of Object.keys(MODELS)) { const m = MODELS[id](); MODEL_GEO[id] = { body: m.P.build(), limbs: m.limbs }; }
function makeModel(id) {
  const g = new THREE.Group(), M = MODEL_GEO[id];
  g.add(new THREE.Mesh(M.body, MAT));
  g.userData.limbs = M.limbs.map((l) => { const m = new THREE.Mesh(l.geo, MAT); m.position.set(...l.at); m.userData = l; g.add(m); return m; });
  return g;
}
// swing the limbs: phase advances with speed; mode 'fly' flaps wings, 'fold' tucks them
function animateModel(g, phase, amt, mode) {
  for (const m of g.userData.limbs) {
    const l = m.userData, s = Math.sin(phase + l.ph);
    if (l.kind === 'leg') m.rotation.x = s * 0.7 * amt;
    else if (l.kind === 'arm') m.rotation.x = s * 0.8 * amt;
    else if (l.kind === 'wingL' || l.kind === 'wingR') { const side = l.kind === 'wingL' ? 1 : -1; m.rotation.z = mode === 'fold' ? -1.25 * side : side * Math.sin(phase * 1.6) * 0.6; }
    else if (l.kind === 'tail') m.rotation.y = Math.sin(phase * 1.5) * 0.5;
    else if (l.kind === 'fluke') m.rotation.x = Math.sin(phase * 1.2) * 0.35;
  }
}
