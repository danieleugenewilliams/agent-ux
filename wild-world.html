<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wild World</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #183153; --sun: #ffd23f; --leaf: #3ecf6e; --sky: #5cc8ff; --berry: #ff5d8f; --panel: rgba(24,49,83,.86); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; color: #fff; font-family: 'Baloo 2', ui-rounded, system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); display: none; gap: 8px; z-index: 10; pointer-events: none; }
  #hud.on { display: flex; }
  .chip { display: flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 999px; padding: 3px 12px 3px 4px; height: 40px; font-weight: 800; font-size: 15px; line-height: 1;
    box-shadow: 0 3px 0 rgba(0,0,0,.25); white-space: nowrap; }
  .chip img, .chip .ic { width: 32px; height: 32px; border-radius: 50%; background: #fff3; flex: none; }
  .chip .ic { display: flex; align-items: center; justify-content: center; background: var(--sun); color: var(--ink); }
  .chip .ic svg { width: 20px; height: 20px; }
  .chip small { display: block; font-size: 11px; font-weight: 600; opacity: .85; margin-top: 2px; }
  #toast { position: fixed; left: 50%; top: max(60px, calc(env(safe-area-inset-top) + 56px)); transform: translate(-50%, -10px); z-index: 12; pointer-events: none; opacity: 0;
    transition: opacity .25s, transform .25s; display: flex; align-items: center; gap: 10px; background: #fff; color: var(--ink); border-radius: 18px; padding: 6px 16px 6px 6px;
    font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 rgba(0,0,0,.2); max-width: calc(100vw - 32px); }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #toast img { width: 44px; height: 44px; border-radius: 12px; background: #dff3ff; flex: none; }
  #toast small { display: block; font-size: 13px; font-weight: 600; line-height: 1.25; max-width: 420px; }
  #hint { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 10; display: none; background: var(--panel); border-radius: 12px; padding: 4px 12px;
    font-size: 13px; font-weight: 600; white-space: nowrap; pointer-events: none; }
  #hint.on { display: block; }
  html.tp-showing #hint, html.touchy #hint, html.ov-open #hint, html.ov-open #hud, html.ov-open #toast { display: none; }
  #flash { position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 55%, #fff 0, #fff8 30%, #fff0 70%); }

  /* ---------- overlays (above the TouchPad's z-index 20) ---------- */
  .ov { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(16,36,64,.55); }
  .ov.on { display: flex; }
  .big { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 6px 22px; border: 0; border-radius: 16px; background: #fff; color: var(--ink);
    font-weight: 800; font-size: 20px; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .big svg { width: 28px; height: 28px; flex: none; }
  .big.go { background: var(--leaf); color: #fff; }
  .big:focus-visible, .wslot:focus-visible, .card:focus-visible, .x:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
  .x { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 48px; height: 48px; border-radius: 50%; border: 0;
    background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(0,0,0,.25); z-index: 2; }
  .x svg { width: 24px; height: 24px; }

  #title { background: linear-gradient(#5cc8ffcc, #3ecf6e99); flex-direction: column; gap: 14px; text-align: center; padding: 16px; }
  #title h1 { margin: 0; font-size: clamp(40px, 11vmin, 92px); line-height: .95; color: #fff; text-shadow: 0 4px 0 var(--ink), 0 0 18px #0004; letter-spacing: 1px; }
  #title p { margin: 0; font-size: clamp(15px, 3.6vmin, 22px); font-weight: 800; color: var(--ink); }
  #title .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  #pause .menu { display: flex; flex-direction: column; gap: 10px; align-items: stretch; min-width: 240px; max-height: 100%; padding: 12px; }
  #pause h2 { margin: 0; text-align: center; font-size: 30px; text-shadow: 0 3px 0 var(--ink); }
  #pause .keys { text-align: center; font-size: 13px; font-weight: 600; opacity: .9; }
  html.tp-showing #pause .keys, html.touchy #pause .keys { display: none; }

  #wheel .ring { position: absolute; inset: 0; }
  .wslot { position: absolute; border-radius: 50%; border: 3px solid #fff; background: #ffffffd0; padding: 0; overflow: hidden; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .wslot img { width: 100%; height: 100%; display: block; }
  .wslot.locked { background: #ffffff55; border-color: #ffffff88; }
  .wslot.locked img { filter: brightness(0); opacity: .35; }
  .wslot.cur { border-color: var(--sun); box-shadow: 0 0 0 4px var(--sun); }
  .wslot.sel { transform: scale(1.12); }
  .wslot.human { background: var(--sun); }
  #wname { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); max-width: calc(100% - 100px); overflow: hidden; background: var(--panel); border-radius: 12px; padding: 2px 14px;
    font-weight: 800; font-size: 18px; white-space: nowrap; pointer-events: none; }

  #book { background: rgba(16,36,64,.8); }
  #book .head { position: absolute; left: 16px; right: 72px; top: max(10px, env(safe-area-inset-top)); height: 48px; display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; }
  #book .head svg { width: 30px; height: 30px; }
  #book .grid { position: absolute; display: grid; gap: 8px; }
  .card { position: relative; border: 0; border-radius: 14px; background: #fff; padding: 0; overflow: hidden; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .card img { width: 100%; height: 100%; display: block; }
  .card span { position: absolute; left: 0; right: 0; bottom: 0; background: #183153cc; color: #fff; font-weight: 800; font-size: 13px; line-height: 1.5; text-align: center; }
  .card.locked { background: #ffffff40; }
  .card.locked img { filter: brightness(0); opacity: .4; }
  .card.cur { box-shadow: 0 0 0 4px var(--sun); }

  /* ---------- W2 (#158): who's playing, spelling, the profile maker, the parent view ---------- */
  /* the player tiles wrap onto rows when there's height; on a short screen they're one row that scrolls sideways (auto margins
     centre it without pushing the first tiles out of reach) */
  #title .who { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: min(100%, 560px); padding: 4px; }
  @media (max-height: 430px) { #title .who { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; max-width: 100%; scrollbar-width: none; } #title .who > .ptile:first-child { margin-left: auto; } #title .who > .ptile:last-child { margin-right: auto; } }
  .ptile { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 74px; padding: 0; border: 0; background: none; color: var(--ink); font-weight: 800; font-size: 13px; line-height: 1.15; touch-action: manipulation; }
  .ptile .face { width: 58px; height: 58px; border-radius: 50%; background: var(--c, #fff); color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 3px #fff, 0 3px 0 rgba(0,0,0,.25); }
  .ptile .face svg { width: 32px; height: 32px; }
  .ptile.add .face { background: #ffffffa0; }
  .ptile.cur .face { box-shadow: inset 0 0 0 3px #fff, 0 0 0 4px var(--sun), 0 3px 0 rgba(0,0,0,.25); }
  .ptile .nm { max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ptile:focus-visible .face, .pv-tab:focus-visible, .sp-key:focus-visible, .sp-tile:focus-visible, .sp-round:focus-visible, .mk-ic:focus-visible, .mk-col:focus-visible, .mk-lv:focus-visible, .pv-lv:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
  #parentB { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); width: 52px; height: 52px; padding: 0; border: 0; border-radius: 50%; background: var(--panel); color: #fff;
    display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-touch-callout: none; }
  #parentB .pic svg { width: 26px; height: 26px; }
  #parentB .ring { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); transform: rotate(-90deg); pointer-events: none; }
  #parentB circle { fill: none; stroke: var(--sun); stroke-width: 6; stroke-dasharray: 220; stroke-dashoffset: 220; stroke-linecap: round; }
  #parentB.holding circle { stroke-dashoffset: 0; transition: stroke-dashoffset 2s linear; }
  @media (max-height: 430px) { #title { gap: 8px; } #title h1 br { display: none; } #title h1 { font-size: 40px; } #title p { font-size: 15px; } .ptile .face { width: 50px; height: 50px; } }
  @media (max-height: 430px) { #pause .menu { display: grid; grid-template-columns: 1fr 1fr; min-width: 0; width: min(560px, calc(100vw - 24px)); } #pause h2, #pause .keys { grid-column: 1 / -1; } }

  .sp-panel, .mk-panel, .pv-panel { position: relative; width: min(760px, calc(100vw - 16px)); max-height: calc(100% - 12px); background: #fffdf5; color: var(--ink); border-radius: 22px; padding: 10px;
    display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
  .sp-top, .mk-head, .pv-head { display: flex; align-items: center; gap: 8px; min-height: 48px; }
  .sp-top img { width: 52px; height: 52px; border-radius: 14px; background: #dff3ff; flex: none; }
  .sp-clue { flex: 1; min-width: 0; font-weight: 800; font-size: 18px; line-height: 1.2; }
  .sp-clue .hint { display: inline-block; letter-spacing: 2px; color: #1f6fb8; white-space: nowrap; }
  .sp-round { width: 48px; height: 48px; border-radius: 50%; border: 0; padding: 0; background: var(--sky); color: #fff; flex: none; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 rgba(0,0,0,.25); touch-action: manipulation; }
  .sp-round svg { width: 26px; height: 26px; }
  .sp-round.plain { background: #e6ecf4; color: var(--ink); }
  .sp-round[hidden] { display: none; }
  .sp-slots { display: flex; justify-content: center; gap: 5px; }
  .sp-slot { width: var(--sw, 44px); height: var(--sh, 48px); border-radius: 10px; background: #fff; border: 3px solid #b9c8dc; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: calc(var(--sh, 48px) * .6); line-height: 1; }
  .sp-slot.next { border-color: var(--sky); box-shadow: 0 0 0 3px #5cc8ff55; }
  .sp-slot.ok { background: #d8f7e2; border-color: var(--leaf); }
  .sp-slot.fix { background: #fff1c2; border-color: #f0a500; }
  .sp-slot.ghost { color: #9fb2c8; }
  .sp-pad, .mk-grid { display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: var(--kg, 6px); }
  .sp-key, .sp-tile { width: var(--kw, 48px); height: var(--kh, 48px); border: 0; border-radius: 12px; padding: 0; background: #fff; color: var(--ink); font-weight: 800; font-size: calc(var(--kh, 48px) * .5); line-height: 1;
    box-shadow: 0 3px 0 #9fb2c8, inset 0 0 0 2px #c9d6e6; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .sp-tile { background: var(--sun); box-shadow: 0 4px 0 #c79a00; font-size: calc(var(--kh, 48px) * .55); }
  .sp-tile.used { visibility: hidden; }
  .sp-key.act { background: #e6ecf4; }
  .sp-key.go { background: var(--leaf); color: #fff; box-shadow: 0 3px 0 #1f8f48; }
  .sp-key svg, .sp-tile svg { width: 60%; height: 60%; }
  .sp-key[disabled] { opacity: .4; }
  .sp-after { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  .sp-after .tried { font-weight: 800; font-size: 18px; color: #c0392b; text-decoration: line-through; min-height: 22px; }
  .sp-after .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .sp-panel.right .sp-slot { background: #d8f7e2; border-color: var(--leaf); }

  .mk-head .face, .pv-tab .face { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--c, #fff); color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 3px #fff; }
  .mk-head .face svg { width: 28px; height: 28px; }
  .mk-name { flex: 1; min-width: 0; height: 48px; border-radius: 14px; background: #fff; border: 3px solid var(--c, #b9c8dc); font-size: 24px; font-weight: 800; display: flex; align-items: center; padding: 0 12px; overflow: hidden; white-space: nowrap; }
  .mk-name.empty { color: #9fb2c8; font-size: 18px; }
  .mk-why { color: #c0392b; font-weight: 800; font-size: 14px; text-align: center; min-height: 18px; }
  .mk-sec { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
  .mk-ic, .mk-col { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0; background: #e6ecf4; color: var(--ink); display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .mk-ic svg { width: 30px; height: 30px; }
  .mk-col { background: var(--c); width: 48px; height: 48px; }
  .mk-ic.on, .mk-col.on { box-shadow: 0 0 0 4px var(--ink); }
  .mk-lvs { display: flex; gap: 10px; }
  .mk-lv { flex: 1; min-height: 88px; border: 0; border-radius: 18px; background: #e6ecf4; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 800; font-size: 15px; padding: 6px; touch-action: manipulation; }
  .mk-lv b { font-size: 28px; line-height: 1; }
  .mk-lv svg { width: 34px; height: 34px; }
  .mk-lv.on { background: var(--sun); box-shadow: 0 0 0 4px var(--ink); }
  .mk-foot { display: flex; justify-content: space-between; gap: 10px; }
  .mk-foot .big { min-width: 120px; }
  .big[disabled] { opacity: .45; }

  .pv-head h2 { flex: 1; margin: 0; font-size: 24px; display: flex; align-items: center; gap: 8px; }
  .pv-head h2 svg { width: 28px; height: 28px; }
  .pv-tabs { display: flex; gap: 6px; flex: none; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .pv-tab { flex: none; }
  .pv-tab { display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 2px 12px 2px 2px; border: 0; border-radius: 999px; background: #e6ecf4; color: var(--ink); font-weight: 800; font-size: 15px; touch-action: manipulation; }
  .pv-tab .face { width: 40px; height: 40px; }
  .pv-tab .face svg { width: 24px; height: 24px; }
  .pv-tab.on { background: var(--sun); }
  .pv-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 700; font-size: 15px; }
  .pv-lv { min-width: 96px; min-height: 44px; border: 0; border-radius: 12px; background: #e6ecf4; color: var(--ink); font-weight: 800; font-size: 15px; touch-action: manipulation; }
  .pv-lv.on { background: var(--leaf); color: #fff; }
  .pv-list { flex: 1; min-height: 60px; overflow-y: auto; font-size: 14px; border-top: 2px solid #e3e9f2; -webkit-overflow-scrolling: touch; }
  .pv-an { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 5px 2px; border-bottom: 1px solid #e3e9f2; }
  .pv-an > b { width: 72px; flex: none; }
  .pv-w { padding: 1px 8px; border-radius: 999px; font-weight: 700; border: 2px solid transparent; }
  .pv-w.s-new { background: #f1f4f8; color: #5b6b80; border-color: #d5dde8; border-style: dashed; }
  .pv-w.s-learning { background: #ffe9b3; }
  .pv-w.s-mastered { background: #ffd23f; border-color: #b88a00; }
  .pv-note { font-size: 13px; color: #5b6b80; }
</style>

  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="hud">
  <div class="chip" id="formChip"><img id="formImg" alt=""><div><span id="formName">You</span><small id="formPower">Meet an animal!</small></div></div>
  <div class="chip" id="bookChip"><div class="ic" id="bookIc"></div><span id="bookCount">0/18</span></div>
</div>
<div id="toast"><img id="toastImg" alt=""><span id="toastText"></span></div>
<div id="hint">WASD move - drag to look - Space jump / fly - Shift power - Q change - V view - B book - Esc pause</div>

<div id="title" class="ov on">
  <h1>WILD <br>WORLD</h1>
  <p>Walk anywhere. Meet animals. Become them!</p>
  <div class="who" id="who"></div>
  <div class="row"><button class="big go" id="playBtn"></button></div>
  <button id="parentB" aria-label="Parents: hold to open"><svg class="ring" viewBox="0 0 78 78"><circle cx="39" cy="39" r="35"/></svg><span class="pic" id="parentIc"></span></button>
</div>

<div id="pause" class="ov"><div class="menu">
  <h2>PAUSED</h2>
  <button class="big go" id="resumeBtn"></button>
  <button class="big" id="pBookBtn"></button>
  <button class="big" id="pHumanBtn"></button>
  <button class="big" id="pSoundBtn"></button>
  <button class="big" id="pWhoBtn"></button>
  <div class="keys">Esc: pause - Q: change - B: book - V: view - H: human</div>
</div></div>

<div id="wheel" class="ov"><div class="ring" id="ring"></div><div id="wname"></div><button class="x" id="wheelX" aria-label="Close"></button></div>

<div id="book" class="ov"><div class="head" id="bookHead"></div><div class="grid" id="grid"></div><button class="x" id="bookX" aria-label="Close"></button></div>

<!-- spelling (#158): a modal over the game; its tiles and keys are its own controls -->
<div id="spell" class="ov" role="dialog" aria-label="Spell the word"><div class="sp-panel" id="spPanel">
  <div class="sp-top"><img id="spImg" alt=""><div class="sp-clue" id="spClue"></div><button class="sp-round" id="spSay" aria-label="Say it again"></button><button class="sp-round" id="spX" aria-label="Close"></button></div>
  <div class="sp-slots" id="spSlots"></div>
  <div class="sp-pad" id="spPad"></div>
</div></div>

<!-- the profile maker: a name (on its own keyboard), an icon and a color, and the level -->
<div id="maker" class="ov" role="dialog" aria-label="New profile"><div class="mk-panel" id="mkPanel"></div></div>

<!-- the parent view: behind the hold-to-open button on the title screen -->
<div id="parent" class="ov" role="dialog" aria-label="Parents"><div class="pv-panel" id="pvPanel"></div></div>

<!-- ===========================================================================
WORDS (#158): what you spell to change into each animal. Edit freely.
  - The first change into an animal always spells its name; after that it asks a word from that animal's lists.
  - level1 is for newer spellers (short, regular words: tap the letter tiles into order).
  - level2 is for stronger spellers (longer words: hear it, then type it).
  - Each line is "word: clue". The word is letters only (no spaces), US spelling; a capital letter is kept (Africa).
    The clue is the sentence shown with it; "..." marks where the word goes.
  - fact: one sentence shown when you first meet the animal.
  - Keep 5 to 8 words in each list (the test script checks).
  - Progress is kept per word, so a word in two lists (calf, fish) is one word to learn.
=========================================================================== -->
<script>
const WORDS = {
  horse: {
    fact: "A baby horse is a foal, and horses eat grass and hay.",
    level1: ["foal: A baby horse is a ...", "hay: In winter horses eat dried grass called ...", "farm: Many horses live on a ...", "mane: The long hair on a horse's neck is its ...", "hoof: A horse's hard foot is a ...", "tail: A horse swishes its ... at flies.", "grass: Horses munch on ... in the field."],
    level2: ["stallion: A grown-up boy horse is a ...", "herbivore: An animal that eats only plants is a ...", "gallop: The fastest way a horse runs is a ...", "pasture: A grassy field where horses eat is a ...", "stable: A horse's house on a farm is a ...", "saddle: A rider sits on a ..."],
  },
  cow: {
    fact: "A baby cow is a calf, and cows eat grass and give us milk.",
    level1: ["calf: A baby cow is a ...", "milk: Cows give us ... to drink.", "grass: Cows eat ... all day.", "farm: Many cows live on a ...", "moo: What sound does a cow make?", "barn: Cows sleep in a ... on the farm."],
    level2: ["herbivore: An animal that eats only plants is a ...", "pasture: A grassy field where cows eat is a ...", "udder: A cow makes milk in its ...", "cattle: A group of cows is called ...", "dairy: A farm that makes milk is a ... farm.", "stomach: A cow's ... has four parts."],
  },
  pig: {
    fact: "Pigs roll in mud to stay cool, and a baby pig is a piglet.",
    level1: ["mud: Pigs roll in ... to stay cool.", "farm: Many pigs live on a ...", "pen: A pig lives in a fenced ...", "snout: A pig's nose is a ...", "oink: What sound does a pig make?", "piglet: A baby pig is a ..."],
    level2: ["omnivore: Pigs eat plants and meat, so a pig is an ...", "sow: A mother pig is a ...", "litter: A group of piglets born together is a ...", "trough: Pigs eat from a long box called a ...", "wallow: Pigs love to roll, or ..., in mud.", "bristles: A pig's stiff hairs are called ..."],
  },

<!-- ===========================================================================
TouchPad: on-screen controller for phones and tablets (issue #92).
Self-contained: its CSS, DOM and logic all live in the one script element below, so another game can copy the block as-is.

  const pad = TouchPad.create({
    buttons: [                       // right side; the first is the main action (biggest, at the thumb's rest)
      { id: 'jump', label: 'JUMP', icon: '<svg…>' },
      { id: 'dive', label: 'DIVE', icon: '<svg…>', angle: 180 },   // degrees around the main button (90 = up, 180 = left)
    ],
    pause: true,                     // a pause button, top right (reported as pressed.pause)
    active: () => bool,              // is the game in play? The controller shows only then, and only in touch mode.
  });
  pad.poll() -> { x, y, held: {id: bool}, pressed: {id: bool}, lookDx, lookDy, looking }
     x/y are analog -1..1 like a gamepad's left stick (y down = +), after a dead zone. `pressed` latches every
     tap since the last poll, so a tap shorter than a frame still counts (and reads as held for that poll).
     lookDx/lookDy are the pixels dragged on empty space on the right since the last poll (camera / aim).
  pad.state -> { showing, touchMode, x, y, held: [ids], looking }   (for test hooks)
  pad.padUsed()                      // call when a gamepad button or stick is used: hides it until the next touch

Touch mode turns on at the first touch (pointerType 'touch') or on load when (pointer: coarse) matches, and off
on any key press, mouse press or padUsed(). Each pointerId is tracked on its own (move + buttons + look at once).
The root element toggles `tp-showing` on <html> so a game can move HUD pieces out of the thumbs' way.
=========================================================================== -->
<script>
window.TouchPad = (() => {
  const CSS = `
  .tp-root { position: fixed; inset: 0; z-index: 20; display: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    --tp-u: 1; --tp-l: max(16px, env(safe-area-inset-left)); --tp-r: max(16px, env(safe-area-inset-right)); --tp-t: max(12px, env(safe-area-inset-top)); --tp-b: max(16px, env(safe-area-inset-bottom)); }
  .tp-root.on { display: block; }
  @media (min-width: 700px) and (min-height: 700px) { .tp-root { --tp-u: 1.3; } }
  .tp-root * { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; box-sizing: border-box; }
  .tp-ring { position: absolute; border-radius: 50%; background: rgba(255,255,255,.25); border: 2px solid rgba(255,255,255,.55);
    box-shadow: 0 0 0 1.5px rgba(0,0,0,.28), inset 0 0 0 1px rgba(0,0,0,.12); }
  .tp-stick { width: calc(120px * var(--tp-u)); height: calc(120px * var(--tp-u)); margin: calc(-60px * var(--tp-u)) 0 0 calc(-60px * var(--tp-u)); pointer-events: none;
    background: rgba(255,255,255,.14); opacity: .75; transition: left .22s ease-out, top .22s ease-out, opacity .22s; }
  .tp-stick.live { transition: none; opacity: 1; background: rgba(255,255,255,.25); }
  .tp-knob { left: 50%; top: 50%; width: 44%; height: 44%; margin: -22% 0 0 -22%; background: rgba(255,255,255,.4); }
  .tp-stick.live .tp-knob { background: rgba(255,255,255,.55); }
  .tp-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #fff; padding: 0;
    font: 900 calc(10px * var(--tp-u)) system-ui, sans-serif; letter-spacing: .5px; text-shadow: 0 1px 2px rgba(0,0,0,.7), 0 0 4px rgba(0,0,0,.35); }
  .tp-btn svg { width: 46%; height: 46%; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.6)) drop-shadow(0 0 3px rgba(0,0,0,.3)); }
  .tp-btn.down { background: rgba(255,255,255,.5); transform: scale(.94); }
  .tp-pause { top: var(--tp-t); right: var(--tp-r); width: calc(44px * var(--tp-u)); height: calc(44px * var(--tp-u)); }
  `;
  const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>';
  const DEAD = 0.15;   // stick dead zone, as a fraction of its radius

  function create(cfg) {
    const style = document.createElement('style'); style.textContent = CSS; document.head.appendChild(style);
    const root = document.createElement('div'); root.className = 'tp-root'; root.setAttribute('aria-hidden', 'true');
    const stick = document.createElement('div'); stick.className = 'tp-ring tp-stick';
    const knob = document.createElement('div'); knob.className = 'tp-ring tp-knob'; stick.appendChild(knob); root.appendChild(stick);
    const btns = {};
    const mkBtn = (b, cls) => {
      const el = document.createElement('div'); el.className = 'tp-ring tp-btn ' + cls; el.dataset.tp = b.id;
      el.innerHTML = b.icon + (b.label ? `<span>${b.label}</span>` : ''); root.appendChild(el); btns[b.id] = el; return el;
    };
    cfg.buttons.forEach((b, i) => mkBtn(b, i === 0 ? 'tp-main' : 'tp-sub'));
    if (cfg.pause) mkBtn({ id: 'pause', icon: PAUSE_ICON }, 'tp-pause');
    document.body.appendChild(root);

    const S = { touchMode: false, showing: false, x: 0, y: 0, lookDx: 0, lookDy: 0 };
    const held = {}, latched = {};
    const ptrs = new Map();   // pointerId -> { role: 'stick' | 'look' | 'btn', ... }
    let home = { x: 0, y: 0 }, R = 60;
    const hasStick = () => [...ptrs.values()].some((p) => p.role === 'stick');

    function layout() {
      const u = parseFloat(getComputedStyle(root).getPropertyValue('--tp-u')) || 1;
      const len = (v) => { const p = document.createElement('div'); p.style.cssText = `position:absolute;width:${v}`; root.appendChild(p); const w = p.getBoundingClientRect().width; p.remove(); return w; };
      const L = len('var(--tp-l)'), Rt = len('var(--tp-r)'), B = len('var(--tp-b)');
      const W = innerWidth, H = innerHeight;
      R = 60 * u;
      home = { x: L + R + 12 * u, y: H - B - R - 12 * u };
      if (!hasStick()) { stick.style.left = home.x + 'px'; stick.style.top = home.y + 'px'; }
      // the main button sits at the right thumb's rest, the others in an arc around it
      const main = 80 * u, sub = 58 * u, gap = 14 * u;
      const cx = W - Rt - main / 2 - 10 * u, cy = H - B - main / 2 - 10 * u;
      cfg.buttons.forEach((b, i) => {
        const el = btns[b.id], s = i === 0 ? main : sub;
        let x = cx, y = cy;
        if (i > 0) { const a = (b.angle ?? 180) * Math.PI / 180, r = main / 2 + sub / 2 + gap; x = cx + Math.cos(a) * r; y = cy - Math.sin(a) * r; }
        Object.assign(el.style, { width: s + 'px', height: s + 'px', left: x - s / 2 + 'px', top: y - s / 2 + 'px' });
      });
    }
    addEventListener('resize', () => { if (S.showing) layout(); });

    const setKnob = (dx, dy) => { knob.style.transform = `translate(${dx}px, ${dy}px)`; };
    function stickHome() { S.x = S.y = 0; setKnob(0, 0); stick.classList.remove('live'); stick.style.left = home.x + 'px'; stick.style.top = home.y + 'px'; }
    function releaseAll() {
      ptrs.clear(); for (const k in held) held[k] = false; for (const k in latched) latched[k] = false;
      S.lookDx = S.lookDy = 0; for (const el of Object.values(btns)) el.classList.remove('down'); stickHome();
    }
    function refresh() {
      const show = S.touchMode && !!cfg.active();
      if (show !== S.showing) {
        S.showing = show; root.classList.toggle('on', show); document.documentElement.classList.toggle('tp-showing', show);
        if (show) layout(); else releaseAll();
      }
    }
    function setTouchMode(on) { if (S.touchMode !== on) { S.touchMode = on; refresh(); } }

    function stickMove(p, x, y) {
      let dx = x - p.x0, dy = y - p.y0; const d = Math.hypot(dx, dy);
      if (d > R) { dx *= R / d; dy *= R / d; }
      setKnob(dx, dy);
      const m = Math.min(1, d / R);
      if (m < DEAD) { S.x = S.y = 0; return; }
      const s = (m - DEAD) / (1 - DEAD) / m;   // rescale: the dead zone's edge reads 0, the rim reads 1
      S.x = dx / R * s; S.y = dy / R * s;
    }

    root.addEventListener('pointerdown', (e) => {
      e.preventDefault();   // no stopPropagation: the game's own pointerdown (audio unlock) still runs
      const bEl = e.target.closest && e.target.closest('[data-tp]');
      try { root.setPointerCapture(e.pointerId); } catch (err) {}
      if (bEl) {
        const id = bEl.dataset.tp; held[id] = true; latched[id] = true; bEl.classList.add('down');
        ptrs.set(e.pointerId, { role: 'btn', id });
      } else if (e.clientX < innerWidth * 0.4) {
        if (hasStick()) return;
        // the stick floats: its centre lands under the thumb, kept fully on screen
        const x = Math.max(R + 4, e.clientX), y = Math.max(R + 4, Math.min(e.clientY, innerHeight - R - 4));
        const p = { role: 'stick', x0: x, y0: y }; ptrs.set(e.pointerId, p);
        stick.classList.add('live'); stick.style.left = x + 'px'; stick.style.top = y + 'px';
        stickMove(p, e.clientX, e.clientY);
      } else {
        ptrs.set(e.pointerId, { role: 'look', lx: e.clientX, ly: e.clientY });
      }
    });
    root.addEventListener('pointermove', (e) => {
      const p = ptrs.get(e.pointerId); if (!p) return;
      e.preventDefault();
      if (p.role === 'stick') stickMove(p, e.clientX, e.clientY);
      else if (p.role === 'look') { S.lookDx += e.clientX - p.lx; S.lookDy += e.clientY - p.ly; p.lx = e.clientX; p.ly = e.clientY; }
    });
    const onUp = (e) => {
      const p = ptrs.get(e.pointerId); if (!p) return;
      ptrs.delete(e.pointerId);
      if (p.role === 'btn') { if (![...ptrs.values()].some((q) => q.role === 'btn' && q.id === p.id)) { held[p.id] = false; btns[p.id].classList.remove('down'); } }
      else if (p.role === 'stick') stickHome();
    };
    for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) root.addEventListener(t, onUp);
    root.addEventListener('contextmenu', (e) => e.preventDefault());
    root.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });   // no double-tap zoom or long-press callout on iOS
    root.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

    // Touch mode: on at the first touch, off on a key or mouse press (capture, so it runs before the game's listeners).
    addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') setTouchMode(true); else if (e.pointerType === 'mouse') setTouchMode(false); }, true);
    addEventListener('keydown', () => setTouchMode(false), true);
    addEventListener('blur', releaseAll);
    document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
    try { if (matchMedia('(pointer: coarse)').matches) S.touchMode = true; } catch (err) {}

    return {
      poll() {
        refresh();
        if (!S.showing) return { x: 0, y: 0, held: {}, pressed: {}, lookDx: 0, lookDy: 0, looking: false };
        const out = { x: S.x, y: S.y, held: { ...held }, pressed: { ...latched }, lookDx: S.lookDx, lookDy: S.lookDy,
          looking: [...ptrs.values()].some((p) => p.role === 'look') };
        for (const k in latched) { if (latched[k]) out.held[k] = true; latched[k] = false; }
        S.lookDx = S.lookDy = 0;
        return out;
      },
      padUsed() { setTouchMode(false); },
      refresh,
      get state() {
        refresh();
        return { showing: S.showing, touchMode: S.touchMode, x: +S.x.toFixed(3), y: +S.y.toFixed(3),
          held: Object.keys(held).filter((k) => held[k]), looking: [...ptrs.values()].some((p) => p.role === 'look') };
      },
    };
  }
  return { create };
})();
</script>

import * as THREE from 'three';

// ===========================================================================
// Wild World (#157, W1): an endless low-poly world, 18 animals to meet, and you can become any of them.
// Everything is built in code. Test hooks: window.__ww (bottom of this script).
// ===========================================================================
const $ = (id) => document.getElementById(id);
const V3 = THREE.Vector3;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const wrapA = (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const DT = 1 / 60;
const CHUNK = 64, SEG = 16, CS = CHUNK / SEG;   // 64 m chunks, a 4 m low-poly grid
const SEA = 0;
const LOAD_R = 2, FAR_R = 3, SLOTS = (FAR_R * 2 + 1) ** 2;   // 5 x 5 chunks loaded (7 x 7 while the giraffe looks far)
const LIVE_CAP = 20, LIVE_R = 85;                             // at most 20 live animals, all within 85 m
const FOG = { near: 40, far: 110 }, FOG_FAR = { near: 80, far: 185 };
const BC = 240, BLEND = 70;                                   // biome cells (m) and the border blend
const BIOMES = ['farm', 'forest', 'savanna', 'water'];

const params = new URLSearchParams(location.search);
const SEED = (parseInt(params.get('seed'), 10) || 157) >>> 0;

// ---------- storage (Robot Battle's try/catch style) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('wildworld.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('wildworld.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('wildworld.' + k); } catch (e) {} },
};

// ===========================================================================
// Seeded noise. Every chunk's random numbers come from (seed, cx, cz), never from a shared stream,
// so a chunk is the same whatever order the chunks load in.
// ===========================================================================
function hashI(a, b, c) {

const MODEL_GEO = {};
for (const id of Object.keys(MODELS)) { const m = MODELS[id](); MODEL_GEO[id] = { body: m.P.build(), limbs: m.limbs }; }
function makeModel(id) {
  const g = new THREE.Group(), M = MODEL_GEO[id];
  g.add(new THREE.Mesh(M.body, MAT));
  g.userData.limbs = M.limbs.map((l) => { const m = new THREE.Mesh(l.geo, MAT); m.position.set(...l.at); m.userData = l; g.add(m); return m; });
  return g;
}
// swing the limbs: phase advances with speed; mode 'fly' flaps wings, 'fold' tucks them
function animateModel(g, phase, amt, mode) {
  for (const m of g.userData.limbs) {
    const l = m.userData, s = Math.sin(phase + l.ph);
    if (l.kind === 'leg') m.rotation.x = s * 0.7 * amt;
    else if (l.kind === 'arm') m.rotation.x = s * 0.8 * amt;
    else if (l.kind === 'wingL' || l.kind === 'wingR') { const side = l.kind === 'wingL' ? 1 : -1; m.rotation.z = mode === 'fold' ? -1.25 * side : side * Math.sin(phase * 1.6) * 0.6; }
    else if (l.kind === 'tail') m.rotation.y = Math.sin(phase * 1.5) * 0.5;
    else if (l.kind === 'fluke') m.rotation.x = Math.sin(phase * 1.2) * 0.35;
  }
}

    if (n === 4) acc = 0;
  } else acc = 0;

    for (let i = 0; i < PUFF_N * 3; i += 3) { puffVel[i + 1] -= 3 * dt; puffPos[i] += puffVel[i] * dt; puffPos[i + 1] += puffVel[i + 1] * dt; puffPos[i + 2] += puffVel[i + 2] * dt; puffVel[i] *= 0.96; puffVel[i + 2] *= 0.96; }

  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }

  power() { VIN.powerP = true; this.step(1); return P.lastSmash; },
  meet(id) { return meet(id); },
  become(id) { if (id !== 'human' && !P.met.has(id)) meet(id); return requestChange(id); },
  reset() { store.del('save'); store.del('book.' + who.id); P.met.clear(); Player.changed.clear(); return true; },
  biomeAt, heightAt: groundAt, heightRaw,
  animalsNear(r = 1e9) { return [...live.values()].filter((a) => Math.hypot(a.x - P.x, a.z - P.z) < r).map((a) => ({ key: a.key, type: a.type, x: +a.x.toFixed(2), y: +a.y.toFixed(2), z: +a.z.toFixed(2), biome: biomeAt(a.x, a.z), home: biomeAt(a.hx, a.hz), d: +Math.hypot(a.x - P.x, a.z - P.z).toFixed(2), scare: a.scare, call: a.call, mode: a.mode })); },
  liveAnimal(key) { return live.get(key) || null; },
  spawnsAround(r) { const out = [], pcx = Math.floor(P.x / CHUNK), pcz = Math.floor(P.z / CHUNK); for (let dx = -r; dx <= r; dx++) for (let dz = -r; dz <= r; dz++) out.push(...chunkSpawns(pcx + dx, pcz + dz)); return out; },
  nearestUnmet,
  meetReach(type) { return meetReach({ def: A[type] }); },
  chunk(cx, cz) {
    const c = chunks.get(cx + ',' + cz); if (!c) return null;
    const pos = c.mesh.geometry.attributes.position.array, heights = []; for (let i = 1; i < pos.length; i += 3) heights.push(+pos[i].toFixed(4));
    const m = new THREE.Matrix4(), props = c.props.map((p) => { PROPS[p.t].getMatrixAt(p.i, m); const e = m.elements; return [p.t, +e[12].toFixed(3), +e[13].toFixed(3), +e[14].toFixed(3), +Math.hypot(e[0], e[1], e[2]).toFixed(3)]; });
    return { gen: c.gen, uuid: c.mesh.geometry.uuid, heights, props, slot: c.slot, spawns: c.spawns.length };
  },
  propsNear(r = 12) {
    const fx = Math.sin(P.yaw), fz = Math.cos(P.yaw), out = [];
    for (const p of propsNear(P.x, P.z, r)) { const dx = p.x - P.x, dz = p.z - P.z, d = Math.hypot(dx, dz); if (d <= r) out.push({ t: p.t, x: p.x, z: p.z, d: +d.toFixed(2), dot: +((dx * fx + dz * fz) / (d || 1)).toFixed(3), big: p.big, fallen: p.fallen, knock: !!PROP_DEFS[p.t].knock, col: PROP_DEFS[p.t].col * p.s }); }
    return out;
  },
  info() {
    const inst = {}; let liveInst = 0;
    for (const k of PROP_KINDS) { let n = 0; for (const c of chunks.values()) for (const p of c.props) if (p.t === k) n++; inst[k] = { capacity: PROPS[k].userData.capacity, count: PROPS[k].count, live: n }; liveInst += n; }
    return { geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures, meshes: sceneMeshes(), animalMeshes: [...live.values()].reduce((n, a) => n + a.model.children.length, 0), chunks: chunks.size, animals: live.size, instances: inst, liveInstances: liveInst,
      programs: renderer.info.programs?.length ?? null, frames };
  },
  openWheel, openBook, openPause, closeOverlay, toggleView, thumbs: THUMB, makeModel,
  // ---- W2 (#158): who's playing and spelling
  WORDS: typeof WORDS === 'object' ? WORDS : null, LISTS, SPELL, PROFILE,
  // pick who's playing ('guest' or a profile's id; as a tap on their title tile does, without starting play); no id: who it is
  profile(id) { if (id !== undefined) { if (id !== GUEST.id && !Profiles.get(id)) return null; choosePlayer(id); } return { ...who, changed: [...Player.changed] }; },
  profiles() { return Profiles.all().map((p) => ({ ...p })); },
  addProfile(name, icon, color, level) { const r = Profiles.add(name, icon, color, level); if (r.ok && screen !== 'play') drawWho(); return r; },
  // the current player's level (as the parent view sets it); no n: what it is
  level(n) { if (n !== undefined) Profiles.setLevel(who.id, n); return who.level; },
  // the spelling panel now: { open, animal, word, kind (name | word), level, mode (tiles | type), clue, tiles, typed, done, reveal, shown, speech, ... }
  prompt() { return Ask.status(); },
  // answer the open prompt (as typed or tapped): { right, word, form } (the change, or the spelling shown, happens at once)
  answer(text) { if (overlay !== 'spell' || !Ask.p) return null; const word = Ask.p.word, right = Ask.submit(text, true); return { right, word, form: P.form, prompt: Ask.status() }; },
  again() { Ask.again(); return Ask.status(); },
  // open the panel for animal with a given word from its lists (the tests' way to aim at one word); go: change if right
  ask(animal, word) { const q = [...(LISTS[animal]?.[1] || []), ...(LISTS[animal]?.[2] || [])].find((x) => x.word.toLowerCase() === String(word).toLowerCase()); if (!q || !P.met.has(animal)) return null; return Ask.open(animal, () => { Player.changed.add(animal); doChange(animal); }, q); },
  // an animal's words with the current player's stage for each
  words(animal) { const L = LISTS[animal]; if (!L) return null; const st = (q) => ({ word: q.word, clue: q.clue, stage: Spell.stage(q.word) }); return { name: A[animal].name.toLowerCase(), nameStage: Spell.stage(A[animal].name), fact: L.fact, level1: L[1].map(st), level2: L[2].map(st) }; },
  // the current player's word progress
  progress() { const R = Spell.rec; return { who: who.id, level: who.level, n: R.n, last: R.last, today: Spell.day(), missesWeek: Spell.missesWeek(), words: JSON.parse(JSON.stringify(R.words)), saved: !who.guest && store.get('words.' + who.id, null) != null }; },
  // the clock for "different days": days from now (fractions are fine); returns the day number
  clock(days = 0) { Spell.offset = days * DAY_MS; return Spell.day(); },
  // the spelling gate on or off for this page (not saved): ww-world.mjs turns it off so its form checks change at once
  spelling(on = true) { Spell.on = !!on; return Spell.on; },
  seed(n) { Spell.rand = rng(n >>> 0); return true; },
  say: Say,
  openMaker() { return Maker.open(); }, maker() { return Maker.status(); }, Maker,
  openParent() { return Parent.open(); }, parent() { return Parent.status(); }, Parent, Hold,
  openTitle() { openTitle(); return screen; },
  // the player's tails as the play camera sees them: shown = how much of the tail's length faces the camera
  // (1 side-on, 0 end-on: |dir x ray to its middle|), and on-screen widths (px, across the tail's screen line) of each tail and its tip
  tailView() {
    P.pop = 1; updateView(); P.model.updateMatrixWorld(true); camera.updateMatrixWorld();
    const body = P.model.children[0], W = body.matrixWorld, out = [];
    const px = (p) => { const q = p.clone().project(camera); return [(q.x + 1) / 2 * innerWidth, (1 - q.y) / 2 * innerHeight]; };
    const corners = (q) => { const m = new THREE.Matrix4().fromArray(q.m).premultiply(W), [w, h, d] = q.dims, o = [];
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) o.push(px(new V3(sx * w / 2, sy * h / 2, sz * d / 2).applyMatrix4(m))); return o; };
    let cur = null;
    for (const q of body.geometry.userData.anat) {
      if (q.role === 'tail' && q.dims) {
        const m = new THREE.Matrix4().fromArray(q.m).premultiply(W), k = q.dims.indexOf(Math.max(...q.dims)), u = [0, 0, 0]; u[k] = q.dims[k] / 2;
        const a = new V3(...u).applyMatrix4(m), b = new V3(...u.map((x) => -x)).applyMatrix4(m), dir = b.clone().sub(a).normalize(), mid = a.clone().add(b).multiplyScalar(0.5);
        const ray = mid.clone().sub(camera.position).normalize(), sa = px(a), sb = px(b);
        let ax = [sb[0] - sa[0], sb[1] - sa[1]]; const l = Math.hypot(...ax) || 1; ax = [-ax[1] / l, ax[0] / l];
        const across = (cs) => { const v = cs.map((c) => c[0] * ax[0] + c[1] * ax[1]); return Math.max(...v) - Math.min(...v); };
        const sorted = [...q.dims].sort((x, y) => y - x);
        cur = { shown: +dir.clone().cross(ray).length().toFixed(3), lengthPx: +l.toFixed(1), widthPx: +across(corners(q)).toFixed(1), line: sorted[0] / sorted[1] >= 2, tips: [], across };
        out.push(cur);
      } else if (q.role === 'tip' && cur) cur.tips.push({ widthPx: +cur.across(corners(q)).toFixed(1) });
    }
    return { form: P.form, tails: out.map(({ across, ...t }) => t), camD: camera.position.distanceTo(P.model.position) };
  },
  // a model's tagged parts in world space (built at `at`, facing +z): each part's box and the two ends of its long axis;
  // swinging tails (fish, dolphin) give their pivot and their far end
  anatomy(id, at = [12, 3, -7]) {
    const g = makeModel(id); g.position.set(...at); g.updateMatrixWorld(true);
    const body = g.children[0], W = body.matrixWorld, v = (a) => new V3(...a);
    const parts = body.geometry.userData.anat.map((q) => {
      const m = new THREE.Matrix4().fromArray(q.m), box = new THREE.Box3(v(q.min), v(q.max)).applyMatrix4(W);
      let e1, e2;
      if (q.dims) { const k = q.dims.indexOf(Math.max(...q.dims)), u = [0, 0, 0]; u[k] = q.dims[k] / 2; e1 = v(u).applyMatrix4(m).applyMatrix4(W); e2 = v(u.map((x) => -x)).applyMatrix4(m).applyMatrix4(W); }
      else { const c = new V3().setFromMatrixPosition(m).applyMatrix4(W); e1 = c.clone().add(new V3(0, 0, q.r)); e2 = c.clone().add(new V3(0, 0, -q.r)); }
      const size = q.dims ? Math.max(...q.dims) : q.r * 2;
      return { role: q.role, min: box.min.toArray(), max: box.max.toArray(), ends: [e1.toArray(), e2.toArray()], size };
    });
    const swing = g.userData.limbs.filter((l) => l.userData.kind === 'tail' || l.userData.kind === 'fluke').map((l) => {
      l.geometry.computeBoundingBox(); return { role: 'tail', ends: [l.getWorldPosition(new V3()).toArray(), new V3(0, 0, l.geometry.boundingBox.min.z).applyMatrix4(l.matrixWorld).toArray()], swing: true };
    });
    return { id, at, parts: [...parts, ...swing] };
  },
};
