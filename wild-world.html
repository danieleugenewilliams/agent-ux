<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wild World</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #183153; --sun: #ffd23f; --leaf: #3ecf6e; --sky: #5cc8ff; --berry: #ff5d8f; --panel: rgba(24,49,83,.86); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; color: #fff; font-family: 'Baloo 2', ui-rounded, system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); display: none; gap: 8px; z-index: 10; pointer-events: none; }
  #hud.on { display: flex; }
  .chip { display: flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 999px; padding: 3px 12px 3px 4px; height: 40px; font-weight: 800; font-size: 15px; line-height: 1;
    box-shadow: 0 3px 0 rgba(0,0,0,.25); white-space: nowrap; }
  .chip img, .chip .ic { width: 32px; height: 32px; border-radius: 50%; background: #fff3; flex: none; }
  .chip .ic { display: flex; align-items: center; justify-content: center; background: var(--sun); color: var(--ink); }
  .chip .ic svg { width: 20px; height: 20px; }
  .chip small { display: block; font-size: 11px; font-weight: 600; opacity: .85; margin-top: 2px; }
  #toast { position: fixed; left: 50%; top: max(60px, calc(env(safe-area-inset-top) + 56px)); transform: translate(-50%, -10px); z-index: 12; pointer-events: none; opacity: 0;
    transition: opacity .25s, transform .25s; display: flex; align-items: center; gap: 10px; background: #fff; color: var(--ink); border-radius: 18px; padding: 6px 16px 6px 6px;
    font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 rgba(0,0,0,.2); max-width: calc(100vw - 32px); }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #toast img { width: 44px; height: 44px; border-radius: 12px; background: #dff3ff; flex: none; }
  #toast small { display: block; font-size: 13px; font-weight: 600; line-height: 1.25; max-width: 420px; }
  #hint { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 10; display: none; background: var(--panel); border-radius: 12px; padding: 4px 12px;
    font-size: 13px; font-weight: 600; white-space: nowrap; pointer-events: none; }
  #hint.on { display: block; }
  html.tp-showing #hint, html.touchy #hint, html.ov-open #hint, html.ov-open #hud, html.ov-open #toast { display: none; }
  #flash { position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 55%, #fff 0, #fff8 30%, #fff0 70%); }

  /* ---------- overlays (above the TouchPad's z-index 20) ---------- */
  .ov { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(16,36,64,.55); }
  .ov.on { display: flex; }
  .big { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 6px 22px; border: 0; border-radius: 16px; background: #fff; color: var(--ink);
    font-weight: 800; font-size: 20px; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .big svg { width: 28px; height: 28px; flex: none; }
  .big.go { background: var(--leaf); color: #fff; }
  .big:focus-visible, .wslot:focus-visible, .card:focus-visible, .x:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
  .x { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 48px; height: 48px; border-radius: 50%; border: 0;
    background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(0,0,0,.25); z-index: 2; }
  .x svg { width: 24px; height: 24px; }

  #title { background: linear-gradient(#5cc8ffcc, #3ecf6e99); flex-direction: column; gap: 14px; text-align: center; padding: 16px; }
  #title h1 { margin: 0; font-size: clamp(40px, 11vmin, 92px); line-height: .95; color: #fff; text-shadow: 0 4px 0 var(--ink), 0 0 18px #0004; letter-spacing: 1px; }
  #title p { margin: 0; font-size: clamp(15px, 3.6vmin, 22px); font-weight: 800; color: var(--ink); }
  #title .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  #pause .menu { display: flex; flex-direction: column; gap: 10px; align-items: stretch; min-width: 240px; max-height: 100%; padding: 12px; }
  #pause h2 { margin: 0; text-align: center; font-size: 30px; text-shadow: 0 3px 0 var(--ink); }
  #pause .keys { text-align: center; font-size: 13px; font-weight: 600; opacity: .9; }
  html.tp-showing #pause .keys, html.touchy #pause .keys { display: none; }

  #wheel .ring { position: absolute; inset: 0; }
  .wslot { position: absolute; border-radius: 50%; border: 3px solid #fff; background: #ffffffd0; padding: 0; overflow: hidden; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .wslot img { width: 100%; height: 100%; display: block; }
  .wslot.locked { background: #ffffff55; border-color: #ffffff88; }
  .wslot.locked img { filter: brightness(0); opacity: .35; }
  .wslot.cur { border-color: var(--sun); box-shadow: 0 0 0 4px var(--sun); }
  .wslot.sel { transform: scale(1.12); }
  .wslot.human { background: var(--sun); }
  #wname { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); max-width: calc(100% - 100px); overflow: hidden; background: var(--panel); border-radius: 12px; padding: 2px 14px;
    font-weight: 800; font-size: 18px; white-space: nowrap; pointer-events: none; }

  #book { background: rgba(16,36,64,.8); }
  #book .head { position: absolute; left: 16px; right: 72px; top: max(10px, env(safe-area-inset-top)); height: 48px; display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; }
  #book .head svg { width: 30px; height: 30px; }
  #book .grid { position: absolute; display: grid; gap: 8px; }
  .card { position: relative; border: 0; border-radius: 14px; background: #fff; padding: 0; overflow: hidden; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .card img { width: 100%; height: 100%; display: block; }
  .card span { position: absolute; left: 0; right: 0; bottom: 0; background: #183153cc; color: #fff; font-weight: 800; font-size: 13px; line-height: 1.5; text-align: center; }
  .card.locked { background: #ffffff40; }
  .card.locked img { filter: brightness(0); opacity: .4; }
  .card.cur { box-shadow: 0 0 0 4px var(--sun); }

  /* ---------- W2 (#158): who's playing, spelling, the profile maker, the parent view ---------- */
  /* the player tiles wrap onto rows when there's height; on a short screen they're one row that scrolls sideways (auto margins
     centre it without pushing the first tiles out of reach) */
  #title .who { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: min(100%, 560px); padding: 4px; }
  @media (max-height: 430px) { #title .who { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; max-width: 100%; scrollbar-width: none; } #title .who > .ptile:first-child { margin-left: auto; } #title .who > .ptile:last-child { margin-right: auto; } }
  .ptile { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 74px; padding: 0; border: 0; background: none; color: var(--ink); font-weight: 800; font-size: 13px; line-height: 1.15; touch-action: manipulation; }
  .ptile .face { width: 58px; height: 58px; border-radius: 50%; background: var(--c, #fff); color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 3px #fff, 0 3px 0 rgba(0,0,0,.25); }
  .ptile .face svg { width: 32px; height: 32px; }
  .ptile.add .face { background: #ffffffa0; }
  .ptile.cur .face { box-shadow: inset 0 0 0 3px #fff, 0 0 0 4px var(--sun), 0 3px 0 rgba(0,0,0,.25); }
  .ptile .nm { max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ptile:focus-visible .face, .pv-tab:focus-visible, .sp-key:focus-visible, .sp-tile:focus-visible, .sp-round:focus-visible, .mk-ic:focus-visible, .mk-col:focus-visible, .mk-lv:focus-visible, .pv-lv:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
  #parentB { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); width: 52px; height: 52px; padding: 0; border: 0; border-radius: 50%; background: var(--panel); color: #fff;
    display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-touch-callout: none; }
  #parentB .pic svg { width: 26px; height: 26px; }
  #parentB .ring { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); transform: rotate(-90deg); pointer-events: none; }
  #parentB circle { fill: none; stroke: var(--sun); stroke-width: 6; stroke-dasharray: 220; stroke-dashoffset: 220; stroke-linecap: round; }
  #parentB.holding circle { stroke-dashoffset: 0; transition: stroke-dashoffset 2s linear; }
  @media (max-height: 430px) { #title { gap: 8px; } #title h1 br { display: none; } #title h1 { font-size: 40px; } #title p { font-size: 15px; } .ptile .face { width: 50px; height: 50px; } }
  @media (max-height: 430px) { #pause .menu { display: grid; grid-template-columns: 1fr 1fr; min-width: 0; width: min(560px, calc(100vw - 24px)); } #pause h2, #pause .keys { grid-column: 1 / -1; } }

  .sp-panel, .mk-panel, .pv-panel { position: relative; width: min(760px, calc(100vw - 16px)); max-height: calc(100% - 12px); background: #fffdf5; color: var(--ink); border-radius: 22px; padding: 10px;
    display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
  .sp-top, .mk-head, .pv-head { display: flex; align-items: center; gap: 8px; min-height: 48px; }
  .sp-top img { width: 52px; height: 52px; border-radius: 14px; background: #dff3ff; flex: none; }
  .sp-clue { flex: 1; min-width: 0; font-weight: 800; font-size: 18px; line-height: 1.2; }
  .sp-clue .hint { display: inline-block; letter-spacing: 2px; color: #1f6fb8; white-space: nowrap; }
  .sp-round { width: 48px; height: 48px; border-radius: 50%; border: 0; padding: 0; background: var(--sky); color: #fff; flex: none; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 rgba(0,0,0,.25); touch-action: manipulation; }
  .sp-round svg { width: 26px; height: 26px; }
  .sp-round.plain { background: #e6ecf4; color: var(--ink); }
  .sp-round[hidden] { display: none; }
  .sp-slots { display: flex; justify-content: center; gap: 5px; }
  .sp-slot { width: var(--sw, 44px); height: var(--sh, 48px); border-radius: 10px; background: #fff; border: 3px solid #b9c8dc; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: calc(var(--sh, 48px) * .6); line-height: 1; }
  .sp-slot.next { border-color: var(--sky); box-shadow: 0 0 0 3px #5cc8ff55; }
  .sp-gap { width: calc(var(--sw, 44px) * 0.45); flex: none; }   /* W4: the space in a two-word name (polar bear), filled in */
  .sp-slot.ok { background: #d8f7e2; border-color: var(--leaf); }
  .sp-slot.fix { background: #fff1c2; border-color: #f0a500; }
  .sp-slot.ghost { color: #9fb2c8; }
  .sp-pad, .mk-grid { display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: var(--kg, 6px); }
  .sp-key, .sp-tile { width: var(--kw, 48px); height: var(--kh, 48px); border: 0; border-radius: 12px; padding: 0; background: #fff; color: var(--ink); font-weight: 800; font-size: calc(var(--kh, 48px) * .5); line-height: 1;
    box-shadow: 0 3px 0 #9fb2c8, inset 0 0 0 2px #c9d6e6; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .sp-tile { background: var(--sun); box-shadow: 0 4px 0 #c79a00; font-size: calc(var(--kh, 48px) * .55); }
  .sp-tile.used { visibility: hidden; }
  .sp-key.act { background: #e6ecf4; }
  .sp-key.go { background: var(--leaf); color: #fff; box-shadow: 0 3px 0 #1f8f48; }
  .sp-key svg, .sp-tile svg { width: 60%; height: 60%; }
  .sp-key[disabled] { opacity: .4; }
  .sp-after { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  .sp-after .tried { font-weight: 800; font-size: 18px; color: #c0392b; text-decoration: line-through; min-height: 22px; }
  .sp-after .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .sp-panel.right .sp-slot { background: #d8f7e2; border-color: var(--leaf); }

  .mk-head .face, .pv-tab .face { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--c, #fff); color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 3px #fff; }
  .mk-head .face svg { width: 28px; height: 28px; }
  .mk-name { flex: 1; min-width: 0; height: 48px; border-radius: 14px; background: #fff; border: 3px solid var(--c, #b9c8dc); font-size: 24px; font-weight: 800; display: flex; align-items: center; padding: 0 12px; overflow: hidden; white-space: nowrap; }
  .mk-name.empty { color: #9fb2c8; font-size: 18px; }
  .mk-why { color: #c0392b; font-weight: 800; font-size: 14px; text-align: center; min-height: 18px; }
  .mk-sec { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
  .mk-ic, .mk-col { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0; background: #e6ecf4; color: var(--ink); display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .mk-ic svg { width: 30px; height: 30px; }
  .mk-col { background: var(--c); width: 48px; height: 48px; }
  .mk-ic.on, .mk-col.on { box-shadow: 0 0 0 4px var(--ink); }
  .mk-lvs { display: flex; gap: 10px; }
  .mk-lv { flex: 1; min-height: 88px; border: 0; border-radius: 18px; background: #e6ecf4; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 800; font-size: 15px; padding: 6px; touch-action: manipulation; }
  .mk-lv b { font-size: 28px; line-height: 1; }
  .mk-lv svg { width: 34px; height: 34px; }
  .mk-lv.on { background: var(--sun); box-shadow: 0 0 0 4px var(--ink); }
  .mk-copy { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 16px; background: #eef6ff; font-weight: 800; font-size: 15px; }
  .mk-cbook { flex: none; display: flex; align-items: center; gap: 4px; font-size: 22px; }
  .mk-cbook svg { width: 30px; height: 30px; }
  .mk-ctext { flex: 1; min-width: 0; }
  .mk-yn { flex: none; width: 52px; height: 52px; border: 0; border-radius: 50%; padding: 0; background: #e6ecf4; color: var(--ink); display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .mk-yn svg { width: 28px; height: 28px; }
  .mk-yn.on { background: var(--leaf); color: #fff; box-shadow: 0 0 0 4px var(--ink); }
  .mk-yn.no.on { background: #ff8a8a; }
  @media (max-height: 430px) { .mk-lv { min-height: 64px; flex-direction: row; gap: 8px; } .mk-lv b { font-size: 24px; } }
  .mk-foot { display: flex; justify-content: space-between; gap: 10px; }
  .mk-foot .big { min-width: 120px; }
  .big[disabled] { opacity: .45; }

  .pv-head h2 { flex: 1; margin: 0; font-size: 24px; display: flex; align-items: center; gap: 8px; }
  .pv-head h2 svg { width: 28px; height: 28px; }
  .pv-tabs { display: flex; gap: 6px; flex: none; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .pv-tab { flex: none; }
  .pv-tab { display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 2px 12px 2px 2px; border: 0; border-radius: 999px; background: #e6ecf4; color: var(--ink); font-weight: 800; font-size: 15px; touch-action: manipulation; }
  .pv-tab .face { width: 40px; height: 40px; }
  .pv-tab .face svg { width: 24px; height: 24px; }
  .pv-tab.on { background: var(--sun); }
  .pv-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 700; font-size: 15px; }
  .pv-lv { min-width: 96px; min-height: 44px; border: 0; border-radius: 12px; background: #e6ecf4; color: var(--ink); font-weight: 800; font-size: 15px; touch-action: manipulation; }
  .pv-lv.on { background: var(--leaf); color: #fff; }
  .pv-list { flex: 1; min-height: 60px; overflow-y: auto; font-size: 14px; border-top: 2px solid #e3e9f2; -webkit-overflow-scrolling: touch; }
  .pv-an { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 5px 2px; border-bottom: 1px solid #e3e9f2; }
  .pv-an > b { width: 72px; flex: none; }
  .pv-w { padding: 1px 8px; border-radius: 999px; font-weight: 700; border: 2px solid transparent; }
  .pv-w.s-new { background: #f1f4f8; color: #5b6b80; border-color: #d5dde8; border-style: dashed; }
  .pv-w.s-learning { background: #ffe9b3; }
  .pv-w.s-mastered { background: #ffd23f; border-color: #b88a00; }
  .pv-note { font-size: 13px; color: #5b6b80; }
</style>

  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="hud">
  <div class="chip" id="formChip"><img id="formImg" alt=""><div><span id="formName">You</span><small id="formPower">Meet an animal!</small></div></div>
  <div class="chip" id="bookChip"><div class="ic" id="bookIc"></div><span id="bookCount">0/29</span></div>
  <div class="chip" id="gameChip"><div class="ic" id="gameIc"></div><span id="gameText"></span></div>
</div>
<div id="peerTag"></div><div id="peerArrow"><span class="pt"></span><span class="fc"></span></div>
<div id="toast"><img id="toastImg" alt=""><span id="toastIc"></span><span id="toastText"></span></div>
<div id="hint">WASD move - drag to look - Space jump / fly - Shift power - Q change - V view - B book - Esc pause</div>

<div id="title" class="ov on">
  <h1>WILD <br>WORLD</h1>
  <p>Walk anywhere. Meet animals. Become them!</p>
  <div class="who" id="who"></div>
  <div class="row"><button class="big go" id="playBtn"></button></div>
  <button id="parentB" aria-label="Parents: hold to open"><svg class="ring" viewBox="0 0 78 78"><circle cx="39" cy="39" r="35"/></svg><span class="pic" id="parentIc"></span></button>
</div>

<div id="pause" class="ov"><div class="menu">
  <h2>PAUSED</h2>
  <button class="big go" id="resumeBtn"></button>
  <button class="big" id="pBookBtn"></button>
  <button class="big" id="pHumanBtn"></button>
  <button class="big" id="pSoundBtn"></button>
  <button class="big" id="pWhoBtn"></button>
  <button class="big" id="pTwoBtn"></button>
  <button class="big" id="pRaceBtn"></button>
  <button class="big" id="pTagBtn"></button>
  <div class="keys">Esc: pause - Q: change - B: book - V: view - H: human</div>
</div></div>

<div id="wheel" class="ov"><div class="ring" id="ring"></div><div id="wname"></div><button class="x" id="wheelX" aria-label="Close"></button></div>

<div id="book" class="ov"><div class="head" id="bookHead"></div><div class="grid" id="grid"></div><button class="x" id="bookX" aria-label="Close"></button></div>

<!-- spelling (#158): a modal over the game; its tiles and keys are its own controls -->
<div id="spell" class="ov" role="dialog" aria-label="Spell the word"><div class="sp-panel" id="spPanel">
  <div class="sp-top"><img id="spImg" alt=""><div class="sp-clue" id="spClue"></div><button class="sp-round" id="spSay" aria-label="Say it again"></button><button class="sp-round" id="spX" aria-label="Close"></button></div>
  <div class="sp-slots" id="spSlots"></div>
  <div class="sp-pad" id="spPad"></div>
</div></div>

<!-- the profile maker: a name (on its own keyboard), an icon and a color, and the level -->
<div id="maker" class="ov" role="dialog" aria-label="New profile"><div class="mk-panel" id="mkPanel"></div></div>

<!-- the parent view: behind the hold-to-open button on the title screen -->
<div id="parent" class="ov" role="dialog" aria-label="Parents"><div class="pv-panel" id="pvPanel"></div></div>
<input type="file" id="pvFile" accept=".json,application/json" hidden>

<!-- two players (#160): host or join a room on the home game server, from the pause menu -->
<div id="two" class="ov" role="dialog" aria-label="Two players"><div class="tw-panel" id="twPanel"></div></div>

<!-- ===========================================================================
WORDS (#158): what you spell to change into each animal. Edit freely.
  - The first change into an animal always spells its name; after that it asks a word from that animal's lists.
  - level1 is for newer spellers (short, regular words: tap the letter tiles into order).
  - level2 is for stronger spellers (longer words: hear it, then type it).
  - Each line is "word: clue". The word is letters only (no spaces), US spelling; a capital letter is kept (Africa).
    (An animal's own name may have a space, Polar Bear: the space is shown as a gap and filled in, never tapped or typed.)
    The clue is the sentence shown with it; "..." marks where the word goes.
  - fact: one sentence shown when you first meet the animal.
  - Keep 5 to 8 words in each list (the test script checks).
  - Progress is kept per word, so a word in two lists (calf, fish) is one word to learn.
=========================================================================== -->
<script>
const WORDS = {

  /* ---------- W3 (#160): two players: the friend's face over their head (or at the screen's edge), the game chip, the panel ---------- */
  #gameChip { display: none; }
  #hud.game #gameChip { display: flex; }
  #hud.game #bookChip { display: none; }
  #gameChip .ic { background: var(--sky); color: #fff; }
  #gameChip.it .ic { background: var(--berry); }
  #gameChip.it { background: #b0254f; }
  #peerTag, #peerArrow { position: fixed; left: 0; top: 0; z-index: 8; pointer-events: none; display: none; }
  #peerTag { width: 34px; height: 34px; margin: -17px 0 0 -17px; }
  #peerArrow { width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; }
  #peerTag.on, #peerArrow.on { display: block; }

    box-shadow: inset 0 0 0 3px #fff, 0 2px 0 rgba(0,0,0,.3); }
  #peerTag .face svg, #peerArrow .face svg, #toastIc .face svg { width: 60%; height: 60%; }
  #peerTag.it .face, #peerArrow.it .face { box-shadow: inset 0 0 0 3px #fff, 0 0 0 4px var(--berry); }
  #peerArrow .fc { position: absolute; inset: 0; }
  #peerArrow .pt { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #peerArrow .pt::before { content: ''; position: absolute; left: 24px; top: -10px; border-left: 14px solid var(--sun); border-top: 10px solid transparent; border-bottom: 10px solid transparent;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
  html.ov-open #peerTag, html.ov-open #peerArrow { display: none; }

  .tw-panel { position: relative; width: min(640px, calc(100vw - 16px)); max-height: calc(100% - 12px); background: #fffdf5; color: var(--ink); border-radius: 22px; padding: 10px;

})();

for (const id of Object.keys(MODELS)) { const m = MODELS[id](); MODEL_GEO[id] = { body: m.P.build(), limbs: m.limbs }; }
function makeModel(id) {
  const g = new THREE.Group(), M = MODEL_GEO[id];
  g.add(new THREE.Mesh(M.body, MAT));
  g.userData.limbs = M.limbs.map((l) => { const m = new THREE.Mesh(l.geo, MAT); m.position.set(...l.at); if (l.ry != null) { m.rotation.order = 'YXZ'; m.rotation.y = l.ry; } if (l.kind === 'mem') m.visible = false; m.userData = l; g.add(m); return m; });
  return g;
}
// swing the limbs: phase advances with speed; mode 'fly' flaps wings, 'fold' tucks them
function animateModel(g, phase, amt, mode) {
  for (const m of g.userData.limbs) {
    const l = m.userData, s = Math.sin(phase + l.ph);
    if (l.kind === 'leg') m.rotation.x = s * 0.7 * amt;
    else if (l.kind === 'arm') m.rotation.x = s * 0.8 * amt;
    else if (l.kind === 'wingL' || l.kind === 'wingR') { const side = l.kind === 'wingL' ? 1 : -1; m.rotation.z = mode === 'fold' ? -1.25 * side : side * Math.sin(phase * 1.6) * 0.6; }
    else if (l.kind === 'tail') m.rotation.y = Math.sin(phase * 1.5) * 0.5;
    else if (l.kind === 'fluke') m.rotation.x = Math.sin(phase * 1.2) * 0.35;
    // W4 (#166)
    else if (l.kind === 'row') m.rotation.z = s * 0.25 * amt;                                                   // a row of little legs (crab, beetle, centipede)
    else if (l.kind === 'tent') m.rotation.y = Math.sin(phase * 1.3 + l.ph) * 0.18;                             // an octopus's arms sway, every other one in turn
    else if (l.kind === 'flip') m.rotation.z = (l.at[0] > 0 ? 1 : -1) * (0.25 + (0.5 + 0.5 * s) * 0.5 * amt);    // a penguin's flippers
    else if (l.kind === 'elyL' || l.kind === 'elyR') m.rotation.z = mode === 'fly' ? (l.kind === 'elyL' ? -1 : 1) * 1.0 : 0;   // a beetle's shell opens to fly
    else if (l.kind === 'mem') { m.visible = mode === 'fly'; m.rotation.z = Math.sin(phase * 9 + l.ph) * 0.5; }   // and its thin wings buzz
  }
}

// ===========================================================================
// W3 (#160): two players, each on their own device, in the same world. Home Wi-Fi only, for now (Dad's pick): the page talks to
// scripts/ww-relay.mjs, which also serves it. The game only ever uses Net (host, join, send, on, close); the transport behind
// it is one small object (HomeTransport), so another one (a Cloudflare Worker) can be added later without touching the game.
// About a player, only their avatar (icon and color) goes over the wire: no name, no level, no words, no profile id.
//   The host is the referee (Net.you === 0): it decides who reached the flag first, who's it, and when time's up. Timers run on
//   each device's own clock from a duration (the devices' clocks needn't agree), and on real time, so a paused player doesn't
//   stop the other's game.
// ===========================================================================
// hz: where you are, sent this often; interp: the friend is drawn this far (ms) behind their newest message, one and a half
// sends, so there are nearly always two to slide between; snap: a jump bigger than this (m) between two messages isn't slid; silent: this long (ms) with nothing from the friend means the line is gone
const TWO = { hz: 30, interp: 50, snap: 8, silent: 8000, rideReach: 2.6, tagGap: 0.6, tagCool: 2000, raceDist: 60, raceSecs: 90, tagSecs: 60, goal: 4, countdown: 3 };

// W4 (#166): the world's layout version, sent with hi. The same seed lays the world out differently since W4 (seven places), so a
// W3 page and a W4 page aren't in the same world even with the same seed (a W3 page sends no w: that's 3).
const WORLD_V = 4;
// what the friend should see of a power, sent with every st as k (bits): 1 ink (hidden: the octopus can't be seen), 2 slither (no
// face or arrow: the snake moves silently), 4 under the ground (the worm burrowing), 8 sliding on its belly, 16 flying (the beetle)
const LOOK = { ink: 1, quiet: 2, under: 4, slide: 8, fly: 16 };
const lookBits = () => (P.ink > 0 ? LOOK.ink : 0) | (P.slither > 0 ? LOOK.quiet : 0) | (P.burrowing ? LOOK.under : 0) | (P.form === 'penguin' && P.slide > 0 ? LOOK.slide : 0) | (P.form === 'beetle' && P.buzzing && !P.grounded ? LOOK.fly : 0);
// what can be ridden, and where the rider sits: seat = the top of its back above its feet, z = how far forward of its middle
// (the builder could add more big animals here: cow, bear and giraffe would all carry a rider)
const RIDE = { horse: { seat: 1.75, z: -0.2 }, elephant: { seat: 2.5, z: -0.3 }, dolphin: { seat: 0.68, z: 0.05 } };
const HIP = 0.92;   // the guy's hips above his feet
const CODE_PICS = ['horse', 'pig', 'chicken', 'cat', 'elephant', 'giraffe', 'fish', 'eagle'];   // a room code is 4 of these

// ---------- the transport: the home game server's WebSocket (only on the page it serves, which says so with WW_RELAY)
const HomeTransport = {
  name: 'home',
  available() { return !!window.WW_RELAY && location.protocol === 'http:' && typeof WebSocket === 'function'; },
  // resolves to { send(obj), close() } once open; onMsg(obj) for each message, onClose() if the line drops later
  connect(onMsg, onClose) {
    return new Promise((res, rej) => {
      let ws, opened = false;
      try { ws = new WebSocket('ws://' + location.host + '/ww'); } catch (e) { rej(e); return; }
      ws.onopen = () => { opened = true; res({ send: (m) => { if (ws.readyState === 1) ws.send(JSON.stringify(m)); }, close: () => { ws.onclose = null; try { ws.close(); } catch (e) {} } }); };
      ws.onmessage = (e) => { let m = null; try { m = JSON.parse(e.data); } catch (err) {} if (m && typeof m.t === 'string') onMsg(m); };
      ws.onerror = () => {};
      ws.onclose = () => { if (!opened) rej(new Error('closed')); else onClose(); };
    });
  },
};

// ---------- Net: the only thing the game talks to.  state: off | connecting | waiting (hosting, alone) | together | dropped
const Net = {
  transport: HomeTransport, link: null, gen: 0, state: 'off', code: null, you: 0, sent: 0, got: 0, handlers: {},
  available() { return this.transport.available(); },
  on(type, fn) { (this.handlers[type] ||= []).push(fn); return fn; },
  emit(m) { for (const fn of this.handlers[m.t] || []) fn(m); },
  async open() {
    if (this.link) return this.link;
    const gen = ++this.gen; this.state = 'connecting';
    try {
      const link = await this.transport.connect((m) => { if (gen === this.gen) { this.got++; this.receive(m); } }, () => { if (gen === this.gen) this.lost(); });
      if (gen !== this.gen) { link.close(); return null; }
      this.link = link; return link;
    } catch (e) { if (gen === this.gen) { this.state = 'off'; this.emit({ t: 'fail' }); } return null; }
  },
  async host() { if (!this.available()) return false; const l = await this.open(); if (!l) return false; l.send({ t: 'host' }); return true; },
  async join(code) { if (!this.available()) return false; const l = await this.open(); if (!l) return false; l.send({ t: 'join', code }); return true; },
  send(m) { if (!this.link) return false; this.link.send(m); this.sent++; return true; },
  close() {
    this.gen++; const was = this.state;
    if (this.link) { this.link.send({ t: 'leave' }); this.link.close(); }
    this.link = null; this.state = 'off'; this.code = null;
    if (was !== 'off') this.emit({ t: 'closed' });
  },
  // the line dropped (closed), or went silent: hang up and say so
  lost(silent) { this.gen++; if (this.link) this.link.close(); this.link = null; const was = this.state; this.state = 'dropped'; this.code = null; this.emit({ t: 'lost', was, silent: !!silent }); },
  receive(m) {
    this.heardAt = performance.now();
    if (m.t === 'room') { this.code = Array.isArray(m.code) ? m.code.slice(0, 4) : null; this.you = m.you === 1 ? 1 : 0; this.state = m.peers > 1 ? 'together' : 'waiting'; }
    else if (m.t === 'peer-join') this.state = 'together';
    else if (m.t === 'peer-left') { if (this.state === 'together') this.state = 'waiting'; }
    else if (m.t === 'err') { this.gen++; if (this.link) this.link.close(); this.link = null; this.state = 'off'; this.code = null; }
    this.emit(m);
  },
};

// put the player at x, z: on the ground, paddling at the top in deep water, or swimming if a fish or dolphin (the tests' teleport too)
function placeAt(x, z, y) {
  P.x = x; P.z = z; const g = groundAt(x, z);
  P.y = y != null ? y : (isSwimmer(P.form) && g < SEA - 0.9 ? swimY(FORMS[P.form], g) : Math.max(g, g < SEA - 1.25 ? SEA - Math.min(1.3, FORMS[P.form].eye * 0.75) : g));
  P.vy = 0; P.vx = P.vz = 0; P.grounded = y == null; P.hop = P.leap = false; P.roll = P.slide = 0; P.burrowing = P.buzzing = false;
}

const Two = {
  page: 'off', entry: [], msg: '', lent: new Set(), calm: false, peer: null, ride: null, carrying: false, game: null, pulseT: 0, closeT: 0, nearRide: false, lastText: '',
  av() { return { icon: who.icon, color: who.color }; },

  // ---- the session
  async host() {
    if (!Net.available()) { this.msg = TWO_WHY; this.calm = true; this.draw(); return false; }

  joinPage() {

  async join(code) {

  del() { if (this.page !== 'join') return; this.entry.pop(); this.msg = ''; this.draw(); },
  leave() { Net.close(); },
  together() {

  // sent 30 times a second by a timer, and also from the frame loop as soon as you've moved (at most every 16 ms: the relay
