    return Array.isArray(out) ? out.map(of) : of(out);
  },
  // player i uses a weapon now ('gun' | 'punch' | 'kick'), through the same attack
  // code as the keys. Bullets fly and swings land over the next steps.
  // 'em' fires a pulse; 'rail' starts its charge (the shot leaves WEAPON.rail.charge seconds later)
  // and is refused while it's locked, as the keys are.
  fire(i, weapon) {
    const h = Game.humans[i]; if (!h || !WEAPON[weapon]) return null;
    if (!Game.unlocked.has(weapon)) return { ...this.state().players[i], refused: 'locked' };
    h.weapon = weapon; const m = h.mech; m.input.weapon = weapon;
    m.cool = 0; m.swing = null; m.charge = null;
    startAttack(m, weapon);
    return this.state().players[i];
  },
  // move player i (setup)
  // (a running mech that lands on a repair kit picks it up straight away, as walking onto it would)
  teleport(i, x, z) {
    const h = Game.humans[i]; if (!h) return null;
    const m = h.mech; m.pos.set(x, groundH(x, z), z); m.speed = 0; m.turnVel = 0; m.push.set(0, 0, 0); h.rig.snap = true;
    const kit = Kits.check(h), found = Hidden.check(h);
    return { ...this.state().players[i], kit: r3(kit), found };
  },
  // setup only: hurt player i without a robot (how: 'hit' lands on the hull, 'ram' on hull and legs)
  hurt(i, amount, how = 'hit') {
    const h = Game.humans[i]; if (!h) return null;
    hurtMech(h.mech, amount, how);
    return this.state().players[i];
  },
  // self-repair: player i spends parts from the bag on its own mech, picks = part ids,
  // e.g. ['armour'] (🛡️ mends the hull) or ['armour', 'motor']. The same path as tapping a
  // part in the 🔧 panel. Refused (nothing spent, nothing mended) when a part isn't in the
  // bag, fixes nothing, or its area isn't damaged, or the mech is powered down.
  repair(i, picks) {
    const h = Game.humans[i]; if (!h) return null;
    const res = repairSelf(h, picks);
    return { ...res, player: this.state().players[i], bag: { ...Game.bag }, parts: Game.parts };
  },
  // open or close the 🔧 mend panel (as its button does); returns whether it's open
  mend() { return FixUI.toggleMend(); },
  // setup only: hurt a robot without a weapon hit (doesn't count as a hit)
  damage(id, amount, weapon = 'setup') {
    const r = Game.robots.find((q) => q.id === id); if (!r) return null;
    hurtRobot(r, amount, weapon);
    return this.state().robots.find((q) => q.id === id);
  },
  // deal with a downed robot as player 0 (who must be within REPAIR.promptRange):
  // 'fix' opens its Quick Fix (name is optional; a random one is used if left out).
  // 'parts' with picks (a list of part ids from state().robots[i].parts, at most
  // REPAIR.takeMax) takes those into the bag and scraps the robot; without picks it
  // opens the parts picker, the same as the prompt's 🔩. Same path as keys and buttons.
  choose(id, choice, name, picks) {
    const r = Game.robots.find((q) => q.id === id);
    const res = r ? chooseFor(Game.humans[0], r, choice, name, picks) : { ok: false, why: 'no robot' };
    return { ...res, robot: r && Game.robots.includes(r) ? robotState(r) : null, squad: this.state().squad, parts: Game.parts, bag: { ...Game.bag } };
  },
  // patch a burnt plug in the open Quick Fix (as a tap on it does): 'new' (a 🔌 from the bag swapped it),
  // 'scrub' (one tap of FAULTS.scrub done), 'clean' (stripped clean), 'not burnt', 'not fixing'
  patch(id, plug) {
    const r = Game.robots.find((q) => q.id === id); if (!r) return null;
    const result = patchWire(Game.humans[0], r, plug);
    if (FixUI.mode === 'wires' && FixUI.r === r) FixUI.renderWires();
    return { result, robot: robotState(r), bag: { ...Game.bag }, parts: Game.parts };
  },
  // While the send-home panel is up (a 4th fix), pick squadmate id to go home, as a tap on its tile
  // does: the Quick Fix opens, and it leaves once that fix is done. With no panel up, squadmate id
  // goes home straight away.
  sendHome(id) {
    const h = Game.humans[0], r = Game.squad.find((q) => q.id === id);
    let res;
    if (h?.repair?.kind === 'home') res = chooseHome(h, r);
    else res = r ? { ok: sendHome(r), home: id, now: true } : { ok: false, why: 'not in squad' };
    return { ...res, squad: this.state().squad, ui: FixUI.mode, repair: this.state().repair };
  },
  // the clear screen's ▶: bring in the next wave. Refused until the meadow is cleared; from wave 0
  // (manual mode, where start() spawns nothing) it brings out wave 1, the opening spawn.
  nextWave() { const res = nextWave(); return { ...res, cleared: Game.cleared, clear: Waves.stats(), robots: this.state().robots.length }; },
  // pick player 0's weapon as a key or a tap on its slot does (refused while it's locked)
  weapon(w) { const h = Game.humans[0]; const ok = selectWeapon(h, w); return { ok, weapon: h?.weapon, unlocked: WEAPONS.filter((x) => Game.unlocked.has(x)) }; },
  // tap a part in the open picker (as a click would): 'on' | 'off' | 'full' | ...
  pick(id) { return { result: FixUI.pick(Game.humans[0], id), picks: Game.humans[0].repair?.picks?.slice() ?? null }; },
  // open or close the parts bag (as the 🎒 button does); returns whether it's open
  bag() { return FixUI.toggleBag(); },
  // plug wires in: pairs = [[plug, port], ...] (indexes into state().robots[i].wires).
  // Each goes through the same connectWire as a drag: right colour stays in, wrong
  // colour springs out. The last right wire fixes the robot.
  wire(id, pairs = []) {
    const r = Game.robots.find((q) => q.id === id); if (!r) return null;
    const results = pairs.map(([a, b]) => connectWire(Game.humans[0], r, a, b));
    FixUI.draw();
    return { results, robot: robotState(r), squad: this.state().squad, parts: Game.parts, bag: { ...Game.bag } };
  },
  state() {
    const p0 = Game.humans[0]?.mech, h0 = Game.humans[0];
    return {
      state: Game.state, paused: Game.paused, ticks: Game.ticks, hz: SIM_HZ,
      players: Game.humans.map((h) => {
        const m = h.mech;
        return {
          x: r3(m.pos.x), y: r3(m.pos.y), z: r3(m.pos.z),
          legHeading: r3(m.legHeading),                        // world yaw the legs face; forward = (-sin, -cos)
          torsoAim: { yaw: r3(m.torsoYaw), pitch: r3(m.aimPitch) },
          torsoOffset: r3(wrapAngle(m.torsoYaw - m.legHeading)), // torso relative to legs
          speed: r3(m.speed), topSpeed: MECH.topSpeed, footfalls: m.footfalls,
          health: r3(m.health), maxHealth: m.maxHealth, weapon: h.weapon, hitsTaken: m.hitsTaken,
          gun: { flash: r3(m.flash || 0), recoil: r3(m.recoil || 0), burst: m.burstN || 0, cool: r3(m.cool) },   // muzzle flash time left, arm recoil 0..1, rounds into this burst
          railCharge: m.charge ? r3(m.charge.t / WEAPON.rail.charge) : null,   // 0..1 while the rail gun charges
          state: m.state,                                      // 'up' | 'down' (powered down at 0 hearts)
          rebootIn: m.state === 'down' ? r3(m.downT) : null, downs: m.downs, reboots: m.reboots, glow: r3(m.glow),
          input: { throttle: m.input.throttle, turn: m.input.turn, attack: m.input.attack },
          damage: Object.fromEntries(AREAS.map((a) => [a, r3(m.damage[a])])),   // health missing, by area
          // what the 🔧 panel offers: each damaged area, the part that fixes it, and how many the bag has
          needs: AREAS.filter((a) => hurtIn(m, a)).map((a) => ({ area: a, part: partFor(a) ?? null, have: Game.bag[partFor(a)] || 0 })),
          heal: Object.fromEntries(Object.entries(h.heals).map(([s, v]) => [s, r3(v)])),   // health mended this tick, by source
          beam: h.beam ? h.beam.id : null,                     // the squadmate mending this mech now
          pilot: h.pilot?.name ?? null,                        // who's in the cockpit
        };
      }),
      robots: Game.robots.map(robotState),
      squad: Game.squad.map((r) => ({ id: r.id, name: r.name, state: r.state, x: r3(r.pos.x), z: r3(r.pos.z), dist: p0 ? r3(flatDist(r, p0)) : null })),
      parts: Game.parts,                                  // total parts collected (the HUD's 🔩)
      bag: { ...Game.bag },                               // parts collected, by kind: { armour: 2, ram: 1 }
      takeMax: REPAIR.takeMax,
      kits: Kits.list.map((k) => ({ id: k.id, x: r3(k.x), z: r3(k.z), from: k.from, spotted: k.spotted })),   // repair kits lying in the meadow ('meadow' | 'robot'); spotted = a squadmate drone has marked it
      swarms: Object.values(Game.swarms).map((sw) => ({ id: sw.id, n: sw.n, drones: Game.robots.filter((r) => r.swarm === sw.id).map((r) => r.id), kit: sw.kit })),   // kit: its one kit has dropped
      rules: { heal: { ...HEAL }, player: { ...PLAYER } },
      prompt: h0 && !h0.repair ? promptRobot(h0)?.id ?? null : null,   // the downed robot the prompt is beside
      // kind 'home' = asking who goes home; home = the squadmate picked to go when this fix is done
      repair: h0?.repair ? { id: h0.repair.r.id, kind: h0.repair.kind, name: h0.repair.name ?? null, picks: h0.repair.picks ? [...h0.repair.picks] : null, home: h0.repair.home?.id ?? null } : null,
      ui: FixUI.mode,                                     // null | 'wires' | 'name' | 'parts' | 'bag' | 'mend' | 'home'
      bullets: Bullets.list.length,
      // each live round: speed (m/s) and how far it has flown
      shots: Bullets.list.map((b) => ({ speed: r3(b.v.length()), d: r3(b.d), x: r3(b.p.x), y: r3(b.p.y), z: r3(b.p.z) })),
      gunSpeed: WEAPON.gun.speed,
      // every weapon in slot order, and the ones a player can pick now (the rail gun once a 🔭 is taken)
      weapons: WEAPONS.slice(), unlocked: WEAPONS.filter((w) => Game.unlocked.has(w)),
      lastRail: Game.lastRail ? { ...Game.lastRail, hits: [...Game.lastRail.hits] } : null,   // the last rail-gun shot: robots it passed through
      squadMax: REPAIR.squadMax,
      faultRules: { ...FAULTS, weight: { ...FAULTS.weight } },
      pulses: Bullets.list.filter((b) => b.kind === 'em').length, railFx: RailFx.live(),
      fx: { ...Impacts.live(), sparks: Sparks.list.filter((p) => p.t < p.life).length },
      // the pilot picked on the title screen (null until then); title: the title / pause screen is up
      pilot: Game.pilot ? { id: Game.pilot.id, name: Game.pilot.name, color: Game.pilot.hex } : null,
      title: Title.on ? (Game.pilot ? 'pause' : 'title') : null,
      pilots: PILOTS.map((P) => P.name),
      // hidden parts in the meadow: found = in the bag now (gone from the meadow); spotted = a squadmate drone marked it (by = its id)
      hidden: Hidden.list.map((q) => ({ id: q.id, part: q.part, x: r3(q.x), z: r3(q.z), found: q.found, spotted: q.spotted, by: q.by })),
      hiddenFound: Hidden.list.filter((q) => q.found).length,
      // every smashable: 'tree' | 'rock' | 'fence' (a fence section); broken for good once hp is 0 (by = what broke it, 'walk' = walked into)
      props: Props.list.map((p) => ({ id: p.id, kind: p.kind, x: r3(p.x), z: r3(p.z), hp: r3(p.hp), maxHp: p.maxHp, broken: p.broken, by: p.by, blocking: p.obs.some((o) => obstacles.includes(o)) })),
      propsBroken: Props.list.filter((p) => p.broken).length,
      // waves: the wave out now (0 before the first); cleared = no glitched or powered-down robot left in it;
      // clear = this wave's counts (fixed, taken apart, hidden parts found, robots it brought, left to beat,
      // player power-downs, stars once cleared); clearScreen = the clear screen is up
      wave: Game.wave, cleared: Game.cleared, clear: Waves.stats(), clearScreen: Waves.showing,
      waveRules: { ...WAVE, next: Waves.list(Game.wave + 1), nextTough: r3(Waves.tough(Game.wave + 1)) },
    };
  },
};

// ===========================================================================
// Boot
// ===========================================================================
Meadow.build();
Dust.init();
Sparks.init();
Bullets.init();
Impacts.init();
Pulses.init();
RailFx.init();
Kits.init();
Meadow.buildFences();     // after the kits, on their own seed, so nothing already in the meadow moves
Hidden.init();
Beams.init();
spawnPlayer(0, 0, 0, 0);
buildHud();
FixUI.init();
onResize();
Title.build();
// the portraits' initials use the web font: draw them again once it has loaded
document.fonts?.ready.then(() => { pilotFace.cache?.clear(); Title.build(); $('who').dataset.p = ''; Title.draw(); if (Game.pilot) setPilot(Game.humans[0], Game.pilot); updateHud.pilotKey = null; });
Game.state = 'play';
setPause(true);           // waits on the title screen for a pilot; hooks can still step
Game.paused = false;      // ...but the sim runs, so the mech idles in the meadow
$('loading').remove();
requestAnimationFrame(frame);
</script>
</body>
</html>
