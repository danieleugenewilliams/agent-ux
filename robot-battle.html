      const n = P.answer.length, st = P.done ? n : P.step, tw = Z.tw && Z.tw.until > performance.now() ? Z.tw.step : 0;
      const sock = (i) => `<span class="sock${i < st ? ' on' : ''}" style="${i < st ? `background:${CHAIN.tiles[P.answer[i]].hex}` : ''}">${i < st ? icon(CHAIN.tiles[P.answer[i]].ic) : ''}</span>`;
      const arr = (i) => `<b class="arr${i < st ? ' on' : ''}">${icon('arrow')}</b>`;
      const bot = `<svg class="bot${P.done ? ' on' : ''}" viewBox="0 0 80 100" role="img" aria-label="robot">`

      const row = (i, id, ic, name, inner) => `<div class="prow${i === this.prow ? ' cur' : ''}" data-row="${id}"><span class="plab">${icon(ic)}<small>${name}</small></span><div class="psw">${inner}</div></div>`;
      const sw = (id) => PALETTE.map((c, k) => `<button class="swatch${p[id] === c ? ' on' : ''}" data-row="${id}" data-v="${k}" style="--sc:${c}" aria-label="${id} colour ${k + 1}"></button>`).join('');

        return `<button class="decal${p.decal === D.id ? ' on' : ''}${t ? ' tint' : ''}" data-row="decal" data-v="${D.id}" aria-label="${D.name}" style="--tc:${p.trim}">${icon(D.ic)}${t ? `<i class="dtint" style="--m:${iconURL(D.ic)}"></i>` : ''}</button>`; }).join('');

    } else if (T.id === 'body') {

      const B = Body.status();

      const L = Shapes.status();

        // #89: a shape not built yet is a blueprint: its parts (icon, in / needed) and its steps as pips (lit once done); one

          : `<span class="lbp">${Object.keys(br.need).map((p) => `<i class="${br.parts[p] >= br.need[p] ? 'full' : ''}">${icon(PARTS[p].ic)}<b>${br.parts[p]}/${br.need[p]}</b></i>`).join('')}</span>`
            + `<span class="lpips">${Array.from({ length: br.steps }, (_, k) => `<i class="${k < br.step ? 'on' : ''}"></i>`).join('')}</span>`;
        return `<button class="lcard${on ? ' on' : ''}${i === this.lcur ? ' cur' : ''}${o.unlocked ? '' : ' locked'}${o.unlocked ? '' : soon ? ' soon' : ' bp'}" data-shape="${S.id}" style="--pc:${S.part ? PARTS[S.part].hex : '#ffd83d'}"`

  },
  // B2: a leg shape's trade-off against the walker, as [icon name, better?, how much]: energy, speed (top speed), accel (how
  // fast it gets going, I2), swap (leg turn), jump, boot (kick), smash (walking damage) and knock (the knock-back it takes,
  // I2: less is better)
  legFx(S) {
    const out = [], pct = (v) => (v > 1 ? '+' : '−') + Math.round(Math.abs(v - 1) * 100) + '%', times = (v) => '×' + v;
    if (S.energy) out.push(['energy', S.energy > 0, (S.energy > 0 ? '+' : '−') + Math.abs(S.energy)]);
    for (const [k, ic, f] of [['topSpeed', 'speed', pct], ['accel', 'accel', pct], ['legTurn', 'swap', times], ['jump', 'jump', pct], ['kick', 'boot', pct], ['walkDamage', 'smash', times], ['push', 'knock', times]])

  },
  // G4: the advanced shelf under the trophies: a slot per advanced part, lit once unlocked (its icon and what it does),

        : `<b class="amile">${icon('star')}${p.at}</b><small class="awords">${p.at} facts mastered</small>${next ? `<span class="abar"><i style="width:${Math.round(100 * Math.min(1, A.mastered / p.at))}%"></i></span>` : ''}`;
      return `<div class="aslot ${p.got ? 'got' : 'none'}${next ? ' next' : ''}${cheer.includes(p.id) ? ' new' : ''}" data-adv="${p.id}" data-got="${p.got ? 1 : 0}" data-at="${p.at}" style="--pc:${D.hex}" aria-label="${D.name}: ${p.got ? 'unlocked' : p.at + ' facts mastered'}">`
        + `<div class="tv"></div><span class="aic">${icon(D.ic)}</span>${foot}</div>`;
    }).join('')}</div>`;
  },
  // what the open wall shows, read back from the page: per part, found, the count and icons shown, and what
  // the 3D drew in its box last frame ('piece' or 'outline'); lock = the 🔒 tab showing instead.
  // I2: every field read from the page gives icon names, not emoji: a field that is only an icon is its name, a count is a
  // number, and a field mixing icons and text reads as the tables' fxIc strings do, each icon a {name} (icRead)
  dom() {
    if (!this.on) return null;
    const W = $('gWall'), lock = W.querySelector('.glock');
    const ic = (el) => el?.querySelector('svg.ic')?.dataset.icon ?? null, num = (el) => (el ? +(el.textContent.match(/-?\d+/)?.[0] ?? NaN) : null);
    const slots = Object.fromEntries([...W.querySelectorAll('.tslot')].map((el) => { const tn = el.querySelector('.tn');
      return [el.dataset.part, { found: el.dataset.found === '1', n: +el.dataset.n, count: ic(tn) ?? num(tn), icons: [...el.querySelectorAll('.tf svg.ic')].map((s) => s.dataset.icon), drawn: this.drawn[el.dataset.part] ?? null }]; }));
    // G2: the 🦾 cards as shown: level (pips lit), cost, bag count, the button's state ('buy' | 'off' greyed | 'max'),
    // picked = the keys / pad pick, drawn = the 3D piece in its box last frame
    const cards = Object.fromEntries([...W.querySelectorAll('.ucard')].map((el) => { const b = el.querySelector('.ubuy');
      return [el.dataset.up, { pips: el.querySelectorAll('.pips i.on').length, of: el.querySelectorAll('.pips i').length, cost: icRead(el.querySelector('.ucost')), have: num(el.querySelector('.uhave')),
        short: el.querySelector('.uhave').classList.contains('short'), button: b.classList.contains('max') ? 'max' : b.classList.contains('off') ? 'off' : 'buy', buttonIcon: ic(b), fx: icRead(el.querySelector('.ufx')),
        key: el.querySelector('.ukey') ? icRead(el.querySelector('.ukey')) : null, picked: el.classList.contains('cur'), drawn: this.drawn['up:' + el.dataset.up] ?? null }]; }));
    // G3: the 🤖 cards as shown (per squadmate: name, energy shown, the 🏠 warning, and per upgrade the same as a 🦾

    const rowOf = (el) => { const b = el.querySelector('.ubuy'); return { pips: el.querySelectorAll('.pips i.on').length, of: el.querySelectorAll('.pips i').length, fx: icRead(el.querySelector('.ufx')), part: ic(el.querySelector('.spart')),

      bar: +el.querySelector('.shead').dataset.bar, down: el.classList.contains('down'), downIcon: ic(el.querySelector('.sdown')),
      warn: el.querySelector('.swarn') ? icRead(el.querySelector('.swarn')) : null, rows: Object.fromEntries([...el.querySelectorAll('.srow')].map((r) => [r.dataset.up, rowOf(r)])) }));
    const prows = [...W.querySelectorAll('.prow')];

    const paint = prows.length ? Object.fromEntries(prows.map((el) => { const on = el.querySelector('.on'); return [el.dataset.row, { on: on ? (el.dataset.row === 'decal' ? on.dataset.v : PALETTE[+on.dataset.v]) : null, n: el.querySelectorAll('.swatch, .decal').length, picked: el.classList.contains('cur'),
      icon: ic(el.querySelector('.plab')), icons: [...el.querySelectorAll('.decal svg.ic')].map((s) => s.dataset.icon) }]; })) : null;
    // G4: the advanced shelf as shown: per part, unlocked, the milestone and words shown on an outline (null once lit),

    const advanced = Object.fromEntries([...W.querySelectorAll('.aslot')].map((el) => [el.dataset.adv, { got: el.dataset.got === '1', at: +el.dataset.at,
      mile: el.querySelector('.amile') ? icRead(el.querySelector('.amile')) : null, words: el.querySelector('.awords')?.textContent ?? null, fx: el.querySelector('.afx') ? icRead(el.querySelector('.afx')) : null,
      icon: ic(el.querySelector('.aic')), next: el.classList.contains('next'), bar: el.querySelector('.abar i')?.style.width ?? null, new: el.classList.contains('new'), drawn: this.drawn['adv:' + el.dataset.adv] ?? null }]));

    const lcards = [...W.querySelectorAll('.lcard')];
    const legs = lcards.length ? Object.fromEntries(lcards.map((el) => [el.dataset.shape, { on: el.classList.contains('on'), tick: !!el.querySelector('.lon'), tickIcon: ic(el.querySelector('.lon')), locked: el.classList.contains('locked'),

      fx: [...el.querySelectorAll('.lfx i')].map((i) => i.className + ' ' + icRead(i)), drawn: this.drawn['legs:' + el.dataset.shape] ?? null,
      // #89: a blueprint card: its parts as shown ('{spring}0/4{motor}0/2...'), its step pips (lit, of), or soon (no recipe yet)
      blueprint: el.classList.contains('bp'), soon: el.classList.contains('soon'), parts: el.querySelector('.lbp') ? icRead(el.querySelector('.lbp')) : null,
      pips: el.querySelector('.lpips') ? [el.querySelectorAll('.lpips i.on').length, el.querySelectorAll('.lpips i').length] : null }])) : null;
    // #89: the open blueprint as shown: its steps (lit, of, the current one), the part chips (in / needed and the bag's count
    // as shown, picked, the keys / pad cursor, full, none in the bag), the spots over the lift (in, next, glowing, where on the
    // lift box, shown), the job's plugs and ports (their tags, in, picked, cursor, the miss shown) and frame = what the 3D drew
    const bw = W.classList.contains('build'), num2 = (el) => (el ? (el.textContent.match(/(\d+)\/(\d+)/) || []).slice(1).map(Number) : null);
    const build = !bw ? null : { shape: this.bp, steps: [W.querySelectorAll('.bsteps i.on').length, W.querySelectorAll('.bsteps i').length], step: +(W.querySelector('.bsteps i.cur')?.dataset.k ?? -1),
      stepIcons: [...W.querySelectorAll('.bsteps i')].map((i) => ic(i)), done: !!W.querySelector('.bdone'), hint: W.querySelector('.bhint') ? icRead(W.querySelector('.bhint')) : null,
      parts: Object.fromEntries([...W.querySelectorAll('.bpart')].map((el) => { const [n, v] = num2(el.querySelector('.bin')); return [el.dataset.part, { in: n, need: v, bag: num(el.querySelector('.bbag')), picked: el.classList.contains('pick'),

        plugs: [...W.querySelectorAll('.bplug')].map((el) => ({ tag: el.querySelector('.fact')?.textContent ?? el.querySelector('.wsh')?.style.getPropertyValue('--wc') ?? null, stiff: el.querySelectorAll('.stiff i.on').length || null,
          in: el.classList.contains('in'), picked: el.classList.contains('pick'), cur: el.classList.contains('cur'), miss: ic(el.querySelector('.bmiss')) })),

    const ch = $('gCheer'), em = W.querySelector('.sempty');
    return { tab: this.tab, body, legs, build, lock: lock ? { tab: lock.dataset.tab, text: icRead(lock) } : null, slots, cards, squad, advanced, cheer: ch.classList.contains('on') ? icRead(ch.querySelector('.gch')) : null,

  // the 🔧 panel. Refused like repair(), and while the squadmate is powered down (that needs its Quick Fix)
  repairMate(id, picks, i = 0) {
    const h = Game.humans[i]; if (!h) return null;
    const res = repairSelf(h, picks, Game.squad.find((q) => q.id === id) ?? null);
    return { ...res, mate: this.state().squad.find((q) => q.id === id) ?? null, bag: { ...Game.bag }, parts: Game.parts };
  },
  // #59: tap a row in the open 🔧 panel, as a click does: 'armour' for your mech, 'armour@<id>' for a squadmate
  mendTap(key) { return FixUI.useMend(Game.humans[0], key); },
  damage(id, amount, weapon = 'setup') {
    const r = Game.robots.find((q) => q.id === id); if (!r) return null;
    hurtRobot(r, amount, weapon);
    return this.state().robots.find((q) => q.id === id);
  },
  // deal with a downed robot as player 0 (who must be within REPAIR.promptRange):
  // 'fix' opens its Quick Fix (name is optional; a random one is used if left out).
  // 'parts' with picks (a list of part ids from state().robots[i].parts, at most
  // REPAIR.takeMax) takes those into the bag and scraps the robot; without picks it
  // opens the parts picker, the same as the prompt's 🔩. Same path as keys and buttons.
  choose(id, choice, name, picks) {
    const r = Game.robots.find((q) => q.id === id);
    const res = r ? chooseFor(Game.humans[0], r, choice, name, picks) : { ok: false, why: 'no robot' };
    return { ...res, robot: r && Game.robots.includes(r) ? robotState(r) : null, squad: this.state().squad, parts: Game.parts, bag: { ...Game.bag } };
  },
  // patch a burnt plug in the open Quick Fix (as a tap on it does): 'new' (a 🔌 from the bag swapped it),
  // 'scrub' (one tap of FAULTS.scrub done), 'clean' (stripped clean), 'not burnt', 'not fixing'
  patch(id, plug) {
    const r = Game.robots.find((q) => q.id === id); if (!r) return null;
    const result = patchWire(Game.humans[0], r, plug);
    if (FixUI.mode === 'wires' && FixUI.r === r) { if (result === 'type') FixUI.openEntry(plug); else FixUI.renderWires(); }
    return { result, robot: robotState(r), bag: { ...Game.bag }, parts: Game.parts };
  },
  // While the send-home panel is up (a 4th fix), pick squadmate id to go home, as a tap on its tile
  // does: the Quick Fix opens, and it leaves once that fix is done. (G3: a squadmate with upgrades warns on the
  // first pick, why: 'upgrades'; picking it again sends it.) With no panel up, squadmate id
  // goes home straight away.
  sendHome(id) {
    const h = Game.humans[0], r = Game.squad.find((q) => q.id === id);
    let res;
    if (h?.repair?.kind === 'home') res = FixUI.pickHome(h, r);   // G3: an upgraded squadmate warns first (a second call sends it)
    else res = r ? { ok: sendHome(r), home: id, now: true } : { ok: false, why: 'not in squad' };
    return { ...res, squad: this.state().squad, ui: FixUI.mode, repair: this.state().repair };
  },
  // the clear screen's ▶: bring in the next wave. Refused until the meadow is cleared; from wave 0
  // (manual mode, where start() spawns nothing) it brings out wave 1, the opening spawn.
  nextWave() { const res = nextWave(); return { ...res, cleared: Game.cleared, clear: Waves.stats(), robots: this.state().robots.length }; },
  // pick player 0's weapon as a key or a tap on its slot does (refused while it's locked)
  weapon(w) { const h = Game.humans[0]; const ok = selectWeapon(h, w); return { ok, weapon: h?.weapon, unlocked: WEAPONS.filter((x) => Game.unlocked.has(x)) }; },
  // tap a part in the open picker (as a click would): 'on' | 'off' | 'full' | ...
  pick(id) { return { result: FixUI.pick(Game.humans[0], id), picks: Game.humans[0].repair?.picks?.slice() ?? null }; },
  // open or close the parts bag (as the 🎒 button does); returns whether it's open
  bag() { return FixUI.toggleBag(); },
  // plug wires in: pairs = [[plug, port], ...] (indexes into state().robots[i].wires).
  // Each goes through the same connectWire as a drag: right colour stays in, wrong
  // colour springs out. The last right wire fixes the robot.
  // Math wiring: each pair answers plug a's fact with port b's answer (recorded, as a drag is), timed as a
  // drag would be unless ms is given (then every pair took ms). 'typed' = plug a is typed (🔢: tap it and type
  // its answer); 'hidden' = port b is a typed plug's ❓.
  wire(id, pairs = [], ms) {
    const r = Game.robots.find((q) => q.id === id); if (!r) return null;
    const results = pairs.map(([a, b]) => connectWire(Game.humans[0], r, a, b, ms));
    if (FixUI.mode === 'wires' && FixUI.r === r) FixUI.renderWires(); else FixUI.draw();
    return { results, robot: robotState(r), squad: this.state().squad, parts: Game.parts, bag: { ...Game.bag } };
  },
  // Math wiring: type value for typed plug `plug` (state().robots[i].wires.typed, or a burnt one), as tapping
  // it and keying the digits then ✔ does (through the open keypad when the Quick Fix is up). 'ok' = right (it
  // snaps into its port), 'wrong' = a miss (it stays loose and its right answer shows), 'not typed', 'taken',
  // 'not math', 'not fixing'. ms as for wire().
  type(id, plug, value, ms) {
    const r = Game.robots.find((q) => q.id === id); if (!r) return null;
    let result;
    if (FixUI.mode === 'wires' && FixUI.r === r && typedPlug(r.wires, plug)) {
      if (FixUI.entry?.plug !== plug) FixUI.openEntry(plug);
      FixUI.entry.value = String(value ?? ''); FixUI.entry.lock = false;
      result = FixUI.submit(ms);
    } else result = typeAnswer(Game.humans[0], r, plug, value, ms);
    return { result, robot: Game.robots.includes(r) ? robotState(r) : null, entry: this.state().entry, squad: this.state().squad };
  },
  // tap plug `plug` in the open Quick Fix, as a click on it does: a burnt one is patched ('new' | 'scrub' |
  // 'clean' | 'type'), a typed one opens the keypad ('keypad'), any other is picked up ('sel')
  tap(plug) {
    const W = FixUI.mode === 'wires' && FixUI.r?.wires; if (!W) return { result: 'not fixing' };
    if (!(plug >= 0 && plug < W.plugs.length)) return { result: 'no such wire' };
    let result;
    if (W.burnt[plug]) result = FixUI.patch(plug);
    else if (typedPlug(W, plug)) result = FixUI.openEntry(plug) ? 'keypad' : 'refused';
    else if (W.link[plug] >= 0) result = 'taken';
    else { FixUI.sel = plug; FixUI.draw(); result = 'sel'; }
    return { result, entry: this.state().entry };
  },
  // press a key on the open keypad, as a tap on it does: '0'–'9', '⌫' or '✔'. Returns what key() did (the
  // value so far, 'empty', or ✔'s 'ok' / 'wrong') and the keypad and robot after it.
  key(k) {
    const r = FixUI.r, result = FixUI.key(k);
    return { result, entry: this.state().entry, robot: r && Game.robots.includes(r) ? robotState(r) : null };
  },
  state() {
    const p0 = Game.humans[0]?.mech, h0 = Game.humans[0];
    return {
      state: Game.state, paused: Game.paused, ticks: Game.ticks, hz: SIM_HZ,
      players: Game.humans.map((h) => {
        const m = h.mech;
        return {
          x: r3(m.pos.x), y: r3(m.pos.y), z: r3(m.pos.z),
          legHeading: r3(m.legHeading),                        // world yaw the legs face; forward = (-sin, -cos)
          torsoAim: { yaw: r3(m.torsoYaw), pitch: r3(m.aimPitch) },
          torsoOffset: r3(wrapAngle(m.torsoYaw - m.legHeading)), // torso relative to legs
          speed: r3(m.speed), topSpeed: r3((m.spec || MECH).topSpeed), footfalls: m.footfalls,   // topSpeed: with G2's leg motors
          health: r3(m.health), maxHealth: m.maxHealth, weapon: h.weapon, hitsTaken: m.hitsTaken,
          gun: { flash: r3(m.flash || 0), recoil: r3(m.recoil || 0), burst: m.burstN || 0, cool: r3(m.cool) },   // muzzle flash time left, arm recoil 0..1, rounds into this burst
          railCharge: m.charge ? r3(m.charge.t / WEAPON.rail.charge) : null,   // 0..1 while the rail gun charges
          state: m.state,                                      // 'up' | 'down' (powered down at 0 hearts)
          rebootIn: m.state === 'down' ? r3(m.downT) : null, downs: m.downs, reboots: m.reboots, glow: r3(m.glow),
          input: { throttle: m.input.throttle, turn: m.input.turn, attack: m.input.attack },
          damage: Object.fromEntries(AREAS.map((a) => [a, r3(m.damage[a])])),   // health missing, by area
          // what the 🔧 panel offers: each damaged area, the part that fixes it, and how many the bag has
          needs: AREAS.filter((a) => hurtIn(m, a)).map((a) => ({ area: a, part: partFor(a) ?? null, have: Game.bag[partFor(a)] || 0 })),
          heal: Object.fromEntries(Object.entries(h.heals).map(([s, v]) => [s, r3(v)])),   // health mended this tick, by source
          beam: h.beam ? h.beam.id : null,                     // the squadmate mending this mech now
          pilot: h.pilot?.name ?? null,                        // who's in the cockpit
          // G2: the upgrade levels on this mech, what they do now, and the upgrade pieces on its model (upgradeLook).
          // recharge: how fast weapon cooldowns run down (1 = as built); mend: what one part mends in self-repair;
          // kick: the kick's damage; jump: how high a jump goes (0 = can't); air: in a jump now, y = how high above
          // the ground, peak = this jump's highest so far, last = the last landed jump's height, jumps = landed,
          // over = the smashables this jump has passed over whole (ids; kept after landing until the mech is clear of them)
          upgrades: { ...upLevels({ upgrades: m.upg }) },
          effects: { maxHealth: m.maxHealth, topSpeed: r3((m.spec || MECH).topSpeed), recharge: r3(rechargeOf(m)), mend: mendPer(m),
            kick: r3(kickDmg(m)), jump: r3(UPGRADE.jump[m.upg?.spring || 0] * (m.fx?.jump ?? 1)),
            // B2: the leg shape's: legTurn and accel (rad/s and m/s², as the legs turn and speed up now), push = × knock-back taken,
            // walkDamage = × what walking into a prop does to it, turnSlow, and the shape's own multipliers (energy added)
            legTurn: r3((m.spec || MECH).legTurn), accel: r3((m.spec || MECH).accel), turnSlow: (m.spec || MECH).turnSlow ?? 0.3, push: m.fx?.push ?? 1, walkDamage: m.fx?.walkDamage ?? 1,
            shape: { legs: m.model?.legShape ?? 'walker', energy: m.fx?.energy ?? 0, speed: m.fx?.topSpeed ?? 1, jump: m.fx?.jump ?? 1, kick: m.fx?.kick ?? 1 } },
          jump: { air: !!m.hop, y: r3(m.hop ? m.hop.y : 0), peak: r3(m.hop ? m.hop.peak : 0), last: r3(m.hopPeak), jumps: m.jumps, over: m.over ? [...m.over].map((p) => p.id) : [],
            jet: !!m.hop?.jet, jetJumps: m.jetJumps || 0, flame: r3(m.jetT || 0) },   // G4: jet = this jump's mid-air jet jump is used; jetJumps = all of them; flame = burn left (s)
          // G4: the advanced parts on this mech (id: on), shield = hits it will still block this wave, blocked = hits blocked
          // so far, and what the model shows: the jets (and their flames lit now), the core, the bubble
          adv: { ...(m.adv || {}) }, shield: m.shield || 0, blocked: m.blocked || 0,
          advLook: m.model ? { jets: m.model.flames?.length || 0, flames: m.model.flames?.filter((f) => f.visible).length || 0, core: !!m.model.core?.parent, bubble: !!m.model.bubble?.visible } : null,
          look: upgradeLook(m.model),
          // G3: the paint on this mech, read back from its model: body / trim = the colours on its role materials, meshes
          // = how many wear each, decal = the one showing ('none' if none), decals = how many squares show it, and where
          paint: paintLook(m.model),
          // B1 (player 0): tiers by section, upgrade points, mastery bonus, the tiers' names, quality (mode 'auto' | 'full' |
          // 'lite', and the map size it gives), previewTier's override, and the model read back: mats per section
          // (Body.look) and cost = its draw calls and triangles
          body: h.idx === 0 ? Body.status(m.model) : null,
        };
      }),
      robots: Game.robots.map(robotState),
      // G3: type, health / maxHealth, its garage upgrades (plating, job) and what they do (effects: maxHealth, job =
      // { what: ram | range | scout | chain, value }), its mode, and rams = squadmate Charger rams landed (lastRam = the last's damage)
      squad: Game.squad.map((r) => ({ id: r.id, name: r.name, state: r.state, x: r3(r.pos.x), z: r3(r.pos.z), dist: p0 ? r3(flatDist(r, p0)) : null,
        type: r.type, health: r.health, maxHealth: r.maxHealth, upgrades: { plating: r.upg?.plating || 0, job: r.upg?.job || 0 }, effects: squadEffects(r), mode: r.ai.mode, rams: r.rams || 0, lastRam: r.lastRam ?? null,
        // #59: its damage by area, hits taken as a squadmate, powered down (down) with its rescue clock (rescueIn, s),
        // times powered down and rescued, the areas worth a part (needs, as players' needs), and its chip as drawn
        damage: Object.fromEntries(AREAS.map((a) => [a, r3(r.damage[a])])), hitsTaken: r.hitsTaken, down: r.state === 'down', rescueIn: r.state === 'down' ? r3(r.downT) : null,
        downs: r.mateDowns || 0, rescues: r.rescues || 0,
        needs: r.state === 'ally' ? AREAS.filter((a) => hurtIn(r, a)).map((a) => ({ area: a, part: partFor(a) ?? null, have: Game.bag[partFor(a)] || 0 })) : [],
        chip: (() => { const c = $('squad').children[Game.squad.indexOf(r)]; return c ? { bar: parseFloat(c.querySelector('.mhp b')?.style.width) || 0, down: c.classList.contains('down'), icon: c.querySelector('b svg')?.dataset.icon ?? null } : null; })() })),
      lost: Game.lost.map((q) => ({ ...q, upgrades: { ...q.upgrades } })),   // #59: squadmates destroyed this session ({ id, name, type, how: 'time' | 'parts', wave, upgrades })
      parts: Game.parts,                                  // total parts collected (the HUD's 🔩)
      bag: { ...Game.bag },                               // parts collected, by kind: { armour: 2, ram: 1 }
      takeMax: REPAIR.takeMax,
      kits: Kits.list.map((k) => ({ id: k.id, x: r3(k.x), z: r3(k.z), from: k.from, spotted: k.spotted })),   // repair kits lying in the meadow ('meadow' | 'robot'); spotted = a squadmate drone has marked it
      swarms: Object.values(Game.swarms).map((sw) => ({ id: sw.id, n: sw.n, drones: Game.robots.filter((r) => r.swarm === sw.id).map((r) => r.id), kit: sw.kit })),   // kit: its one kit has dropped
      rules: { heal: { ...HEAL }, player: { ...PLAYER } },
      prompt: h0 && !h0.repair ? promptRobot(h0)?.id ?? null : null,   // the downed robot the prompt is beside
      // kind 'home' = asking who goes home; home = the squadmate picked to go when this fix is done
      repair: h0?.repair ? { id: h0.repair.r.id, kind: h0.repair.kind, name: h0.repair.name ?? null, picks: h0.repair.picks ? [...h0.repair.picks] : null, home: h0.repair.home?.id ?? null } : null,
      ui: FixUI.mode,                                     // null | 'wires' | 'name' | 'parts' | 'bag' | 'mend' | 'home'
      // math wiring: a typed plug's keypad while it's open (plug, the digits typed, lock = a miss showing,
      // pos = the gamepad dial's digit: 0 tens, 1 ones; dial = the dial is drawn, a gamepad being connected)
      entry: FixUI.entry ? { plug: FixUI.entry.plug, value: FixUI.entry.value, lock: FixUI.entry.lock, pos: FixUI.entry.pos, dial: $('entV').classList.contains('dial') } : null,
      bullets: Bullets.list.length,
      // each live round: speed (m/s) and how far it has flown
      shots: Bullets.list.map((b) => ({ speed: r3(b.v.length()), d: r3(b.d), x: r3(b.p.x), y: r3(b.p.y), z: r3(b.p.z) })),
      gunSpeed: WEAPON.gun.speed,
      // every weapon in slot order, and the ones a player can pick now (the rail gun once a 🔭 is taken)
      weapons: WEAPONS.slice(), unlocked: WEAPONS.filter((w) => Game.unlocked.has(w)),
      lastRail: Game.lastRail ? { ...Game.lastRail, hits: [...Game.lastRail.hits] } : null,   // the last rail-gun shot: robots it passed through
      squadMax: REPAIR.squadMax,
      // P3-1: the last fix (board open to reboot): ms, math wires, puzzles (and their types, wrong taps), wiring, wave, band,
      // target; fixes = every fix this session; puzzle = the puzzle open in the Quick Fix ({ slot, type, cur } or null);
      // pace = the wave bands; seen = when each puzzle type was last dealt, for whoever is playing (an order)
      lastFix: Game.lastFix ? { ...Game.lastFix, types: [...Game.lastFix.types] } : null, fixes: Game.fixes.map((f) => ({ ...f, types: [...f.types] })),
      puzzle: FixUI.puz ? { slot: FixUI.puz.k, type: FixUI.puzzleOpen()?.type ?? null, cur: FixUI.puz.cur, step: FixUI.puzzleOpen()?.step ?? null } : null,
      pace: PACE.map((b) => ({ ...b, sizes: { ...b.sizes } })), seen: { ...puzzleSeen().seen },
      // #48: the puzzle types whose first-time hint this child has had (Guest's: this page only); hint = the hint playing now
      hints: Object.keys(puzzleHints()), hint: FixUI.hint ? { type: FixUI.hint.type, on: !!FixUI.hint.el.isConnected } : null,
      faultRules: { ...FAULTS, weight: { ...FAULTS.weight } },
      pulses: Bullets.list.filter((b) => b.kind === 'em').length, railFx: RailFx.live(),
      fx: { ...Impacts.live(), sparks: Sparks.list.filter((p) => p.t < p.life).length },
      // the pilot picked on the title screen (null until then); title: the title / pause screen is up
      pilot: Game.pilot ? { id: Game.pilot.id, name: Game.pilot.name, color: Game.pilot.hex } : null,
      // 'who' = who's playing, 'title' = the pilot pick, 'pause'; null while playing
      title: Title.on ? (Game.pilot ? 'pause' : Game.child ? 'title' : 'who') : null,
      // who's playing (null until picked), their Quick Fix setting, and math = it's math wiring
      child: Game.child ? { id: Game.child.id, name: Game.child.name, color: Game.child.hex, guest: !!Game.child.guest } : null,
      children: CHILDREN.map((C) => C.name),
      wiring: wiringMode(), math: wiringMode() === 'math',
      factStep: Facts.rec ? Facts.rec.step : null,
      // M4: the open overlay (null | 'grid' | 'parent'), where the grid was opened from ('hud' | 'pause'), the ⭐ badge's
      // text (null when it's hidden: Guest), the parent view's tab and confirm, the parent button being held, the cheer up now
      progress: { ui: Progress.mode, from: Progress.from, badge: $('masteryB').classList.contains('on') ? $('masteryN').textContent : null,
        tab: Progress.mode === 'parent' ? Progress.tab : null, confirm: Progress.confirm, holding: !!Progress.holdT, cheer: Progress.cheering ? [...Progress.cheering.tables] : null },
      pilots: PILOTS.map((P) => P.name),
      // hidden parts in the meadow: found = in the bag now (gone from the meadow); spotted = a squadmate drone marked it (by = its id)
      hidden: Hidden.list.map((q) => ({ id: q.id, part: q.part, x: r3(q.x), z: r3(q.z), found: q.found, spotted: q.spotted, by: q.by })),
      hiddenFound: Hidden.list.filter((q) => q.found).length,
      // every smashable: 'tree' | 'rock' | 'fence' (a fence section); broken for good once hp is 0 (by = what broke it, 'walk' = walked into, 'stomp' = a jump came down on it)
      props: Props.list.map((p) => ({ id: p.id, kind: p.kind, x: r3(p.x), z: r3(p.z), hp: r3(p.hp), maxHp: p.maxHp, broken: p.broken, by: p.by, blocking: p.obs.some((o) => obstacles.includes(o)) })),
      propsBroken: Props.list.filter((p) => p.broken).length,
      // waves: the wave out now (0 before the first); cleared = no glitched or powered-down robot left in it;
      // clear = this wave's counts (fixed, taken apart, hidden parts found, robots it brought, left to beat,
      // player power-downs, stars once cleared); clearScreen = the clear screen is up
      wave: Game.wave, cleared: Game.cleared, clear: Waves.stats(), clearScreen: Waves.showing,
      // G1: the garage (on, from 'pause' | 'clear', tab, paused, trophies by part: { count, found, from }, dom = the wall read back)
      // G2: garage.upgrades = whoever is playing's upgrade levels (saved in their record), garage.offer = what each next level needs
      garage: Garage.status(),
      unlocks: Garage.advStatus(),                        // G4: whoever is playing's advanced parts (Garage.advStatus)
      textures: Body.made,                                // B1: the canvas textures made for the body's maps so far
      // B2: whoever is playing's body shop: equipped { legs, torso, arms }, unlocked (shape ids latched), offer = per leg shape
      // { unlocked, have (its part's lifetime count), need, part }
      body: Shapes.status(),
      upgrades: Garage.levels(),                          // G2: whoever is playing's upgrade levels, by id
      upgradeRules: { ...UPGRADE, jump: [...UPGRADE.jump], list: UPGRADES.map((U) => ({ id: U.id, name: U.name, max: U.max, part: U.id })) },
      waveRules: { ...WAVE, next: Waves.list(Game.wave + 1), nextTough: r3(Waves.tough(Game.wave + 1)) },
    };
  },
};

// ===========================================================================
// Boot
// ===========================================================================
Icons.mount();            // I1: the icon sprite, and the page's icon placeholders drawn
Meadow.build();
Dust.init();
Sparks.init();
Bullets.init();
Impacts.init();
Pulses.init();
RailFx.init();
Kits.init();
Meadow.buildFences();     // after the kits, on their own seed, so nothing already in the meadow moves
Hidden.init();
Beams.init();
spawnPlayer(0, 0, 0, 0);
buildHud();
FixUI.init();
Progress.init();
BackupUI.init();
Garage.init();
applyUpgrades();          // G2: nobody picked yet, so a bare mech (levels all 0)
onResize();
Title.build();
// the portraits' initials use the web font: draw them again once it has loaded
document.fonts?.ready.then(() => pilotFace.refresh());
Game.state = 'play';
setPause(true);           // waits on the title screen for a pilot; hooks can still step
Game.paused = false;      // ...but the sim runs, so the mech idles in the meadow
iconTex.preload();         // I1: every world icon drawn now, long before a sprite can show one (iconTex.blank counts any that did)
$('loading').remove();
requestAnimationFrame(frame);
</script>
</body>
</html>
