// Simulation state for one mech. Players and robots write the same `input`
// fields; a robot also carries a `spec` that stands in for MECH.
function newMech(x, z, heading) {
  return {
    health: MECH_HEALTH, maxHealth: MECH_HEALTH, hitsTaken: 0,
    state: 'up', downT: 0, downs: 0, reboots: 0,   // a player's mech: 'up' | 'down' (robots set their own state)
    damage: { hull: 0, legs: 0, power: 0, wiring: 0 },   // health missing, by area (AREAS)
    glow: 1, slump: 0,        // lights 0..1 (dark when down, blinking before a reboot); slump 0..1 as it sags
    push: new V3(),           // knockback velocity, fades out
    cool: 0, swing: null,     // weapon cooldown and the melee swing in progress
    pos: new V3(x, groundH(x, z), z),
    legHeading: heading,      // where the legs face and walk
    torsoYaw: heading,        // where the torso faces (world yaw)
    aimPitch: 0,
    speed: 0,                 // signed, along legHeading
    turnVel: 0,
    phase: 0, footfalls: 0, lastFall: 0, fallFoot: 0,
    input: { throttle: 0, turn: 0, aimYaw: heading, aimPitch: 0, weapon: 'gun', attack: false, boost: false },
    model: null,
  };
}

function mechTick(m, dt) {
  const inp = m.input, S = m.spec || MECH;
  // Throttle: ease toward the target speed. Heavy: slow to gain, quicker to shed.
  // A robot with a boostSpeed (the Charger) can surge past its top speed.
  const boost = inp.boost && S.boostSpeed;
  const target = inp.throttle >= 0 ? inp.throttle * (boost ? S.boostSpeed : S.topSpeed) : inp.throttle * S.backSpeed;
  const speeding = Math.abs(target) > Math.abs(m.speed) && target * m.speed >= 0;
  m.speed = approach(m.speed, target, (speeding ? (boost ? S.boostAccel : S.accel) : S.brake) * dt);
  m.speed = clamp(m.speed, -S.backSpeed, S.boostSpeed || S.topSpeed);
  // Legs turn slowly, a little slower at speed
  const turnRate = S.legTurn * Math.max(0.2, 1 - 0.3 * Math.abs(m.speed) / S.topSpeed);
  m.turnVel = approach(m.turnVel, -inp.turn * turnRate, turnRate * 3 * dt);
  m.legHeading = wrapAngle(m.legHeading + m.turnVel * dt);
  // Torso swings toward the aim on its own turret ring
  m.torsoYaw = turnToward(m.torsoYaw, inp.aimYaw, S.torsoTurn * dt);
  m.aimPitch = approach(m.aimPitch, clamp(inp.aimPitch, -0.35, 0.5), 1.5 * dt);
  // Walk
  const fx = -Math.sin(m.legHeading), fz = -Math.cos(m.legHeading);
  m.pos.x += fx * m.speed * dt; m.pos.z += fz * m.speed * dt;
  // Knockback from rams and kicks slides the mech and fades out
  m.pos.x += m.push.x * dt; m.pos.z += m.push.z * dt; m.push.multiplyScalar(Math.exp(-3.5 * dt));
  let touched = null;    // the props a player's mech is leaning on (smashed after the loop: it changes `obstacles`)
  for (const o of obstacles) {
    const dx = m.pos.x - o.x, dz = m.pos.z - o.z, d = Math.hypot(dx, dz), min = o.r + S.radius;
    if (d < min && d > 1e-6) {
      m.pos.x = o.x + dx / d * min; m.pos.z = o.z + dz / d * min;
      if (m.human && o.prop) (touched ||= []).push([o, dx, dz, d]);
    }
  }
  if (touched) pushProps(m, touched, dt);
  const r = Math.hypot(m.pos.x, m.pos.z);
  if (r > WORLD_R) { m.pos.x *= WORLD_R / r; m.pos.z *= WORLD_R / r; }
  m.pos.y = groundH(m.pos.x, m.pos.z);
  // Gait: a footfall every stride, at the front of each leg's swing
  const prevPhase = m.phase;
  m.phase += (m.speed * dt / S.stride) * Math.PI;
  if (Math.abs(m.speed) < 0.05 && Math.abs(m.turnVel) > 0.05) m.phase += Math.abs(m.turnVel) * dt * 1.6;  // shuffle when turning on the spot
  const fallIdx = (ph) => Math.floor((ph - Math.PI / 2) / Math.PI);
  if (fallIdx(m.phase) !== fallIdx(prevPhase)) { m.footfalls++; m.lastFall = 0; m.fallFoot = fallIdx(m.phase) & 1; m.onFootfall?.(m); }
  m.lastFall += dt;
}

function syncMechModel(m) {
  const md = m.model; if (!md) return;
  md.root.position.copy(m.pos);
  md.root.rotation.y = m.legHeading;
  const k = clamp(Math.abs(m.speed) / MECH.topSpeed + Math.abs(m.turnVel) * 0.6, 0, 1);
  for (const L of md.legs) {
    const p = m.phase + (L.s > 0 ? 0 : Math.PI);
    const swing = Math.sin(p), lift = Math.max(0, Math.cos(p));
    L.hip.rotation.x = swing * 0.42 * k - 0.12;
    L.knee.rotation.x = -(0.25 + lift * 0.85 * k);
    L.ankle.rotation.x = -(L.hip.rotation.x + L.knee.rotation.x);
  }
  const bob = -0.22 * k * Math.pow(Math.abs(Math.sin(m.phase)), 6) - 0.12;
  md.body.position.y = bob;
  md.body.rotation.z = Math.sin(m.phase) * 0.025 * k;           // weight shifts side to side
  md.body.rotation.x = -m.speed / MECH.topSpeed * 0.04;          // lean into the walk
  md.torso.rotation.y = wrapAngle(m.torsoYaw - m.legHeading);
  for (const A of md.arms) { A.arm.rotation.x = m.aimPitch; A.fore.position.z = 0; }   // arms pitch with the aim
  // Powered down: the lights go out, the body sags, the torso tips forward and the arms hang
  for (const L of md.lights) L.mat.emissiveIntensity = L.k * m.glow;
  const sl = m.slump;
  md.body.position.y -= sl * 1.1; md.torso.rotation.x = -0.22 * sl;   // (the arms hang at the end, after recoil and swings)
  if (md.icon) {
    const icon = m.state === 'down' ? (m.downT > PLAYER.warnTime ? '💤' : '⚠️') : null;
    md.icon.visible = !!icon;
    if (icon) { md.icon.material.map = iconTex(icon); md.icon.position.y = 10.2 + Math.sin(Game.ticks / 10) * 0.2; }
  }
  // The cannon arm kicks back and up on each round; the flash sits on the barrel that fired
  const R = md.arms.find((a) => a.s > 0), rc = m.recoil || 0;
  R.fore.position.z = rc * 0.55; R.arm.rotation.x = m.aimPitch + rc * 0.09;
  const fl = m.flash > 0 ? m.flash / MUZZLE.flash : 0;
  md.flashes.forEach((f, k) => MuzzleFx.show(f, k === (m.barrel ? 1 : 0) ? fl : 0));
  if (md.muzzleLight) md.muzzleLight.intensity = fl * MUZZLE.light + (m.charge ? 12 * m.charge.t / WEAPON.rail.charge : 0);   // the rail gun glows as it charges
  // Melee: cock back until the strike, snap out, then ease home.
  // Punch throws the left (rocket-pod) arm; kick swings the right leg.
  const sw = m.swing;
  if (sw) {
    const W = WEAPON[sw.w];
    const e = sw.t < W.strike ? -0.35 * (sw.t / W.strike) : 1 - Math.pow(clamp((sw.t - W.strike) / (W.dur - W.strike), 0, 1), 2);
    if (sw.w === 'punch') {
      const A = md.arms.find((a) => a.s < 0);
      A.arm.rotation.x = m.aimPitch + e * 1.45; A.fore.position.z = -Math.max(0, e) * 0.9;
      md.torso.rotation.y += e * 0.18;
    } else {
      const L = md.legs.find((l) => l.s > 0);
      L.hip.rotation.x = e * 1.1; L.knee.rotation.x = -(0.25 + (1 - Math.max(0, e)) * 0.7); L.ankle.rotation.x = -(L.hip.rotation.x + L.knee.rotation.x) * 0.5;
      md.body.rotation.x += Math.max(0, e) * 0.07;
    }
  }
  if (sl > 0) for (const A of md.arms) A.arm.rotation.x -= 0.7 * sl;
}

// ===========================================================================
// Camera rig (Family Knockout's CamRig, aimed by the torso)
// ===========================================================================
class CamRig {
  constructor(i) { this.i = i; this.cam = new THREE.PerspectiveCamera(60, 1, 0.1, 1200); this.yaw = 0; this.pitch = 0; this.dist = 15; this.target = new V3(); this.shake = 0; this.rec = 0; this.snap = true; this.t = 0; }
  kick(k) { this.shake = Math.min(1.2, this.shake + k); }
  // a gun's kick: the view jolts back and up, then settles (shake is for thuds)
  recoil(k) { this.rec = Math.min(1, this.rec + k); }
  update(dt, m) {
    if (!m) return;
    this.t += dt;
    const k = this.snap ? 1 : 1 - Math.exp(-10 * dt);
    this.target.x = lerp(this.target.x, m.pos.x, k); this.target.z = lerp(this.target.z, m.pos.z, k);
    this.target.y = lerp(this.target.y, m.pos.y + 6.2, this.snap ? 1 : 1 - Math.exp(-5 * dt));
    this.snap = false;
    const yaw = m.torsoYaw, el = clamp(0.32 - m.aimPitch * 0.8, 0.02, 0.85), c = this.cam;
    const cp = Math.cos(el);
    c.position.set(this.target.x + Math.sin(yaw) * cp * this.dist, this.target.y + Math.sin(el) * this.dist, this.target.z + Math.cos(yaw) * cp * this.dist);
    const g = groundH(c.position.x, c.position.z) + 1.5; if (c.position.y < g) c.position.y = g;
    const look = new V3(this.target.x - Math.sin(yaw) * 10, this.target.y + Math.tan(m.aimPitch) * 10, this.target.z - Math.cos(yaw) * 10);
    if (this.shake > 0.001) {
      const s = this.shake * this.shake * 0.35, t = this.t * 40;
      c.position.y += Math.sin(t * 1.3) * s; c.position.x += Math.sin(t * 0.9 + 1) * s * 0.6;
      look.y += Math.sin(t * 1.7 + 2) * s * 0.5;
    }
    this.shake *= Math.exp(-6 * dt);
    if (this.rec > 0.001) { c.position.x += Math.sin(yaw) * this.rec * 0.45; c.position.z += Math.cos(yaw) * this.rec * 0.45; c.position.y += this.rec * 0.12; look.y += this.rec * 0.75; }
    this.rec *= Math.exp(-14 * dt);
    c.lookAt(look);
  }
}

// ===========================================================================
// Game
// ===========================================================================
// bag = parts collected, by kind ({ armour: 2, ram: 1 }); parts = their total (the HUD's 🔩)
// swarms = each drone swarm by id: { id, n, wp (where it's roaming to), seen (tick it last saw a player), kit (dropped yet) }
// unlocked = the weapons a player can pick (every WEAPON without `locked`, plus any a part has unlocked)
// lastRail = the last rail-gun shot: { hits: robot ids it passed through, len, end }
// pilot = player 0's pilot (a PILOTS entry), null until one is picked on the title screen
// wave = the wave in the meadow (0 until the first one comes out); cleared = no glitched or powered-down
// robot is left in it; waveStats = this wave's robots fixed and taken apart, and where its counts began
const Game = { state: 'loading', humans: [], mechs: [], robots: [], squad: [], bag: {}, swarms: {}, unlocked: new Set(WEAPONS.filter((w) => !WEAPON[w].locked)), lastRail: null, get parts() { return Object.values(this.bag).reduce((a, n) => a + n, 0); }, nextId: 1, manual: false, paused: false, acc: 0, ticks: 0, hurtFlash: 0, pilot: null,
  wave: 0, cleared: false, waveStats: { fixed: 0, taken: 0, found0: 0, downs0: 0, robots: 0 } };
// The start screen is the title (pick a pilot) until a pilot is picked, then the pause screen (▶)
function setPause(on) {
  Game.paused = on;
  $('start').classList.toggle('on', on);
  Title.draw(); Waves.draw();
  if (on && document.pointerLockElement) document.exitPointerLock();
}

// ===========================================================================
// Title screen: ROBOT BATTLE and a big tile per pilot. A tap (or the d-pad / ◀ ▶
// keys and A / Enter) picks one and starts the game: startGame(), the same path as
// __rb.start(pilot). The sim already runs behind it, so the mech idles in the meadow.
// ===========================================================================
const Title = {
  cur: 0,
  get on() { return $('start').classList.contains('on'); },
  build() {
    const last = pilotOf(store.get('pilot', '')); this.cur = last ? PILOTS.indexOf(last) : 0;
    $('pilots').innerHTML = PILOTS.map((P) => `<button class="pilot" data-p="${P.id}" aria-label="${P.name}" style="--c:${P.hex}"><img alt="" src="${pilotFace(P).toDataURL()}"><span>${P.name}</span></button>`).join('');
    this.draw();
  },
  draw() {
    const title = !Game.pilot, st = $('start');
    st.classList.toggle('title', title);
    [...$('pilots').children].forEach((b, i) => b.classList.toggle('cur', i === this.cur));
    const P = Game.pilot, who = $('who');
    if (P && who.dataset.p !== P.id) { who.dataset.p = P.id; who.style.setProperty('--c', P.hex); who.innerHTML = `<img alt="" src="${pilotFace(P).toDataURL()}"><span>${P.name}</span>`; }
  },
  // keys and pad on the title (not in manual mode: checks use __rb.start)
  input(pad) {
    if (Game.manual || !this.on) return;
    const n = PILOTS.length, kp = (...c) => c.some((k) => keysPressed.has(k));
    if (!Game.pilot) {
      const d = (kp('ArrowRight', 'KeyD') || pad?.rightP ? 1 : 0) - (kp('ArrowLeft', 'KeyA') || pad?.leftP ? 1 : 0);
      if (d) { this.cur = (this.cur + d + n) % n; this.draw(); Sfx.click(); }
      if (kp('Enter', 'Space') || pad?.aP) startGame(PILOTS[this.cur].id);
    } else if (kp('Enter') || pad?.aP) startPlay();
  },
};
// Pick pilot `p` (an id, a name or an index) for player 0 and start: the title gives way to the game.
function startGame(p) {
  const P = pilotOf(p), h = Game.humans[0];
  if (!P || !h) return { ok: false, why: 'no such pilot' };
  Game.pilot = P; setPilot(h, P); store.set('pilot', P.id); Title.cur = PILOTS.indexOf(P);
  startPlay();
  return { ok: true, pilot: P.id };
}

function spawnPlayer(i, x, z, heading) {
  const m = newMech(x, z, heading);
  m.model = buildMech(); scene.add(m.model.root);
  // a 💤 over the mech while it's powered down (⚠️ just before it reboots), like a robot's
  const icon = new THREE.Sprite(new THREE.SpriteMaterial({ depthWrite: false, toneMapped: false, transparent: true, map: iconTex('💤') }));
  icon.scale.set(2.4, 2.4, 1); icon.visible = false; icon.renderOrder = 7; m.model.root.add(icon); m.model.icon = icon;
  // heals: health mended this tick, by source; healPop: mended but not yet shown on the HUD;
  // beam: the squadmate mending this mech right now
  const h = { idx: i, rig: new CamRig(i), mech: m, ci: { camX: 0, camY: 0 }, weapon: 'gun', repair: null,
    heals: { parts: 0, ally: 0, kit: 0, reboot: 0 }, healPop: { parts: 0, ally: 0, kit: 0, reboot: 0 }, beam: null, beamSnd: 0 };
  h.rig.yaw = heading; m.human = h;
  m.onFootfall = (mm) => {
    const k = 0.4 + 0.6 * Math.min(1, Math.abs(mm.speed) / MECH.topSpeed);
    h.rig.kick(0.35 + 0.45 * k);
    if (!Game.manual) { Sfx.thud(k); Sfx.servo(); }
    Dust.puff(mm, k);
  };
  Game.humans.push(h); Game.mechs.push(m);
  return h;
}

// Dust puffs where a foot lands
const Dust = {
  list: [],
  init() {
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(210,190,150,0.8)'); gr.addColorStop(1, 'rgba(210,190,150,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    this.tex = new THREE.CanvasTexture(c); this.tex.colorSpace = THREE.SRGBColorSpace;
    for (let i = 0; i < 24; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: this.tex, transparent: true, depthWrite: false, opacity: 0 }));
      s.visible = false; scene.add(s); this.list.push({ s, t: 9 });
    }
  },
  puff(m, k) {
    // Even footfall index = right leg (s = +1) landing going forward; going backward the
    // index steps down, so the same mapping picks the left leg. The landing foot is ahead
    // of the hips walking forward and behind them walking backward.
    const side = m.fallFoot ? -1 : 1, h = m.legHeading, ahead = m.speed < 0 ? -1.2 : 1.2;
    const fx = -Math.sin(h), fz = -Math.cos(h), rx = Math.cos(h), rz = -Math.sin(h);
    const x = m.pos.x + rx * side * 1.75 + fx * ahead, z = m.pos.z + rz * side * 1.75 + fz * ahead;
    for (let n = 0; n < 3; n++) {
      const d = this.list.find((q) => q.t > 1) || this.list[0];
      d.t = 0; d.k = k; d.x = x + (Math.random() - 0.5) * 1.2; d.z = z + (Math.random() - 0.5) * 1.2; d.y = groundH(x, z) + 0.3;
      d.s.visible = true;
    }
  },
  update(dt) {
    for (const d of this.list) {
      if (d.t > 1) { d.s.visible = false; continue; }
      d.t += dt * 1.1;
      const sc = (1.2 + d.t * 3) * (0.6 + d.k * 0.6);
      d.s.position.set(d.x, d.y + d.t * 0.8, d.z); d.s.scale.set(sc, sc * 0.6, 1);
      d.s.material.opacity = 0.7 * (1 - d.t);
    }
  },
};

// How loud something at `p` should be for player 0 (0 = out of earshot)
function near(p) { const h = Game.humans[0]; if (!h) return 0; return clamp(1 - Math.hypot(p.x - h.mech.pos.x, p.z - h.mech.pos.z) / 60, 0, 1); }
const loud = (p) => (Game.manual ? 0 : near(p));

// ===========================================================================
// Sparks: hot points that bloom. Glitched robots spit them, and hits throw them.
// ===========================================================================
const SPARK_HOT = [5, 3.4, 1.1], SPARK_ZAP = [2.2, 3.8, 6], SPARK_MEND = [1.4, 5, 2.4], SPARK_RAIL = [4.2, 1.3, 3.2];
const Sparks = {
  N: 400, i: 0, list: [],
  init() {
    const geo = new THREE.BufferGeometry();
    this.pos = new Float32Array(this.N * 3); this.col = new Float32Array(this.N * 3);
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(this.col, 3));
    const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d');
    const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.8)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
    this.tex = new THREE.CanvasTexture(c);
    this.points = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.5, map: this.tex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
    this.points.frustumCulled = false; scene.add(this.points);
    for (let k = 0; k < this.N; k++) this.list.push({ x: 0, y: -999, z: 0, vx: 0, vy: 0, vz: 0, t: 1, life: 1, c: SPARK_HOT });
  },
  burst(x, y, z, n, c = SPARK_HOT, speed = 6) {
    for (let k = 0; k < n; k++) {
      const p = this.list[this.i = (this.i + 1) % this.N];
      const a = Math.random() * Math.PI * 2, u = 0.15 + Math.random() * 0.85;
      p.x = x; p.y = y; p.z = z; p.c = c;
      p.vx = Math.cos(a) * speed * u; p.vz = Math.sin(a) * speed * u; p.vy = speed * (0.3 + Math.random() * 0.9);
      p.t = 0; p.life = 0.25 + Math.random() * 0.45;
    }
  },
  // like burst, but thrown back along (bx, bz): off armour toward whoever shot it
  spray(x, y, z, n, c, speed, bx, bz) {
    for (let k = 0; k < n; k++) {
      const p = this.list[this.i = (this.i + 1) % this.N];
      const u = 0.3 + Math.random() * 0.7;
      p.x = x; p.y = y; p.z = z; p.c = c;
      p.vx = (bx * 0.8 + (Math.random() - 0.5) * 1.1) * speed * u; p.vz = (bz * 0.8 + (Math.random() - 0.5) * 1.1) * speed * u;
      p.vy = speed * (0.1 + Math.random() * 0.7);
      p.t = 0; p.life = 0.15 + Math.random() * 0.3;
    }
  },
  tick(dt) {
    for (const p of this.list) {
      if (p.t >= p.life) continue;
      p.t += dt; p.vy -= 18 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      const gy = groundH(p.x, p.z); if (p.y < gy) { p.y = gy; p.vy *= -0.35; p.vx *= 0.5; p.vz *= 0.5; }
    }
  },
  sync() {
    this.list.forEach((p, k) => {
      const f = p.t < p.life ? 1 - p.t / p.life : 0;
      this.pos[k * 3] = p.x; this.pos[k * 3 + 1] = f > 0 ? p.y : -999; this.pos[k * 3 + 2] = p.z;
      this.col[k * 3] = p.c[0] * f; this.col[k * 3 + 1] = p.c[1] * f; this.col[k * 3 + 2] = p.c[2] * f;
    });
    const g = this.points.geometry; g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true;
  },
};

// ===========================================================================
// Bullets: tracer rounds from the right-arm cannon. Each tick a round sweeps
// the segment it travelled, so a fast round can't skip through a robot (or a
// tree). Drawn as a thin hot core in an amber sheath with a short streak.
// ===========================================================================
const UP = new V3(0, 1, 0);
const TRACER = { streak: 13, muzzle: 3.2 };   // streak length (m); the barrel's reach past the shoulder
// The same rounds carry a Sniper's shots ('snipe'): a glitched Sniper's rounds (foe) hit
// players' mechs and pass through robots; a squadmate Sniper's hit glitched robots.
// Each look has its own colours: amber for the cannon, red for a glitched Sniper, cyan for a squadmate.
const MECH_HIT = { y: 4.8, r: 2.8 };   // a player's mech as a target for robots' rounds
const Bullets = {
  list: [], pool: [], looks: {},
  init() {
    // a unit tube from y = -1 (tail) to 0 (head), stretched along the flight
    const geo = new THREE.CylinderGeometry(1, 1, 1, 6, 1, true); geo.translate(0, -0.5, 0);
    const look = (core, sheath) => ({
      core: new THREE.MeshBasicMaterial({ color: new THREE.Color(...core), toneMapped: false }),
      sheath: new THREE.MeshBasicMaterial({ color: new THREE.Color(...sheath), toneMapped: false, transparent: true, opacity: 0.5, depthWrite: false }),
    });
    this.looks = { gun: look([3.2, 2.7, 1.7], [1.9, 0.75, 0.12]), foe: look([3.4, 1.6, 2.0], [2.4, 0.15, 0.45]), ally: look([1.8, 3.2, 3.4], [0.2, 1.6, 2.0]), em: look([2.6, 3.4, 4.2], [0.35, 1.1, 3.6]) };
    for (let k = 0; k < 48; k++) {
      const g = new THREE.Group(), c = new THREE.Mesh(geo, this.looks.gun.core), sh = new THREE.Mesh(geo, this.looks.gun.sheath);
      c.scale.set(0.045, 1, 0.045); sh.scale.set(0.15, 1, 0.15); g.add(c, sh);
      g.visible = false; scene.add(g); this.pool.push(g);
    }
  },
  // kind: 'gun' (a player's cannon) | 'em' (a player's electromagnetic pulse) | 'snipe' (a Sniper's rifle);
  // dmg defaults to the kind's
  fire(from, dir, owner, kind = 'gun', dmg) {
    const W = WEAPON[kind] || ROBOT_HITS[kind], foe = !!owner?.type && owner.state === 'glitched';
    this.list.push({ p: from.clone(), v: dir.clone().multiplyScalar(W.speed), d: 0, owner, kind, foe, spd: W.speed, range: W.range, dmg: dmg ?? W.dmg, look: WEAPON[kind] ? kind : foe ? 'foe' : 'ally' });
    if (this.list.length > this.pool.length) this.list.shift();
  },
  tick(dt) {
    const p0 = new V3(), seg = new V3(), c = new V3(), q = new V3();
    const sweep = (x, y, z, R, t0) => {   // how far along the segment it passes within R of (x, y, z), or null
      c.set(x, y, z);
      const t = clamp(c.clone().sub(p0).dot(seg) / seg.lengthSq(), 0, 1);
      q.copy(p0).addScaledVector(seg, t);
      return q.distanceTo(c) < R && t < t0 ? t : null;
    };
    for (let k = this.list.length - 1; k >= 0; k--) {
      const b = this.list[k];
      p0.copy(b.p); b.p.addScaledVector(b.v, dt); b.d += b.spd * dt;
      seg.subVectors(b.p, p0);
      if (b.kind === 'em' && Game.ticks % 2 === 0) Sparks.burst(b.p.x, b.p.y, b.p.z, 2, SPARK_ZAP, 3);   // the pulse crackles as it flies
      let hit = null, best = 2, at = null;
      if (b.foe) {
        for (const m of Game.mechs) {
          if (m.state === 'down') continue;            // a powered-down mech is left alone
          const t = sweep(m.pos.x, m.pos.y + MECH_HIT.y, m.pos.z, MECH_HIT.r, best);
          if (t != null) { best = t; hit = m; at = q.clone(); }
        }
        if (hit) { shotMech(hit, b, at); this.list.splice(k, 1); continue; }
      } else {
        for (const r of Game.robots) {
          if (r.state === 'ally' || r === b.owner) continue;   // shots pass squadmates
          const T = ROBOT_TYPES[r.type];
          const t = sweep(r.pos.x, r.pos.y + T.hitY, r.pos.z, T.hitR, best);
          if (t != null) { best = t; hit = r; at = q.clone(); }
        }
        if (hit) { hitRobot(hit, b.dmg, b.kind, b.v.x, b.v.z, at); this.list.splice(k, 1); continue; }
      }
      // anything else in the way: the first of the ground or a tree / rock along the segment
      const land = this.landing(p0, seg);
      if (land) {
        // a player's round wears down the tree, rock or fence it lands in (Props)
        if (land.o && b.owner?.human) Props.hit(land.o.prop, b.dmg, b.kind, b.v.x, b.v.z);
        if (b.kind === 'em') { Sparks.burst(land.p.x, land.p.y + 0.3, land.p.z, 14, SPARK_ZAP, 5); Impacts.flash(land.p, 1.2); }   // a pulse fizzles out
        else Impacts.at(land.kind, land.p, b.v);
        this.list.splice(k, 1); continue;
      }
      if (b.d > b.range) this.list.splice(k, 1);
    }
  },
  // Where the segment p0 -> p0 + seg first meets the ground or an obstacle (null = clear)
  landing(p0, seg) {
    let best = null;
    const g0 = p0.y - groundH(p0.x, p0.z), g1 = p0.y + seg.y - groundH(p0.x + seg.x, p0.z + seg.z);
    if (g1 < 0) best = { t: g0 > 0 ? g0 / (g0 - g1) : 0, kind: 'ground' };
    const a = seg.x * seg.x + seg.z * seg.z;
    if (a > 1e-9) for (const o of obstacles) {
      // the segment against the obstacle's circle, then a height check where it enters
      const fx = p0.x - o.x, fz = p0.z - o.z, bq = fx * seg.x + fz * seg.z, cq = fx * fx + fz * fz - o.r * o.r;
      const disc = bq * bq - a * cq; if (disc < 0) continue;
      const t = cq < 0 ? 0 : (-bq - Math.sqrt(disc)) / a;
      if (t < 0 || t > 1 || (best && t >= best.t)) continue;
      const x = p0.x + seg.x * t, z = p0.z + seg.z * t;
      if (p0.y + seg.y * t < groundH(x, z) + o.h) best = { t, kind: o.kind, o };
    }
    return best && { kind: best.kind, p: p0.clone().addScaledVector(seg, best.t), o: best.o ?? null };
  },
  sync() {
    const dir = new V3();
    this.pool.forEach((g, k) => {
      const b = this.list[k];
      // the streak trails the head but never reaches back inside the barrel
      const len = b ? Math.min(TRACER.streak, b.d - TRACER.muzzle) : 0;
      g.visible = len > 0.2; if (!g.visible) return;
      const L = this.looks[b.look], em = b.kind === 'em'; g.children[0].material = L.core; g.children[1].material = L.sheath;
      // a pulse is a short fat streak (the crackling ball is drawn over it by Pulses)
      g.children[0].scale.set(em ? 0.14 : 0.045, 1, em ? 0.14 : 0.045); g.children[1].scale.set(em ? 0.42 : 0.15, 1, em ? 0.42 : 0.15);
      g.position.copy(b.p); g.quaternion.setFromUnitVectors(UP, dir.copy(b.v).normalize()); g.scale.set(1, em ? Math.min(len, 3.5) : len, 1);
    });
  },
};

// ===========================================================================
// Muzzle flash: a hot star at the barrel that fired, a forward flame tongue in
// two crossed planes, and a light pulse. Built into the player's mech and shown
// for MUZZLE.flash seconds after each round.
// ===========================================================================
const MUZZLE = { flash: 0.06, light: 45, recoil: 0.11, camKick: 0.32 };
const MuzzleFx = {
  tex() {
    if (this.star) return;
    const mk = (draw) => { const c = document.createElement('canvas'); c.width = c.height = 64; draw(c.getContext('2d')); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
    // a round hot core with four short spikes
    this.star = mk((g) => {
      const gr = g.createRadialGradient(32, 32, 0, 32, 32, 30); gr.addColorStop(0, 'rgba(255,255,240,1)'); gr.addColorStop(0.25, 'rgba(255,220,140,0.9)'); gr.addColorStop(1, 'rgba(255,140,40,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      g.fillStyle = 'rgba(255,240,200,0.85)';
      for (let a = 0; a < 4; a++) { g.save(); g.translate(32, 32); g.rotate(a * Math.PI / 2 + 0.4); g.beginPath(); g.moveTo(-3, 0); g.lineTo(0, -31); g.lineTo(3, 0); g.fill(); g.restore(); }
    });
    // a flame tongue: wide and white at the barrel (bottom), thin and orange at the tip (top)
    this.cone = mk((g) => {
      const gr = g.createLinearGradient(0, 64, 0, 0); gr.addColorStop(0, 'rgba(255,250,225,1)'); gr.addColorStop(0.45, 'rgba(255,190,90,0.8)'); gr.addColorStop(1, 'rgba(255,110,20,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(14, 64); g.quadraticCurveTo(26, 20, 32, 0); g.quadraticCurveTo(38, 20, 50, 64); g.fill();
    });
  },
  build(fore, bx) {
    this.tex();
    const add = { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false };
    const g = new THREE.Group(); g.position.set(bx, 0, -3.3); g.visible = false; fore.add(g);
    // the star skips the depth test: from the chase camera the arm itself hides the barrel's tip,
    // so the flash has to glow past the player's own shoulder to be seen at all
    const star = new THREE.Sprite(new THREE.SpriteMaterial({ map: this.star, color: new THREE.Color(2.4, 1.9, 1.2), ...add, depthTest: false })); g.add(star);
    const cm = new THREE.MeshBasicMaterial({ map: this.cone, color: new THREE.Color(2.2, 1.6, 0.9), side: THREE.DoubleSide, ...add });
    const plane = new THREE.PlaneGeometry(0.75, 1.9); plane.translate(0, 0.95, 0); plane.rotateX(-Math.PI / 2);   // pokes out along -z
    const tongues = [0, Math.PI / 2].map((rz) => { const t = new THREE.Mesh(plane, cm); t.rotation.z = rz; g.add(t); return t; });
    return { g, star, tongues };
  },
  // f: 1 the instant a round leaves, 0 once the flash is over
  show(fx, f) {
    fx.g.visible = f > 0; if (!(f > 0)) return;
    const s = 0.6 + 0.6 * f;
    fx.star.scale.setScalar(2.2 * s); fx.star.material.rotation = Math.random() * Math.PI;
    fx.tongues.forEach((t) => t.scale.set(s, 0.7 + 0.6 * f, s));
    fx.g.rotation.z = Math.random() * Math.PI;
  },
};

// ===========================================================================
// Impacts: what a round leaves behind, pooled and stepped in tick() so a long
// burst never makes new objects. Sparks, a flash and steel flakes on a robot;
// dirt puffs and clods on the ground; chips off rocks and trees. Spent casings
// tumble out of the cannon, bounce, and shrink away.
// ===========================================================================
const Impacts = {
  CHIPS: 160, CASINGS: 48, PUFFS: 32, FLASHES: 16,
  ci: 0, ki: 0, pi: 0, fi: 0,
  init() {
    const zero = new THREE.Matrix4().makeScale(0, 0, 0);
    const inst = (geo, mtl, n) => { const im = new THREE.InstancedMesh(geo, mtl, n); im.instanceMatrix.setUsage(THREE.DynamicDrawUsage); for (let k = 0; k < n; k++) im.setMatrixAt(k, zero); im.frustumCulled = false; im.castShadow = true; scene.add(im); return im; };
    // chips: little flat-shaded shards, each with its own colour (dirt, stone, wood, steel)
    this.chipMesh = inst(new THREE.DodecahedronGeometry(1, 0), new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.1, flatShading: true }), this.CHIPS);
    this.chips = []; const white = new THREE.Color('#ffffff');
    for (let k = 0; k < this.CHIPS; k++) { this.chips.push({ t: 9, life: 1, p: new V3(), v: new V3(), r: new THREE.Euler(), w: new V3(), s: 0.1, rest: false }); this.chipMesh.setColorAt(k, white); }
    // casings: brass tubes
    this.caseMesh = inst(new THREE.CylinderGeometry(0.075, 0.075, 0.36, 8), new THREE.MeshStandardMaterial({ color: '#d9a441', metalness: 0.9, roughness: 0.3 }), this.CASINGS);
    this.casings = [];
    for (let k = 0; k < this.CASINGS; k++) this.casings.push({ t: 9, life: 2.4, p: new V3(), v: new V3(), r: new THREE.Euler(), w: new V3(), rest: false });
    // puffs: soft dirt clouds (Dust's texture); flashes: brief hot blooms where a round lands
    this.puffs = []; this.flashes = [];
    for (let k = 0; k < this.PUFFS; k++) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: Dust.tex, color: '#8a6a45', transparent: true, depthWrite: false, opacity: 0 }));
      sp.visible = false; scene.add(sp); this.puffs.push({ sp, t: 9, life: 0.8, p: new V3(), v: new V3(), k: 1 });
    }
    for (let k = 0; k < this.FLASHES; k++) {
      // no depth test: it's a flare of light on the plating, so a ram or a bumper can't swallow it
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: Sparks.tex, color: new THREE.Color(2.6, 1.9, 1.0), transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, toneMapped: false }));
      sp.visible = false; scene.add(sp); this.flashes.push({ sp, t: 9, life: 0.07, p: new V3(), k: 1 });
    }
  },
  // kind: 'robot' | 'ground' | 'rock' | 'tree'; v is the round's velocity; r the robot it hit
  at(kind, p, v, r) {
    const L = Math.hypot(v.x, v.z) || 1, bx = -v.x / L, bz = -v.z / L;   // back toward the shooter
    if (kind === 'robot') {
      // p is the round's closest pass to the robot's middle; walk back out to its plating, on the shooter's side
      const T = ROBOT_TYPES[r.type], cx = p.x - r.pos.x, cz = p.z - r.pos.z, side = cx * bz - cz * bx;
      const out = Math.sqrt(Math.max(0, T.hitR * T.hitR - side * side)) * 0.95, back = out - (cx * bx + cz * bz);
      p = p.clone(); p.x += bx * back; p.z += bz * back;
      Sparks.spray(p.x, p.y, p.z, 12, SPARK_HOT, 9, bx, bz);
      this.flash(p, 1.7);
      this.chip(p, 2, ['#c9ced8', '#3a4152'], 4, bx, bz, 0.08);
      return;
    }
    const k = loud(p);
    if (kind === 'ground') {
      this.puff(p, 3, 1.5); this.chip(p, 6, ['#6b4a2b', '#4f7d32', '#7d5a36'], 6, bx, bz, 0.14);
      if (k > 0) Sfx.dirt(k);
    } else if (kind === 'rock') {
      this.flash(p, 0.8); this.puff(p, 1, 0.6);
      this.chip(p, 6, ['#8a8f99', '#a3a39a', '#6c707a'], 6, bx, bz, 0.11);
      Sparks.spray(p.x, p.y, p.z, 4, SPARK_HOT, 6, bx, bz);
      if (k > 0) Sfx.chip(k);
    } else {
      this.chip(p, 6, ['#7a5232', '#a07444', '#c9a273'], 5, bx, bz, 0.1);
      if (k > 0) Sfx.chip(0.8 * k);
    }
  },
  chip(p, n, cols, speed, bx, bz, size) {
    const c = new THREE.Color();
    for (let j = 0; j < n; j++) {
      const i = this.ci = (this.ci + 1) % this.CHIPS, q = this.chips[i];
      q.p.copy(p); q.t = 0; q.rest = false; q.life = 0.7 + Math.random() * 0.6; q.s = size * (0.6 + Math.random() * 0.8);
      q.v.set(bx * speed * (0.3 + Math.random()) + (Math.random() - 0.5) * speed, speed * (0.4 + Math.random() * 0.8), bz * speed * (0.3 + Math.random()) + (Math.random() - 0.5) * speed);
      q.r.set(Math.random() * 6, Math.random() * 6, 0); q.w.set((Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30, 0);
      this.chipMesh.setColorAt(i, c.set(cols[j % cols.length]));
    }
    this.chipMesh.instanceColor.needsUpdate = true;
  },
  puff(p, n, k) {
    for (let j = 0; j < n; j++) {
      const q = this.puffs[this.pi = (this.pi + 1) % this.PUFFS];
      q.t = 0; q.k = k; q.life = 0.6 + Math.random() * 0.4;
      q.p.set(p.x + (Math.random() - 0.5) * 0.6, p.y + 0.5, p.z + (Math.random() - 0.5) * 0.6);   // up out of the grass
      q.v.set((Math.random() - 0.5) * 1.2, 1.2 + Math.random(), (Math.random() - 0.5) * 1.2);
    }
  },
  flash(p, k) { const q = this.flashes[this.fi = (this.fi + 1) % this.FLASHES]; q.t = 0; q.k = k; q.p.copy(p); },
  // a spent casing flicks out of the cannon's right side, up and back
  eject(from, rx, rz, fx, fz) {
    const q = this.casings[this.ki = (this.ki + 1) % this.CASINGS];
    q.t = 0; q.rest = false; q.life = 2 + Math.random() * 0.8;
    q.p.set(from.x + rx * 0.5 + fx * 1.4, from.y - 0.9, from.z + rz * 0.5 + fz * 1.4);
    const out = 3.5 + Math.random() * 2, back = -1 - Math.random() * 1.5;
    q.v.set(rx * out + fx * back, 4 + Math.random() * 2.5, rz * out + fz * back);
    q.r.set(Math.random() * 6, Math.random() * 6, Math.random() * 6); q.w.set(8 + Math.random() * 14, (Math.random() - 0.5) * 10, 6 + Math.random() * 10);
  },
  // chips and casings: gravity, a bounce or two, then they settle
  fall(q, dt, bounce) {
    q.v.y -= 18 * dt; q.p.addScaledVector(q.v, dt);
    q.r.x += q.w.x * dt; q.r.y += q.w.y * dt; q.r.z += q.w.z * dt;
    const gy = groundH(q.p.x, q.p.z) + 0.05;
    if (q.p.y < gy) {
      q.p.y = gy; q.v.y = Math.abs(q.v.y) * bounce; q.v.x *= 0.5; q.v.z *= 0.5; q.w.multiplyScalar(0.5);
      if (q.v.y < 0.6) { q.v.set(0, 0, 0); q.w.set(0, 0, 0); q.rest = true; }
    }

  if (!Array.isArray(picks) || !picks.length) return { ok: false, why: 'pick a part' };
  const need = { ...m.damage }, left = { ...Game.bag }, mend = {};
  for (const id of picks) {
    const P = PARTS[id];
    if (!P) return { ok: false, why: 'no such part', part: id };
    if (!(left[id] > 0)) return { ok: false, why: 'not in bag', part: id };
    if (!P.fixes) return { ok: false, why: 'fixes nothing', part: id };
    if (!(need[P.fixes] >= 0.5)) return { ok: false, why: 'not damaged', part: id, area: P.fixes };
    const amt = Math.min(HEAL.part, need[P.fixes]);
    need[P.fixes] -= amt; left[id]--; mend[P.fixes] = (mend[P.fixes] || 0) + amt;
  }
  for (const id of picks) { Game.bag[id]--; if (!Game.bag[id]) delete Game.bag[id]; }
  let mended = 0;
  for (const [a, amt] of Object.entries(mend)) mended += healMech(m, amt, 'parts', a);
  Sparks.burst(m.pos.x, m.pos.y + 5, m.pos.z, 30, SPARK_MEND, 7);
  if (!Game.manual) Sfx.mendParts();
  return { ok: true, used: picks.slice(), mended: Math.round(mended * 1000) / 1000 };
}

// ===========================================================================
// Glitched robots. Each one is a mech-shaped sim (newMech + a `spec`) driven
// by an ai() that writes the same input fields a player does. A glitched
// robot's glow flickers and it spits sparks; a beaten one powers down, then
// reboots if nobody deals with it.
// ===========================================================================
function iconTex(emoji) {
  iconTex.cache = iconTex.cache || new Map();
  if (!iconTex.cache.has(emoji)) {
    const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
    g.font = '100px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(emoji, 64, 72);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; iconTex.cache.set(emoji, t);
  }
  return iconTex.cache.get(emoji);
}

// The Charger: a low, four-legged battering ram with one wide visor eye.
function buildCharger(paint) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);

  const glow = new THREE.MeshStandardMaterial({ color: '#1a0008', emissive: paint.glow, emissiveIntensity: 3, roughness: 0.3 });

  for (const s of [-1, 1]) { const stripe = rbox(0.5, 0.18, 0.84, 0.06, paint.stripe); stripe.position.set(s * 0.9, 2.45, -2.15); body.add(stripe); }
  // head and visor eye
  const head = rbox(1.8, 1.0, 1.2, 0.3, paint.frame, metal); head.position.set(0, 3.05, -1.55); body.add(head);
  const eye = own(new RoundedBoxGeometry(1.4, 0.34, 0.2, 2, 0.08), glow); eye.position.set(0, 3.1, -2.17); body.add(eye);
  // glowing vents down the flanks and a core on the back
  for (const s of [-1, 1]) for (let k = 0; k < 3; k++) { const v = own(new THREE.BoxGeometry(0.08, 0.22, 0.6), glow); v.position.set(s * 1.52, 2.5, -0.6 + k * 0.85); body.add(v); }
  const core = own(new THREE.SphereGeometry(0.36, 14, 10), glow); core.position.set(0, 3.6, 1.45); body.add(core);

  // four stubby piston legs, diagonal pairs in step

// A robot's health bar and status icon, both billboards: the bar at height y, w wide,
// the icon 1.3 above it (scaled with the bar, so a drone's are small)
function robotHud(root, y, w = 3.0) {
  const sm = (o) => new THREE.SpriteMaterial({ depthWrite: false, toneMapped: false, transparent: true, ...o }), s = w / 3;
  const back = new THREE.Sprite(sm({ color: '#14182a', opacity: 0.75 })); back.scale.set(w + 0.2 * s, 0.42 * s, 1); back.position.y = y; back.renderOrder = 5; root.add(back);
  const fill = new THREE.Sprite(sm({ color: '#3ee07a' })); fill.scale.set(w, 0.26 * s, 1); fill.position.y = y; fill.renderOrder = 6; root.add(fill);
  const icon = new THREE.Sprite(sm({ map: iconTex('❗') })); icon.scale.set(1.7 * Math.max(s, 0.75), 1.7 * Math.max(s, 0.75), 1); icon.position.y = y + 1.3 * Math.max(s, 0.75); icon.visible = false; root.add(icon);
  return { back, fill, icon, barY: y, barW: w, iconY: icon.position.y };
}
// Each glitched robot type and its own materials: the armour flashes when hit and the glow flickers

  };
}

// The Bouncer: a round body with one big eye on a coil spring. It jumps on you, and
// springs off other robots' heads on the way to build a combo.
function buildBouncer(paint) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const metal = { metalness: 0.55, roughness: 0.4 }, steel = { metalness: 0.85, roughness: 0.25 };
  const { armour, glow } = robotMats(paint);
  // the spring: a steel helix on a foot pad; it squashes and stretches with every jump
  const spring = new THREE.Group(); body.add(spring);
  const helix = new (class extends THREE.Curve { getPoint(t, o = new V3()) { const a = t * Math.PI * 2 * 4; return o.set(Math.cos(a) * 0.7, t * 1.5, Math.sin(a) * 0.7); } })();
  spring.add(ownMesh(new THREE.TubeGeometry(helix, 96, 0.11, 6), mat(paint.ram, steel)));
  const pad = cyl(0.9, 1.0, 0.25, paint.dark, metal, 18); pad.position.y = 0.05; body.add(pad);
  const top = new THREE.Group(); top.position.y = 1.5; body.add(top);   // rides on the spring's top (the pose moves it)
  const shell = ownMesh(new THREE.SphereGeometry(1.3, 24, 16), armour); shell.position.y = 1.25; top.add(shell);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.12, 8, 30), mat(paint.dark, metal)); rim.rotation.x = Math.PI / 2; rim.position.y = 1.0; top.add(rim);
  const eyeRing = cyl(0.62, 0.62, 0.3, paint.dark, metal, 20); eyeRing.rotation.x = Math.PI / 2; eyeRing.position.set(0, 1.45, -1.12); top.add(eyeRing);
  const eye = ownMesh(new THREE.SphereGeometry(0.48, 16, 12), glow); eye.scale.z = 0.5; eye.position.set(0, 1.45, -1.25); top.add(eye);
  for (const s of [-1, 1]) {
    const ear = cyl(0.05, 0.07, 0.9, paint.ram, steel, 6); ear.position.set(s * 0.6, 2.75, 0); ear.rotation.z = -s * 0.35; top.add(ear);
    const tip = ownMesh(new THREE.SphereGeometry(0.16, 10, 8), glow); tip.position.set(s * 0.77, 3.2, 0); top.add(tip);
  }
  return { root, body, legs: [], glow, armour, spring, top, ...robotHud(root, 5.0) };
}

// Every robot type. Shared fields:
//  icon: its squad tag; health; hitY/hitR: the sphere rounds hit (hitY above r.pos);
//  top: how high its head is (a Bouncer can spring off it; null = not a springboard);
//  beamY: where a mending beam leaves it; spec: stands in for MECH; paint; build: its model;
//  ai: its glitched brain; ally: its brain as a squadmate (its squad job); pose: its animation;
//  parts: what it's built from (ids in PARTS); takeMax: parts a player may take (default REPAIR.takeMax);
//  notice: how close a player has to be before it stops roaming and comes for them;
//  tell: its glitch tell (named in state()); hot(r): about to attack (the ❗ and a faster flicker);
//  sparkBox: [width, depth, height, height range] it spits glitch sparks from.

    parts: ['armour', 'battery', 'motor', 'wiring', 'ram'],
    notice: 60,
    tell: 'jolt',        // its glow flickers and its body jolts when the glitch spikes
    hot: (r) => r.ai.mode === 'windup' || r.ai.mode === 'charge',
    sparkBox: [3, 4, 2, 1.6],
  },
  // Keeps its distance and shoots: backs off inside keep[0], closes in past keep[1].
  // A shot is `gun.aim` seconds of laser on the target, then one round.
  sniper: {
    icon: '🔭', health: 70, hitY: 5.3, hitR: 1.8, top: 6.4, beamY: 5.6,
    spec: { topSpeed: 6.2, backSpeed: 2.5, accel: 3.2, brake: 6, legTurn: 2.2, torsoTurn: 3.0, stride: 2.8, radius: 1.5 },
    paint: { armour: '#2e9f86', frame: '#2a2f40', dark: '#1a1f2c', ram: '#c9ced8', stripe: '#ffd83d', glow: '#ff2f5b' },
    build: buildSniper, ai: sniperAI, ally: allySniper, pose: sniperPose, flicker: stutterGlow,
    parts: ['scope', 'armour', 'motor', 'wiring'],          // the 🔭 scope is the Sniper's alone
    notice: 75, keep: [36, 54],
    gun: { aim: 1.1, cool: 2.4, range: 75, allyAim: 0.5, allyCool: 1.8, allyRange: 70 },
    tell: 'stutter',     // its eye blinks in stuttering pairs and its aim laser shakes
    hot: (r) => r.ai.aimT > 0,

  },
  // Small flyers that come as a swarm of `swarm`. They circle a player at `orbit` metres and

  drone: {

    spec: { topSpeed: 9, backSpeed: 4, accel: 9, brake: 10, legTurn: 3.6, torsoTurn: 6, stride: 50, radius: 0.7 },

    build: buildDrone, ai: droneAI, ally: allyDrone, pose: dronePose, tick: droneFly,
    parts: ['rotor', 'battery', 'wiring'], takeMax: 1,     // a small robot: one part each
    notice: 45, orbit: 10, zapReach: 1.8, scout: 70, scoutMin: 15,
    tell: 'lurch',       // it drops and lurches in the air, and its rotors sputter
    hot: (r) => r.ai.mode === 'dive',
    sparkBox: [0.8, 0.8, -0.2, 0.5], sparkN: 0.4,
  },

  // jump: reach (how far it jumps at a player), hop (how far between springboards), foot (landing slop),

  bouncer: {

    notice: 45,
    jump: { reach: 22, hop: 13, foot: 1.6, crouch: 0.5, land: 0.7, wild: 0.15, miss: [0.6, 2.4], allyCool: 3 },
    tell: 'misbounce',   // it bounces off at random and lands in the wrong spot

const takeMaxOf = (r) => ROBOT_TYPES[r.type].takeMax ?? REPAIR.takeMax;

function spawnRobot(type, x, z) {
  const T = ROBOT_TYPES[type]; if (!T) return null;
  const p = Game.humans[0]?.mech, heading = p ? Math.atan2(-(p.pos.x - x), -(p.pos.z - z)) : 0;
  const r = newMech(x, z, heading);
  Object.assign(r, {
    id: Game.nextId++, type, spec: T.spec, health: T.health, maxHealth: T.health, state: 'glitched',
    t: 0, downT: 0, downs: 0, reboots: 0, glow: 3, glowMode: 'flicker', flickT: 0, sparkT: Math.random() * 0.5, hitFlash: 0,
    hits: { gun: 0, punch: 0, kick: 0, em: 0, rail: 0 },
    // how it's being beaten: damage since it last booted by weapon, electromagnetic shock (0..ROBOT.shockMax),
    // and once it's down, what beat it ('em' = shut down by shock, else the last hit's weapon) and its faults
    harm: {}, shock: 0, beatenBy: null, faults: null,
    ai: { think: Math.random() * 0.05, mode: 'stalk', t: 0.6, alert: 0 },
    wires: makeWires(REPAIR.wires), wrongWires: 0, repairBy: null, name: null, leader: null,
    parts: T.parts.slice(),        // the parts still on it, offered when it's taken apart
    lift: 0,                       // height above the ground (a drone's flight, a Bouncer dropping)
    swarm: null,                   // a drone's swarm id
    // a Bouncer: its hop in progress, bounces in this chain, the last finished chain, its best, all of them,
    // how far its last hop landed from where it meant to, hops gone off at random, stomps landed
    air: null, bounces: 0, lastChain: 0, bestChain: 0, totalBounces: 0, miss: 0, wild: 0, stomps: 0,
    lurches: 0,                    // a drone's glitch lurches
  });
  r.model = T.build(T.paint); scene.add(r.model.root);
  setGlowColor(r, GLOW_COLORS[Math.floor(Math.random() * GLOW_COLORS.length)]);
  Game.robots.push(r);
  return r;
}
// A robot's glow colour (its own material, so only it changes) and glowK, which scales its glow
// level so every colour peaks at the same brightness (GLOW_LUM): r.glow means the same in any colour.
function setGlowColor(r, hex) {
  const c = new THREE.Color(hex), lum = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;   // linear
  r.glowColor = hex; r.glowK = clamp(GLOW_LUM / lum, 0.55, 2.5);
  r.model.glow.emissive.copy(c);
}
// Drop robots into the meadow: spawn('sniper', x, z). A swarm type (drones) comes as a
// whole swarm in a ring round (x, z) and returns the list; any other type returns the robot.
let nextSwarm = 1;
function spawn(type, x, z) {
  const T = ROBOT_TYPES[type]; if (!T) return null;
  if (!T.swarm) return spawnRobot(type, x, z);
  const sw = { id: nextSwarm++, n: T.swarm, wp: null, wpUntil: 0, seen: -1e9, kit: false };
  Game.swarms[sw.id] = sw;
  const out = [];
  for (let i = 0; i < T.swarm; i++) {
    const a = i / T.swarm * Math.PI * 2, r = spawnRobot(type, x + Math.cos(a) * 3, z + Math.sin(a) * 3);
    r.swarm = sw.id; r.orbitA = a; r.lift = T.alt; r.pos.y += T.alt;
    out.push(r);
  }
  return out;
}

function nearestPlayer(r) {
  let best = null, bd = Infinity;
  for (const h of Game.humans) {
    if (h.mech.state === 'down') continue;      // a powered-down mech isn't a target
    const d = Math.hypot(h.mech.pos.x - r.pos.x, h.mech.pos.z - r.pos.z); if (d < bd) { bd = d; best = h.mech; }
  }
  return best;
}

// The Charger's brain. It thinks at 20 Hz and only writes input fields:

// ---------------------------------------------------------------------------

// A charging robot that reaches a mech rams it. Checked before the bodies are
// pushed apart, with a reach past that separation distance.
function rams() {
  for (const r of Game.robots) {
    if (r.state !== 'glitched' || r.ai.mode !== 'charge' || r.speed < 5) continue;
    for (const h of Game.humans) {
      const m = h.mech, dx = m.pos.x - r.pos.x, dz = m.pos.z - r.pos.z, d = Math.hypot(dx, dz) || 1;
      if (m.state === 'down' || d > MECH.radius + r.spec.radius + 0.6) continue;
      const k = clamp(r.speed / r.spec.boostSpeed, 0, 1);
      hurtMech(m, Math.round(10 + 10 * k), 'ram');
      m.push.x += dx / d * 7 * k; m.push.z += dz / d * 7 * k;
      r.push.x -= dx / d * 8; r.push.z -= dz / d * 8; r.speed = 0;     // it bounces off
      r.ai.mode = 'recover'; r.ai.t = 1.6;
      Sparks.burst(r.pos.x + dx / d * 2.5, r.pos.y + 2.2, r.pos.z + dz / d * 2.5, 30, SPARK_HOT, 9);

// Keep bodies apart: a light robot gives way to a heavy mech. A Bouncer mid-hop is above
// it all; a drone keeps its height (lift) as it's nudged.
function separate() {
  const bodies = [...Game.mechs.map((m) => [m, MECH.radius, 0.2]), ...Game.robots.filter((r) => !r.air).map((r) => [r, r.spec.radius, 0.8])];
  for (let a = 0; a < bodies.length; a++) for (let b = a + 1; b < bodies.length; b++) {
    const [A, ra, wa] = bodies[a], [B, rb, wb] = bodies[b];
    const dx = B.pos.x - A.pos.x, dz = B.pos.z - A.pos.z, d = Math.hypot(dx, dz) || 1e-3, min = ra + rb;
    if (d >= min) continue;
    const o = min - d, sa = wa / (wa + wb), sb = wb / (wa + wb);
    A.pos.x -= dx / d * o * sa; A.pos.z -= dz / d * o * sa; B.pos.x += dx / d * o * sb; B.pos.z += dz / d * o * sb;
    A.pos.y = groundH(A.pos.x, A.pos.z) + (A.lift || 0); B.pos.y = groundH(B.pos.x, B.pos.z) + (B.lift || 0);
  }
}

// ===========================================================================
// Repair kits 🧰: red toolboxes with a white cross, tucked beside trees round the
// meadow (seeded, so they're in the same places every visit), plus one dropped by
// each robot the first time it's beaten. Walking onto one mends HEAL.kit at once
// and uses it up. A mech already at full health leaves it where it is.

const Kits = {
  list: [], nextId: 1,
  init() {
    const box = new RoundedBoxGeometry(1.5, 0.95, 1.0, 3, 0.16), bar = new THREE.BoxGeometry(0.18, 0.5, 0.06), handle = new THREE.TorusGeometry(0.32, 0.07, 6, 16, Math.PI);
    const ring = new THREE.TorusGeometry(1.25, 0.07, 6, 32);

    seed = 515;
    const trees = obstacles.filter((o) => o.kind === 'tree' && Math.hypot(o.x, o.z) > 30 && Math.hypot(o.x, o.z) < 100);
    for (let t = 0; t < 200 && this.list.length < HEAL.kits; t++) {
      const o = trees[Math.floor(srand() * trees.length)], a = srange(0, Math.PI * 2), d = o.r + 2.6;
      const x = o.x + Math.cos(a) * d, z = o.z + Math.sin(a) * d;

  add(x, z, from) {

    const crate = new THREE.Mesh(G.box, mat('#e8323f', { roughness: 0.45, metalness: 0.2 })); crate.position.y = 0.6; crate.castShadow = true; g.add(crate);
    const white = mat('#ffffff', { roughness: 0.4 });
    for (const sz of [-1, 1]) for (const rz of [0, Math.PI / 2]) { const b = new THREE.Mesh(G.bar, white); b.position.set(0, 0.6, sz * 0.51); b.rotation.z = rz; g.add(b); }
    const hd = new THREE.Mesh(G.handle, mat('#2d3446', { metalness: 0.6, roughness: 0.4 })); hd.position.y = 1.07; g.add(hd);
    const rg = new THREE.Mesh(G.ring, glowMat('#3ee07a', 2.2)); rg.rotation.x = Math.PI / 2; rg.position.y = 0.12; g.add(rg);
    // the beacon a scouting squadmate drone leaves: a tall light and a 🧰 high over the kit

  // player h walks onto a kit: mend it and use the kit up. Returns what it mended

  check(h) {

// ===========================================================================
// Hidden parts 🔍: a typed part (HIDDEN.kinds) lying half-hidden in the grass in a
// small rusty crate, at seeded spots a mech can stand on. A glint now and then is

const SPARK_GLINT = [4, 3.7, 2.4];
const Hidden = {
  list: [], nextId: 1,
  init() {

      if (Kits.list.some((k) => Math.hypot(k.x - x, k.z - z) < 12)) continue;
      if (this.list.some((q) => Math.hypot(q.x - x, q.z - z) < 30)) continue;                       // spread round the meadow

  add(x, z, part) {

    beacon.scale.set(2.5, 1, 2.5); mark.scale.set(2.6, 2.6, 1);
    g.position.set(x, groundH(x, z), z); scene.add(g);
    const q = { id: this.nextId++, kind: 'part', part, x, z, g, beacon, mark, t: Math.random() * 6, glintT: Math.random() * 3, found: false, spotted: false, by: null };
    this.list.push(q);

  },
  // player h walks over a hidden part: it goes in the bag (once). Returns the part id, or null.
  check(h) {

    }

// ===========================================================================
// A squadmate mends its leader: a steady cyan beam from its core to the mech,
// with green sparks where it lands. Slow, and only while no glitched robot is
// within HEAL.safeRange (a powered-down mech is mended regardless).
// ===========================================================================
function allyMend(h, dt) {
  const m = h.mech; h.beam = null;
  if (m.health >= m.maxHealth) return;
  if (m.state !== 'down' && Game.robots.some((r) => r.state === 'glitched' && flatDist(r, m) < HEAL.safeRange)) return;
  let best = null, bd = HEAL.allyRange;
  for (const r of Game.squad) { if (r.state !== 'ally' || (r.leader && r.leader !== h)) continue; const d = flatDist(r, m); if (d < bd) { bd = d; best = r; } }
  if (!best) return;
  h.beam = best;
  healMech(m, HEAL.allyRate * dt, 'ally');
  h.beamSnd -= dt;
  if (h.beamSnd <= 0) {
    h.beamSnd = 0.7;
    Sparks.burst(m.pos.x, m.pos.y + 5, m.pos.z, 8, SPARK_MEND, 4);
    if (!Game.manual) Sfx.mendAlly();
  }
}
const Beams = {
  list: [],
  init() {

    const core = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 3.4, 3.4), toneMapped: false });
    const sheath = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.3, 1.8, 1.4), toneMapped: false, transparent: true, opacity: 0.45, depthWrite: false });
    this.mk = () => { const g = new THREE.Group(), c = new THREE.Mesh(geo, core), s = new THREE.Mesh(geo, sheath); c.scale.set(0.07, 1, 0.07); g.add(c, s); g.visible = false; scene.add(g); return { g, s }; };
  },
  sync() {
    const a = new V3(), b = new V3(), d = new V3();
    Game.humans.forEach((h, i) => {
      const B = this.list[i] || (this.list[i] = this.mk()), r = h.beam;
      B.g.visible = !!r; if (!r) return;
      const m = h.mech;
      a.set(r.pos.x, r.pos.y + ROBOT_TYPES[r.type].beamY, r.pos.z); b.set(m.pos.x, m.pos.y + 5 - m.slump, m.pos.z);
      d.subVectors(b, a); const len = d.length();
      B.g.position.copy(a); B.g.quaternion.setFromUnitVectors(UP, d.normalize()); B.g.scale.set(1, len, 1);

// Each tick for a player's mech: the reboot clock while it's down (or an early
// wake once a squadmate has mended it far enough), its lights, a squadmate's
// mending and any kit it walks onto.
function playerTick(h, dt) {
  const m = h.mech;
  if (m.state === 'down') {
    m.downT -= dt;
    if (m.downT <= 0 || m.health >= m.maxHealth * PLAYER.wakeHealth) rebootMech(m);
  }
  if (m.state === 'down') m.glow = m.downT > PLAYER.warnTime ? 0.03 : Math.sin(Game.ticks * DT * (1.5 + (PLAYER.warnTime - m.downT) * 1.5) * Math.PI * 2) > 0.3 ? 1 : 0.03;
  else m.glow = 1;
  m.slump = approach(m.slump, m.state === 'down' ? 1 : 0, dt * 1.6);
  allyMend(h, dt);
  Kits.check(h);
  Hidden.check(h);
}

function syncRobotModel(r, dt) {
  const md = r.model, S = r.spec, T = ROBOT_TYPES[r.type];
  const jit = T.tell === 'jolt' && r.state === 'glitched' && r.glow > 5 ? 0.08 : 0;   // a Charger jolts when the glitch spikes
  md.root.position.set(r.pos.x + (Math.random() - 0.5) * jit, r.pos.y, r.pos.z + (Math.random() - 0.5) * jit);
  md.root.rotation.y = r.legHeading;
  const k = clamp(Math.abs(r.speed) / S.topSpeed, 0, 1);
  for (const L of md.legs) L.hip.rotation.x = Math.sin(r.phase + L.ph) * 0.55 * k;
  const mode = r.state === 'down' ? (r.repairBy ? 'repair' : 'down') : r.ai.mode;
  T.pose(r, md, dt, mode);
  md.glow.emissiveIntensity = r.glow * r.glowK;
  md.armour.emissiveIntensity = r.hitFlash * 0.8;
  const f = r.health / r.maxHealth, up = r.state !== 'down';
  md.back.visible = up; md.fill.visible = up && f > 0;
  if (f > 0) { md.fill.scale.x = md.barW * f; md.fill.center.x = 0.5 / f; md.fill.material.color.setHSL(0.33 * f, 0.85, 0.55); }

}
// Each type's own animation on top of the shared walk. mode: its ai mode, or 'down' / 'repair'.
function chargerPose(r, md, dt, mode) {
  if (mode === 'windup') md.legs[0].hip.rotation.x = Math.sin(r.t * 16) * 0.6;   // paws the ground
  const pose = mode === 'windup' ? [-0.35, 0.12, 0] : mode === 'charge' ? [-0.15, 0.1, 0] : mode === 'down' || mode === 'repair' ? [-0.9, 0.18, 0.32] : [0, 0, 0];

// A drone: rotors spin (and sputter in a lurch), it tips into its flight, and lies tilted when down
function dronePose(r, md, dt, mode) {

  for (const p of md.rotors) p.rotation.y += spin * dt;

// The Bouncer: the spring squashes to crouch and land, stretches on the way up, and its
// walk is a run of little hops. In the air it flips once per hop.

// Next / previous unlocked weapon (wheel, pad LB / RB)
function cycleWeapon(h, d) {
  const n = WEAPONS.length; let i = WEAPONS.indexOf(h.weapon);
  for (let k = 0; k < n; k++) { i = (i + d + n) % n; if (Game.unlocked.has(WEAPONS[i])) break; }
  h.weapon = WEAPONS[i];
  if (!Game.manual) Sfx.click();
}
// Pick weapon w (keys, a tap on its slot): refused, with a buzz, while it's locked
function selectWeapon(h, w) {
  if (!h || !WEAPON[w]) return false;
  if (!Game.unlocked.has(w)) { if (!Game.manual) Sfx.buzz(); return false; }
  h.weapon = w; if (!Game.manual) Sfx.click();
  return true;
}

function gatherInput(dt) {
  const solo = Game.humans.length === 1;
  for (const h of Game.humans) {
    const sc = SCHEMES[h.idx];
    const k = (n) => anyKey(sc[n]) || (solo && anyKey(SOLO_EXTRA[n]));
    const pad = readPad(h.idx);
    // Start pauses and carries on; on the title it picks the highlighted pilot. The title's own keys and
    // pad (◀ ▶, A) go to Title.input, and while it's up (outside manual mode) the mech isn't driven.
    if (pad && pad.startP) { if (!Game.pilot && h.idx === 0 && !Game.manual) startGame(PILOTS[Title.cur].id); else setPause(!Game.paused); }
    const titleUp = h.idx === 0 && Title.on && !Game.manual;
    if (titleUp) Title.input(pad);
    sc.wpn.forEach((code, w) => { if (keysPressed.has(code)) selectWeapon(h, WEAPONS[w]); });
    if (pad && (pad.lbP || pad.rbP)) cycleWeapon(h, pad.rbP ? 1 : -1);
    const picking = h.repair?.kind === 'parts', mending = h.idx === 0 && FixUI.mode === 'mend';
    const wiring = h.idx === 0 && FixUI.mode === 'wires', asking = h.repair?.kind === 'home';
    let turn = (k('right') ? 1 : 0) - (k('left') ? 1 : 0), thr = (k('up') ? 1 : 0) - (k('down') ? 1 : 0);
    // in the picker, the mend panel and the send-home panel the d-pad moves between tiles (◀ ▶), and in
    // the Quick Fix between plugs and ports (▲ ▼); the stick still steers
    if (pad) { turn += pad.lx - (picking || mending || asking ? pad.dpadX : 0); thr -= pad.ly - (wiring ? pad.dpadY : 0); }
    let padB = false;   // B was used by a panel this frame (so it doesn't also open the bag)
    h.ci.camX = (k('camR') ? 1 : 0) - (k('camL') ? 1 : 0) + (pad ? pad.rx : 0);
    h.ci.camY = pad ? -pad.ry : 0;
    h.rig.yaw = wrapAngle(h.rig.yaw - h.ci.camX * 1.8 * dt);
    h.rig.pitch = clamp(h.rig.pitch + h.ci.camY * 1.0 * dt, -0.35, 0.5);
    if (solo && mouse.locked) { h.rig.yaw = wrapAngle(h.rig.yaw - mouse.dx * 0.0025); h.rig.pitch = clamp(h.rig.pitch - mouse.dy * 0.002, -0.35, 0.5); }
    const m = h.mech; if (!m) continue;
    m.input.weapon = h.weapon;
    if (Game.paused || titleUp) { m.input.throttle = m.input.turn = 0; m.input.attack = false; continue; }
    // the clear screen's ▶: Enter (which isn't also a shot) or pad A (not while the 🔧 panel, which uses A, is open)
    if (h.idx === 0 && Waves.showing && (keysPressed.has('Enter') || (pad && pad.aP && FixUI.mode !== 'mend'))) { keys.delete('Enter'); nextWave(); }
    // powered down: nothing moves, aims or fires until it reboots
    if (m.state === 'down') { m.input.throttle = m.input.turn = 0; m.input.attack = false; m.input.aimYaw = h.rig.yaw = m.torsoYaw; m.input.aimPitch = m.aimPitch; continue; }
    m.input.throttle = clamp(thr, -1, 1); m.input.turn = clamp(turn, -1, 1);
    m.input.attack = k('fire') || (solo && mouse.locked && mouse.down) || !!(pad && pad.rt);
    m.input.aimYaw = h.rig.yaw; m.input.aimPitch = h.rig.pitch;
    // the prompt beside a downed robot: 🔧 fix or 🔩 take parts
    const pr = !h.repair && promptRobot(h);
    if (pr) {
      if (sc.fix.some((c) => keysPressed.has(c)) || (pad && pad.xP)) chooseFor(h, pr, 'fix');
      else if (sc.parts.some((c) => keysPressed.has(c)) || (pad && pad.yP)) chooseFor(h, pr, 'parts');
    } else if (asking && pad) {
      // who goes home: d-pad ◀ ▶ moves between squadmates, A sends that one home, B backs out
      const rp = h.repair, n = Game.squad.length;
      if (n && (pad.leftP || pad.rightP)) rp.cur = (rp.cur + (pad.rightP ? 1 : -1) + n) % n;
      if (pad.aP && n) chooseHome(h, Game.squad[rp.cur % n]);
      else if (pad.bP) { padB = true; cancelRepair(h); if (h.idx === 0) FixUI.relock(); }
      if (h.idx === 0 && FixUI.mode === 'home') FixUI.drawHome();
    } else if (wiring && pad) {
      // the Quick Fix: d-pad ▲ ▼ moves, A picks up a plug (or patches a burnt one) then A on a port
      // plugs it in; B puts the plug back down, or backs out
      if (pad.bP) { padB = true; if (FixUI.sel >= 0) { FixUI.sel = -1; FixUI.pad = 'plug'; FixUI.draw(); } else FixUI.dismiss(); }
      else FixUI.padWires(pad);
    } else if (picking) {
      // the parts picker: d-pad ◀ ▶ moves, A picks, Y (or the 🔩 key) takes them, B backs out
      const rp = h.repair, n = rp.r.parts.length;
      if (pad && (pad.leftP || pad.rightP)) rp.cur = (rp.cur + (pad.rightP ? 1 : -1) + n) % n;
      if (pad && pad.aP) FixUI.pick(h, rp.r.parts[rp.cur]);
      if (sc.parts.some((c) => keysPressed.has(c)) || (pad && pad.yP)) FixUI.takePicks(h);
      else if (pad && pad.bP) { cancelRepair(h); if (h.idx === 0) FixUI.relock(); }
      if (h.idx === 0) FixUI.drawPicker();
    }
    // fix my mech: 🔧 key or pad LT opens and closes it; in it, d-pad ◀ ▶ moves, A uses a part, B backs out
    if (h.idx === 0 && !picking && (sc.mend.some((c) => keysPressed.has(c)) || (pad && pad.ltP))) FixUI.toggleMend();
    else if (mending && pad) {
      const n = FixUI.mendIds().length;
      if (n && (pad.leftP || pad.rightP)) FixUI.mendCur = (FixUI.mendCur + (pad.rightP ? 1 : -1) + n) % n;
      if (pad.aP && n) FixUI.useMend(h, FixUI.mendIds()[FixUI.mendCur % n]);
      if (pad.bP) FixUI.dismiss();
    }
    if (h.idx === 0 && FixUI.mode === 'mend') FixUI.drawMend();
    // the parts bag: 🎒 key or pad Back (or B when no panel is open)
    if (h.idx === 0 && !picking && !mending && !asking && !wiring && (sc.bag.some((c) => keysPressed.has(c)) || (pad && (pad.backP || (pad.bP && !padB && FixUI.mode !== 'wires'))))) FixUI.toggleBag();
  }
  mouse.dx = mouse.dy = 0;
  keysPressed.clear();
}

function tick(dt) {
  if (Game.state !== 'play' || Game.paused) return;
  Game.ticks++;
  Meadow.time.value += dt;
  // Robots think at 20 Hz (Family Knockout's bot loop), writing their input.
  // Glitched ones run their type's brain; squadmates their type's squad job (each built on allyAI).
  for (const r of Game.robots) {
    if (r.state === 'down') continue;
    r.ai.think -= dt;
    if (r.ai.think <= 0) { const T = ROBOT_TYPES[r.type]; r.ai.think = 0.05; r.ai.alert = Math.max(0, (r.ai.alert || 0) - 0.05); (r.state === 'ally' ? T.ally : T.ai)(r, 0.05); }
  }
  // a repair holds only while the player stays by the robot
  for (const h of Game.humans) { const rp = h.repair; if (rp && (rp.r.state !== 'down' || flatDist(rp.r, h.mech) > REPAIR.keepRange)) cancelRepair(h); }
  for (const h of Game.humans) for (const s in h.heals) h.heals[s] = 0;     // heals are counted per tick
  for (const m of Game.mechs) {
    // a powered-down mech's controls do nothing, whatever is held
    if (m.state === 'down') { m.input.throttle = m.input.turn = 0; m.input.attack = false; m.input.boost = false; m.input.aimYaw = m.torsoYaw; m.input.aimPitch = m.aimPitch; }
    mechTick(m, dt); combatTick(m, dt);
  }
  for (const r of Game.robots) robotTick(r, dt);
  Bullets.tick(dt);
  rams();
  separate();
  for (const h of Game.humans) playerTick(h, dt);
  Sparks.tick(dt);
  Impacts.tick(dt);
  RailFx.tick(dt);
  Props.tick(dt);
  Hidden.tick(dt);
  Game.hurtFlash = Math.max(0, Game.hurtFlash - dt * 2.5);
  Waves.check();
}

// ===========================================================================
// Quick Fix, naming, parts picker and parts bag panels (player 0). Drag a plug
// onto the port with the same colour and shape, or tap a plug then tap its port.
// In the picker, tap up to two parts and ✔. The world keeps running behind every
// panel; only the mouse is freed from pointer lock.
// ===========================================================================
const FixUI = {
  mode: null, r: null, sel: -1, drag: null,
  init() {
    const board = $('board');
    board.addEventListener('pointerdown', (e) => {
      const plug = e.target.closest('.plug'), port = e.target.closest('.port');
      if (plug && plug.classList.contains('burnt')) { e.preventDefault(); this.patch(+plug.dataset.plug); return; }   // a tap patches a burnt plug
      if (plug && !plug.classList.contains('done')) {
        e.preventDefault();
        this.drag = { plug: +plug.dataset.plug, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY };
        board.setPointerCapture(e.pointerId); this.draw();
      } else if (port && this.sel >= 0) { const i = this.sel; this.sel = -1; this.tryWire(i, +port.dataset.port); }
    });
    board.addEventListener('pointermove', (e) => { if (this.drag) { this.drag.x = e.clientX; this.drag.y = e.clientY; this.draw(); } });
    board.addEventListener('pointerup', (e) => {
      const d = this.drag; if (!d) return; this.drag = null;
      const j = this.portAt(e.clientX, e.clientY);
      if (j >= 0) { this.sel = -1; this.tryWire(d.plug, j); }
      else if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 10) { this.sel = this.sel === d.plug ? -1 : d.plug; this.draw(); }   // a tap picks the plug up

    $('nameDice').addEventListener('click', () => { if (this.r) { setRobotName(this.r, randomName()); $('nameIn').value = this.r.name; } if (!Game.manual) Sfx.click(); });
    $('pFix').addEventListener('click', (e) => { e.stopPropagation(); this.fromPrompt('fix'); });
    $('pParts').addEventListener('click', (e) => { e.stopPropagation(); this.fromPrompt('parts'); });
    $('pickTiles').addEventListener('click', (e) => { const t = e.target.closest('.tile'); if (t) this.pick(Game.humans[0], t.dataset.part); });
    $('pickOk').addEventListener('click', () => this.takePicks(Game.humans[0]));
    $('pickX').addEventListener('click', () => this.dismiss());
    $('bagBtn').addEventListener('click', (e) => { e.stopPropagation(); this.toggleBag(); });
    $('bagX').addEventListener('click', () => this.dismiss());
    $('mendBtn').addEventListener('click', (e) => { e.stopPropagation(); this.toggleMend(); });
    $('mendX').addEventListener('click', () => this.dismiss());
    $('mendTiles').addEventListener('click', (e) => { const t = e.target.closest('.tile'); if (t) this.useMend(Game.humans[0], t.dataset.part); });
    $('homeTiles').addEventListener('click', (e) => { const t = e.target.closest('.tile'); if (t) chooseHome(Game.humans[0], Game.squad.find((q) => q.id === +t.dataset.id)); });
    $('homeX').addEventListener('click', () => this.dismiss());
    // the weapon slots on the HUD: a tap picks one (a locked one buzzes)
    $('weapons').addEventListener('click', (e) => { const b = e.target.closest('.wpn'); if (b) { e.stopPropagation(); selectWeapon(Game.humans[0], b.dataset.w); } });
  },
  fromPrompt(choice) { const h = Game.humans[0], r = h && promptRobot(h); if (r) chooseFor(h, r, choice); },
  icon(ci, fill, stroke) { return `<svg viewBox="0 0 40 40"><g fill="${fill}" stroke="${stroke}" stroke-width="3" stroke-linejoin="round">${SHAPE_SVG[WIRE_COLORS[ci].shape]}</g></svg>`; },
  show(id) { for (const p of ['fix', 'namer', 'picker', 'bag', 'mend', 'home']) $(p).classList.toggle('on', id === p); },
  // a round part tile: its icon on its colour
  // a part that unlocks a weapon wears that weapon's icon (the 🔭 scope: ☄️)
  tile(id, cls = '') { const P = PARTS[id], u = P.unlocks && WEAPON[P.unlocks] ? `<span class="unl">${WEAPON[P.unlocks].icon}</span>` : ''; return `<button class="tile ${cls}" data-part="${id}" aria-label="${id}" style="background:${P.hex}">${P.icon}${u}</button>`; },
  openWires(r) {
    this.mode = 'wires'; this.r = r; this.sel = -1; this.drag = null; this.pad = 'plug'; this.cur = 0;   // mode first, so freeing the mouse isn't a pause
    // beside the 🔧🤖: what beat it (🧲 = shut down by the electromagnet, so there's little to fix)
    $('fixHow').textContent = r.beatenBy && WEAPON[r.beatenBy] ? WEAPON[r.beatenBy].icon : '';

  },
  // the plugs and ports. A burnt plug is charred, with a badge: 🔌 (the bag has a new wire) or ✂️ and the taps left
  renderWires() {
    const W = this.r.wires, C = WIRE_COLORS;
    $('plugs').innerHTML = W.plugs.map((ci, i) => {
      const b = W.burnt[i] ? `<b class="fixb">${Game.bag.wiring > 0 ? PARTS.wiring.icon : '✂️<i>' + W.scrub[i] + '</i>'}</b>` : '';
      return `<div class="plug${W.burnt[i] ? ' burnt' : ''}" data-plug="${i}" data-color="${C[ci].color}" style="background:${C[ci].hex}">${this.icon(ci, '#fff', '#14182a')}${b}</div>`;
    }).join('');
    $('ports').innerHTML = W.ports.map((ci, j) => `<div class="port" data-port="${j}" data-color="${C[ci].color}" style="border-color:${C[ci].hex};color:${C[ci].hex}">${this.icon(ci, C[ci].hex, 'none')}</div>`).join('');

  patch(i) {
    const res = patchWire(Game.humans[0], this.r, i);

  },
  // the Quick Fix on a gamepad: ▲ ▼ moves over the plugs (or, holding one, the ports); A picks up,
  // patches a burnt plug, or plugs in
  padWires(pad) {
    const W = this.r?.wires; if (!W) return;
    const n = this.pad === 'port' ? W.ports.length : W.plugs.length;
    if (pad.upP || pad.downP) { this.cur = (this.cur + (pad.downP ? 1 : -1) + n) % n; this.draw(); }
    if (!pad.aP) return;
    if (this.pad === 'port') { const i = this.sel, j = this.cur; this.sel = -1; this.pad = 'plug'; this.cur = Math.max(0, i); this.tryWire(i, j); return; }
    const i = this.cur % W.plugs.length;

  },
  // squad full: every squadmate as a tile; tap the one that goes home. The new robot is shown in the top.
  openHome(r) {
    this.mode = 'home'; this.r = r; this.homeKey = null;   // mode first, so freeing the mouse isn't a pause
    $('homeNew').textContent = '❓  ➕' + ROBOT_TYPES[r.type].icon;
    this.show('home'); this.drawHome();
    if (document.pointerLockElement) document.exitPointerLock();
  },
  drawHome() {
    if (this.mode !== 'home') return;
    const rp = Game.humans[0]?.repair, pad = padConnected(), cur = rp?.cur ?? 0;
    const key = JSON.stringify([Game.squad.map((q) => q.id + q.name), pad && cur]); if (key === this.homeKey) return; this.homeKey = key;
    $('homeTiles').innerHTML = Game.squad.map((q, i) => `<div class="homeTile"><button class="tile mate${pad && i === cur % Game.squad.length ? ' cur' : ''}" data-id="${q.id}" aria-label="${q.name}">${ROBOT_TYPES[q.type].icon}</button><span>${q.name}</span></div>`).join('');
  },
  openName(r) {
    this.r = r; this.mode = 'name'; this.drag = null;
    $('nameIn').value = r.name;      // a random name is already there: ✔ keeps it
    this.show('namer');
  },
  // the parts picker: every part still on the robot, two empty slots that fill as you pick
  openPicker(r) {
    this.r = r; this.mode = 'parts';
    $('pickTiles').innerHTML = r.parts.map((id) => this.tile(id)).join('');
    this.show('picker'); this.drawPicker();
    if (document.pointerLockElement) document.exitPointerLock();
  },
  drawPicker() {
    const h = Game.humans[0], rp = h?.repair;
    if (this.mode !== 'parts' || !rp || rp.kind !== 'parts') return;
    const full = rp.picks.length >= takeMaxOf(rp.r), pad = padConnected();
    [...$('pickTiles').children].forEach((t, i) => {
      const on = rp.picks.includes(t.dataset.part);
      t.classList.toggle('on', on); t.classList.toggle('dim', full && !on); t.classList.toggle('cur', pad && i === rp.cur);
    });
    let slots = '';
    for (let i = 0; i < takeMaxOf(rp.r); i++) { const id = rp.picks[i]; slots += id ? `<div class="slot full" style="background:${PARTS[id].hex}">${PARTS[id].icon}</div>` : '<div class="slot"></div>'; }
    $('slots').innerHTML = slots;
    $('pickOk').classList.toggle('off', !rp.picks.length);
  },
  pick(h, id) {
    const res = pickPart(h, id);
    if (res === 'full' && h.idx === 0) { const b = $('pickTiles'); b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); }
    if (h.idx === 0) this.drawPicker();

  },
  takePicks(h) {
    const rp = h.repair; if (!rp || rp.kind !== 'parts') return { ok: false, why: 'not taking' };
    const res = takeParts(h, rp.r, rp.picks.slice());
    if (!res.ok) { if (!Game.manual) Sfx.buzz(); return res; }
    if (h.idx === 0) this.relock();

  },
  // the parts bag: open it when no other panel is up, close it if it is open
  toggleBag() {
    if (this.mode === 'bag') { this.close(); this.relock(); }
    else if (!this.mode) {
      this.mode = 'bag'; this.bagKey = null;
      this.show('bag'); this.drawBag();
      if (document.pointerLockElement) document.exitPointerLock();
    }
    if (!Game.manual) Sfx.click();
    return this.mode === 'bag';
  },
  drawBag() {
    if (this.mode !== 'bag') return;
    const key = JSON.stringify(Game.bag); if (key === this.bagKey) return; this.bagKey = key;
    const have = Object.keys(PARTS).filter((id) => Game.bag[id] > 0);
    $('bagTiles').innerHTML = have.length ? have.map((id) => this.tile(id, 'have').replace('</button>', `<b class="n">×${Game.bag[id]}</b></button>`)).join('') : '<div class="empty">🎒</div>';
    $('bagN').textContent = Game.parts;
  },
  // fix my mech: open it when no other panel is up (and the mech is running), close it if it's open
  toggleMend() {
    const m = Game.humans[0]?.mech;
    if (this.mode === 'mend') { this.close(); this.relock(); }
    else if (!this.mode && m && m.state !== 'down') {
      this.mode = 'mend'; this.mendKey = null; this.mendCur = 0;   // mode first, so freeing the mouse isn't a pause
      this.show('mend'); this.drawMend();
      if (document.pointerLockElement) document.exitPointerLock();
    }
    if (!Game.manual) Sfx.click();
    return this.mode === 'mend';
  },
  // the part ids the mend panel offers: one per damaged area, the part that fixes it
  mendIds() { const m = Game.humans[0]?.mech; return m ? AREAS.filter((a) => hurtIn(m, a) && partFor(a)).map(partFor) : []; },
  // each damaged area: its icon, how hurt it is, and the part that fixes it with how many the bag has
  drawMend() {
    if (this.mode !== 'mend') return;
    const m = Game.humans[0].mech, pad = padConnected(), ids = this.mendIds();
    const key = JSON.stringify([AREAS.map((a) => Math.round(m.damage[a])), Game.bag, pad && this.mendCur]); if (key === this.mendKey) return; this.mendKey = key;
    if (!ids.length) { $('mendTiles').innerHTML = '<div class="empty">❤️✔</div>'; return; }
    $('mendTiles').innerHTML = ids.map((id, i) => {
      const a = PARTS[id].fixes, n = Game.bag[id] || 0, f = clamp(m.damage[a] / m.maxHealth, 0, 1);
      return `<div class="need" data-area="${a}"><span class="area">${AREA_ICON[a]}</span><div class="dmg"><b style="width:${(f * 100).toFixed(1)}%"></b></div>`
        + this.tile(id, (n ? '' : 'dim') + (pad && i === this.mendCur % ids.length ? ' cur' : '')).replace('</button>', `<b class="n${n ? '' : ' zero'}">×${n}</b></button>`) + '</div>';
    }).join('');
  },
  // tap a part in the mend panel: use one on its area, or buzz and shake if the bag hasn't got it
  useMend(h, id) {
    const res = repairSelf(h, [id]);
    if (!res.ok) { if (!Game.manual) Sfx.buzz(); const b = $('mendTiles'); b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); }
    this.drawMend();
    return res;
  },
  close() { this.mode = null; this.r = null; this.drag = null; this.sel = -1; this.show(null); $('nameIn').blur(); },
  // (from a pad button or a hook there is no user gesture, so the browser can refuse the lock: the mouse just isn't captured yet)
  relock() { if (Game.humans.length === 1 && Game.state === 'play' && !Game.paused && !Game.manual) canvas.requestPointerLock?.()?.catch?.(() => {}); },
  // ✖ / Escape: leave the wiring or the picker (the robot's clock runs again and
  // nothing is taken), close the bag, or keep the name
  dismiss() {
    if (this.mode === 'name') { this.confirmName(); return; }
    if (this.mode === 'wires' || this.mode === 'parts' || this.mode === 'home') cancelRepair(Game.humans[0]);
    this.close(); this.relock();
  },
  confirmName() {
    if (this.mode !== 'name') return;
    const v = $('nameIn').value.trim().slice(0, 12);
    if (v && this.r && v !== this.r.name) setRobotName(this.r, v);
    if (!Game.manual) Sfx.click();
    this.close(); this.relock();
  },
  tryWire(i, j) {
    const res = connectWire(Game.humans[0], this.r, i, j);
    if (res === 'wrong' || res === 'burnt') { const b = $('board'); b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); }
    this.draw();
    return res;
  },
  centre(el, box) { const q = el.getBoundingClientRect(); return [q.left + q.width / 2 - box.left, q.top + q.height / 2 - box.top]; },
  portAt(x, y) {
    let best = -1, bd = 60;   // generous: a drop near the port counts
    $('ports').querySelectorAll('.port').forEach((el) => { const q = el.getBoundingClientRect(), d = Math.hypot(x - (q.left + q.width / 2), y - (q.top + q.height / 2)); if (d < bd) { bd = d; best = +el.dataset.port; } });
    return best;
  },
  // wires already in, and the one being dragged, as fat cable curves
  draw() {
    if (this.mode !== 'wires' || !this.r) return;
    const W = this.r.wires, box = $('board').getBoundingClientRect();
    const plugs = $('plugs').children, ports = $('ports').children;
    const cable = (a, b, hex) => {
      const dx = Math.max(40, (b[0] - a[0]) * 0.45), d = `M${a[0]},${a[1]} C${a[0] + dx},${a[1]} ${b[0] - dx},${b[1]} ${b[0]},${b[1]}`;
      return `<path d="${d}" stroke="#14182a" stroke-width="18" fill="none" stroke-linecap="round"/><path d="${d}" stroke="${hex}" stroke-width="10" fill="none" stroke-linecap="round"/>`;
    };
    let svg = '';
    W.link.forEach((j, i) => {
      plugs[i].classList.toggle('done', j >= 0); plugs[i].classList.toggle('sel', i === this.sel);
      if (j >= 0) svg += cable(this.centre(plugs[i], box), this.centre(ports[j], box), WIRE_COLORS[W.plugs[i]].hex);
    });
