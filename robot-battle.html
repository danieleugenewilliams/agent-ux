<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Battle</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Asap:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #ff8a1f; --yellow: #ffd83d; --cyan: #3ff0ff; --ink: #14182a; --green: #3ee07a; --white: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fc8ff; font-family: 'Asap', system-ui, sans-serif; user-select: none; -webkit-user-select: none; color: #fff; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .screen { position: fixed; inset: 0; display: none; pointer-events: none; }
  .screen.on { display: block; }
  .screen.on button { pointer-events: auto; }
  .rb-title {
    font-family: 'Titan One', 'Asap', sans-serif; color: #fff; letter-spacing: .5px;
    text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink),
                 2px 2px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 0 6px 0 var(--ink);
  }
  /* ---------- START OVERLAY ---------- */
  #start { background: radial-gradient(ellipse at center, rgba(20,24,42,.25), rgba(20,24,42,.7)); }
  #start .wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
  #start .logo { font-size: 64px; line-height: 1; transform: rotate(-3deg); }
  #start .logo span { color: var(--orange); }
  #go { margin-top: 26px; width: 150px; height: 150px; border-radius: 50%; border: 6px solid var(--ink); background: var(--orange); box-shadow: 0 10px 0 var(--ink), 0 0 40px rgba(255,138,31,.6); font-size: 64px; color: #fff; cursor: pointer; transition: transform .1s; }
  #go:hover { transform: scale(1.06); }
  #go:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--ink); }
  .keys { margin-top: 28px; display: flex; gap: 26px; justify-content: center; align-items: center; }
  .keyset { display: grid; grid-template-columns: repeat(3, 40px); gap: 5px; }
  .key { width: 40px; height: 40px; border-radius: 9px; background: rgba(255,255,255,.92); color: var(--ink); font-weight: 900; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .key.e { visibility: hidden; }
  .hint { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 30px; }
  .hint small { font-size: 26px; }
  /* ---------- HUD ---------- */
  #hud .speed { position: absolute; left: 22px; bottom: 22px; display: flex; align-items: flex-end; gap: 5px; padding: 12px 14px; border-radius: 18px; background: rgba(20,24,42,.6); }
  #hud .speed .ico { font-size: 30px; margin-right: 6px; }
  #hud .speed i { display: block; width: 14px; border-radius: 4px; background: rgba(255,255,255,.18); }
  #hud .speed i.on { background: var(--orange); box-shadow: 0 0 10px var(--orange); }
  #hud .speed i.on.max { background: var(--yellow); box-shadow: 0 0 12px var(--yellow); }
  #hud .compass { position: absolute; right: 22px; bottom: 22px; width: 120px; height: 120px; border-radius: 50%; background: rgba(20,24,42,.6); border: 4px solid rgba(255,255,255,.25); }
  #hud .compass .arm { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #hud .compass .arm b { position: absolute; left: -14px; top: -52px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  #hud .compass .arm::before { content: ''; position: absolute; left: -3px; top: -28px; width: 6px; height: 28px; border-radius: 3px; }
  #hud .compass .legs::before { background: var(--orange); }
  #hud .compass .torso::before { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  #hud .compass .hub { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); }
  #hud .reticle { position: absolute; left: 50%; top: 42%; width: 34px; height: 34px; margin: -17px; border: 3px solid var(--cyan); border-radius: 50%; box-shadow: 0 0 10px var(--cyan); opacity: .85; }
  #hud .reticle::after { content: ''; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; background: var(--cyan); border-radius: 50%; }
  #hud .health { position: absolute; left: 22px; top: 22px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 18px; background: rgba(20,24,42,.6); }
  #hud .health .ico { font-size: 30px; }
  #hud .health .bar { width: 220px; height: 22px; border-radius: 11px; background: rgba(255,255,255,.18); overflow: hidden; }
  #hud .health .bar b { display: block; height: 100%; width: 100%; border-radius: 11px; background: var(--green); box-shadow: 0 0 10px var(--green); transition: width .15s; }
  #hud .weapons { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 12px; }
  #hud .wpn { position: relative; width: 66px; height: 66px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; background: rgba(20,24,42,.6); border: 4px solid rgba(255,255,255,.25); }
  #hud .wpn.on { border-color: var(--orange); background: rgba(255,138,31,.35); box-shadow: 0 0 16px var(--orange); transform: scale(1.12); }
  #hud .wpn small { position: absolute; right: -4px; bottom: -4px; width: 24px; height: 24px; border-radius: 7px; background: #fff; color: var(--ink); font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,40,60,0) 45%, rgba(255,40,60,.75)); }
  .key.wide { width: 110px; }
  /* ---------- SQUAD + PARTS ---------- */
  #hud .right { position: absolute; right: 22px; top: 22px; display: flex; gap: 10px; align-items: center; }
  #hud .squad { display: flex; gap: 8px; }
  #hud .parts { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 18px; background: rgba(20,24,42,.6); font-size: 30px; font-weight: 900; }
  #hud .mate { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 18px; background: rgba(20,24,42,.6); border: 3px solid var(--cyan); box-shadow: 0 0 10px rgba(63,240,255,.5); font-size: 18px; font-weight: 800; }
  #hud .mate b { font-size: 26px; }
  /* ---------- PROMPT beside a downed robot: Fix or Take parts ---------- */
  #hud .prompt { position: absolute; display: none; gap: 12px; transform: translateY(-50%); }
  #hud .prompt.on { display: flex; }
  #hud .prompt button { position: relative; width: 78px; height: 78px; border-radius: 50%; font-size: 40px; border: 5px solid var(--ink); cursor: pointer; box-shadow: 0 6px 0 var(--ink); }
  #hud .prompt .pfix { background: var(--green); }
  #hud .prompt .pparts { background: var(--orange); }
  #hud .prompt button.off { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
  #hud .prompt small { position: absolute; right: -6px; bottom: -6px; width: 26px; height: 26px; border-radius: 7px; background: #fff; color: var(--ink); font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  /* ---------- QUICK FIX: drag each wire to the port of the same colour ---------- */
  .panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: auto; padding: 16px 22px 22px; border-radius: 26px; background: rgba(20,24,42,.88); border: 5px solid var(--cyan); box-shadow: 0 0 30px rgba(63,240,255,.45); }
  .panel .top { display: flex; justify-content: space-between; align-items: center; font-size: 40px; margin-bottom: 8px; }
  .panel .x { width: 52px; height: 52px; border-radius: 50%; border: 4px solid var(--ink); background: #ff4d5e; color: #fff; font-size: 26px; font-weight: 900; cursor: pointer; }
  .board { position: relative; display: flex; justify-content: space-between; width: min(520px, 86vw); gap: 120px; padding: 6px 0; touch-action: none; }
  #wireSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .board .col { display: flex; flex-direction: column; gap: 22px; }
  .plug, .port { width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .plug { cursor: grab; border: 5px solid var(--ink); box-shadow: 0 5px 0 var(--ink); }
  .plug.sel { outline: 5px solid #fff; outline-offset: 3px; }
  .plug.done { cursor: default; }
  .port { background: #0b0e1a; border: 7px solid; box-shadow: inset 0 0 0 4px #0b0e1a, inset 0 0 14px rgba(0,0,0,.9); }
  .port.done { box-shadow: inset 0 0 0 4px #0b0e1a, 0 0 18px currentColor; }
  .plug svg, .port svg { width: 44px; height: 44px; }
  .board.bad { animation: shake .3s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  /* ---------- NAME the fixed robot (a random name is already filled in) ---------- */
  #namer .row { display: flex; align-items: center; gap: 12px; }
  #namer .big { font-size: 56px; }
  #nameIn { width: 230px; height: 64px; border-radius: 16px; border: 4px solid var(--cyan); background: #0b0e1a; color: #fff; font: 800 30px 'Asap', sans-serif; text-align: center; }
  #namer button { width: 64px; height: 64px; border-radius: 50%; border: 4px solid var(--ink); font-size: 32px; cursor: pointer; box-shadow: 0 5px 0 var(--ink); }
  #nameDice { background: var(--yellow); }
  #nameOk { background: var(--green); }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 60px; background: #8fc8ff; }
</style>

  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<body>
<canvas id="c"></canvas>
<div id="loading">🤖</div>

<!-- START: press play, then mouse aims (pointer lock) -->
<div id="start" class="screen on">
  <div class="wrap">
    <div class="logo rb-title">ROBOT <span>BATTLE</span></div>
    <button id="go" aria-label="Play">▶</button>
    <div class="keys">
      <div class="hint"><div class="keyset">
        <div class="key e"></div><div class="key">W</div><div class="key e"></div>
        <div class="key">A</div><div class="key">S</div><div class="key">D</div>
      </div><small>🦿</small></div>
      <div class="hint">🖱️<small>🎯</small></div>
      <div class="hint"><div class="keyset">
        <div class="key">1</div><div class="key">2</div><div class="key">3</div>
      </div><small>🔫👊🦶</small></div>
      <div class="hint"><div class="key wide">␣</div><small>💥</small></div>
      <div class="hint">🎮</div>
    </div>
  </div>
</div>

<!-- HUD: health, weapons, speed bars (boot icon) and a compass showing legs vs torso -->
<div id="hurt"></div>
<div id="hud" class="screen on">
  <div class="reticle"></div>
  <div class="health"><span class="ico">❤️</span><div class="bar"><b id="hpFill"></b></div></div>
  <div class="weapons" id="weapons"></div>
  <div class="speed" id="speed"><span class="ico">🦿</span></div>
  <div class="compass">
    <div class="arm legs" id="cLegs"><b>🦶</b></div>
    <div class="arm torso" id="cTorso"><b>🎯</b></div>
    <div class="hub"></div>
  </div>
  <div class="right"><div id="squad" class="squad"></div><div class="parts"><span>🔩</span><b id="partsN">0</b></div></div>
  <div class="prompt" id="prompt">
    <button class="pfix" id="pFix" aria-label="Fix">🔧<small>F</small></button>
    <button class="pparts" id="pParts" aria-label="Take parts">🔩<small>G</small></button>
  </div>
</div>

<!-- QUICK FIX: drag each plug to the port with the same colour and shape -->
<div id="fix" class="screen">
  <div class="panel">
    <div class="top"><span>🔧🤖</span><button class="x" id="fixX" aria-label="Stop">✖</button></div>
    <div class="board" id="board"><svg id="wireSvg"></svg><div class="col" id="plugs"></div><div class="col" id="ports"></div></div>
  </div>
</div>

<!-- NAME: the fixed robot already has a random name; typing a new one is optional -->
<div id="namer" class="screen">
  <div class="panel">
    <div class="row"><span class="big">🤖</span><input id="nameIn" maxlength="12" autocomplete="off" spellcheck="false" aria-label="Name"><button id="nameDice" aria-label="Random name">🎲</button><button id="nameOk" aria-label="OK">✔</button></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ===========================================================================
// Tuning. Metres and seconds. The mech is heavy: it gathers speed slowly,
// tops out, and every footfall lands with a thud and a camera shake.
// ===========================================================================
const SIM_HZ = 60, DT = 1 / SIM_HZ, MAX_STEPS = 8;
const MECH = {
  topSpeed: 5.5,      // forward cap (m/s)
  backSpeed: 2.4,     // reverse cap
  accel: 1.9,         // m/s^2 speeding up
  brake: 3.4,         // m/s^2 slowing down
  legTurn: 0.95,      // rad/s the legs can turn
  torsoTurn: 2.4,     // rad/s the torso can swing to the aim
  stride: 3.2,        // metres per footfall
  radius: 2.3,
};
const WORLD_R = 115;
const MECH_HEALTH = 100;
// Weapons. The cannon fires bullets; punch and kick are melee swings that land
// at `strike` seconds in. Punch follows the torso, kick follows the legs.
const WEAPON = {
  gun:   { icon: '🔫', dmg: 10, cool: 0.16, speed: 85, range: 95, push: 0.8 },
  punch: { icon: '👊', dmg: 22, cool: 0.55, strike: 0.16, dur: 0.5, reach: 3.4, arc: 0.85, push: 6 },
  kick:  { icon: '🦶', dmg: 34, cool: 0.9, strike: 0.32, dur: 0.85, reach: 3.2, arc: 0.7, push: 12 },
};
const WEAPONS = ['gun', 'punch', 'kick'];
const AIM_ASSIST = 0.2;      // rad: the cannon locks onto a robot this close to the torso aim
const ROBOT = {
  downTime: 12,              // seconds a beaten robot stays powered down
  warnTime: 3,               // ...the last of which it blinks before rebooting
  rebootHealth: 0.5,         // fraction of health it comes back with
};
// Fix it or take the parts. A downed robot within promptRange shows the choice.
// While a player has a robot's Quick Fix open its reboot clock holds (the world
// keeps running); walking past keepRange drops the repair and the clock runs again.
const REPAIR = { wires: 3, promptRange: 11, keepRange: 16, squadMax: 3 };
// Wire colours: Okabe-Ito colour-blind-safe hues, each with its own shape too
const WIRE_COLORS = [
  { color: 'yellow', hex: '#F0E442', shape: 'triangle' },
  { color: 'blue',   hex: '#56B4E9', shape: 'square' },
  { color: 'red',    hex: '#D55E00', shape: 'circle' },
  { color: 'pink',   hex: '#CC79A7', shape: 'star' },
];
const SHAPE_SVG = {
  triangle: '<polygon points="20,5 35,33 5,33"/>',
  square: '<rect x="7" y="7" width="26" height="26" rx="3"/>',
  circle: '<circle cx="20" cy="20" r="14"/>',
  star: '<polygon points="20,3 25,14.5 37,15.5 28,23.5 30.5,35.5 20,29 9.5,35.5 12,23.5 3,15.5 15,14.5"/>',
};
const ALLY = { glow: 2.6, color: '#3ff0ff' };
// where squadmates walk, in the leader's frame: [right, behind] metres
const SQUAD_SLOTS = [[-6, 7], [6, 7], [0, 12]];
const ROBOT_NAMES = ['Bolt', 'Sprocket', 'Rusty', 'Zippy', 'Clank', 'Gizmo', 'Sparky', 'Dynamo', 'Piston', 'Cog', 'Nugget', 'Turbo', 'Pixel', 'Rivet', 'Widget', 'Boomer'];

const V3 = THREE.Vector3;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const wrapAngle = (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const approach = (a, b, max) => (a < b ? Math.min(b, a + max) : Math.max(b, a - max));
const turnToward = (a, b, max) => wrapAngle(a + clamp(wrapAngle(b - a), -max, max));
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('robotbattle.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('robotbattle.' + k, JSON.stringify(v)); } catch (e) {} },
};
// Seeded random so the meadow is the same every visit
let seed = 1337;
const srand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const srange = (a, b) => a + (b - a) * srand();

// ===========================================================================
// Renderer + bloom (Neon Dash's UnrealBloomPass setup)
// ===========================================================================
const canvas = $('c');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#bfe3ff', 60, 210);
const composerRT = new THREE.WebGLRenderTarget(innerWidth * DPR, innerHeight * DPR, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, composerRT);
const renderPass = new RenderPass(scene, new THREE.PerspectiveCamera());
composer.addPass(renderPass);
// High threshold: only the emissive glow parts bloom, and they hold steady.
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.5, 0.86);
composer.addPass(bloom);
composer.addPass(new OutputPass());
function onResize() { renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight); }
addEventListener('resize', onResize);

const matCache = new Map();
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.2, ...opts }));
  return matCache.get(key);
}
const glowMat = (color, k = 2.6) => mat(color, { emissive: color, emissiveIntensity: k, roughness: 0.3 });

// ===========================================================================
// Audio (all synthesised, Family Knockout's Sfx shape)
// ===========================================================================
const Sfx = {
  ctx: null, master: null, hum: null,
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.6; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate; const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      this.startHum();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, dur, type = 'sine', vol = 0.25, f2 = null, delay = 0) {
    if (!this.ctx) return; const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol = 0.2, freq = 1500, delay = 0, q = 1, type = 'bandpass') {
    if (!this.ctx) return; const t = this.ctx.currentTime + delay;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  // A heavy footfall: a sub thump, a dirt crunch and a hydraulic hiss
  thud(k = 1) {
    this.tone(72, 0.38, 'sine', 0.55 * k, 34);
    this.tone(48, 0.5, 'triangle', 0.3 * k, 28);
    this.noise(0.25, 0.25 * k, 260, 0, 0.7, 'lowpass');
    this.noise(0.18, 0.05 * k, 4200, 0.06, 2, 'highpass');
  },
  servo() { this.tone(180, 0.12, 'sawtooth', 0.025, 240); },
  click() { this.tone(660, 0.06, 'triangle', 0.15, 990); },
  // Combat. `k` is a 0..1 loudness for sounds out in the meadow.
  shot() { this.tone(900, 0.09, 'square', 0.07, 260); this.noise(0.07, 0.12, 2600, 0, 1.2); },
  swing() { this.noise(0.18, 0.1, 900, 0, 0.6); },
  clang(k = 1) { this.tone(520, 0.25, 'triangle', 0.2 * k, 470); this.tone(1310, 0.18, 'triangle', 0.08 * k, 1180); this.noise(0.12, 0.18 * k, 3200, 0, 1.5); },
  whack(k = 1) { this.tone(95, 0.3, 'sine', 0.5 * k, 45); this.clang(0.8 * k); },
  ram() { this.tone(60, 0.6, 'sawtooth', 0.4, 30); this.noise(0.5, 0.45, 500, 0, 0.6, 'lowpass'); this.clang(1); this.tone(220, 0.3, 'square', 0.08, 90, 0.05); },
  snort(k = 1) { this.noise(0.35, 0.18 * k, 700, 0, 0.8); this.tone(140, 0.4, 'sawtooth', 0.06 * k, 300); },
  zap(k = 1) { this.noise(0.06, 0.12 * k, 5200, 0, 3, 'highpass'); this.tone(1800 + Math.random() * 1600, 0.04, 'square', 0.03 * k); },
  powerDown(k = 1) { this.tone(420, 1.1, 'sawtooth', 0.12 * k, 40); this.tone(840, 0.6, 'sine', 0.06 * k, 80); this.noise(0.3, 0.2 * k, 2400); },
  reboot(k = 1) { this.tone(80, 0.9, 'sawtooth', 0.1 * k, 620); this.tone(1200, 0.08, 'square', 0.06 * k, null, 0.9); this.tone(1600, 0.08, 'square', 0.06 * k, null, 1.0); },
  // Repairs: a plug clicks home, a wrong wire buzzes, a fixed robot sings, salvage clanks
  plug() { this.tone(520, 0.08, 'square', 0.1, 780); this.tone(1040, 0.12, 'triangle', 0.12, null, 0.05); },
  buzz() { this.tone(110, 0.3, 'sawtooth', 0.16, 85); this.noise(0.2, 0.14, 1800, 0, 2); },
  fixed() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.16, null, i * 0.1)); },
  salvage() { this.clang(1); this.clang(0.7); this.tone(260, 0.12, 'square', 0.06, 180, 0.12); this.tone(340, 0.12, 'square', 0.06, 220, 0.26); this.noise(0.3, 0.2, 900, 0.1, 0.8); },
  // A low engine hum that rises with speed
  startHum() {

};

const padPrev = [{}, {}, {}, {}];
function readPad(i) {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const list = [...pads].filter(Boolean);
  const p = list[i]; if (!p) return null;
  const dz = (v) => (Math.abs(v) < 0.18 ? 0 : v);
  const b = (n) => !!(p.buttons[n] && p.buttons[n].pressed);
  const prev = padPrev[i];
  const cur = { start: b(9), up: b(12), down: b(13), left: b(14), right: b(15), a: b(0), x: b(2), y: b(3), lb: b(4), rb: b(5), rt: b(7) || (p.buttons[7] && p.buttons[7].value > 0.4) };
  const out = {
    lx: dz(p.axes[0] || 0) + (cur.right ? 1 : 0) - (cur.left ? 1 : 0),
    ly: dz(p.axes[1] || 0) + (cur.down ? 1 : 0) - (cur.up ? 1 : 0),
    rx: dz(p.axes[2] || 0), ry: dz(p.axes[3] || 0),
    startP: cur.start && !prev.start, aP: cur.a && !prev.a, xP: cur.x && !prev.x, yP: cur.y && !prev.y,
    rt: cur.rt, lbP: cur.lb && !prev.lb, rbP: cur.rb && !prev.rb,
  };
  padPrev[i] = cur;
  return out;
}

// ===========================================================================
// The meadow: rolling ground, wind-blown grass, rocks and trees
// ===========================================================================
function groundH(x, z) {
  const r = Math.hypot(x, z);
  const hills = 0.9 * Math.sin(x * 0.045) * Math.cos(z * 0.038) + 0.45 * Math.sin(x * 0.11 + z * 0.07) + 0.3 * Math.cos(z * 0.13 - x * 0.05);
  const rim = r > 90 ? Math.min(1, Math.pow((r - 90) / 35, 2)) * 12 : 0;   // the meadow rises into hills at the edge
  return hills * 0.8 + rim;
}
const obstacles = [];   // { x, z, r } circles the mech can't walk through

function makeSky() {
  const geo = new THREE.SphereGeometry(500, 32, 16);
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color('#3f8cff') }, mid: { value: new THREE.Color('#9fd4ff') }, bot: { value: new THREE.Color('#e8f6ff') } },
    vertexShader: 'varying vec3 vp; void main(){ vp = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vp; void main(){ float h = normalize(vp).y; vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.6)) : mix(mid, bot, min(1.0, -h * 4.0)); gl_FragColor = vec4(c, 1.0); }',
  });
  const sky = new THREE.Mesh(geo, m); sky.renderOrder = -1; scene.add(sky); return sky;
}

const Meadow = {
  time: { value: 0 },
  build() {
    this.sky = makeSky();
    scene.add(new THREE.HemisphereLight('#dff1ff', '#5d8a3a', 1.25));
    const sun = new THREE.DirectionalLight('#fff3d6', 2.6);
    sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
    const sc = sun.shadow.camera; sc.left = -40; sc.right = 40; sc.top = 40; sc.bottom = -40; sc.near = 1; sc.far = 160;
    sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
    scene.add(sun); scene.add(sun.target); this.sun = sun;

    // Ground
    const g = new THREE.PlaneGeometry(260, 260, 160, 160); g.rotateX(-Math.PI / 2);
    const p = g.attributes.position, col = [];
    const cA = new THREE.Color('#5fae3c'), cB = new THREE.Color('#86c94a'), cC = new THREE.Color('#7a6a3c'), tmp = new THREE.Color();
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i), y = groundH(x, z); p.setY(i, y);
      const n = 0.5 + 0.5 * Math.sin(x * 0.21 + Math.cos(z * 0.17) * 2);
      tmp.copy(cA).lerp(cB, n); if (y > 4) tmp.lerp(cC, clamp((y - 4) / 8, 0, 0.6));
      col.push(tmp.r, tmp.g, tmp.b);
    }
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
    const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
    ground.receiveShadow = true; scene.add(ground);

    this.buildGrass();
    this.buildFlowers();
    seed = 4242;
    for (let i = 0; i < 70; i++) { const [x, z] = this.spot(30, 108); this.addTree(x, z, srange(0.8, 1.35)); }
    for (let i = 0; i < 55; i++) { const [x, z] = this.spot(26, 105); this.addRock(x, z, srange(0.6, 2.4)); }
    for (let i = 0; i < 14; i++) { const a = srange(0, Math.PI * 2), r = srange(8, 24); this.addRock(Math.cos(a) * r, Math.sin(a) * r, srange(0.25, 0.5), true); }
  },
  // A random spot in a ring, away from the spawn clearing and other obstacles
  spot(r0, r1) {
    for (let t = 0; t < 40; t++) {
      const a = srange(0, Math.PI * 2), r = Math.sqrt(srange(r0 * r0, r1 * r1));
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (obstacles.every((o) => Math.hypot(o.x - x, o.z - z) > o.r + 4)) return [x, z];

  },
  buildGrass() {
    const blade = new THREE.BufferGeometry();

    blade.setAttribute('position', new THREE.Float32BufferAttribute([-0.07, 0, 0, 0.07, 0, 0, -0.045, 0.45, 0.03, 0.045, 0.45, 0.03, 0, 0.9, 0.1], 3));

        vec4 ip = instanceMatrix[3];

      const s = srange(0.6, 1.5); o.scale.set(s, s * srange(0.8, 1.4), s); o.updateMatrix();
      im.setMatrixAt(i, o.matrix);
      c.setHSL(srange(0.22, 0.3), srange(0.5, 0.7), srange(0.3, 0.45)); im.setColorAt(i, c);
    }

  },
  buildFlowers() {
    const geo = new THREE.IcosahedronGeometry(0.12, 0);
    const N = 900, im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial(), N);
    const o = new THREE.Object3D(), c = new THREE.Color(), hues = ['#ffffff', '#ffd83d', '#ff5fa2', '#9f7bff', '#ff8a1f'];
    seed = 7;
    for (let i = 0; i < N; i++) {
      const a = srange(0, Math.PI * 2), r = Math.sqrt(srand()) * 95, x = Math.cos(a) * r, z = Math.sin(a) * r;
      o.position.set(x, groundH(x, z) + srange(0.35, 0.6), z); o.updateMatrix(); im.setMatrixAt(i, o.matrix);

  },
  addTree(x, z, s) {
    const t = new THREE.Group(); t.position.set(x, groundH(x, z) - 0.2, z);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35 * s, 0.6 * s, 4.5 * s, 7), mat('#7a5232', { roughness: 0.9, metalness: 0 }));
    trunk.position.y = 2.25 * s; trunk.castShadow = true; t.add(trunk);

// ===========================================================================
// The mech, built from parts: legs, torso, arms, cockpit
// ===========================================================================
const PAINT = { armour: '#ff8a1f', trim: '#ffd83d', frame: '#2d3446', dark: '#1a1f2c', glow: '#3ff0ff' };
function rbox(w, h, d, r, color, opts) { const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat(color, opts)); m.castShadow = true; m.receiveShadow = true; return m; }
function cyl(rt, rb, h, color, opts, seg = 16) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat(color, opts)); m.castShadow = true; return m; }
function ball(r, color, opts) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 12), mat(color, opts)); m.castShadow = true; return m; }
function capsule(r, len, color, opts) { const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 12), mat(color, opts)); m.castShadow = true; return m; }

function buildMech(paint = PAINT) {
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);            // bobs with the gait
  const metal = { metalness: 0.55, roughness: 0.4 };

  const hub = cyl(0.9, 1.1, 1.0, paint.frame, metal, 20); pelvis.add(hub);

    const hipCap = cyl(0.7, 0.7, 0.35, paint.trim, metal, 18); hipCap.rotation.z = Math.PI / 2; hipCap.position.x = s * 0.45; hip.add(hipCap);
    // thigh: piston frame with an armour plate
    const thigh = capsule(0.42, 1.4, paint.frame, metal); thigh.position.y = -1.0; hip.add(thigh);
    const thighPlate = rbox(0.95, 1.6, 0.8, 0.25, paint.armour); thighPlate.position.set(s * 0.12, -0.95, -0.18); thighPlate.rotation.x = 0.08; hip.add(thighPlate);
    const knee = new THREE.Group(); knee.position.y = -2.0; hip.add(knee);

    // shin: tapered, heavier at the bottom

    const shinGuard = rbox(0.9, 1.5, 0.55, 0.22, paint.armour); shinGuard.position.set(0, -0.9, -0.3); knee.add(shinGuard);
    const piston = cyl(0.11, 0.11, 1.5, '#c9ced8', { metalness: 0.9, roughness: 0.2 }); piston.position.set(0, -0.9, 0.42); knee.add(piston);
    const ankle = new THREE.Group(); ankle.position.y = -1.95; knee.add(ankle);

    const heel = rbox(0.55, 0.35, 0.7, 0.15, paint.armour); heel.position.set(0, -0.08, 0.85); foot.add(heel);
    legs.push({ s, hip, knee, ankle });
  }

  const ring = cyl(1.05, 1.05, 0.4, paint.dark, metal, 24); ring.position.y = -0.4; torso.add(ring);

  const back = rbox(2.8, 1.6, 1.1, 0.35, paint.frame, metal); back.position.set(0, 0.9, 1.15); torso.add(back);
  for (const s of [-1, 1]) {   // exhaust stacks

  }

  const cowl = new THREE.Mesh(new THREE.SphereGeometry(0.95, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), mat(paint.frame, metal));

  // Arms: shoulder pods that pitch with the aim. Right: twin cannon. Left: rocket pod.
  const arms = [];
  for (const s of [-1, 1]) {
    const shoulder = new THREE.Group(); shoulder.position.set(s * 2.25, 1.0, -0.1); torso.add(shoulder);
    const pod = ball(0.7, paint.dark, metal); shoulder.add(pod);
    const pauldron = new THREE.Mesh(new THREE.SphereGeometry(0.95, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(paint.armour));
    pauldron.scale.set(1.1, 0.75, 1.25); pauldron.position.set(s * 0.2, 0.2, 0); pauldron.castShadow = true; shoulder.add(pauldron);

    const fore = new THREE.Group(); fore.position.y = -1.0; arm.add(fore);
    fore.add(ball(0.38, paint.dark, metal));
    if (s > 0) {
      const housing = rbox(0.9, 0.9, 2.2, 0.25, paint.armour); housing.position.z = -0.8; fore.add(housing);
      for (const bx of [-0.2, 0.2]) {
        const barrel = cyl(0.13, 0.15, 1.6, '#3a4152', { metalness: 0.8, roughness: 0.3 }, 12); barrel.rotation.x = Math.PI / 2; barrel.position.set(bx, 0, -2.4); fore.add(barrel);
        const muzzle = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.04, 6, 16), glowMat(paint.glow, 2.4)); muzzle.position.set(bx, 0, -3.2); fore.add(muzzle);
      }
    } else {
      const podBox = rbox(1.1, 1.0, 1.9, 0.28, paint.armour); podBox.position.z = -0.7; fore.add(podBox);
      for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
        const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.06, 12), glowMat('#ffd83d', 1.8));
        tube.rotation.x = Math.PI / 2; tube.position.set(-0.24 + c * 0.48, -0.2 + r * 0.4, -1.66); fore.add(tube);
      }

  }

}

// Simulation state for one mech. Players and robots write the same `input`
// fields; a robot also carries a `spec` that stands in for MECH.
function newMech(x, z, heading) {
  return {
    health: MECH_HEALTH, maxHealth: MECH_HEALTH, hitsTaken: 0,
    push: new V3(),           // knockback velocity, fades out
    cool: 0, swing: null,     // weapon cooldown and the melee swing in progress
    pos: new V3(x, groundH(x, z), z),
    legHeading: heading,      // where the legs face and walk
    torsoYaw: heading,        // where the torso faces (world yaw)
    aimPitch: 0,
    speed: 0,                 // signed, along legHeading
    turnVel: 0,
    phase: 0, footfalls: 0, lastFall: 0, fallFoot: 0,
    input: { throttle: 0, turn: 0, aimYaw: heading, aimPitch: 0, weapon: 'gun', attack: false, boost: false },
    model: null,
  };
}

function mechTick(m, dt) {
  const inp = m.input, S = m.spec || MECH;
  // Throttle: ease toward the target speed. Heavy: slow to gain, quicker to shed.
  // A robot with a boostSpeed (the Charger) can surge past its top speed.
  const boost = inp.boost && S.boostSpeed;
  const target = inp.throttle >= 0 ? inp.throttle * (boost ? S.boostSpeed : S.topSpeed) : inp.throttle * S.backSpeed;
  const speeding = Math.abs(target) > Math.abs(m.speed) && target * m.speed >= 0;
  m.speed = approach(m.speed, target, (speeding ? (boost ? S.boostAccel : S.accel) : S.brake) * dt);
  m.speed = clamp(m.speed, -S.backSpeed, S.boostSpeed || S.topSpeed);
  // Legs turn slowly, a little slower at speed
  const turnRate = S.legTurn * Math.max(0.2, 1 - 0.3 * Math.abs(m.speed) / S.topSpeed);
  m.turnVel = approach(m.turnVel, -inp.turn * turnRate, turnRate * 3 * dt);
  m.legHeading = wrapAngle(m.legHeading + m.turnVel * dt);
  // Torso swings toward the aim on its own turret ring
  m.torsoYaw = turnToward(m.torsoYaw, inp.aimYaw, S.torsoTurn * dt);
  m.aimPitch = approach(m.aimPitch, clamp(inp.aimPitch, -0.35, 0.5), 1.5 * dt);
  // Walk
  const fx = -Math.sin(m.legHeading), fz = -Math.cos(m.legHeading);
  m.pos.x += fx * m.speed * dt; m.pos.z += fz * m.speed * dt;
  // Knockback from rams and kicks slides the mech and fades out
  m.pos.x += m.push.x * dt; m.pos.z += m.push.z * dt; m.push.multiplyScalar(Math.exp(-3.5 * dt));
  for (const o of obstacles) {
    const dx = m.pos.x - o.x, dz = m.pos.z - o.z, d = Math.hypot(dx, dz), min = o.r + S.radius;
    if (d < min && d > 1e-6) { m.pos.x = o.x + dx / d * min; m.pos.z = o.z + dz / d * min; }
  }
  const r = Math.hypot(m.pos.x, m.pos.z);
  if (r > WORLD_R) { m.pos.x *= WORLD_R / r; m.pos.z *= WORLD_R / r; }
  m.pos.y = groundH(m.pos.x, m.pos.z);
  // Gait: a footfall every stride, at the front of each leg's swing
  const prevPhase = m.phase;
  m.phase += (m.speed * dt / S.stride) * Math.PI;
  if (Math.abs(m.speed) < 0.05 && Math.abs(m.turnVel) > 0.05) m.phase += Math.abs(m.turnVel) * dt * 1.6;  // shuffle when turning on the spot
  const fallIdx = (ph) => Math.floor((ph - Math.PI / 2) / Math.PI);
  if (fallIdx(m.phase) !== fallIdx(prevPhase)) { m.footfalls++; m.lastFall = 0; m.fallFoot = fallIdx(m.phase) & 1; m.onFootfall?.(m); }
  m.lastFall += dt;
}

function syncMechModel(m) {
  const md = m.model; if (!md) return;
  md.root.position.copy(m.pos);
  md.root.rotation.y = m.legHeading;
  const k = clamp(Math.abs(m.speed) / MECH.topSpeed + Math.abs(m.turnVel) * 0.6, 0, 1);
  for (const L of md.legs) {
    const p = m.phase + (L.s > 0 ? 0 : Math.PI);
    const swing = Math.sin(p), lift = Math.max(0, Math.cos(p));
    L.hip.rotation.x = swing * 0.42 * k - 0.12;
    L.knee.rotation.x = -(0.25 + lift * 0.85 * k);
    L.ankle.rotation.x = -(L.hip.rotation.x + L.knee.rotation.x);
  }
  const bob = -0.22 * k * Math.pow(Math.abs(Math.sin(m.phase)), 6) - 0.12;
  md.body.position.y = bob;
  md.body.rotation.z = Math.sin(m.phase) * 0.025 * k;           // weight shifts side to side
  md.body.rotation.x = -m.speed / MECH.topSpeed * 0.04;          // lean into the walk
  md.torso.rotation.y = wrapAngle(m.torsoYaw - m.legHeading);
  for (const A of md.arms) { A.arm.rotation.x = m.aimPitch; A.fore.position.z = 0; }   // arms pitch with the aim
  // Melee: cock back until the strike, snap out, then ease home.
  // Punch throws the left (rocket-pod) arm; kick swings the right leg.
  const sw = m.swing;
  if (sw) {
    const W = WEAPON[sw.w];
    const e = sw.t < W.strike ? -0.35 * (sw.t / W.strike) : 1 - Math.pow(clamp((sw.t - W.strike) / (W.dur - W.strike), 0, 1), 2);
    if (sw.w === 'punch') {
      const A = md.arms.find((a) => a.s < 0);
      A.arm.rotation.x = m.aimPitch + e * 1.45; A.fore.position.z = -Math.max(0, e) * 0.9;
      md.torso.rotation.y += e * 0.18;
    } else {
      const L = md.legs.find((l) => l.s > 0);
      L.hip.rotation.x = e * 1.1; L.knee.rotation.x = -(0.25 + (1 - Math.max(0, e)) * 0.7); L.ankle.rotation.x = -(L.hip.rotation.x + L.knee.rotation.x) * 0.5;
      md.body.rotation.x += Math.max(0, e) * 0.07;
    }
  }
}

// ===========================================================================
// Camera rig (Family Knockout's CamRig, aimed by the torso)
// ===========================================================================
class CamRig {
  constructor(i) { this.i = i; this.cam = new THREE.PerspectiveCamera(60, 1, 0.1, 1200); this.yaw = 0; this.pitch = 0; this.dist = 15; this.target = new V3(); this.shake = 0; this.snap = true; this.t = 0; }
  kick(k) { this.shake = Math.min(1.2, this.shake + k); }
  update(dt, m) {
    if (!m) return;
    this.t += dt;
    const k = this.snap ? 1 : 1 - Math.exp(-10 * dt);
    this.target.x = lerp(this.target.x, m.pos.x, k); this.target.z = lerp(this.target.z, m.pos.z, k);
    this.target.y = lerp(this.target.y, m.pos.y + 6.2, this.snap ? 1 : 1 - Math.exp(-5 * dt));
    this.snap = false;
    const yaw = m.torsoYaw, el = clamp(0.32 - m.aimPitch * 0.8, 0.02, 0.85), c = this.cam;
    const cp = Math.cos(el);
    c.position.set(this.target.x + Math.sin(yaw) * cp * this.dist, this.target.y + Math.sin(el) * this.dist, this.target.z + Math.cos(yaw) * cp * this.dist);
    const g = groundH(c.position.x, c.position.z) + 1.5; if (c.position.y < g) c.position.y = g;
    const look = new V3(this.target.x - Math.sin(yaw) * 10, this.target.y + Math.tan(m.aimPitch) * 10, this.target.z - Math.cos(yaw) * 10);
    if (this.shake > 0.001) {
      const s = this.shake * this.shake * 0.35, t = this.t * 40;
      c.position.y += Math.sin(t * 1.3) * s; c.position.x += Math.sin(t * 0.9 + 1) * s * 0.6;
      look.y += Math.sin(t * 1.7 + 2) * s * 0.5;
    }
    this.shake *= Math.exp(-6 * dt);
    c.lookAt(look);
  }
}

// ===========================================================================
// Game
// ===========================================================================
const Game = { state: 'loading', humans: [], mechs: [], robots: [], squad: [], parts: 0, nextId: 1, manual: false, paused: false, acc: 0, ticks: 0, hurtFlash: 0 };
function setPause(on) {
  Game.paused = on;
  $('start').classList.toggle('on', on);
  if (on && document.pointerLockElement) document.exitPointerLock();
}

function spawnPlayer(i, x, z, heading) {
  const m = newMech(x, z, heading);
  m.model = buildMech(); scene.add(m.model.root);
  const h = { idx: i, rig: new CamRig(i), mech: m, ci: { camX: 0, camY: 0 }, weapon: 'gun', repair: null };
  h.rig.yaw = heading; m.human = h;
  m.onFootfall = (mm) => {
    const k = 0.4 + 0.6 * Math.min(1, Math.abs(mm.speed) / MECH.topSpeed);
    h.rig.kick(0.35 + 0.45 * k);
    if (!Game.manual) { Sfx.thud(k); Sfx.servo(); }
    Dust.puff(mm, k);
  };
  Game.humans.push(h); Game.mechs.push(m);
  return h;
}

// Dust puffs where a foot lands
const Dust = {
  list: [],
  init() {
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(210,190,150,0.8)'); gr.addColorStop(1, 'rgba(210,190,150,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    this.tex = new THREE.CanvasTexture(c); this.tex.colorSpace = THREE.SRGBColorSpace;
    for (let i = 0; i < 24; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: this.tex, transparent: true, depthWrite: false, opacity: 0 }));
      s.visible = false; scene.add(s); this.list.push({ s, t: 9 });
    }
  },
  puff(m, k) {
    // Even footfall index = right leg (s = +1) landing going forward; going backward the
    // index steps down, so the same mapping picks the left leg. The landing foot is ahead
    // of the hips walking forward and behind them walking backward.
    const side = m.fallFoot ? -1 : 1, h = m.legHeading, ahead = m.speed < 0 ? -1.2 : 1.2;
    const fx = -Math.sin(h), fz = -Math.cos(h), rx = Math.cos(h), rz = -Math.sin(h);
    const x = m.pos.x + rx * side * 1.75 + fx * ahead, z = m.pos.z + rz * side * 1.75 + fz * ahead;
    for (let n = 0; n < 3; n++) {
      const d = this.list.find((q) => q.t > 1) || this.list[0];
      d.t = 0; d.k = k; d.x = x + (Math.random() - 0.5) * 1.2; d.z = z + (Math.random() - 0.5) * 1.2; d.y = groundH(x, z) + 0.3;
      d.s.visible = true;
    }
  },
  update(dt) {
    for (const d of this.list) {
      if (d.t > 1) { d.s.visible = false; continue; }
      d.t += dt * 1.1;
      const sc = (1.2 + d.t * 3) * (0.6 + d.k * 0.6);
      d.s.position.set(d.x, d.y + d.t * 0.8, d.z); d.s.scale.set(sc, sc * 0.6, 1);
      d.s.material.opacity = 0.7 * (1 - d.t);
    }
  },
};

// How loud something at `p` should be for player 0 (0 = out of earshot)
function near(p) { const h = Game.humans[0]; if (!h) return 0; return clamp(1 - Math.hypot(p.x - h.mech.pos.x, p.z - h.mech.pos.z) / 60, 0, 1); }
const loud = (p) => (Game.manual ? 0 : near(p));

// ===========================================================================
// Sparks: hot points that bloom. Glitched robots spit them, and hits throw them.
// ===========================================================================
const SPARK_HOT = [5, 3.4, 1.1], SPARK_ZAP = [2.2, 3.8, 6];
const Sparks = {
  N: 400, i: 0, list: [],
  init() {
    const geo = new THREE.BufferGeometry();
    this.pos = new Float32Array(this.N * 3); this.col = new Float32Array(this.N * 3);
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(this.col, 3));
    const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d');
    const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.8)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
    this.points = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.5, map: new THREE.CanvasTexture(c), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
    this.points.frustumCulled = false; scene.add(this.points);
    for (let k = 0; k < this.N; k++) this.list.push({ x: 0, y: -999, z: 0, vx: 0, vy: 0, vz: 0, t: 1, life: 1, c: SPARK_HOT });
  },
  burst(x, y, z, n, c = SPARK_HOT, speed = 6) {
    for (let k = 0; k < n; k++) {
      const p = this.list[this.i = (this.i + 1) % this.N];
      const a = Math.random() * Math.PI * 2, u = 0.15 + Math.random() * 0.85;
      p.x = x; p.y = y; p.z = z; p.c = c;
      p.vx = Math.cos(a) * speed * u; p.vz = Math.sin(a) * speed * u; p.vy = speed * (0.3 + Math.random() * 0.9);
      p.t = 0; p.life = 0.25 + Math.random() * 0.45;
    }
  },
  tick(dt) {
    for (const p of this.list) {
      if (p.t >= p.life) continue;
      p.t += dt; p.vy -= 18 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      const gy = groundH(p.x, p.z); if (p.y < gy) { p.y = gy; p.vy *= -0.35; p.vx *= 0.5; p.vz *= 0.5; }
    }
  },
  sync() {
    this.list.forEach((p, k) => {
      const f = p.t < p.life ? 1 - p.t / p.life : 0;
      this.pos[k * 3] = p.x; this.pos[k * 3 + 1] = f > 0 ? p.y : -999; this.pos[k * 3 + 2] = p.z;
      this.col[k * 3] = p.c[0] * f; this.col[k * 3 + 1] = p.c[1] * f; this.col[k * 3 + 2] = p.c[2] * f;
    });
    const g = this.points.geometry; g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true;
  },
};

// ===========================================================================
// Bullets: glowing slugs from the right-arm cannon. Each tick a bullet sweeps
// the segment it travelled, so a fast slug can't skip through a robot.
// ===========================================================================
const UP = new V3(0, 1, 0);
const Bullets = {
  list: [], pool: [],
  init() {
    const geo = new THREE.CapsuleGeometry(0.13, 1.5, 4, 8), m = glowMat('#7ff8ff', 4);
    for (let k = 0; k < 48; k++) { const b = new THREE.Mesh(geo, m); b.visible = false; scene.add(b); this.pool.push(b); }
  },
  fire(from, dir, owner) { this.list.push({ p: from.clone(), v: dir.clone().multiplyScalar(WEAPON.gun.speed), d: 0, owner }); if (this.list.length > this.pool.length) this.list.shift(); },
  tick(dt) {
    const W = WEAPON.gun, p0 = new V3(), seg = new V3(), c = new V3(), q = new V3();
    for (let k = this.list.length - 1; k >= 0; k--) {
      const b = this.list[k];
      p0.copy(b.p); b.p.addScaledVector(b.v, dt); b.d += W.speed * dt;
      seg.subVectors(b.p, p0);
      let hit = null, best = 2, at = null;
      for (const r of Game.robots) {
        if (r.state === 'ally') continue;              // shots pass squadmates
        const T = ROBOT_TYPES[r.type];
        c.set(r.pos.x, r.pos.y + T.hitY, r.pos.z);
        const t = clamp(c.clone().sub(p0).dot(seg) / seg.lengthSq(), 0, 1);
        q.copy(p0).addScaledVector(seg, t);
        if (q.distanceTo(c) < T.hitR && t < best) { best = t; hit = r; at = q.clone(); }
      }
      if (hit) { hitRobot(hit, W.dmg, 'gun', b.v.x, b.v.z, at); this.list.splice(k, 1); continue; }
      const gy = groundH(b.p.x, b.p.z);
      const tree = b.p.y < gy + 5 && obstacles.find((o) => Math.hypot(b.p.x - o.x, b.p.z - o.z) < o.r);
      if (b.p.y < gy || tree || b.d > W.range) {
        if (b.d <= W.range) Sparks.burst(b.p.x, Math.max(b.p.y, gy + 0.1), b.p.z, 3, SPARK_HOT, 3);
        this.list.splice(k, 1);
      }
    }
  },
  sync() {
    this.pool.forEach((mesh, k) => {
      const b = this.list[k]; mesh.visible = !!b; if (!b) return;
      mesh.position.copy(b.p); mesh.quaternion.setFromUnitVectors(UP, b.v.clone().normalize());
    });
  },
};

// ===========================================================================
// Combat: one attack path for every weapon. Players reach it through `input`
// (and __rb.fire); hits land in hitRobot / hurtMech.
// ===========================================================================
function startAttack(m, w) {
  const W = WEAPON[w]; if (!W) return false;
  m.cool = W.cool;
  if (w === 'gun') shoot(m);
  else { m.swing = { w, t: 0, struck: false }; if (!Game.manual) Sfx.swing(); }
  return true;
}
function combatTick(m, dt) {
  m.cool = Math.max(0, m.cool - dt);
  const sw = m.swing;
  if (sw) {
    const W = WEAPON[sw.w]; sw.t += dt;
    if (!sw.struck && sw.t >= W.strike) { sw.struck = true; meleeStrike(m, sw.w); }
    if (sw.t >= W.dur) m.swing = null;
  }
  if (m.input.attack && m.cool <= 0 && !m.swing) startAttack(m, m.input.weapon);
}
// The cannon sits on the right arm. The shot starts at the shoulder (so a
// point-blank shot still sweeps through a robot in its face) and locks onto a
// robot close to the torso aim: kids get to hit what they point at.
function shoot(m) {
  m.barrel = (m.barrel || 0) ^ 1;
  const yaw = m.torsoYaw, fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  const side = 2.4 + (m.barrel ? 0.2 : -0.2);
  const from = new V3(m.pos.x + rx * side + fx * 0.5, m.pos.y + 4.4, m.pos.z + rz * side + fz * 0.5);
  const cp = Math.cos(m.aimPitch), dir = new V3(fx * cp, Math.sin(m.aimPitch), fz * cp);
  let best = AIM_ASSIST;
  for (const r of Game.robots) {
    if (r.state !== 'glitched') continue;
    const T = ROBOT_TYPES[r.type], c = new V3(r.pos.x, r.pos.y + T.hitY, r.pos.z), dx = c.x - m.pos.x, dz = c.z - m.pos.z;
    const off = Math.abs(wrapAngle(Math.atan2(-dx, -dz) - yaw));
    if (off < best && Math.hypot(dx, dz) < WEAPON.gun.range) { best = off; dir.subVectors(c, from).normalize(); }
  }
  Bullets.fire(from, dir, m);
  Sparks.burst(from.x + fx * 2.7, from.y, from.z + fz * 2.7, 2, SPARK_ZAP, 2);
  m.human?.rig.kick(0.06);
  if (!Game.manual) Sfx.shot();
}
function meleeStrike(m, w) {
  const W = WEAPON[w], face = w === 'kick' ? m.legHeading : m.torsoYaw;
  let any = false;
  for (const r of Game.robots) {
    if (r.state === 'ally') continue;
    const T = ROBOT_TYPES[r.type], dx = r.pos.x - m.pos.x, dz = r.pos.z - m.pos.z, d = Math.hypot(dx, dz) || 1;
    if (d > MECH.radius + r.spec.radius + W.reach) continue;
    if (Math.abs(wrapAngle(Math.atan2(-dx, -dz) - face)) > W.arc) continue;
    const at = new V3(r.pos.x - dx / d * r.spec.radius, r.pos.y + T.hitY * (w === 'kick' ? 0.6 : 1.1), r.pos.z - dz / d * r.spec.radius);
    hitRobot(r, W.dmg, w, dx, dz, at); any = true;
  }
  if (any) m.human?.rig.kick(w === 'kick' ? 0.8 : 0.5);
}
// A real hit from a weapon: counts it, knocks the robot back, throws sparks, then hurts it
function hitRobot(r, dmg, w, dx, dz, at) {
  const W = WEAPON[w], L = Math.hypot(dx, dz) || 1;
  r.hits[w]++;
  r.push.x += dx / L * W.push; r.push.z += dz / L * W.push;
  r.hitFlash = 1;
  Sparks.burst(at.x, at.y, at.z, w === 'gun' ? 6 : 18, SPARK_HOT, w === 'gun' ? 5 : 9);
  const k = loud(r.pos); if (k > 0) (w === 'gun' ? Sfx.clang(0.5 * k) : Sfx.whack(k));
  hurtRobot(r, dmg, w);
}
function hurtRobot(r, amount, w) {
  if (r.state === 'down') return false;
  r.health = Math.max(0, r.health - amount); r.lastHitBy = w;
  if (r.health <= 0) powerDown(r);
  return true;
}
function hurtMech(m, amount) {
  m.health = Math.max(0, m.health - amount); m.hitsTaken++;
  if (m.human) { Game.hurtFlash = 1; m.human.rig.kick(1.2); }
}

// ===========================================================================
// Glitched robots. Each one is a mech-shaped sim (newMech + a `spec`) driven
// by an ai() that writes the same input fields a player does. A glitched
// robot's glow flickers and it spits sparks; a beaten one powers down, then
// reboots if nobody deals with it.
// ===========================================================================

// The Charger: a low, four-legged battering ram with one wide visor eye.
function buildCharger(paint) {

  const glow = new THREE.MeshStandardMaterial({ color: '#1a0008', emissive: paint.glow, emissiveIntensity: 3, roughness: 0.3 });
  const own = (geo, m) => { const x = new THREE.Mesh(geo, m); x.castShadow = true; x.receiveShadow = true; return x; };

  for (const s of [-1, 1]) { const stripe = rbox(0.5, 0.18, 0.84, 0.06, paint.stripe); stripe.position.set(s * 0.9, 2.45, -2.15); body.add(stripe); }
  // head and visor eye
  const head = rbox(1.8, 1.0, 1.2, 0.3, paint.frame, metal); head.position.set(0, 3.05, -1.55); body.add(head);
  const eye = own(new RoundedBoxGeometry(1.4, 0.34, 0.2, 2, 0.08), glow); eye.position.set(0, 3.1, -2.17); body.add(eye);
  // glowing vents down the flanks and a core on the back
  for (const s of [-1, 1]) for (let k = 0; k < 3; k++) { const v = own(new THREE.BoxGeometry(0.08, 0.22, 0.6), glow); v.position.set(s * 1.52, 2.5, -0.6 + k * 0.85); body.add(v); }
  const core = own(new THREE.SphereGeometry(0.36, 14, 10), glow); core.position.set(0, 3.6, 1.45); body.add(core);
  const cage = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.06, 6, 18), mat(paint.dark, metal)); cage.position.copy(core.position); cage.rotation.x = Math.PI / 2; body.add(cage);
  // four stubby piston legs, diagonal pairs in step
  const legs = [];
  for (const [lx, lz, ph] of [[-1.3, -1.2, 0], [1.3, -1.2, Math.PI], [-1.3, 1.5, Math.PI], [1.3, 1.5, 0]]) {
    const hip = new THREE.Group(); hip.position.set(lx, 1.9, lz); body.add(hip);
    hip.add(ball(0.45, paint.dark, metal));
    const leg = cyl(0.32, 0.42, 1.5, paint.frame, metal, 12); leg.position.y = -0.8; hip.add(leg);

  const back = new THREE.Sprite(sm({ color: '#14182a', opacity: 0.75 })); back.scale.set(3.2, 0.42, 1); back.position.y = 5.1; back.renderOrder = 5; root.add(back);
  const fill = new THREE.Sprite(sm({ color: '#3ee07a' })); fill.scale.set(3.0, 0.26, 1); fill.position.y = 5.1; fill.renderOrder = 6; root.add(fill);

const ROBOT_TYPES = {
  charger: {
    health: 100, hitY: 2.2, hitR: 2.5,
    spec: { topSpeed: 6.5, backSpeed: 5, accel: 4.5, brake: 8, boostSpeed: 17, boostAccel: 18, legTurn: 2.4, torsoTurn: 4, stride: 1.6, radius: 2.0 },
    paint: { armour: '#8a5cff', frame: '#2a2f40', dark: '#1a1f2c', ram: '#c9ced8', stripe: '#ffd83d', glow: '#ff2f5b' },
    build: buildCharger,
    ai: chargerAI,
    parts: 3,                  // what taking it apart is worth
  },
};

function spawnRobot(type, x, z) {
  const T = ROBOT_TYPES[type]; if (!T) return null;
  const p = Game.humans[0]?.mech, heading = p ? Math.atan2(-(p.pos.x - x), -(p.pos.z - z)) : 0;
  const r = newMech(x, z, heading);
  Object.assign(r, {
    id: Game.nextId++, type, spec: T.spec, health: T.health, maxHealth: T.health, state: 'glitched',
    t: 0, downT: 0, downs: 0, reboots: 0, glow: 3, glowMode: 'flicker', flickT: 0, sparkT: Math.random() * 0.5, hitFlash: 0,
    hits: { gun: 0, punch: 0, kick: 0 },
    ai: { think: Math.random() * 0.05, mode: 'stalk', t: 0.6 },
    wires: makeWires(REPAIR.wires), wrongWires: 0, repairBy: null, name: null, leader: null,
  });
  r.model = T.build(T.paint); scene.add(r.model.root);
  Game.robots.push(r);
  return r;
}

function nearestPlayer(r) {
  let best = null, bd = Infinity;
  for (const h of Game.humans) { const d = Math.hypot(h.mech.pos.x - r.pos.x, h.mech.pos.z - r.pos.z); if (d < bd) { bd = d; best = h.mech; } }
  return best;
}

// The Charger's brain. It thinks at 20 Hz and only writes input fields:
// stalk (close in, or back off for a run-up) -> windup (stop, paw, glare)
// -> charge (boost straight at you) -> recover (shake it off) -> stalk.
// Bend a heading error round trees and rocks in the next 10 m (closer than `dist`)
// (and round any extra `bodies`, e.g. a squadmate's leader: { x, z, r })
function avoid(r, err, dist, bodies = []) {
  const h = r.legHeading, fx = -Math.sin(h), fz = -Math.cos(h), rx = Math.cos(h), rz = -Math.sin(h);
  for (const o of bodies.length ? obstacles.concat(bodies) : obstacles) {
    const ox = o.x - r.pos.x, oz = o.z - r.pos.z, along = ox * fx + oz * fz, lat = ox * rx + oz * rz;
    if (along > 0 && along < 10 && along < dist && Math.abs(lat) < o.r + r.spec.radius + 1) err += lat > 0 ? 0.9 : -0.9;
  }
  return err;
}

function chargerAI(r, dt) {
  const ai = r.ai, inp = r.input, S = r.spec, tgt = nearestPlayer(r);
  inp.boost = false;
  if (!tgt) { inp.throttle = inp.turn = 0; return; }
  const dx = tgt.pos.x - r.pos.x, dz = tgt.pos.z - r.pos.z, dist = Math.hypot(dx, dz);
  const want = Math.atan2(-dx, -dz);
  let err = wrapAngle(want - r.legHeading);
  ai.t -= dt;
  // steer round trees and rocks ahead (not during a charge: it commits)
  if (ai.mode !== 'charge') err = avoid(r, err, dist);
  if (ai.mode === 'stalk') {
    inp.throttle = dist < 12 ? -0.7 : Math.abs(err) < 1 ? 1 : 0.3;
    if (ai.t <= 0 && dist > 10 && dist < 28 && Math.abs(err) < 0.2) { ai.mode = 'windup'; ai.t = 0.75; const k = loud(r.pos); if (k > 0) Sfx.snort(k); }
  } else if (ai.mode === 'windup') {
    inp.throttle = 0;
    if (ai.t <= 0) { ai.mode = 'charge'; ai.t = 2.2; }
  } else if (ai.mode === 'charge') {
    inp.throttle = 1; inp.boost = true;
    err = clamp(err, -0.3, 0.3);                       // it barely homes once it's going
    if (ai.t <= 0) { ai.mode = 'recover'; ai.t = 1.2; }
  } else if (ai.mode === 'recover') {
    inp.throttle = 0;
    if (ai.t <= 0) { ai.mode = 'stalk'; ai.t = 0.8; }
  }
  inp.turn = clamp(-err * 2.5, -1, 1);                 // positive turn swings the heading down
  inp.aimYaw = r.legHeading;
}

function powerDown(r) {
  r.state = 'down'; r.downT = ROBOT.downTime; r.downs++; r.ai.mode = 'off';
  r.input.throttle = r.input.turn = 0; r.input.boost = false;
  Sparks.burst(r.pos.x, r.pos.y + 3, r.pos.z, 40, SPARK_HOT, 10);
  const k = loud(r.pos); if (k > 0) Sfx.powerDown(k);
}
function reboot(r) {
  r.wires.link.fill(-1);
  r.state = 'glitched'; r.health = Math.round(r.maxHealth * ROBOT.rebootHealth); r.reboots++;
  r.ai.mode = 'recover'; r.ai.t = 1.2; r.flickT = 0;
  Sparks.burst(r.pos.x, r.pos.y + 3, r.pos.z, 30, SPARK_ZAP, 8);
  const k = loud(r.pos); if (k > 0) Sfx.reboot(k);
}

// ===========================================================================
// Fix it or take the parts. A downed robot nearby shows a prompt: 🔧 opens
// the Quick Fix (drag each wire to the port of the same colour and shape),
// 🔩 takes it apart. A fixed robot gets a name, glows steady and joins the
// squad. Players, the prompt's buttons and __rb.choose / __rb.wire all go
// through chooseFor / connectWire.
// ===========================================================================
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// plugs[i] and ports[j] are indexes into WIRE_COLORS; link[i] is the port plug i is in (-1 = loose)
function makeWires(n) {
  const plugs = shuffle(WIRE_COLORS.map((_, i) => i)).slice(0, n);
  let ports = shuffle(plugs.slice());
  for (let t = 0; t < 10 && ports.every((c, i) => c === plugs[i]); t++) ports = shuffle(ports);   // never straight across
  return { plugs, ports, link: plugs.map(() => -1) };
}
function randomName() {
  const used = new Set(Game.robots.map((r) => r.name));
  const free = ROBOT_NAMES.filter((n) => !used.has(n));
  return (free.length ? free : ROBOT_NAMES)[Math.floor(Math.random() * (free.length || ROBOT_NAMES.length))];
}
const flatDist = (a, b) => Math.hypot(a.pos.x - b.pos.x, a.pos.z - b.pos.z);
// The downed robot player h is close enough to deal with (nearest first)
function promptRobot(h) {
  let best = null, bd = REPAIR.promptRange;
  for (const r of Game.robots) { if (r.state !== 'down' || r.repairBy) continue; const d = flatDist(r, h.mech); if (d < bd) { bd = d; best = r; } }
  return best;
}
// choice: 'fix' opens the Quick Fix, 'parts' takes the robot apart.
// name: what to call it once fixed; leave it out and a random one is filled in
// (and the player is offered the chance to type their own).
function chooseFor(h, r, choice, name) {
  if (!h || !r) return { ok: false, why: 'no robot' };
  if (r.state !== 'down') return { ok: false, why: 'not down' };
  if (flatDist(r, h.mech) > REPAIR.promptRange) return { ok: false, why: 'too far' };
  if (r.repairBy && r.repairBy !== h) return { ok: false, why: 'busy' };
  if (choice === 'parts') { takeParts(h, r); return { ok: true }; }
  if (choice !== 'fix') return { ok: false, why: 'fix or parts' };
  if (Game.squad.length >= REPAIR.squadMax) return { ok: false, why: 'squad full' };
  if (h.repair && h.repair.r !== r) cancelRepair(h);
  const typed = typeof name === 'string' && name.trim() !== '';
  h.repair = { r, name: typed ? name.trim().slice(0, 12) : randomName(), askName: !typed };
  r.repairBy = h; r.wires.link.fill(-1);
  if (h.idx === 0) FixUI.openWires(r);
  return { ok: true };
}
function cancelRepair(h) {
  const rp = h.repair; if (!rp) return;
  rp.r.repairBy = null; h.repair = null;
  if (h.idx === 0 && FixUI.mode === 'wires') FixUI.close();
}
// One wire: plug index -> port index. A wire in the wrong colour buzzes, sparks
// and springs back out; the robot stays down. The last right wire fixes it.
function connectWire(h, r, plug, port) {
  const W = r.wires;
  if (!h.repair || h.repair.r !== r) return 'not fixing';
  if (!(plug >= 0 && plug < W.plugs.length && port >= 0 && port < W.ports.length)) return 'no such wire';
  if (W.link[plug] >= 0 || W.link.includes(port)) return 'taken';
  if (W.plugs[plug] !== W.ports[port]) {
    r.wrongWires++;
    Sparks.burst(r.pos.x, r.pos.y + 3, r.pos.z, 12, SPARK_ZAP, 5);
    if (!Game.manual) Sfx.buzz();
    return 'wrong';
  }
  W.link[plug] = port;
  Sparks.burst(r.pos.x, r.pos.y + 3.2, r.pos.z, 6, SPARK_ZAP, 3);
  if (!Game.manual) Sfx.plug();
  if (W.link.every((p) => p >= 0)) fixRobot(h, r);
  return 'ok';
}
function fixRobot(h, r) {
  const rp = h.repair; h.repair = null; r.repairBy = null;
  r.state = 'ally'; r.health = r.maxHealth; r.leader = h;
  r.ai = { think: 0, mode: 'follow', slot: Game.squad.length };
  r.input.throttle = r.input.turn = 0; r.input.boost = false; r.input.attack = false;
  r.glowMode = 'steady'; r.glow = ALLY.glow; r.model.glow.emissive.set(ALLY.color);
  setRobotName(r, rp.name);
  Game.squad.push(r);
  Sparks.burst(r.pos.x, r.pos.y + 3.5, r.pos.z, 50, SPARK_ZAP, 9);
  if (!Game.manual) Sfx.fixed();
  if (h.idx === 0) { if (rp.askName) FixUI.openName(r); else FixUI.close(); }
}
function setRobotName(r, name) {
  r.name = name;
  const md = r.model;
  if (!md.label) {
    md.label = new THREE.Sprite(new THREE.SpriteMaterial({ depthWrite: false, toneMapped: false, transparent: true }));
    md.label.scale.set(5, 1.25, 1); md.label.position.y = 6.2; md.label.renderOrder = 7; md.root.add(md.label);
  }
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const g = c.getContext('2d');
  g.font = '900 72px "Titan One", "Asap", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = 16; g.strokeStyle = '#14182a'; g.strokeText(name, 256, 66);
  g.fillStyle = ALLY.color; g.fillText(name, 256, 66);
  md.label.material.map?.dispose(); md.label.material.map = new THREE.CanvasTexture(c); md.label.material.map.colorSpace = THREE.SRGBColorSpace; md.label.material.needsUpdate = true;
}
function takeParts(h, r) {
  if (r.repairBy) cancelRepair(r.repairBy);
  Game.parts += ROBOT_TYPES[r.type].parts;
  Game.robots.splice(Game.robots.indexOf(r), 1);
  scene.remove(r.model.root);
  const md = r.model; md.glow.dispose(); md.armour.dispose(); md.label?.material.map?.dispose();   // its own materials; shared ones stay cached
  Sparks.burst(r.pos.x, r.pos.y + 2.5, r.pos.z, 45, SPARK_HOT, 8);
  if (!Game.manual) Sfx.salvage();
}
// A squadmate's brain: the same 20 Hz think and the same input fields as a
// glitched robot, but it walks to its slot beside and behind its leader.
function allyAI(r, dt) {
  const inp = r.input, lead = r.leader?.mech || Game.humans[0]?.mech;
  inp.boost = false; inp.attack = false;
  if (!lead) { inp.throttle = inp.turn = 0; return; }
  const [sx, sb] = SQUAD_SLOTS[r.ai.slot % SQUAD_SLOTS.length], h = lead.legHeading;
  const fx = -Math.sin(h), fz = -Math.cos(h), rx = Math.cos(h), rz = -Math.sin(h);
  const tx = lead.pos.x + rx * sx - fx * sb, tz = lead.pos.z + rz * sx - fz * sb;
  const dx = tx - r.pos.x, dz = tz - r.pos.z, dist = Math.hypot(dx, dz);
  let err;
  if (dist < 1.5) { inp.throttle = 0; err = wrapAngle(h - r.legHeading); r.ai.mode = 'idle'; }   // in its slot: face the way the leader faces
  else {
    // walk round the leader and the other squadmates, not through them
    const bodies = [{ x: lead.pos.x, z: lead.pos.z, r: MECH.radius + 1.5 }, ...Game.squad.filter((q) => q !== r).map((q) => ({ x: q.pos.x, z: q.pos.z, r: q.spec.radius + 0.5 }))];
    err = avoid(r, wrapAngle(Math.atan2(-dx, -dz) - r.legHeading), dist, bodies);
    inp.throttle = Math.abs(err) > 1.3 ? 0.2 : clamp(dist / 6, 0.25, 1);
    inp.boost = dist > 14 && Math.abs(err) < 0.4;                        // sprint to catch up
    // nose to nose with the leader: back off instead of shoving the mech
    const lx = lead.pos.x - r.pos.x, lz = lead.pos.z - r.pos.z, ld = Math.hypot(lx, lz) || 1;
    if (ld < MECH.radius + r.spec.radius + 2.5 && (-lx * Math.sin(r.legHeading) - lz * Math.cos(r.legHeading)) / ld > 0.3) { inp.throttle = -0.6; inp.boost = false; }
    r.ai.mode = 'follow';
  }
  inp.turn = clamp(-err * 2.5, -1, 1);
  inp.aimYaw = r.legHeading;
}

// Glow is gameplay, so it's simulated (and testable), not just drawn.
// Glitched: jumps between near-dark and far past the bloom threshold, faster
// when winding up or charging. Down: dark, then blinks as the reboot nears.
function robotGlow(r, dt) {
  if (r.state === 'glitched') {
    r.glowMode = 'flicker';
    r.flickT -= dt;
    if (r.flickT <= 0) {
      const hot = r.ai.mode === 'windup' || r.ai.mode === 'charge', u = Math.random();
      r.flickT = hot ? 0.03 + Math.random() * 0.05 : 0.04 + Math.random() * 0.14;
      r.glow = u < 0.3 ? 0.04 : u < 0.42 ? 0.6 : hot ? 6 + Math.random() * 2 : 2.8 + Math.random() * 2.4;
    }
  } else if (r.state === 'ally') { r.glowMode = 'steady'; r.glow = ALLY.glow; }
  else if (r.downT > ROBOT.warnTime || r.repairBy) { r.glowMode = 'off'; r.glow = 0.03; }
  else { r.glowMode = 'blink'; const hz = 1.5 + (ROBOT.warnTime - r.downT) * 1.5; r.glow = Math.sin(r.t * hz * Math.PI * 2) > 0.3 ? 3.5 : 0.03; }
}

function robotTick(r, dt) {
  r.t += dt;
  if (r.state === 'down') {
    r.input.throttle = r.input.turn = 0; r.input.boost = false;
    if (!r.repairBy) r.downT -= dt;          // the clock holds while someone is fixing it
    if (r.downT <= 0) reboot(r);
  }
  mechTick(r, dt);
  robotGlow(r, dt);
  // sparks: a glitched robot spits them often, a downed one now and then
  r.sparkT -= dt;
  if (r.sparkT <= 0) {
    const g = r.state === 'glitched', h = r.legHeading;
    r.sparkT = g ? 0.2 + Math.random() * 0.7 : 0.8 + Math.random() * 1.6;
    const lx = (Math.random() - 0.5) * 3, lz = (Math.random() - 0.5) * 4, y = r.pos.y + 2 + Math.random() * 1.6;
    Sparks.burst(r.pos.x + lx * Math.cos(h) + lz * Math.sin(h), y, r.pos.z - lx * Math.sin(h) + lz * Math.cos(h), g ? 4 + Math.floor(Math.random() * 6) : 2, g && Math.random() < 0.5 ? SPARK_ZAP : SPARK_HOT, g ? 6 : 3);
    const k = loud(r.pos); if (g && k > 0) Sfx.zap(k);
  }
  r.hitFlash = Math.max(0, r.hitFlash - dt * 6);
}

// A charging robot that reaches a mech rams it. Checked before the bodies are
// pushed apart, with a reach past that separation distance.
function rams() {
  for (const r of Game.robots) {
    if (r.state !== 'glitched' || r.ai.mode !== 'charge' || r.speed < 5) continue;
    for (const h of Game.humans) {
      const m = h.mech, dx = m.pos.x - r.pos.x, dz = m.pos.z - r.pos.z, d = Math.hypot(dx, dz) || 1;
      if (d > MECH.radius + r.spec.radius + 0.6) continue;
      const k = clamp(r.speed / r.spec.boostSpeed, 0, 1);
      hurtMech(m, Math.round(10 + 10 * k));
      m.push.x += dx / d * 7 * k; m.push.z += dz / d * 7 * k;
      r.push.x -= dx / d * 8; r.push.z -= dz / d * 8; r.speed = 0;     // it bounces off
      r.ai.mode = 'recover'; r.ai.t = 1.6;
      Sparks.burst(r.pos.x + dx / d * 2.5, r.pos.y + 2.2, r.pos.z + dz / d * 2.5, 30, SPARK_HOT, 9);
      if (!Game.manual) Sfx.ram();
      break;
    }
  }
}
// Keep bodies apart: a light robot gives way to a heavy mech
function separate() {
  const bodies = [...Game.mechs.map((m) => [m, MECH.radius, 0.2]), ...Game.robots.map((r) => [r, r.spec.radius, 0.8])];
  for (let a = 0; a < bodies.length; a++) for (let b = a + 1; b < bodies.length; b++) {
    const [A, ra, wa] = bodies[a], [B, rb, wb] = bodies[b];
    const dx = B.pos.x - A.pos.x, dz = B.pos.z - A.pos.z, d = Math.hypot(dx, dz) || 1e-3, min = ra + rb;
    if (d >= min) continue;
    const o = min - d, sa = wa / (wa + wb), sb = wb / (wa + wb);
    A.pos.x -= dx / d * o * sa; A.pos.z -= dz / d * o * sa; B.pos.x += dx / d * o * sb; B.pos.z += dz / d * o * sb;
    A.pos.y = groundH(A.pos.x, A.pos.z); B.pos.y = groundH(B.pos.x, B.pos.z);
  }
}

function syncRobotModel(r, dt) {
  const md = r.model, S = r.spec;
  const jit = r.state === 'glitched' && r.glow > 5 ? 0.08 : 0;   // it jolts when the glitch spikes
  md.root.position.set(r.pos.x + (Math.random() - 0.5) * jit, r.pos.y, r.pos.z + (Math.random() - 0.5) * jit);
  md.root.rotation.y = r.legHeading;
  const k = clamp(Math.abs(r.speed) / S.topSpeed, 0, 1);
  for (const L of md.legs) L.hip.rotation.x = Math.sin(r.phase + L.ph) * 0.55 * k;
  const mode = r.state === 'down' ? (r.repairBy ? 'repair' : 'down') : r.ai.mode;
  if (mode === 'windup') md.legs[0].hip.rotation.x = Math.sin(r.t * 16) * 0.6;   // paws the ground
  const pose = mode === 'windup' ? [-0.35, 0.12, 0] : mode === 'charge' ? [-0.15, 0.1, 0] : mode === 'down' || mode === 'repair' ? [-0.9, 0.18, 0.32] : [0, 0, 0];
  md.body.position.y = damp(md.body.position.y, pose[0], 8, dt);
  md.body.rotation.x = damp(md.body.rotation.x, pose[1], 8, dt);
  md.body.rotation.z = damp(md.body.rotation.z, pose[2], 4, dt);

  const f = r.health / r.maxHealth, up = r.state !== 'down';
  md.back.visible = up; md.fill.visible = up && f > 0;
