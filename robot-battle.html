<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Battle</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Asap:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #ff8a1f; --yellow: #ffd83d; --cyan: #3ff0ff; --ink: #14182a; --green: #3ee07a; --white: #fff;
  }
  * { box-sizing: border-box; }
  /* I1: an icon from the sprite (icon()): sized by the font, like the emoji it replaces. It sits 0.15em below the baseline;
     its margins (0.15em over, 0.16em under, the margin box 0.31em under the baseline) give the line the height an emoji
     glyph gave it (1em up, 0.31em down), so swapping an emoji for an icon moves nothing */
  .ic { width: 1em; height: 1em; margin: 0.15em 0 0.16em; vertical-align: -0.31em; pointer-events: none; flex: none; overflow: visible; color: #fff; }
  /* #85: the UI symbols (✔ ✖ ▶ ...) fill with .ic's color: white, but ink on a light button or key cap (white, cyan, green,
     yellow, orange) and the icon sheet's light panel, where white read only as its outline. ⌫'s cross-out is cut in the
     button's own colour */
  :is(.pbtn:is(.keep, .step, .go), #go, #nextB, #nextB small, .entry .pad :is(.ok, .del), #pickOk, #nameOk, .lcard .lon, .ucard .ukey, #iconSheet .light .isz) > .ic { color: var(--ink); }
  .entry .pad .del > .ic { --ic-cut: var(--yellow); }
  /* __rb.iconSheet(): every icon at 16, 24 and 48 px, on the dark HUD, a light panel, and (parts) their own colour */
  #iconSheet { position: fixed; inset: 0; overflow: auto; z-index: 1000; background: #0b0e18; }
  #iconSheet .ish { display: flex; flex-wrap: wrap; gap: 6px 4px; padding: 10px 12px; }
  #iconSheet .ish h3 { width: 100%; margin: 2px 0 4px; font: 800 16px 'Asap', sans-serif; }
  #iconSheet .dark { background: #1b2034; color: #fff; }
  #iconSheet .light { background: #eef1f7; color: var(--ink); }
  #iconSheet .isc { width: 118px; display: flex; flex-direction: column; align-items: center; }
  #iconSheet .isz { display: flex; align-items: center; gap: 6px; height: 52px; }
  #iconSheet .isz.own { width: 64px; height: 64px; justify-content: center; border-radius: 50%; border: 4px solid var(--ink); }
  #iconSheet .s16 { font-size: 16px; } #iconSheet .s24 { font-size: 24px; } #iconSheet .s48 { font-size: 48px; }
  #iconSheet small { font: 700 11px 'Asap', sans-serif; opacity: .8; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fc8ff; font-family: 'Asap', system-ui, sans-serif; user-select: none; -webkit-user-select: none; color: #fff; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .screen { position: fixed; inset: 0; display: none; pointer-events: none; }
  .screen.on { display: block; }
  .screen.on button { pointer-events: auto; }
  .rb-title {
    font-family: 'Titan One', 'Asap', sans-serif; color: #fff; letter-spacing: .5px;
    text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink),
                 2px 2px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 0 6px 0 var(--ink);
  }
  /* ---------- START OVERLAY ---------- */
  #start { background: radial-gradient(ellipse at center, rgba(20,24,42,.25), rgba(20,24,42,.7)); }
  #start .wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
  #start .logo { font-size: 64px; line-height: 1; transform: rotate(-3deg); }
  #start .logo span { color: var(--orange); }
  #go { margin-top: 26px; width: 150px; height: 150px; border-radius: 50%; border: 6px solid var(--ink); background: var(--orange); box-shadow: 0 10px 0 var(--ink), 0 0 40px rgba(255,138,31,.6); font-size: 64px; color: #fff; cursor: pointer; transition: transform .1s; }
  #go:hover { transform: scale(1.06); }
  #go:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--ink); }
  .keys { margin-top: 28px; display: flex; gap: 26px; justify-content: center; align-items: center; }
  .keyset { display: grid; grid-template-columns: repeat(3, 40px); gap: 5px; }
  .key { width: 40px; height: 40px; border-radius: 9px; background: rgba(255,255,255,.92); color: var(--ink); font-weight: 900; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .key.e { visibility: hidden; }
  .hint { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 30px; }
  .hint small { font-size: 26px; }
  /* ---------- HUD ---------- */
  #hud .speed { position: absolute; left: 22px; bottom: 22px; display: flex; align-items: flex-end; gap: 5px; padding: 12px 14px; border-radius: 18px; background: rgba(20,24,42,.6); }
  #hud .speed .ico { font-size: 30px; margin-right: 6px; }
  #hud .speed i { display: block; width: 14px; border-radius: 4px; background: rgba(255,255,255,.18); }
  #hud .speed i.on { background: var(--orange); box-shadow: 0 0 10px var(--orange); }
  #hud .speed i.on.max { background: var(--yellow); box-shadow: 0 0 12px var(--yellow); }
  #hud .compass { position: absolute; right: 22px; bottom: 22px; width: 120px; height: 120px; border-radius: 50%; background: rgba(20,24,42,.6); border: 4px solid rgba(255,255,255,.25); }
  #hud .compass .arm { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #hud .compass .arm b { position: absolute; left: -14px; top: -52px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  #hud .compass .arm::before { content: ''; position: absolute; left: -3px; top: -28px; width: 6px; height: 28px; border-radius: 3px; }
  #hud .compass .legs::before { background: var(--orange); }
  #hud .compass .torso::before { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  #hud .compass .hub { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); }
  #hud .reticle { position: absolute; left: 50%; top: 42%; width: 34px; height: 34px; margin: -17px; border: 3px solid var(--cyan); border-radius: 50%; box-shadow: 0 0 10px var(--cyan); opacity: .85; }
  #hud .reticle::after { content: ''; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; background: var(--cyan); border-radius: 50%; }
  #hud .health { position: absolute; left: 22px; top: 22px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 18px; background: rgba(20,24,42,.6); }
  #hud .health .ico { font-size: 30px; }
  #hud .health .bar { width: 220px; height: 22px; border-radius: 11px; background: rgba(255,255,255,.18); overflow: hidden; }
  #hud .health .bar b { display: block; height: 100%; width: 100%; border-radius: 11px; background: var(--green); box-shadow: 0 0 10px var(--green); transition: width .15s; }
  #hud .weapons { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 12px; }
  #hud .wpn { position: relative; width: 66px; height: 66px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; background: rgba(20,24,42,.6); border: 4px solid rgba(255,255,255,.25); }
  #hud .wpn.on { border-color: var(--orange); background: rgba(255,138,31,.35); box-shadow: 0 0 16px var(--orange); transform: scale(1.12); }
  #hud .wpn small { position: absolute; right: -4px; bottom: -4px; width: 24px; height: 24px; border-radius: 7px; background: #fff; color: var(--ink); font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,40,60,0) 45%, rgba(255,40,60,.75)); }
  .key.wide { width: 110px; }
  /* ---------- SQUAD + PARTS ---------- */
  /* the top-right group never reaches left past the health panel (❤️ bar 🔧 ⤴️, ending ~496 px in): when the squad chips
     and the counters don't fit on one row beside it, the counters (🔩 🔍 🎒) stay on top and the chips wrap below them (#39) */
  #hud .right { position: absolute; right: 22px; top: 22px; left: 512px; display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; gap: 8px 10px; align-items: center; }
  #hud .counts { display: flex; gap: 10px; align-items: center; }
  #hud .squad { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  #hud .parts { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 18px; background: rgba(20,24,42,.6); font-size: 30px; font-weight: 900; }
  #hud .mate { display: flex; align-items: center; gap: 6px; white-space: nowrap; padding: 8px 12px; border-radius: 18px; background: rgba(20,24,42,.6); border: 3px solid var(--cyan); box-shadow: 0 0 10px rgba(63,240,255,.5); font-size: 18px; font-weight: 800; }
  #hud .mate b { font-size: 26px; }
  #hud .mate { position: relative; }   /* #59: its energy bar along the bottom edge; dark while it's powered down */
  #hud .mate .mhp { position: absolute; left: 14px; right: 14px; bottom: 3px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
  #hud .mate .mhp b { display: block; height: 100%; width: 100%; border-radius: 3px; background: var(--green); font-size: 0; }
  #hud .mate.down { opacity: .7; background: rgba(10,12,20,.8); filter: grayscale(.6); }
  #hud .bagb { position: relative; width: 62px; height: 62px; border-radius: 50%; border: 4px solid var(--ink); background: var(--yellow); font-size: 32px; cursor: pointer; box-shadow: 0 5px 0 var(--ink); }
  #hud .bagb small, .panel .ok small { position: absolute; right: -6px; bottom: -6px; width: 26px; height: 26px; border-radius: 7px; background: #fff; color: var(--ink); font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  /* ---------- PROMPT beside a downed robot: Fix or Take parts ---------- */
  #hud .prompt { position: absolute; display: none; gap: 12px; transform: translateY(-50%); }
  #hud .prompt.on { display: flex; }
  #hud .prompt button { position: relative; width: 78px; height: 78px; border-radius: 50%; font-size: 40px; border: 5px solid var(--ink); cursor: pointer; box-shadow: 0 6px 0 var(--ink); }
  #hud .prompt .pfix { background: var(--green); }
  #hud .prompt .pparts { background: var(--orange); }
  #hud .prompt button.off { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
  #hud .prompt small { position: absolute; right: -6px; bottom: -6px; width: 26px; height: 26px; border-radius: 7px; background: #fff; color: var(--ink); font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  /* ---------- QUICK FIX: drag each wire to the port of the same colour ---------- */
  .panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: auto; padding: 16px 22px 22px; border-radius: 26px; background: rgba(20,24,42,.88); border: 5px solid var(--cyan); box-shadow: 0 0 30px rgba(63,240,255,.45); }
  .panel .top { display: flex; justify-content: space-between; align-items: center; font-size: 40px; margin-bottom: 8px; }
  .panel .x { width: 52px; height: 52px; border-radius: 50%; border: 4px solid var(--ink); background: #ff4d5e; color: #fff; font-size: 26px; font-weight: 900; cursor: pointer; }
  .board { position: relative; display: flex; justify-content: space-between; width: min(520px, 86vw); gap: 120px; padding: 6px 0; touch-action: none; }
  #wireSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .board .col { display: flex; flex-direction: column; gap: 22px; }
  .plug, .port { width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .plug { cursor: grab; border: 5px solid var(--ink); box-shadow: 0 5px 0 var(--ink); }
  .plug.sel { outline: 5px solid #fff; outline-offset: 3px; }
  .plug.done { cursor: default; }
  .port { background: #0b0e1a; border: 7px solid; box-shadow: inset 0 0 0 4px #0b0e1a, inset 0 0 14px rgba(0,0,0,.9); }
  .port.done { box-shadow: inset 0 0 0 4px #0b0e1a, 0 0 18px currentColor; }
  .plug svg:not(.ic), .port svg:not(.ic) { width: 44px; height: 44px; }   /* (I3: a cable's shape, not an icon in a badge) */
  .board.bad { animation: shake .3s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  /* ---------- NAME the fixed robot (a random name is already filled in) ---------- */
  #namer .row { display: flex; align-items: center; gap: 12px; }
  #namer .big { font-size: 56px; }
  #nameIn { width: 230px; height: 64px; border-radius: 16px; border: 4px solid var(--cyan); background: #0b0e1a; color: #fff; font: 800 30px 'Asap', sans-serif; text-align: center; }
  #namer button { width: 64px; height: 64px; border-radius: 50%; border: 4px solid var(--ink); font-size: 32px; cursor: pointer; box-shadow: 0 5px 0 var(--ink); }
  #nameDice { background: var(--yellow); }
  #nameOk { background: var(--green); }
  /* ---------- CHOOSE PARTS: tap up to two parts, ✔ takes them, the rest is scrapped ---------- */
  #picker .panel, #bag .panel { border-color: var(--orange); box-shadow: 0 0 30px rgba(255,138,31,.45); }
  .slots { display: flex; justify-content: center; gap: 14px; margin-bottom: 14px; }
  .slot { width: 70px; height: 70px; border-radius: 50%; border: 5px dashed rgba(255,255,255,.45); display: flex; align-items: center; justify-content: center; font-size: 36px; }
  .slot.full { border-style: solid; border-color: #fff; }
  .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: min(560px, 86vw); }
  .tile { position: relative; width: 88px; height: 88px; border-radius: 50%; border: 5px solid var(--ink); box-shadow: 0 6px 0 var(--ink); font-size: 44px; cursor: pointer; padding: 0; transition: transform .1s, filter .1s; }
  .tile.on { outline: 6px solid #fff; outline-offset: 3px; transform: scale(1.08); }
  .tile.on::after { content: ''; position: absolute; right: -10px; top: -10px; width: 30px; height: 30px; border-radius: 50%; background: var(--green) var(--ic-check) center / 20px no-repeat; border: 3px solid var(--ink); }   /* (I3: the check icon, was a ✔ glyph) */
  .tile.dim { filter: grayscale(.8) brightness(.55); }
  .tile.cur { box-shadow: 0 6px 0 var(--ink), 0 0 0 5px var(--yellow), 0 0 24px var(--yellow); }
  .tiles.bad { animation: shake .3s; }
  .panel .foot { display: flex; justify-content: center; margin-top: 18px; }
  .panel .ok { position: relative; width: 78px; height: 78px; border-radius: 50%; border: 5px solid var(--ink); background: var(--green); font-size: 38px; cursor: pointer; box-shadow: 0 6px 0 var(--ink); }
  .panel .ok.off { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
  /* ---------- PARTS BAG: what's been collected, as icons with counts ---------- */
  .tile.have { cursor: default; }
  .tile .n { position: absolute; right: -12px; bottom: -8px; min-width: 38px; height: 32px; padding: 0 6px; border-radius: 16px; background: #fff; border: 3px solid var(--ink); color: var(--ink); font: 900 20px 'Asap', sans-serif; display: flex; align-items: center; justify-content: center; }
  .bagtotal { font-size: 30px; font-weight: 900; margin-left: 14px; }
  .empty { font-size: 64px; opacity: .35; text-align: center; padding: 10px 40px; }
  /* ---------- MEND: getting hearts back ---------- */
  #hud .health .mendb { position: relative; width: 50px; height: 50px; border-radius: 50%; border: 4px solid var(--ink); background: var(--green); font-size: 24px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); padding: 0; }
  #hud .health .mendb small { position: absolute; right: -7px; bottom: -7px; width: 22px; height: 22px; border-radius: 6px; background: #fff; color: var(--ink); font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  #hud .health .mendb.off { filter: grayscale(1) brightness(.6); }
  #hud .health .mendb.ready { animation: pulse 0.9s ease-in-out infinite; }
  /* G2: the spring legs' jump button, only once they're bought (a click or tap jumps, as C does) */
  #hud .health .jumpb { display: none; background: #9f7bff; }
  #hud .health .jumpb.on { display: block; }
  @media (max-width: 560px) { #hud .health:has(.jumpb.on) .bar { width: 150px; } }   /* a phone: room for ⤴️ beside 🔧 */
  #hud .health .jumpb.air { filter: brightness(.7); }
  @keyframes pulse { 0%,100% { box-shadow: 0 4px 0 var(--ink), 0 0 0 0 rgba(62,224,122,.9); } 50% { box-shadow: 0 4px 0 var(--ink), 0 0 0 9px rgba(62,224,122,0); } }
  #hud .health .bar { transition: box-shadow .2s; }
  #hud .health.heal .bar { box-shadow: 0 0 0 3px #fff, 0 0 22px var(--green); }
  #hud .health .pop { position: absolute; left: 70px; top: 6px; font: 900 30px 'Asap', sans-serif; color: var(--green); white-space: nowrap; pointer-events: none;
    text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink); animation: rise 1.3s ease-out forwards; }
  @keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-56px); opacity: 0; } }
  #mend .panel { border-color: var(--green); box-shadow: 0 0 30px rgba(62,224,122,.45); }
  .needs { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; }
  .need { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .need .area { font-size: 40px; line-height: 1; }
  .need .dmg { width: 88px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.18); overflow: hidden; }
  #mendTiles:has(.need.mate) { max-height: calc(100dvh - 150px); overflow-y: auto; padding: 10px 6px; }   /* #59: room for every squadmate's areas */
  .need.mate { position: relative; }   /* #59: a squadmate's area: its robot icon in its glow colour */
  .need.mate .who { position: absolute; left: -6px; top: -8px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: rgba(20,24,42,.85); border: 3px solid var(--cyan); }
  .need.mate .who svg, .need.mate .who img { width: 22px; height: 22px; }
  .need .dmg b { display: block; height: 100%; border-radius: 7px; background: #ff4d5e; box-shadow: 0 0 8px #ff4d5e; }
  .needs.bad { animation: shake .3s; }
  .tile .n.zero { background: #ff4d5e; color: #fff; }
  /* ---------- POWERED DOWN: the world goes grey, a ring fills to the reboot ---------- */
  #c { transition: filter .4s; }
  body.off #c { filter: grayscale(.85) brightness(.5); }
  #downOv { position: fixed; left: 50%; top: 40%; width: 180px; height: 180px; margin: -90px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 84px; pointer-events: none;
    --p: 0; background: conic-gradient(var(--cyan) calc(var(--p) * 1turn), rgba(20,24,42,.75) 0); box-shadow: 0 0 30px rgba(63,240,255,.5); }
  #downOv::before { content: ''; position: absolute; inset: 14px; border-radius: 50%; background: rgba(20,24,42,.92); }
  #downOv span { position: relative; }
  #downOv .mate { position: absolute; right: -12px; bottom: -6px; font-size: 48px; display: none; }
  #downOv.beam .mate { display: block; }
  body.off #downOv { display: flex; }
  /* ---------- WEAPONS: tap a slot to pick it; a locked one is grey with a 🔒 until a part unlocks it ---------- */
  #hud .wpn { cursor: pointer; padding: 0; color: #fff; font-family: inherit; }
  #hud .wpn.lock { filter: grayscale(1) brightness(.5); cursor: not-allowed; }
  #hud .wpn .lk { position: absolute; left: -6px; top: -8px; font-size: 22px; }
  #hud .wpn.new { animation: newWpn 0.7s ease-in-out 5; }
  @keyframes newWpn { 0%,100% { box-shadow: 0 0 0 0 rgba(255,95,162,.9); } 50% { box-shadow: 0 0 0 14px rgba(255,95,162,0); } }
  #hud .wpn .chg { position: absolute; inset: -9px; border-radius: 50%; pointer-events: none; --p: 0;
    background: conic-gradient(#ff5fa2 calc(var(--p) * 1turn), transparent 0); -webkit-mask: radial-gradient(circle, transparent 37px, #000 38px); mask: radial-gradient(circle, transparent 37px, #000 38px); }
  .tile .unl { position: absolute; left: -10px; top: -10px; width: 34px; height: 34px; border-radius: 50%; background: #14182a; border: 3px solid #ff5fa2; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  /* ---------- QUICK FIX faults: a burnt wire is charred; 🔌 from the bag swaps it, or ✂️ tap it clean ---------- */
  .panel .top .how { font-size: 30px; margin-left: 10px; opacity: .9; }
  .plug.burnt { background: #2a211c !important; border-color: #000; cursor: pointer; animation: smoke 1.2s ease-in-out infinite; }
  .plug.burnt svg:not(.ic) { filter: grayscale(1) brightness(.45); }
  .plug .fixb { position: absolute; right: -12px; top: -12px; min-width: 40px; height: 40px; padding: 0 4px; border-radius: 20px; background: #fff; border: 3px solid var(--ink); font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 1px; }
  .plug .fixb i { font: 900 16px 'Asap', sans-serif; font-style: normal; color: var(--ink); }
  .plug, .port { position: relative; }
  .plug.cur, .port.cur { outline: 5px dashed var(--yellow); outline-offset: 5px; }
  @keyframes smoke { 0%,100% { box-shadow: 0 5px 0 var(--ink), 0 0 6px 2px rgba(255,120,40,.35); } 50% { box-shadow: 0 5px 0 var(--ink), 0 0 16px 6px rgba(255,120,40,.6); } }
  /* ---------- SEND HOME: the squad is full; tap who goes home 🏠 ---------- */
  #home .panel { border-color: var(--yellow); box-shadow: 0 0 30px rgba(255,216,61,.45); }
  #home .top .new { display: flex; align-items: center; gap: 10px; }
  .tile.mate { background: var(--cyan); }
  .homeTile { display: flex; flex-direction: column; align-items: center; gap: 8px; font: 800 18px 'Asap', sans-serif; }
  /* G3: an upgraded squadmate shows its upgrades (⬆️ and pips) on its tile; the first tap on it warns (they're lost
     going home) and the tile turns red; a second tap sends it */
  .homeTile .hup { display: flex; align-items: center; gap: 3px; font-size: 16px; }

  /* ---------- MATH WIRING: each plug is a fact (7 × 8) in its wire's colour; each port only an answer (56), no colour or shape,

  .board.math { width: min(560px, calc(100vw - 84px)); gap: 40px; }

  .board.math .plug svg:not(.ic) { width: 30px; height: 30px; flex: none; }

    text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px -2px 0 var(--ink); }

  /* the keypad for a typed plug: the fact, the answer box, and big keys sized for small fingers (the

  /* 🔥 Find the break: the loop 🔋 → 4 wire segments → ⚙️; dark until the break is spliced, then the current runs and the motor spins */
  .loop { width: min(420px, calc(100vw - 92px)); height: auto; touch-action: manipulation; }

  /* I2: the garage's icons take the room the emoji they replace took, so nothing moves. Measured in Chrome (Asap 900): an
     emoji in small text is bigger than its em (up to 3.5 px more, as wide and as high over the baseline, to 23 px), and
     stands .31em + 1 px under the baseline; from 24 px up it's 1em square, as .ic's own margins give. Where a line is 1em
     tall (line-height: 1, or a flex item) it took 1em of height, so there only the side margins stay. And an icon's

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ===========================================================================
// Tuning. Metres and seconds. The mech is heavy: it gathers speed slowly,
// tops out, and every footfall lands with a thud and a camera shake.
// ===========================================================================
const SIM_HZ = 60, DT = 1 / SIM_HZ, MAX_STEPS = 8;
const MECH = {
  topSpeed: 5.5,      // forward cap (m/s)
  backSpeed: 2.4,     // reverse cap
  accel: 1.9,         // m/s^2 speeding up
  brake: 3.4,         // m/s^2 slowing down
  legTurn: 0.95,      // rad/s the legs can turn
  torsoTurn: 2.4,     // rad/s the torso can swing to the aim
  stride: 3.2,        // metres per footfall
  radius: 2.3,
};
const WORLD_R = 115;
// G1 tougher mechs: 150 (was 100). Enemy damage is unchanged, so a full-speed Charger ram (20) takes
// 8 to power it down (was 5) and a Sniper round (12) 13 (was 9). Starting values, tuned at the playtest.
const MECH_HEALTH = 150;
// Weapons. The cannon fires bullets; punch and kick are melee swings that land
// at `strike` seconds in. Punch follows the torso, kick follows the legs.
// The cannon fires short bursts while fire is held: `burst` rounds `cool` apart,
// then a `rest`. That keeps the old 10 dmg / 0.16 s rate (62.5 a second).
const WEAPON = {
  gun:   { ic: 'gun', dmg: 10, cool: 0.075, burst: 3, rest: 0.33, speed: 280, range: 95, push: 0.8 },
  punch: { ic: 'punch', dmg: 22, cool: 0.55, strike: 0.16, dur: 0.5, reach: 3.4, arc: 0.85, push: 6 },
  kick:  { ic: 'boot', dmg: 34, cool: 0.9, strike: 0.32, dur: 0.85, reach: 3.2, arc: 0.7, push: 12 },
  // The electromagnetic pulse (a starting weapon, from the left-arm pod): a crackling ball that
  // does little damage but loads `shock` into a robot's electronics. At ROBOT.shockMax it shuts
  // down mostly intact. Shock drains at ROBOT.shockFade a second, so it takes hits close together.
  em:    { ic: 'em', dmg: 4, cool: 0.5, speed: 90, range: 55, push: 0.4, shock: 40 },
  // The rail gun (locked until a part that `unlocks: 'rail'` is taken): fire starts a `charge`,
  // then one long straight shot that passes through every robot along it (`range` metres, or
  // until it meets the ground, a rock or a tree), then `cool`.
  rail:  { ic: 'rail', dmg: 60, cool: 1.6, charge: 0.8, range: 140, push: 3, locked: true },
};
const WEAPONS = ['gun', 'punch', 'kick', 'em', 'rail'];
const AIM_ASSIST = 0.2;      // rad: the cannon locks onto a robot this close to the torso aim
// Robots' own attacks. They aren't player weapons (no slot, no __rb.fire), but they land
// through the same hitRobot / hurtMech paths and count in a robot's `hits` by key.
// dmg is what a glitched robot does to a player; allyDmg what a squadmate does to a robot.
const ROBOT_HITS = {
  snipe: { dmg: 12, allyDmg: 20, speed: 130, range: 100, push: 1.5 },   // a Sniper's round: slower than the cannon, so it can be dodged
  zap:   { dmg: 3, push: 0 },                                          // a drone diving in
  stomp: { dmg: 8, combo: 5, allyDmg: 18, push: 4 },                   // a Bouncer landing; each bounce before it adds `combo`
  ram:   { allyDmg: 20, push: 8 },                                     // G3: a squadmate Charger ramming a robot (ALLY_RAM)
};
const ROBOT = {
  downTime: 12,              // seconds a beaten robot stays powered down
  warnTime: 3,               // ...the last of which it blinks before rebooting
  rebootHealth: 0.5,         // fraction of health it comes back with
  alert: 10,                 // seconds a hit robot hunts its attacker, however far away
  shockMax: 100,             // electromagnetic shock that shuts a robot down
  shockFade: 20,             // shock drained a second
};
// Damage affects repair. Each robot remembers how it was beaten: the damage it took since it
// last booted, by weapon (r.harm). When it powers down that sets its faults:
//   wear  = sum of harm[w] * weight[w] / maxHealth  (an electromagnetic shutdown halves it: `em`)
//   wires = 1 + round(wear * 2), from 1 to 4      (plugs to connect in the Quick Fix)
//   burnt = 1 at wear >= burnt[0], 2 at >= burnt[1] (charred plugs: a 🔌 from the bag swaps one,
//           or `scrub` taps strip it clean, so a fix never needs a part)
// e.g. bullets 1.4 -> 4 wires + 1 burnt; a kick 1.6 -> 4 + 1; setup 1 -> 3 + 0 (as before faults);
// a punch 0.6 -> 2 + 0; a pure electromagnetic shutdown 0 -> 1 wire.
const FAULTS = {
  weight: { em: 0, punch: 0.6, setup: 1, gun: 1.4, snipe: 1.4, kick: 1.6, stomp: 1.6, rail: 2 },
  em: 0.5, burnt: [1.2, 1.8], scrub: 3,
};
// Fix it or take the parts. A downed robot within promptRange shows the choice.
// While a player has a robot's Quick Fix open its reboot clock holds (the world
// keeps running); walking past keepRange drops the repair and the clock runs again.
// Taking parts: the player picks up to takeMax of the robot's parts; the rest is scrapped.
const REPAIR = { wires: 3, promptRange: 11, keepRange: 16, squadMax: 3, takeMax: 2 };
// Every kind of part, by id. A robot type lists the ids it is built from
// (ROBOT_TYPES[type].parts); the same kind from two robot types stacks in the bag.
// `fixes` is what the part can mend on the player's own mech (read by self-repair,
// e.g. armour for hull damage). A type-only part can later carry `unlocks: '<weapon>'`.
const PARTS = {
  armour:  { icon: '🛡️', ic: 'armour', hex: '#8a5cff', fixes: 'hull' },     // armour plate
  battery: { icon: '🔋', ic: 'battery', hex: '#3ee07a', fixes: 'power' },
  motor:   { icon: '⚙️', ic: 'motor', hex: '#ff8a1f', fixes: 'legs' },     // leg motor
  wiring:  { icon: '🔌', ic: 'wiring', hex: '#56B4E9', fixes: 'wiring' },
  ram:     { icon: '🐏', ic: 'ram', hex: '#c9ced8', fixes: null },        // the Charger's ram
  scope:   { icon: '🔭', ic: 'scope', hex: '#ff5fa2', fixes: null, unlocks: 'rail' },   // the Sniper's scope; only a Sniper carries one
  rotor:   { icon: '🌀', ic: 'rotor', hex: '#ffd83d', fixes: null },        // a drone's rotor
  spring:  { icon: '➰', ic: 'spring', hex: '#9f7bff', fixes: null },        // the Bouncer's coil spring
};
// Getting hearts back. Damage lands in areas of the mech (AREAS); its health is
// always maxHealth minus the damage in every area, so every heal mends areas too
// (B2: except after a leg swap onto a smaller shape or, #68, a switch to a child with less energy, which can leave more damage than that: see applyUpgrades).
//  - parts: fast. One part mends up to `part` health in the area its `fixes` names.
//  - ally: slower. A squadmate within allyRange mends allyRate health a second while
//    no glitched robot is within safeRange (a powered-down mech is mended regardless).
//  - kit: fastest. Walking onto a kit mends `kit` health at once; it's used up.
//    `kits` lie tucked beside trees; a robot drops one the first time it's beaten.
const AREAS = ['hull', 'legs', 'power', 'wiring'];
const AREA_IC = { hull: 'torso', legs: 'legs', power: 'power', wiring: 'wire' };   // I1: each area's icon
// where each kind of hit lands: a Sniper's round on the hull, a drone's zap in the power and
// wiring (so 🔋 and 🔌 have something to mend), a Bouncer's stomp mostly in the legs
const HIT_AREAS = { hit: { hull: 1 }, ram: { hull: 0.5, legs: 0.5 }, snipe: { hull: 1 }, zap: { power: 0.5, wiring: 0.5 }, stomp: { hull: 0.4, legs: 0.6 } };
const HEAL = { part: 25, allyRate: 5, allyRange: 15, safeRange: 30, kit: 75, kitReach: 3.5, kits: 6 };
const HEAL_IC = { parts: 'wrench', ally: 'robot', kit: 'kit', reboot: 'wiring' };   // I1: each heal's icon (the HUD's +N pop)
// G2: mech upgrades, bought in the garage's 🦾 tab. Each costs UPGRADE.cost of its part per level, taken
// from the bag (the same bag self-repair spends), and each shows on the mech. id = the part it costs.
//   armour  🛡️ +25 energy a level (150 → 250)          motor  ⚙️ +8% top speed a level
//   battery 🔋 weapons recharge 10% faster a level     wiring 🔌 self-repair mends 10 more a part, a level
//   spring  ➰ level 1 adds a jump, level 2 higher      ram    🐏 the kick does 25% more damage a level
// fx = what a level does, as an icon (shown on its card). Saved per child in rec.garage.upgrades.
const UPGRADES = [
  { id: 'armour', name: 'Armour plating', max: 4, fxIc: '{energy}+25', alias: ['armor', 'plating', 'energy'] },
  { id: 'motor', name: 'Leg motors', max: 3, fxIc: '{speed}+8%', alias: ['motors', 'legs', 'speed'] },
  { id: 'battery', name: 'Power cells', max: 3, fxIc: '{timer}+10%', alias: ['cells', 'power', 'recharge'] },
  { id: 'wiring', name: 'Wiring harness', max: 2, fxIc: '{wrench}+10', alias: ['harness', 'mend'] },
  { id: 'spring', name: 'Spring legs', max: 2, fxIc: '{jump}', alias: ['springs', 'jump'] },
  { id: 'ram', name: 'Ram plate', max: 2, fxIc: '{boot}+25%', alias: ['ramplate', 'kick'] },
];
// jump: how high each spring level jumps (m; level 0 can't); gravity pulls the mech back down (m/s²). #46: gravity was
// 22; lighter, the same heights hang longer, so a running jump carries the mech further (level 1 over a fence: #46)
const UPGRADE = { cost: 2, energy: 25, speed: 0.08, recharge: 0.1, mend: 10, kick: 0.25, jump: [0, 2.6, 4.2], gravity: 12 };
const upgradeOf = (n) => { const s = String(n ?? '').toLowerCase(); return UPGRADES.find((U) => U.id === s || U.alias.includes(s) || U.name.toLowerCase() === s || PARTS[U.id].icon === n) || null; };
// G4: advanced parts. Every 9 facts Mastered (of the 45) unlocks one that no robot drops (at = the milestone). They're
// latched per child in rec.garage.unlocks (ids, in this order): a fact slipping back from Mastered never takes one
// away, and a parent's reset keeps them (it keeps the garage). rec.garage.fresh = ones earned but not yet cheered in
// the garage. Guest earns none. What each does (ADV):
//   chrome ✨  energy: +25 energy past the armour cap, and a mirror finish
//   jets   🚀  jet: a second jump in mid-air (rising `jet` m from wherever it fires), with a flame burst (flame s)
//   fusion ⚡  recharge: weapons recharge 20% faster (added to the power cells' 10% a level), and the core glows
//   shield 🛡️  shield: a bubble that blocks the next 3 hits, back to 3 each wave
//   gold   👑  gold: the whole mech turns gold, and squadmates glow gold
// toast: how long the in-play toast stays (ms); cheer: how long the garage's cheer stays (ms)
const ADVANCED = [
  { id: 'chrome', icon: '✨', ic: 'sparkle', name: 'Chrome plating', at: 9, hex: '#dfe7f2', fxIc: '{energy}+25' },
  { id: 'jets', icon: '🚀', ic: 'rocket', name: 'Jump jets', at: 18, hex: '#ff6a2a', fxIc: '{jump}{jump}' },
  { id: 'fusion', icon: '⚡', ic: 'fusion', name: 'Fusion core', at: 27, hex: '#3ff0ff', fxIc: '{timer}+20%' },
  { id: 'shield', icon: '🛡️', ic: 'shield', name: 'Shield emitter', at: 36, hex: '#56B4E9', fxIc: '{bubble}×3' },
  { id: 'gold', icon: '👑', ic: 'crown', name: 'Gold plating', at: 45, hex: '#ffc21a', fxIc: '{crown}' },
];
const ADV = { energy: 25, jet: 2.6, flame: 0.6, recharge: 0.2, shield: 3, gold: '#ffc21a', goldTrim: '#ffe27a', goldFrame: '#b8860b', toast: 3500, cheer: 4500 };
const advOf = (n) => { const s = String(n ?? '').toLowerCase(); return ADVANCED.find((A) => A.id === s || A.icon === n || A.name.toLowerCase() === s) || null; };
// B2 body shop: leg shapes, swapped in the garage's 🦿 tab (free, instant). Each unlocked when the trophy wall's lifetime count
// of its part reached `need` (#89: now each is built instead, BUILDS; part / need stay for the one-time latch), and changes the mech's stats by these multipliers (or,

  // parent view and the garage (#31) read this. Never writes; null for nobody.
  mastery(c) {
    const C = c == null ? this.child : childOf(c), rec = C && this.peek(C); if (!rec) return null;
    const g = this.goal(rec); let m = 0;

  },
  // a fact's typical time (ms): the median of its last FACT.keepTimes answer times, counting only the right

  typical(e) {

    const h = e.hist.slice(-e.ms.length), right = e.ms.filter((_, i) => h[i] === 1);
    const t = (right.length ? right : e.ms).slice().sort((x, y) => x - y), n = t.length;
    return Math.round(n % 2 ? t[(n - 1) / 2] : (t[n / 2 - 1] + t[n / 2]) / 2);
  },
  // the 9×9 grid of stages: rows[a-1][b-1] is a × b's stage (b × a is the same fact, so the grid is symmetric)
  grid(rec = this.rec) {
    const O = OPS['×'], rows = [];
    for (let a = O.lo; a <= O.hi; a++) { const row = []; for (let b = O.lo; b <= O.hi; b++) row.push(rec.facts[makeFact('×', a, b).key]?.s ?? 'new'); rows.push(row); }

  },

  // the n slowest facts answered so far, slowest first, by typical time (a tie: the less often right first)
  slowest(rec = this.rec, n = 10) {
    return Object.entries(rec.facts).filter(([, e]) => e.n > 0).map(([key, e]) => ({ key, a: e.a, b: e.b, s: e.s, ms: this.typical(e), n: e.n, right: e.right }))

  // #48: a fix's time (ms, board open to reboot) goes in today's list; days older than FIXTIME.days go
  addFix(ms) {

  fixDays(rec = this.rec, n = FIXTIME.days) { return this.days(rec, n).map(({ date }) => { const a = rec?.fixMs?.[date] || []; return { date, n: a.length, median: median(a) }; }); },
  // time answering on each of the last n days, oldest first, ending today (the tracker's clock): { date, ms, wd }
  days(rec = this.rec, n = 14) {
    const out = [], d0 = new Date(this.now()); d0.setHours(12, 0, 0, 0);
    for (let i = n - 1; i >= 0; i--) { const d = new Date(d0); d.setDate(d0.getDate() - i); const k = this.date(d.getTime()); out.push({ date: k, ms: rec.practice?.[k] || 0, wd: d.getDay() }); }

  // a parent resets child c: their record starts again from blank (the Quick Fix setting is kept: it's a
  // setting, not progress; so is the garage: trophies and upgrades earned stay earned). Only that child's
  // record is touched; Guest has none.
  reset(c) {
    const C = childOf(c); if (!C || C.guest) return { ok: false, why: C ? 'guest keeps nothing' : 'no such child' };
    const was = this.peek(C), r = this.blank(C); r.wiring = was.wiring; r.garage = was.garage;

  },
  // a parent opens steps early, up to step n (M4's "open next step" button); never closes one
  openStep(n) {
    if (!this.rec) return { ok: false, why: 'nobody playing' };
    n = Math.round(Number(n));
    if (!(n >= 1 && n <= this.steps.length)) return { ok: false, why: 'no such step', steps: this.steps.length };
    while (this.rec.step < n) { this.rec.step++; this.rec.opened.push({ step: this.rec.step, at: this.now(), by: 'parent' }); }

  setWiring(mode) {
    if (!this.rec || !['math', 'colour'].includes(mode)) return false;

  },
  // move a fact down a stage (a miss, or a Mastered fact answered too slowly): it keeps the fast days that
  // stage starts with (Learning 1, Known 2), and today no longer counts, so it climbs back on a later day
  demote(e, today) {

  // record an answer: value given for fact f in ms milliseconds
  answer(f, value, ms) {

    const right = value !== '' && value != null && Number(value) === f.answer, fast = right && ms < FACT.fast;
    // Orion's quick check: the first answer to a fact in a 'check' step sorts it at once
    const check = e.n === 0 && this.curStep.kind === 'check' && stepFacts(this.curStep).some((q) => q.key === f.key);
    e.n++; e.last = now;

    e.hist.push(right ? 1 : 0); if (e.hist.length > FACT.keepHist) e.hist.shift();

    const review = (step) => { e.box = clamp(e.box + step, 0, FACT.reviewDays.length - 1); e.due = now + FACT.reviewDays[e.box] * DAY_MS; };
    if (right) {

        if (fast) { e.s = 'known'; e.box = 0; e.due = now + FACT.reviewDays[0] * DAY_MS; } else e.s = 'learning';

        for (;;) {

    const cheer = [], ch = (this.rec.cheered ||= {});

  },
  // The next fact to ask. opts.exclude: facts already on the board (keys or { op, a, b }); opts.ops: only
  // these ops (what the asking UI can show). A missed fact whose couple of minutes are up comes first;
  // then about 3 in 4 are familiar (Learning, Known, Mastered; due reviews first, then weighted toward
  // the shakier stages), the rest New, from at most FACT.newMax in play. During a check step familiar
  // facts are asked only when a review is due, so a child isn't drilled on what he just showed he knows.
  next(opts = {}) {

    const ex = new Set((opts.exclude || []).map((x) => factOf(x)?.key));
    const ops = opts.ops ? new Set([].concat(opts.ops).map((o) => OP_ALIAS[o])) : null;
    const ok = (k) => !ex.has(k) && (!ops || ops.has(open.get(k).op));

    // 1. a miss coming back
    const back = keys.filter((k) => F[k]?.miss && F[k].due <= now).sort((x, y) => F[x].due - F[y].due);
    if (back.length) return out(back[0], 'miss');
    // 2. top up the New facts in play: from a step a parent opened early first (the newest such step), so
    // "open next step" brings its facts in straight away; then from the earliest open step
    R.inPlay = R.inPlay.filter((k) => open.has(k) && this.stage(k) === 'new');
    if (R.inPlay.length < FACT.newMax) {

      const order = [...new Set([...early, ...this.steps.slice(0, R.step).map((_, i) => i + 1)])];
      for (const st of order.map((i) => this.steps[i - 1])) {

      const seen = [...open.keys()].filter((k) => this.stage(k) === 'new' && !R.inPlay.includes(k));

    }
    const fresh = R.inPlay.filter((k) => ok(k) && !waiting(k));
    const fam = keys.filter((k) => this.stage(k) !== 'new' && !waiting(k));
    const due = fam.filter((k) => F[k].due > 0 && F[k].due <= now && ['known', 'mastered'].includes(F[k].s)).sort((x, y) => F[x].due - F[y].due);

    // 'warm' (waves 1–2): a familiar fact, Known or Mastered first, then Learning, fastest typical time first (not the
    // one just asked, while there's another); with nothing familiar, a New fact. During a check step it asks as
    // today, so it never re-drills what the child just sorted. 'stretch' (asked for one wire a board, from wave 5): the
    // slowest Learning or Known fact by typical time, or else a New fact from the newest open step. 'mix': today's pick.
    const typ = (k) => this.typical(F[k]) ?? Infinity;
    if (opts.band === 'warm' && this.curStep.kind !== 'check') {
      const l = fam.length > 1 ? fam.filter((k) => k !== R.last) : fam, fast = (x, y) => typ(x) - typ(y);
      const pick = l.filter((k) => ['known', 'mastered'].includes(F[k].s)).sort(fast)[0] ?? l.filter((k) => F[k].s === 'learning').sort(fast)[0];
      if (pick) return out(pick, 'warm');
      if (fresh.length) return out(pickR(fresh), 'new');
    }
    if (opts.band === 'stretch') {
      const slow = fam.filter((k) => ['learning', 'known'].includes(F[k].s)).sort((x, y) => typ(y) - typ(x));
      if (slow.length) return out(slow[0], 'stretch');
      const top = stepFacts(this.steps[R.step - 1]).map((f) => f.key).filter((k) => ok(k) && this.stage(k) === 'new' && !waiting(k));
      const pick = top.find((k) => R.inPlay.includes(k)) ?? (top.length ? top[Math.floor(this.rand() * top.length)] : null);
      if (pick) { if (!R.inPlay.includes(pick) && R.inPlay.length < FACT.newMax) R.inPlay.push(pick); return out(pick, 'stretch'); }
    }
    // maintenance (the ladder is done): reviews when they're due, then whatever isn't Known yet, and
    // only if nothing else is left the Known / Mastered fact whose review is nearest
    if (this.maintaining) {
      if (due.length) return out(due[0], 'review');
      const shaky = [...fresh, ...fam.filter((k) => F[k].s === 'learning')];
      if (shaky.length) return out(pickR(shaky), 'practice');
      const soon = fam.filter((k) => k !== R.last || fam.length === 1).sort((x, y) => (F[x].due || Infinity) - (F[y].due || Infinity));

  },
  // counts for the HUD / tests: stages of the open facts, the step's progress
  summary() {
    if (!this.rec) return null;

      child: this.child.id, guest: !!this.child.guest, wiring: this.rec.wiring, step: this.rec.step, steps: this.steps.length, maintaining: this.maintaining,
      ladder: this.steps.map((s, i) => ({ step: i + 1, op: s.op, tables: s.tables ?? null, range: [...s.range], kind: s.kind ?? null, facts: stepFacts(s).length, open: i < this.rec.step })),

      current: { kind: st.kind ?? null, facts: fs.length, known: fs.filter((f) => ['known', 'mastered'].includes(this.stage(f.key))).length, answered: fs.filter((f) => this.rec.facts[f.key]?.n > 0).length },
      now: this.now(), day: this.day(), today: this.rec.practice[this.date()] || 0,
    };
  },
};

// ===========================================================================
// Storage D1 (#69): back up and restore. Backup is plain data and rules: no DOM, and it reads no live game state
// (everything comes in as arguments), so D4's import into the server can use validate / merge / plan as they are.
// Only Backup.apply writes to storage, and only after a choice: the parent view's ✔ Restore, or __rb.restore with one.
// A backup file: { app: 'robot-battle', format: 1, exported: ISO time, device: a short label, data: { key: value } }.
// data holds every robotbattle.* key in storage (the key without the prefix, the value parsed). On main today that's
// facts.<child> (each child's record: the fact tracker, the garage with its trophies, upgrades, paint, unlocks and body)
// and the settings child (who played last) and pilot (the last pilot). The squad, the bag and the meadow aren't saved
// by the game, so they aren't in a backup. Guest is never in one: facts.guest is dropped, and so is child = 'guest'.
// ===========================================================================
// rise: the counts (Backup.count) that only ever go up with play, so a restore that lowers one says so. (Known and
// Learning aren't among them: a fact moving on to Mastered leaves them.)
const BACKUP = { app: 'robot-battle', format: 1, prefix: 'robotbattle.', maxBytes: 5e6, choices: ['device', 'backup', 'best'],
  rise: ['mastered', 'answered', 'step', 'parts', 'upgrades', 'unlocks', 'shapes', 'minutes'] };
// keys that would reach an object's prototype rather than be its own (a hand-edited file could carry one)
const ownKeys = (o) => (o && typeof o === 'object' ? Object.keys(o).filter((k) => k !== '__proto__' && k !== 'constructor' && k !== 'prototype') : []);
const isObj = (o) => !!o && typeof o === 'object' && !Array.isArray(o);
const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
// the same value, whatever order its keys are in
const canon = (v) => (Array.isArray(v) ? '[' + v.map(canon).join(',') + ']' : isObj(v) ? '{' + Object.keys(v).sort().map((k) => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}' : JSON.stringify(v) ?? 'null');
const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
const Backup = {
  // the child a facts.<id> key belongs to (Guest included, so the caller can drop it); null for any other key
  kidOf(key) { const m = /^facts\.(.+)$/.exec(key); return m ? CHILDREN.find((C) => C.id === m[1]) || { id: m[1], unknown: true } : null; },
  // a key Guest owns: its record, or the who-played-last setting when that was Guest
  guestKey(key, v) { return this.kidOf(key)?.guest || (key === 'child' && !!childOf(v)?.guest); },
  // the export object from a storage snapshot ({ key without the prefix: raw string }). A value that won't parse is left
  // out (the game reads it as nothing too). meta: { exported, device }
  make(raw, meta = {}) {
    const data = {};
    for (const k of ownKeys(raw).sort()) {
      let v; try { v = JSON.parse(raw[k]); } catch (e) { continue; }
      if (this.guestKey(k, v)) continue;
      data[k] = v;
    }
    return { app: BACKUP.app, format: BACKUP.format, exported: meta.exported ?? null, device: meta.device ?? null, data };
  },
  // why child C's record r can't be restored (null: it can). Deeper than Facts.valid: every fact entry has a stage, and
  // the parts the merge reads are the shape it expects. A fact key the game doesn't ask (say a ×12 from some older
  // version) is kept and carried along, as the game itself keeps it; only a key that would reach the prototype is refused.
  checkRec(r, C) {
    if (!isObj(r)) return `${C.name}'s record is empty`;
    if (r.v !== 1) return `${C.name}'s record is a version this game doesn't know (v ${r.v})`;
    if (!Facts.valid(r, C)) return `${C.name}'s record is damaged`;
    for (const k of Object.keys(r.facts)) {
      const e = r.facts[k];
      if (!ownKeys({ [k]: 1 }).length) return `${C.name}'s record has a damaged fact (${k})`;
      if (!isObj(e) || !STAGES.includes(e.s)) return `${C.name}'s record has a damaged fact (${String(k).slice(0, 20)})`;
      for (const a of ['ms', 'hist', 'days']) if (e[a] != null && !Array.isArray(e[a])) return `${C.name}'s record has a damaged fact (${k})`;
      for (const n of ['n', 'right', 'last', 'due']) if (e[n] != null && !Number.isFinite(e[n])) return `${C.name}'s record has a damaged fact (${k})`;
    }
    if (!r.inPlay.every((k) => typeof k === 'string')) return `${C.name}'s record is damaged`;
    if (r.opened != null && !Array.isArray(r.opened)) return `${C.name}'s record is damaged`;
    for (const f of ['practice', 'cheered', 'hints', 'fixMs', 'puzzles', 'garage']) if (r[f] != null && !isObj(r[f])) return `${C.name}'s record is damaged`;
    const g = r.garage;
    if (g) {
      for (const f of ['trophies', 'upgrades', 'body']) if (g[f] != null && !isObj(g[f])) return `${C.name}'s garage is damaged`;
      for (const f of ['unlocks', 'fresh']) if (g[f] != null && !Array.isArray(g[f])) return `${C.name}'s garage is damaged`;
      if (g.paint != null && !isObj(g.paint)) return `${C.name}'s garage is damaged`;
      for (const k of ownKeys(g.trophies)) if (!isObj(g.trophies[k]) || !Number.isFinite(g.trophies[k].n ?? 0)) return `${C.name}'s garage is damaged`;

  // check a backup (the file's text, or the object) before anything is written: { ok, why, kids: { id: record },
  // settings: { child, pilot }, skipped: [keys this game doesn't restore], meta: { exported, device } }. Any problem refuses
  // the whole file: a record that can't be read is never half-restored.
  validate(input) {
    const no = (why) => ({ ok: false, why });
    let obj = input;
    if (typeof input === 'string') {
      if (input.length > BACKUP.maxBytes) return no("it's far too big to be a Robot Battle backup");
      try { obj = JSON.parse(input); } catch (e) { return no("it isn't a backup file (it can't be read)"); }
    }
    if (!isObj(obj)) return no("it isn't a backup file");
    if (obj.app !== BACKUP.app) return no("it isn't a Robot Battle backup");
    if (!Number.isInteger(obj.format) || obj.format < 1) return no("it doesn't say which backup format it is");
    if (obj.format > BACKUP.format) return no(`a newer version of the game made it (format ${obj.format}); this game reads format ${BACKUP.format}`);
    if (!isObj(obj.data)) return no('it has no progress in it');
    const kids = {}, settings = {}, skipped = [];

      if (K) { const why = this.checkRec(v, K); if (why) return no(why); kids[K.id] = v; }

  },
  // "keep the best" of two records of one child: dev (this device's) and bak (the backup's), both passing checkRec.
  // Never lowers anything either side has. Pure: a new record; neither input is changed. merge(r, r) is r.
  //   facts     every fact either has. On both: the stronger stage wins (a tie: the later answered); its entry comes whole
  //             (its stage, streak, fast days, review box and due date belong together), then last answered = the later,
  //             answers n = the more, and right = the right count of the entry with more answers (so right ≤ n)
  //   step      the higher; opened = every step's opening, the earliest of each
  //   inPlay    this device's New facts in play, then the backup's, at most FACT.newMax (more if the device already has more)
  //   practice  each day's minutes: the more (never added: a backup restored twice mustn't count twice)
  //   fixMs     each day's fix times: the longer list
  //   cheered, hints  every one either has, the earliest time
  //   puzzles   the one further along (higher seq), whole
  //   created   the earlier; v, child, ladder, wiring, last: this device's (wiring is a setting, not progress)
  //   garage    trophies: each part's count and each source's count, the more; upgrades: each level, the higher;
  //             unlocks and body.unlocked: everything either has; fresh: an unlock still waits for its cheer only if
  //             every side that has it hasn't cheered it yet; paint and the equipped shapes: this device's (the backup's
  //             if this device has none)
  //   anything else (a field a later slice adds): this device's, the backup's where this device has none
  merge(dev, bak) {
    const out = clone(dev), b = clone(bak);
    for (const k of ownKeys(b)) if (out[k] === undefined) out[k] = b[k];
    // facts
    // (this device's record passed only Facts.valid, as the game loads it: an odd part of it is kept or outvoted, never thrown)
    const rank = (e) => STAGES.indexOf(e.s), F = {}, arr = (a) => (Array.isArray(a) ? a : []);
    for (const k of new Set([...ownKeys(dev.facts), ...ownKeys(bak.facts)])) {

      if (!isObj(x) || !isObj(y)) { F[k] = clone(isObj(y) && !isObj(x) ? y : x ?? y); continue; }
      const win = rank(y) > rank(x) || (rank(y) === rank(x) && num(y.last) > num(x.last)) ? y : x, e = clone(win);
      if (x.last != null || y.last != null) e.last = Math.max(num(x.last), num(y.last));

      if (x.n != null || y.n != null) { e.n = num(more.n); e.right = num(more.right); }

    const steps = LADDERS[out.ladder].length;

    for (const f of ['cheered', 'hints']) if (dev[f] || bak[f]) out[f] = byKey(dev[f], bak[f], (p, q) => Math.min(num(p), num(q)));
    if (dev.puzzles || bak.puzzles) out.puzzles = clone(num(bak.puzzles?.seq) > num(dev.puzzles?.seq) ? bak.puzzles : dev.puzzles);

    g.fresh = g.unlocks.filter((id) => (!und.includes(id) || arr(gd.fresh).includes(id)) && (!unb.includes(id) || arr(gb.fresh).includes(id)));

      g.body = clone(isObj(gd.body) ? gd.body : gb.body);

    // the summary should show them now), waiting for their cheer

  },
  // what a record holds, for the summary (straight from the record: nothing is loaded or saved)
  count(r) {
    if (!r) return null;
    const goal = Facts.goal(r), st = Object.fromEntries(STAGES.map((s) => [s, 0]));
    goal.forEach((k) => st[r.facts[k]?.s ?? 'new']++);
    const g = r.garage || {};

      mastered: st.mastered, known: st.known, learning: st.learning, goal: goal.size, answered: ownKeys(r.facts).filter((k) => num(r.facts[k]?.n) > 0).length,
      step: r.step, unlocks: Array.isArray(g.unlocks) ? g.unlocks.length : 0, shapes: Array.isArray(g.body?.unlocked) ? g.body.unlocked.length : 0,
      parts: ownKeys(g.trophies).reduce((t, k) => t + num(g.trophies[k]?.n), 0), upgrades: ownKeys(g.upgrades).reduce((t, k) => t + num(g.upgrades[k]), 0),

  },
  // a choice per child: 'device' (keep this device's), 'backup' (use the backup's) or 'best' (keep the best). choices is
  // one of those for everyone, or { childId: choice }; a child left out gets 'best'
  choiceFor(choices, id) { const c = typeof choices === 'string' ? choices : isObj(choices) ? choices[id] : null; return BACKUP.choices.includes(c) ? c : c == null ? 'best' : null; },
  // the writes a restore would make, and a summary per child. v = validate()'s result; dev = this device's
  // { kids: { id: record or null }, settings: { child, pilot } }. Pure: nothing is written. A setting is only filled
  // in where this device has none (it's this device's choice, not progress). Only what changes is written.
  plan(v, choices, dev) {

    const writes = [], kids = [];

      const res = !bak || choice === 'device' ? here : choice === 'backup' || !here ? bak : this.merge(here, bak);

    }
    for (const k of ['child', 'pilot']) if (v.settings[k] != null && dev.settings[k] == null) writes.push({ key: k, value: v.settings[k] });

  // ---- the parts that touch the browser (D4 has its own) ----
  // every robotbattle.* key in storage, raw: { key without the prefix: string }
  raw() {
    const out = {};
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k?.startsWith(BACKUP.prefix)) out[k.slice(BACKUP.prefix.length)] = localStorage.getItem(k); } } catch (e) {}

  },
  // this device's side of a restore: each child's saved record (null only if there's none, or the game itself wouldn't
  // load it: a record the game plays from every day is never treated as missing)
  device() {

    for (const C of CHILDREN.filter((q) => !q.guest)) { const r = store.get('facts.' + C.id, null); kids[C.id] = Facts.valid(r, C) ? r : null; }
    return { kids, settings: { child: store.get('child', null), pilot: store.get('pilot', null) } };
  },
  // a short name for this device and browser, for the file
  deviceName() {

      : /CrOS/.test(ua) ? 'Chromebook' : /Mac/.test(ua) ? 'Mac' : /Win/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : 'device';
    const br = /Edg\//.test(ua) ? 'Edge' : /Firefox\/|FxiOS/.test(ua) ? 'Firefox' : /Chrome\/|CriOS/.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'browser';
    return dev + ' · ' + br;
  },
  // the backup of this device, now (whoever is playing saved first)
  now() { Facts.save(); return this.make(this.raw(), { exported: new Date().toISOString(), device: this.deviceName() }); },
  // the file's name: robot-battle-backup-<today's date>.json (the real date, not the tracker's test clock)
  fileName() { return `robot-battle-backup-${Facts.date(Date.now())}.json`; },
  // write every change, or none: each key's old value is kept first, and if any write fails (storage full or blocked)
  // the ones already made are put back. Then each is read back to be sure.
  apply(writes) {
    const old = [];
    try {
      for (const w of writes) { const k = BACKUP.prefix + w.key; old.push([k, localStorage.getItem(k)]); localStorage.setItem(k, JSON.stringify(w.value)); }
      for (const w of writes) if (localStorage.getItem(BACKUP.prefix + w.key) !== JSON.stringify(w.value)) throw new Error('read back differs');
    } catch (e) {
      try { for (const [k, v] of old.reverse()) { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } } catch (e2) {}

  // check, plan and (with a choice) write a restore: __rb.restore and the parent view's ✔ both come here. choices left
  // out = a preview: the summary, and nothing is written. Whoever is playing is reloaded from what was written.
  restore(input, choices, write = choices != null) {

    if (!v.ok) return { ok: false, why: v.why, summary: null };

    const p = this.plan(v, choices, this.device());
    if (!p.ok) return { ok: false, why: p.why, summary: null };
    if (!write) return { ok: true, preview: true, summary: p.summary };
    const res = this.apply(p.writes);
    if (!res.ok) return { ok: false, why: res.why, summary: p.summary };
    const C = Facts.child;
    if (C && !C.guest && p.writes.some((w) => w.key === 'facts.' + C.id)) { Facts.load(C); applyUpgrades({ swap: true }); }
    return { ok: true, summary: p.summary };
  },
};

// ===========================================================================
// Renderer + bloom (Neon Dash's UnrealBloomPass setup)
// ===========================================================================
const canvas = $('c');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#bfe3ff', 60, 210);
const composerRT = new THREE.WebGLRenderTarget(innerWidth * DPR, innerHeight * DPR, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, composerRT);
const renderPass = new RenderPass(scene, new THREE.PerspectiveCamera());
composer.addPass(renderPass);
// High threshold: only the emissive glow parts bloom, and they hold steady.
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.5, 0.86);
composer.addPass(bloom);
composer.addPass(new OutputPass());
function onResize() { renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight); }
addEventListener('resize', onResize);

const matCache = new Map();
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.2, ...opts }));
  return matCache.get(key);
}
const glowMat = (color, k = 2.6) => mat(color, { emissive: color, emissiveIntensity: k, roughness: 0.3 });

// ===========================================================================
// Props: everything in the meadow that can be smashed (trees, big rocks, fence
// sections). hit() wears one down; at 0 it breaks for good: its circles leave
// `obstacles`, a tree topples over (Props.tick, so it's simulated and testable),
// a rock crumbles to rubble, a fence's posts snap and its rails drop.
// ===========================================================================
const Props = {
  list: [], nextId: 1,
  add(kind, x, z, circles, look) {
    const p = { id: this.nextId++, kind, x, z, hp: PROP[kind].hp, maxHp: PROP[kind].hp, broken: false, by: null, hits: 0, obs: [], wob: 0, fall: null, ...look };
    for (const c of circles) { const o = { ...c, kind, prop: p }; p.obs.push(o); obstacles.push(o); }
    this.list.push(p);
    return p;
  },
  // p takes `dmg` from weapon w ('walk' = a mech leaning on it) travelling along (dx, dz).
  // Returns true if that broke it.
  hit(p, dmg, w, dx, dz) {
    if (!p || p.broken) return false;
    const d = dmg * (PROP.weapon[w] ?? 1); if (!(d > 0)) return false;
    p.hp = Math.max(0, p.hp - d); p.hits++; p.wob = Math.min(1, p.wob + (w === 'walk' ? 0.08 : 0.5));
    if (p.hp > 0) return false;
    this.smash(p, w, dx, dz);
    return true;
  },
  smash(p, w, dx, dz) {
    p.broken = true; p.by = w; p.hp = 0;
    for (const o of p.obs) { const i = obstacles.indexOf(o); if (i >= 0) obstacles.splice(i, 1); }
    const L = Math.hypot(dx, dz) || 1, ux = dx / L, uz = dz / L, y = groundH(p.x, p.z), at = new V3(p.x, y + 1.2, p.z), k = loud(at);
    if (p.kind === 'tree') {
      // it tips over away from whatever hit it
      p.fall = { t: 0, axis: new V3(uz, 0, -ux), landed: false };
      Impacts.chip(new V3(p.x, y + 1.1 * p.s, p.z), 14, ['#7a5232', '#a07444', '#c9a273'], 7, -ux, -uz, 0.16);
      Impacts.chip(new V3(p.x, y + 4.5 * p.s, p.z), 18, ['#2f8f3a', '#3fa548', '#4db84f'], 5, ux, uz, 0.2);
      if (k > 0) Sfx.crack(k);
    } else if (p.kind === 'rock') {
      // the rock crumbles into a ring of rubble that a mech walks over
      p.root.visible = false;
      const g = new THREE.Group(), m = mat(p.col, { roughness: 0.95, metalness: 0, flatShading: true });
      Props.rubble = Props.rubble || new THREE.DodecahedronGeometry(1, 0);
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * Math.PI * 2 + Math.random() * 0.6, d = p.s * (0.35 + Math.random() * 0.6), s = p.s * (0.22 + Math.random() * 0.18);
        const c = new THREE.Mesh(Props.rubble, m); c.scale.set(s, s * 0.6, s); c.rotation.set(Math.random() * 3, Math.random() * 3, 0);
        const cx = p.x + Math.cos(a) * d, cz = p.z + Math.sin(a) * d; c.position.set(cx, groundH(cx, cz) + s * 0.3, cz); c.castShadow = true; c.receiveShadow = true; g.add(c);
      }
      scene.add(g); p.debris = g;
      Impacts.chip(at, 22, ['#8a8f99', '#a3a39a', '#6c707a'], 8, -ux, -uz, 0.2); Impacts.puff(at, 6, 2.2);
      Sparks.spray(at.x, at.y, at.z, 10, SPARK_HOT, 7, -ux, -uz);
      if (k > 0) Sfx.crumble(k);
    } else {
      // the posts snap to splintered stubs and the rails drop flat into the grass
      for (const q of p.posts) { q.scale.y = 0.35; q.position.y = 0.3; q.rotation.set(Math.random() * 0.5 - 0.25, q.rotation.y, Math.random() * 0.5 - 0.25); }
      p.rails.forEach((q, i) => { q.position.set((Math.random() - 0.5) * 0.8, 0.12 + i * 0.1, 0.6 + i * 0.9); q.rotation.set(Math.PI / 2 * 0.15, (Math.random() - 0.5) * 0.7, 0); });

      if (k > 0) Sfx.splinter(k);

  },
  // the simulated part: a toppling tree's fall, and the shake of a prop being hit
  tick(dt) {
    for (const p of this.list) {
      p.wob = Math.max(0, p.wob - dt * 3);
      const f = p.fall; if (!f || f.landed) continue;
      f.t += dt;
      if (f.t >= 1.1) {
        f.landed = true;
        const k = loud(p); if (k > 0) Sfx.thud(0.8 * k);
        const ax = f.axis, lx = p.x - ax.z * 5 * p.s, lz = p.z + ax.x * 5 * p.s;    // where the leaves land
        Impacts.puff(new V3(lx, groundH(lx, lz), lz), 6, 2.4);

      }

  },
  // the drawn part: the fall's angle (eases in, like falling) and the shake
  sync() {

// A player's mech leaning on props as it walks (from mechTick): damage by how fast it's pushing in
function pushProps(m, touched, dt) {
  const fx = -Math.sin(m.legHeading), fz = -Math.cos(m.legHeading);
  for (const [o, dx, dz, d] of touched) {
    const into = -(fx * m.speed * dx + fz * m.speed * dz) / d;     // speed toward the obstacle
    if (into < PROP.walkMin) continue;
    if (Props.hit(o.prop, PROP[o.kind].walk * into / MECH.topSpeed * dt * (m.fx?.walkDamage ?? 1), 'walk', -dx, -dz)) m.human?.rig.kick(o.kind === 'fence' ? 0.4 : 0.8);
  }
}
// #46: a player's jump and a smashable its body is within walking reach of (from mechTick, once a tick per smashable,
// so both circles of a fence get the same answer). Heights are the mech's own: its feet are J.y above the ground
// under it (the soles sit at m.pos.y standing) and the jump tops out at its own peak, so other legs with other jumps
// follow the same rule. The object's top is its height above the ground under it. In the air what counts is the
// object's real footprint (footGap: a fence section's posts and rails, not its blocking circles) against the
// mech's centre; on the ground it's walking reach, as ever.
//   null    as walking into it: on the ground and not passed, or a jump whose peak can't get the feet over its top
//   'air'   in a jump that can clear it, not over it yet: no push and no damage, but not passed either. Landing still
//           inside its walking reach crushes it (mechTick)
//   'over'  passed whole: the feet were above its top over its footprint (kept in m.over until the mech is clear of
//           its walking reach), and in the air now
//   'held'  passed whole and on the ground now: never closer than before this tick's step, walking damage if pushing in
//   'stomp' the jump comes down into its footprint with the feet below its top: crushed
//   'bump'  the jump rises into its footprint with the feet below its top: held where it was and hit as walking
function jumpPass(m, J, gy, p) {

  const top = groundH(p.x, p.z) + p.obs[0].h, peak = J.v > 0 ? J.y + J.v * J.v / (2 * UPGRADE.gravity) : J.peak;
  if (gy + peak < top) return null;
  if (footGap(p, m.pos.x, m.pos.z) > 0) return passed ? 'over' : 'air';
  if (gy + J.y >= top) { (m.over ||= new Set()).add(p); return 'over'; }

}
// how far (x, z) is outside smashable p's real footprint (0 = over it): a fence section's box, else its circles
function footGap(p, x, z) {
  const F = p.foot;
  if (!F) return Math.min(...p.obs.map((o) => Math.hypot(x - o.x, z - o.z) - o.r));
  const dx = x - p.x, dz = z - p.z, a = Math.abs(dx * F.ux + dz * F.uz) - F.half, n = -dx * F.uz + dz * F.ux;
  return Math.hypot(Math.max(0, a), n < F.n0 ? F.n0 - n : n > F.n1 ? n - F.n1 : 0);
}

// ===========================================================================
// The mech, built from parts: legs, torso, arms, cockpit
// ===========================================================================
const PAINT = { armour: '#ff8a1f', trim: '#ffd83d', frame: '#2d3446', dark: '#1a1f2c', glow: '#3ff0ff' };

function capsule(r, len, color, opts) { const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 12), mat(color, opts)); m.castShadow = true; return m; }

// B2: the mech is built from designed pieces that plug together: a leg piece (LEG_KITS, by shape) hangs from the

// skirt) is the same on every shape, at the same height, so the torso, arms, camera, hit heights and the jump's

  const skirt = rbox(2.2, 0.5, 1.6, 0.22, paint.armour); skirt.position.set(0, -0.35, 0); pelvis.add(skirt);

  const legs = legSet.legs;

  const ringGlow = new THREE.Mesh(new THREE.TorusGeometry(1.08, 0.06, 8, 40), glowMat(paint.glow, 2)); ringGlow.rotation.x = Math.PI / 2; ringGlow.position.y = -0.4; torso.add(ringGlow);
  const hull = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 18), mat(paint.armour, { roughness: 0.45, metalness: 0.25 }));
  hull.scale.set(2.0, 1.25, 1.65); hull.position.y = 0.75; hull.castShadow = true; torso.add(hull);
  const chest = rbox(2.6, 1.3, 0.7, 0.3, paint.trim); chest.position.set(0, 0.35, -1.25); chest.rotation.x = -0.25; torso.add(chest);
  const back = rbox(2.8, 1.6, 1.1, 0.35, paint.frame, metal); back.position.set(0, 0.9, 1.15); torso.add(back);
  back.userData.core = 'back';   // B1: the back plate, stacks and vents are the core section (not the torso's)
  for (const s of [-1, 1]) {   // exhaust stacks
    const stack = cyl(0.22, 0.28, 1.6, paint.dark, metal, 12); stack.position.set(s * 0.8, 1.9, 1.45); stack.rotation.x = 0.15; torso.add(stack);
    const vent = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.05, 12), glowMat('#ff6a2a', 2.2)); vent.position.set(s * 0.8, 2.7, 1.57); torso.add(vent);
    stack.userData.core = 'stack'; vent.userData.core = 'vent';
  }

  const cowl = new THREE.Mesh(new THREE.SphereGeometry(0.95, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), mat(paint.frame, metal));
  cowl.scale.set(1.15, 0.8, 1.2); cowl.castShadow = true; cockpit.add(cowl);

  for (const s of [-1, 1]) {
    const shoulder = new THREE.Group(); shoulder.position.set(s * 2.25, 1.0, -0.1); torso.add(shoulder);
    const pod = ball(0.7, paint.dark, metal); shoulder.add(pod);
    const pauldron = new THREE.Mesh(new THREE.SphereGeometry(0.95, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(paint.armour));
    pauldron.scale.set(1.1, 0.75, 1.25); pauldron.position.set(s * 0.2, 0.2, 0); pauldron.castShadow = true; shoulder.add(pauldron);
    const arm = new THREE.Group(); arm.position.set(s * 0.35, -0.55, 0); shoulder.add(arm);
    const upper = capsule(0.32, 0.8, paint.frame, metal); upper.position.y = -0.4; arm.add(upper);
    const fore = new THREE.Group(); fore.position.y = -1.0; arm.add(fore);
    fore.add(ball(0.38, paint.dark, metal));
    if (s > 0) {
      const housing = rbox(0.9, 0.9, 2.2, 0.25, paint.armour); housing.position.z = -0.8; fore.add(housing);
      for (const bx of [-0.2, 0.2]) {

        const muzzle = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.04, 6, 16), glowMat(paint.glow, 2.4)); muzzle.position.set(bx, 0, -3.2); fore.add(muzzle);

      for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
        const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.06, 12), glowMat('#ffd83d', 1.8));
        tube.rotation.x = Math.PI / 2; tube.position.set(-0.24 + c * 0.48, -0.2 + r * 0.4, -1.66); fore.add(tube);

  // G4 finishes go by them (paint fills armour and trim, gold the frame and the dark parts too), so they fill any shape.
  const roleOf = { [paint.armour]: 'armour', [paint.trim]: 'trim', [paint.frame]: 'frame', [paint.dark]: 'dark' };

  md.legShape = kit; md.sockLegs = legs.filter((L) => L.sock); md.treads = legSet.treads || null;

// ---------------------------------------------------------------------------
// B2: the leg pieces. Each one builds its legs into the pelvis and moves them. A leg that carries the G2 pieces has
// `sock`, its named sockets, each { p: the group it's in, x, y, z } (plus: drum s = which way is out, the drum sits
// x + half its length that way; ram tip = the spikes' z; piston rx = its tilt; ry turns a plate, sc scales a piece):
//   drum ⚙️ the motor drum and its band     spring ➰ the coil      ram 🐏 the ram plate and spikes
//   plate 🛡️ the shin plates (armour 2+)     piston  B1's tier-4 exposed piston
// and armour / motor: the meshes 🛡️ and ⚙️ thicken; plateRef / limbRef: the ones G2's look reads back.

// bob, kick(md, e) the kick (e from -0.35 cocked, to 1 at the strike, back to 0), down(md, sl) the power-down pose (sl

const TRACK = { a: 1.75, r: 0.75, w: 1.0, pitch: 0.39, y: -3.33, blade: -2.55 };   // tracks: run half-length, end radius, width, link pitch, unit and blade at rest
const LEG_KITS = {

      for (const s of [-1, 1]) {

        const hipJoint = ball(0.62, paint.dark, metal); hip.add(hipJoint);
        const hipCap = cyl(0.7, 0.7, 0.35, paint.trim, metal, 18); hipCap.rotation.z = Math.PI / 2; hipCap.position.x = s * 0.45; hip.add(hipCap);

// tracks: one belt round two wheels, as a strip of quads: the bottom run (front to back), round the back, the top run, round
// the front. u counts tread links along it (so the link texture repeats), v goes across.
function beltGeo(a, R, w, pitch) {
  const pts = [], arc = (cz, t0, t1) => { for (let i = 1; i <= 12; i++) { const t = t0 + (t1 - t0) * i / 12; pts.push([R * Math.sin(t), cz + R * Math.cos(t), Math.sin(t), Math.cos(t)]); } };
  pts.push([-R, -a, -1, 0]); pts.push([-R, a, -1, 0]);
  arc(a, -Math.PI / 2, Math.PI / 2);
  pts.push([R, -a, 1, 0]);
  arc(-a, Math.PI / 2, Math.PI * 1.5);
  const pos = [], nor = [], uv = [], idx = []; let u = 0;
  pts.forEach(([y, z, ny, nz], i) => {
    if (i) u += Math.hypot(y - pts[i - 1][0], z - pts[i - 1][1]) / pitch;
    for (const x of [-w / 2, w / 2]) { pos.push(x, y, z); nor.push(0, ny, nz); uv.push(u, x < 0 ? 0 : 1); }
    if (i) { const b = (i - 1) * 2; idx.push(b, b + 2, b + 1, b + 1, b + 2, b + 3); }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);

}

// G3 paint. Paint goes through materials, not meshes: a mech owns one copy of each material its painted meshes
// use (md.paintMats[role]: source material → its copy), and paintMech sets the role's colour on those copies.
// A mesh joins a role by its userData.paint tag ('body' | 'trim'); adoptPaint gives every tagged mesh not yet
// adopted this mech's copy. So a section model swapped in later (new legs, a new torso) only has to tag its
// meshes and call adoptPaint(md), then paintMech(md, …): the paint follows, whatever the geometry. The cached

  // G4 jump jets: one more jump in mid-air, rising ADV.jet m from wherever it fires (the same jump goes on: its peak,
  // and what it has passed over, carry on), with a flame burst under the jets
  if (m.hop && m.adv?.jets && !m.hop.jet) {
    m.hop.v = Math.sqrt(2 * UPGRADE.gravity * ADV.jet); m.hop.jet = true; m.jetT = ADV.flame; m.jetJumps = (m.jetJumps || 0) + 1;
    Sparks.burst(m.pos.x, m.pos.y + 1.5, m.pos.z, 36, SPARK_HOT, 7);
    if (!Game.manual) { Sfx.noise(0.45, 0.22, 900, 0, 0.8); Sfx.tone(220, 0.35, 'sawtooth', 0.08, 660); }
    return { ok: true, level: lv, jet: true, height: r3(m.hop.y + ADV.jet) };
  }
  if (m.hop) return { ok: false, why: m.hop.jet ? 'jets used' : 'in the air' };
  const H = UPGRADE.jump[lv] * (m.fx?.jump ?? 1);   // (B2: × the leg shape's jump)
  m.hop = { y: 0, v: Math.sqrt(2 * UPGRADE.gravity * H), peak: 0 };
  if (!Game.manual) { Sfx.tone(160, 0.3, 'sine', 0.22, 520); Sfx.tone(320, 0.18, 'triangle', 0.08, 900, 0.03); }
  return { ok: true, level: lv, height: H };
}

// A pilot's helmet portrait: a helmet in their colour, their initial glowing on the visor and
// their emblem underneath. One canvas per pilot, used on the title screen, the HUD and the mech.
function pilotFace(P) {
  pilotFace.cache = pilotFace.cache || new Map();

  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#14182a'; g.beginPath(); g.arc(128, 128, 128, 0, Math.PI * 2); g.fill();
  const gr = g.createRadialGradient(96, 80, 10, 128, 128, 118); gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.18, P.hex); gr.addColorStop(1, P.hex);
  g.fillStyle = gr; g.beginPath(); g.arc(128, 128, 116, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(20,24,42,.28)'; g.fillRect(122, 14, 12, 70);                          // a crest down the helmet
  g.fillStyle = '#14182a'; g.beginPath(); g.roundRect(34, 86, 188, 92, 40); g.fill();        // the visor
  g.fillStyle = 'rgba(160,240,255,.22)'; g.beginPath(); g.roundRect(46, 94, 70, 20, 10); g.fill();
  g.font = '900 84px "Titan One", "Asap", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = P.hex; g.shadowBlur = 18; g.fillStyle = P.hex; g.fillText(P.name[0], 128, 136); g.shadowBlur = 0;

  const img = iconImage(P.emblemIc); c.emblem = { icon: P.emblemIc, drawn: iconLoaded(img) };

// Put pilot P in player h's mech: a helmeted pilot in the cockpit, the canopy and the turret ring
