  md.icon.visible = !!icon;
  if (icon) { md.icon.material.map = iconTex(icon); md.icon.position.y = 6.4 + Math.sin(r.t * 6) * 0.15; }
}

function cycleWeapon(h, d) {
  h.weapon = WEAPONS[(WEAPONS.indexOf(h.weapon) + d + WEAPONS.length) % WEAPONS.length];
  if (!Game.manual) Sfx.click();
}

function gatherInput(dt) {
  const solo = Game.humans.length === 1;
  for (const h of Game.humans) {
    const sc = SCHEMES[h.idx];
    const k = (n) => anyKey(sc[n]) || (solo && anyKey(SOLO_EXTRA[n]));
    const pad = readPad(h.idx);
    if (pad && pad.startP) setPause(!Game.paused);
    if (pad && pad.aP && Game.paused) startPlay();
    sc.wpn.forEach((code, w) => { if (keysPressed.has(code)) { h.weapon = WEAPONS[w]; if (!Game.manual) Sfx.click(); } });
    if (pad && (pad.lbP || pad.rbP)) cycleWeapon(h, pad.rbP ? 1 : -1);
    let turn = (k('right') ? 1 : 0) - (k('left') ? 1 : 0), thr = (k('up') ? 1 : 0) - (k('down') ? 1 : 0);
    if (pad) { turn += pad.lx; thr -= pad.ly; }
    h.ci.camX = (k('camR') ? 1 : 0) - (k('camL') ? 1 : 0) + (pad ? pad.rx : 0);
    h.ci.camY = pad ? -pad.ry : 0;
    h.rig.yaw = wrapAngle(h.rig.yaw - h.ci.camX * 1.8 * dt);
    h.rig.pitch = clamp(h.rig.pitch + h.ci.camY * 1.0 * dt, -0.35, 0.5);
    if (solo && mouse.locked) { h.rig.yaw = wrapAngle(h.rig.yaw - mouse.dx * 0.0025); h.rig.pitch = clamp(h.rig.pitch - mouse.dy * 0.002, -0.35, 0.5); }
    const m = h.mech; if (!m) continue;
    m.input.weapon = h.weapon;
    if (Game.paused) { m.input.throttle = m.input.turn = 0; m.input.attack = false; continue; }
    m.input.throttle = clamp(thr, -1, 1); m.input.turn = clamp(turn, -1, 1);
    m.input.attack = k('fire') || (solo && mouse.locked && mouse.down) || !!(pad && pad.rt);
    m.input.aimYaw = h.rig.yaw; m.input.aimPitch = h.rig.pitch;
    // the prompt beside a downed robot: 🔧 fix or 🔩 take parts
    const pr = !h.repair && promptRobot(h);
    if (pr) {
      if (sc.fix.some((c) => keysPressed.has(c)) || (pad && pad.xP)) chooseFor(h, pr, 'fix');
      else if (sc.parts.some((c) => keysPressed.has(c)) || (pad && pad.yP)) chooseFor(h, pr, 'parts');
    }
  }
  mouse.dx = mouse.dy = 0;
  keysPressed.clear();
}

function tick(dt) {
  if (Game.state !== 'play' || Game.paused) return;
  Game.ticks++;
  Meadow.time.value += dt;
  // Robots think at 20 Hz (Family Knockout's bot loop), writing their input.
  // Glitched ones run their type's brain; squadmates run allyAI.
  for (const r of Game.robots) {
    if (r.state === 'down') continue;
    r.ai.think -= dt; if (r.ai.think <= 0) { r.ai.think = 0.05; (r.state === 'ally' ? allyAI : ROBOT_TYPES[r.type].ai)(r, 0.05); }
  }
  // a repair holds only while the player stays by the robot
  for (const h of Game.humans) { const rp = h.repair; if (rp && (rp.r.state !== 'down' || flatDist(rp.r, h.mech) > REPAIR.keepRange)) cancelRepair(h); }
  for (const m of Game.mechs) { mechTick(m, dt); combatTick(m, dt); }
  for (const r of Game.robots) robotTick(r, dt);
  Bullets.tick(dt);
  rams();
  separate();
  Sparks.tick(dt);
  Game.hurtFlash = Math.max(0, Game.hurtFlash - dt * 2.5);
}

// ===========================================================================
// Quick Fix + naming panels (player 0). Drag a plug onto the port with the
// same colour and shape, or tap a plug then tap its port. The world keeps
// running behind the panel; only the mouse is freed from pointer lock.
// ===========================================================================
const FixUI = {
  mode: null, r: null, sel: -1, drag: null,
  init() {
    const board = $('board');
    board.addEventListener('pointerdown', (e) => {
      const plug = e.target.closest('.plug'), port = e.target.closest('.port');
      if (plug && !plug.classList.contains('done')) {
        e.preventDefault();
        this.drag = { plug: +plug.dataset.plug, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY };
        board.setPointerCapture(e.pointerId); this.draw();
      } else if (port && this.sel >= 0) { const i = this.sel; this.sel = -1; this.tryWire(i, +port.dataset.port); }
    });
    board.addEventListener('pointermove', (e) => { if (this.drag) { this.drag.x = e.clientX; this.drag.y = e.clientY; this.draw(); } });
    board.addEventListener('pointerup', (e) => {
      const d = this.drag; if (!d) return; this.drag = null;
      const j = this.portAt(e.clientX, e.clientY);
      if (j >= 0) { this.sel = -1; this.tryWire(d.plug, j); }
      else if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 10) { this.sel = this.sel === d.plug ? -1 : d.plug; this.draw(); }   // a tap picks the plug up
      else this.draw();
    });
    board.addEventListener('pointercancel', () => { this.drag = null; this.draw(); });
    $('fixX').addEventListener('click', () => this.dismiss());
    $('nameOk').addEventListener('click', () => this.confirmName());
    $('nameDice').addEventListener('click', () => { if (this.r) { setRobotName(this.r, randomName()); $('nameIn').value = this.r.name; } if (!Game.manual) Sfx.click(); });
    $('pFix').addEventListener('click', (e) => { e.stopPropagation(); this.fromPrompt('fix'); });
    $('pParts').addEventListener('click', (e) => { e.stopPropagation(); this.fromPrompt('parts'); });
  },
  fromPrompt(choice) { const h = Game.humans[0], r = h && promptRobot(h); if (r) chooseFor(h, r, choice); },
  icon(ci, fill, stroke) { return `<svg viewBox="0 0 40 40"><g fill="${fill}" stroke="${stroke}" stroke-width="3" stroke-linejoin="round">${SHAPE_SVG[WIRE_COLORS[ci].shape]}</g></svg>`; },
  show(id) { $('fix').classList.toggle('on', id === 'fix'); $('namer').classList.toggle('on', id === 'namer'); },
  openWires(r) {
    this.r = r; this.mode = 'wires'; this.sel = -1; this.drag = null;
    const W = r.wires, C = WIRE_COLORS;
    $('plugs').innerHTML = W.plugs.map((ci, i) => `<div class="plug" data-plug="${i}" data-color="${C[ci].color}" style="background:${C[ci].hex}">${this.icon(ci, '#fff', '#14182a')}</div>`).join('');
    $('ports').innerHTML = W.ports.map((ci, j) => `<div class="port" data-port="${j}" data-color="${C[ci].color}" style="border-color:${C[ci].hex};color:${C[ci].hex}">${this.icon(ci, C[ci].hex, 'none')}</div>`).join('');
    this.show('fix'); this.draw();
    if (document.pointerLockElement) document.exitPointerLock();
  },
  openName(r) {
    this.r = r; this.mode = 'name'; this.drag = null;
    $('nameIn').value = r.name;      // a random name is already there: ✔ keeps it
    this.show('namer');
  },
  close() { this.mode = null; this.r = null; this.drag = null; this.sel = -1; this.show(null); $('nameIn').blur(); },
  relock() { if (Game.humans.length === 1 && Game.state === 'play' && !Game.paused && !Game.manual) canvas.requestPointerLock?.(); },
  // ✖ / Escape: leave the wiring (the robot's clock runs again), or keep the name
  dismiss() {
    if (this.mode === 'name') { this.confirmName(); return; }
    if (this.mode === 'wires') cancelRepair(Game.humans[0]);
    this.close(); this.relock();
  },
  confirmName() {
    if (this.mode !== 'name') return;
    const v = $('nameIn').value.trim().slice(0, 12);
    if (v && this.r && v !== this.r.name) setRobotName(this.r, v);
    if (!Game.manual) Sfx.click();
    this.close(); this.relock();
  },
  tryWire(i, j) {
    const res = connectWire(Game.humans[0], this.r, i, j);
    if (res === 'wrong') { const b = $('board'); b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); }
    this.draw();
    return res;
  },
  centre(el, box) { const q = el.getBoundingClientRect(); return [q.left + q.width / 2 - box.left, q.top + q.height / 2 - box.top]; },
  portAt(x, y) {
    let best = -1, bd = 60;   // generous: a drop near the port counts
    $('ports').querySelectorAll('.port').forEach((el) => { const q = el.getBoundingClientRect(), d = Math.hypot(x - (q.left + q.width / 2), y - (q.top + q.height / 2)); if (d < bd) { bd = d; best = +el.dataset.port; } });
    return best;
  },
  // wires already in, and the one being dragged, as fat cable curves
  draw() {
    if (this.mode !== 'wires' || !this.r) return;
    const W = this.r.wires, box = $('board').getBoundingClientRect();
    const plugs = $('plugs').children, ports = $('ports').children;
    const cable = (a, b, hex) => {
      const dx = Math.max(40, (b[0] - a[0]) * 0.45), d = `M${a[0]},${a[1]} C${a[0] + dx},${a[1]} ${b[0] - dx},${b[1]} ${b[0]},${b[1]}`;
      return `<path d="${d}" stroke="#14182a" stroke-width="18" fill="none" stroke-linecap="round"/><path d="${d}" stroke="${hex}" stroke-width="10" fill="none" stroke-linecap="round"/>`;
    };
    let svg = '';
    W.link.forEach((j, i) => {
      plugs[i].classList.toggle('done', j >= 0); plugs[i].classList.toggle('sel', i === this.sel);
      if (j >= 0) svg += cable(this.centre(plugs[i], box), this.centre(ports[j], box), WIRE_COLORS[W.plugs[i]].hex);
    });
    [...ports].forEach((el, j) => el.classList.toggle('done', W.link.includes(j)));
    if (this.drag) svg += cable(this.centre(plugs[this.drag.plug], box), [this.drag.x - box.left, this.drag.y - box.top], WIRE_COLORS[W.plugs[this.drag.plug]].hex);
    $('wireSvg').innerHTML = svg;
  },
};

// HUD: speed bars and legs-vs-torso compass
const SPEED_BARS = 8;
function buildHud() {
  const el = $('speed');
  for (let i = 0; i < SPEED_BARS; i++) { const b = document.createElement('i'); b.style.height = (14 + i * 5) + 'px'; el.appendChild(b); }
  WEAPONS.forEach((w, i) => { const d = document.createElement('div'); d.className = 'wpn'; d.dataset.w = w; d.innerHTML = `${WEAPON[w].icon}<small>${i + 1}</small>`; $('weapons').appendChild(d); });
}
function updateHud() {
  const h = Game.humans[0]; if (!h) return;
  const m = h.mech, f = Math.abs(m.speed) / MECH.topSpeed, on = Math.round(f * SPEED_BARS);
  [...$('speed').querySelectorAll('i')].forEach((b, i) => { b.classList.toggle('on', i < on); b.classList.toggle('max', on >= SPEED_BARS); });
  const hp = m.health / m.maxHealth, fill = $('hpFill'), col = hp > 0.5 ? 'var(--green)' : hp > 0.25 ? 'var(--yellow)' : '#ff4d5e';
  fill.style.width = (hp * 100) + '%'; fill.style.background = col; fill.style.boxShadow = `0 0 10px ${col}`;
  for (const d of $('weapons').children) d.classList.toggle('on', d.dataset.w === h.weapon);
  $('hurt').style.opacity = Game.hurtFlash.toFixed(3);
  // compass is camera-up: torso is always up-ish, legs show their offset
  const camYaw = m.torsoYaw;
  $('cLegs').style.transform = `rotate(${-(m.legHeading - camYaw)}rad)`;
  $('cTorso').style.transform = `rotate(${-(m.torsoYaw - camYaw)}rad)`;
  // parts count and squad name tags
  $('partsN').textContent = Game.parts;
  const sk = Game.squad.map((r) => r.id + ':' + r.name).join('|');
  if (sk !== updateHud.squadKey) {
    updateHud.squadKey = sk; const el = $('squad'); el.textContent = '';
    for (const r of Game.squad) { const d = document.createElement('div'); d.className = 'mate'; const b = document.createElement('b'); b.textContent = '🤖'; d.append(b, r.name); el.append(d); }
  }
  // the prompt sits beside the downed robot on screen
  const pr = !h.repair && !Game.paused && promptRobot(h), pe = $('prompt');
  let shown = false;
  if (pr) {
    const v = new V3(pr.pos.x, pr.pos.y + 3, pr.pos.z).project(h.rig.cam);
    if (v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1) {
      shown = true;
      pe.style.left = clamp((v.x * 0.5 + 0.5) * innerWidth + 70, 10, innerWidth - 190) + 'px';
      pe.style.top = clamp((-v.y * 0.5 + 0.5) * innerHeight, 60, innerHeight - 60) + 'px';
    }
  }
  pe.classList.toggle('on', shown);
  $('pFix').classList.toggle('off', Game.squad.length >= REPAIR.squadMax);
}

function render(dt) {
  const W = innerWidth, H = innerHeight;
  for (const m of Game.mechs) syncMechModel(m);
  for (const r of Game.robots) syncRobotModel(r, dt);
  Bullets.sync();
  Sparks.sync();
  Dust.update(dt);
  const h = Game.humans[0]; if (!h) return;
  h.rig.update(dt, h.mech);
  const c = h.rig.cam; c.aspect = W / H; c.updateProjectionMatrix();
  // keep the sun's shadow box on the player
  const s = Meadow.sun, p = h.mech.pos;
  s.position.set(p.x + 30, p.y + 55, p.z + 18); s.target.position.copy(p); s.target.updateMatrixWorld();
  Meadow.sky.position.copy(c.position);
  renderPass.camera = c;
  composer.render(dt);
  if (!Game.manual && Sfx.ctx) Sfx.setHum(Math.abs(h.mech.speed) / MECH.topSpeed);
  updateHud();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  if (!Game.manual) {
    gatherInput(dt);
    if (!Game.paused) { Game.acc += dt; let n = 0; while (Game.acc >= DT && n < MAX_STEPS) { tick(DT); Game.acc -= DT; n++; } if (n >= MAX_STEPS) Game.acc = 0; }
    else Game.acc = 0;
    render(dt);
  }
  requestAnimationFrame(frame);
}

function startPlay() {
  Sfx.unlock(); Sfx.click();
  setPause(false);
  // the first press of play sends a Charger out of the trees ahead
  const p = Game.humans[0]?.mech;
  if (p && !Game.robots.length && !Game.manual) spawnRobot('charger', p.pos.x - Math.sin(p.legHeading) * 45, p.pos.z - Math.cos(p.legHeading) * 45);
  if (Game.humans.length === 1) canvas.requestPointerLock?.();
}
$('go').addEventListener('click', (e) => { e.stopPropagation(); startPlay(); });

// ===========================================================================
// Test hooks: the Chrome test tab gets no animation frames, so checks drive
// the game with __rb.manual(true), __rb.step(n) and __rb.render().
// ===========================================================================
const r3 = (v) => Math.round(v * 1000) / 1000;

  const p0 = Game.humans[0]?.mech, wc = (ci) => ({ color: WIRE_COLORS[ci].color, shape: WIRE_COLORS[ci].shape });
  return {
    id: r.id, type: r.type, name: r.name, x: r3(r.pos.x), z: r3(r.pos.z),
    health: r.health, maxHealth: r.maxHealth,

    mode: r.ai.mode,                                  // stalk | windup | charge | recover | off | follow | idle
    glow: { mode: r.glowMode, level: r3(r.glow) },    // flicker (glitched) | off | blink (about to reboot) | steady (ally)
    rebootIn: r.state === 'down' ? r3(r.downT) : null, downs: r.downs, reboots: r.reboots,
    repairing: !!r.repairBy,                          // its reboot clock holds while true
    // plugs[i] belongs in the port with the same colour; link[i] = the port it's in (-1 = loose)
    wires: { plugs: r.wires.plugs.map(wc), ports: r.wires.ports.map(wc), link: [...r.wires.link] }, wrongWires: r.wrongWires,
    hits: { ...r.hits },                              // real weapon hits only (damage() doesn't count)

}
window.__rb = {

  render(dt = 1 / 60) { render(dt); return true; },

  hold(code, on = true) { if (on) { keys.add(code); keysPressed.add(code); } else keys.delete(code); return [...keys]; },
  // point player i's torso (and camera) at a world yaw/pitch. As a setup hook it
  // snaps the torso there; mouse and stick aim swing it at MECH.torsoTurn.
  aim(i, yaw, pitch = 0) {
    const h = Game.humans[i]; if (!h) return null;
    h.rig.yaw = wrapAngle(yaw); h.rig.pitch = clamp(pitch, -0.35, 0.5);
    const m = h.mech; m.input.aimYaw = h.rig.yaw; m.input.aimPitch = h.rig.pitch; m.torsoYaw = h.rig.yaw; m.aimPitch = h.rig.pitch;
    return this.state().players[i];
  },
  // drop a robot into the meadow: spawn('charger', x, z)
  spawn(type, x, z) { const r = spawnRobot(type, x, z); return r ? this.state().robots.find((q) => q.id === r.id) : null; },
  // player i uses a weapon now ('gun' | 'punch' | 'kick'), through the same attack
